<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Do g^ij Actually Look Like?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Sora:wght@300;400;600;700&display=swap');

  :root {
    --bg: #07080d;
    --panel: #0d0f17;
    --border: #181c2a;
    --gxx: #f87171;
    --gyy: #c084fc;
    --gxy: #fbbf24;
    --bfield: #60a5fa;
    --jac: #34d399;
    --text: #c4c4cc;
    --dim: #4a4a58;
    --bright: #ececf0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
  }

  .header {
    padding: 20px 16px 10px;
    text-align: center;
  }
  .header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--bright);
  }
  .header p {
    font-size: 0.72rem;
    color: var(--dim);
    margin-top: 3px;
  }

  .tabs {
    display: flex;
    gap: 0;
    padding: 6px 12px;
    justify-content: center;
  }
  .tab {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    font-weight: 500;
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab:first-child { border-radius: 6px 0 0 6px; }
  .tab:last-child { border-radius: 0 6px 6px 0; }
  .tab + .tab { border-left: none; }
  .tab.active {
    color: var(--bright);
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.15);
  }
  .tab[data-id="gxx"].active { color: var(--gxx); }
  .tab[data-id="gyy"].active { color: var(--gyy); }
  .tab[data-id="gxy"].active { color: var(--gxy); }
  .tab[data-id="all"].active { color: var(--bfield); }

  .canvas-wrap {
    max-width: 700px;
    margin: 8px auto;
    padding: 0 12px;
  }
  .canvas-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }
  canvas { width: 100%; display: block; }

  .sliders {
    max-width: 700px;
    margin: 8px auto;
    padding: 0 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .slider-group {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 12px;
  }
  .slider-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 5px;
  }
  .slider-label span {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--dim);
  }
  .slider-label .val {
    color: var(--text);
    font-weight: 500;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--bright);
    cursor: pointer;
    border: 2px solid var(--bg);
  }

  .info {
    max-width: 700px;
    margin: 10px auto;
    padding: 0 12px 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .card h3 {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .card p {
    font-size: 0.76rem;
    line-height: 1.6;
    color: var(--dim);
    margin-bottom: 6px;
  }
  .card p:last-child { margin-bottom: 0; }
  .card strong { color: var(--text); }
  .card code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    background: rgba(255,255,255,0.04);
    padding: 1px 5px;
    border-radius: 3px;
  }

  .formula-box {
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    margin: 8px 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    line-height: 1.8;
  }

  .example-table {
    width: 100%;
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 0.7rem;
  }
  .example-table th {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    text-align: left;
    padding: 5px 8px;
    border-bottom: 1px solid var(--border);
    color: var(--dim);
    font-size: 0.65rem;
  }
  .example-table td {
    padding: 4px 8px;
    font-family: 'IBM Plex Mono', monospace;
    border-bottom: 1px solid rgba(255,255,255,0.02);
  }
  .example-table .z-label { color: var(--bfield); }
</style>
</head>
<body>

<div class="header">
  <h1>What g<sup>xx</sup>, g<sup>yy</sup>, g<sup>xy</sup> Actually Look Like</h1>
  <p>Circular tokamak · analytical forms · real numbers · drag to explore</p>
</div>

<div class="tabs" id="tabs"></div>

<div class="canvas-wrap">
  <div class="canvas-box">
    <canvas id="c"></canvas>
  </div>
</div>

<div class="sliders">
  <div class="slider-group">
    <div class="slider-label"><span>ŝ (shear)</span><span class="val" id="sVal">0.8</span></div>
    <input type="range" id="sSlider" min="0" max="3" step="0.1" value="0.8">
  </div>
  <div class="slider-group">
    <div class="slider-label"><span>q (safety factor)</span><span class="val" id="qVal">1.4</span></div>
    <input type="range" id="qSlider" min="0.5" max="4" step="0.1" value="1.4">
  </div>
  <div class="slider-group">
    <div class="slider-label"><span>ε = r/R₀</span><span class="val" id="eVal">0.18</span></div>
    <input type="range" id="eSlider" min="0.05" max="0.4" step="0.01" value="0.18">
  </div>
  <div class="slider-group">
    <div class="slider-label"><span>r (minor radius, m)</span><span class="val" id="rVal">0.30</span></div>
    <input type="range" id="rSlider" min="0.1" max="0.8" step="0.01" value="0.3">
  </div>
</div>

<div class="info">
  <div class="card" id="info"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;
let activeTab = 'gyy';

const TABS = [
  { id: 'gyy', label: 'g^yy' },
  { id: 'gxx', label: 'g^xx' },
  { id: 'gxy', label: 'g^xy' },
  { id: 'all', label: 'All + |B|' },
];

const INFO = {
  gxx: {
    title: 'g<sup>xx</sup> — the radial metric',
    titleColor: 'var(--gxx)',
    html: `<div class="formula-box" style="color:var(--gxx)">g<sup>xx</sup>(z) ≈ 1 / (qR₀)²</div>
<p><strong>What it means:</strong> "How far apart are neighboring flux surfaces, in real meters, per unit step in my x-coordinate?" It's essentially the <strong>inverse square of the major radius times q</strong>.</p>
<p><strong>Why it's nearly flat:</strong> The spacing between flux surfaces doesn't change much as you go around poloidally. The outboard side is slightly wider (Shafranov shift pushes surfaces together on the inboard side), but in the simple circular case it's approximately constant.</p>
<p><strong>Physical effect in GENE:</strong> It multiplies <code>∂²f/∂x²</code> — the radial diffusion/coupling term. Since it's nearly constant, the radial behavior is pretty uniform along the field line. Not where the interesting physics lives.</p>
<p><strong>Typical value:</strong> For ASDEX Upgrade (R₀=1.65m, q=1.4): g<sup>xx</sup> ≈ 1/(1.4 × 1.65)² ≈ <strong>0.19 m⁻²</strong></p>`
  },
  gyy: {
    title: 'g<sup>yy</sup> — the binormal metric (the big one)',
    titleColor: 'var(--gyy)',
    html: `<div class="formula-box" style="color:var(--gyy)">g<sup>yy</sup>(z) ≈ (1/r²) × [ 1 + (ŝz)² + 2ε·cos(z) + 2ε(ŝz)sin(z) ]</div>
<p><strong>What it means:</strong> "How far apart are neighboring field lines on the same flux surface?" This is the <strong>dominant metric coefficient</strong> and it varies a lot along z.</p>
<p><strong>Why it peaks at the outboard midplane (z=0):</strong> The outside of the torus has a larger circumference, so field lines are more spread out there. The <code>2ε·cos(z)</code> term encodes this: positive at z=0 (outboard), negative at z=±π (inboard).</p>
<p><strong>Why it grows at large |z|:</strong> The <code>(ŝz)²</code> term. Magnetic shear tilts the binormal direction as you move along the field line, effectively stretching it. Higher shear = steeper growth.</p>
<p><strong>Physical effect in GENE:</strong> This dominates k⊥² = g<sup>xx</sup>k<sub>x</sub>² + 2g<sup>xy</sup>k<sub>x</sub>k<sub>y</sub> + g<sup>yy</sup>k<sub>y</sub>². Where g<sup>yy</sup> is large, k⊥ is large, and <strong>FLR damping is strong</strong> (the Bessel function J₀(k⊥ρ) → 0). This is why turbulence is driven most strongly near the outboard midplane but also gets shear-damped away from it.</p>`
  },
  gxy: {
    title: 'g<sup>xy</sup> — the shear cross-term',
    titleColor: 'var(--gxy)',
    html: `<div class="formula-box" style="color:var(--gxy)">g<sup>xy</sup>(z) ≈ (ŝz) / (r² q) + ε·sin(z)/(r² q)</div>
<p><strong>What it means:</strong> "How skewed are my x and y directions relative to each other?" If this is zero, x and y are perpendicular in real space. If it's nonzero, they're tilted.</p>
<p><strong>Why it's zero at z=0:</strong> At the outboard midplane, there's a symmetry — the radial and binormal directions happen to be perpendicular. Away from the midplane, magnetic shear progressively tilts them.</p>
<p><strong>Why it's odd (antisymmetric):</strong> The tilt goes one way above the midplane and the opposite way below. The <code>ŝz</code> makes it linear in z for small z, and the <code>sin(z)</code> term adds a geometric correction.</p>
<p><strong>Physical effect in GENE:</strong> It creates the <code>2g<sup>xy</sup>k<sub>x</sub>k<sub>y</sub></code> cross-term in k⊥². This couples radial and binormal modes — without it, each (k<sub>x</sub>, k<sub>y</sub>) mode would be independent. It's the mechanism by which <strong>magnetic shear stabilizes turbulence</strong> (the "shearing apart" of eddies).</p>
<p><strong>Key insight:</strong> If ŝ = 0 (no shear), g<sup>xy</sup> nearly vanishes. Crank up shear and watch it grow — that's shear stabilization encoded in one number.</p>`
  },
  all: {
    title: 'All coefficients + |B|(z)',
    titleColor: 'var(--bfield)',
    html: `<p><strong>The full picture at a glance.</strong> Notice how each coefficient has different character:</p>
<p><strong style="color:var(--gxx)">g<sup>xx</sup></strong> — nearly flat, boring. Radial spacing doesn't change much.</p>
<p><strong style="color:var(--gyy)">g<sup>yy</sup></strong> — the dominant, strongly varying one. Peaks at outboard, grows with |z| due to shear. This controls FLR damping and is where most of the geometry-dependence of turbulence lives.</p>
<p><strong style="color:var(--gxy)">g<sup>xy</sup></strong> — antisymmetric, zero at midplane, grows with shear. The mode-coupling / shear-stabilization term.</p>
<p><strong style="color:var(--bfield)">|B|(z)</strong> — the magnetic field strength. Strongest on the inboard side (z=±π), weakest on the outboard (z=0). The variation creates <strong>magnetic trapping wells</strong> — particles with low v∥ get trapped in the low-|B| region and bounce back and forth. These trapped particles drive trapped-electron modes (TEM).</p>
<p><strong style="color:var(--jac)">J(z)</strong> — the Jacobian (volume element). Tells GENE how much real-space volume each grid cell represents. Largest on the outboard side where the torus is fatter.</p>`
  }
};

// ─── Sliders ───
function getParams() {
  return {
    s: parseFloat(document.getElementById('sSlider').value),
    q: parseFloat(document.getElementById('qSlider').value),
    eps: parseFloat(document.getElementById('eSlider').value),
    r: parseFloat(document.getElementById('rSlider').value),
  };
}

function updateSliderLabels() {
  const p = getParams();
  document.getElementById('sVal').textContent = p.s.toFixed(1);
  document.getElementById('qVal').textContent = p.q.toFixed(1);
  document.getElementById('eVal').textContent = p.eps.toFixed(2);
  document.getElementById('rVal').textContent = p.r.toFixed(2);
}

document.querySelectorAll('input[type="range"]').forEach(el => {
  el.addEventListener('input', () => { updateSliderLabels(); draw(); });
});

// ─── Physics ───
function gxx(z, p) {
  const R0 = p.r / p.eps;
  return 1 / (p.q * R0) ** 2 * (1 + 0.2 * p.eps * Math.cos(z));
}

function gyy(z, p) {
  const shat_z = p.s * z;
  return (1 / (p.r * p.r)) * (1 + shat_z * shat_z + 2 * p.eps * Math.cos(z) + 2 * p.eps * shat_z * Math.sin(z));
}

function gxy(z, p) {
  return (p.s * z) / (p.r * p.r * p.q) + p.eps * Math.sin(z) / (p.r * p.r * p.q);
}

function Bmag(z, p) {
  const R0 = p.r / p.eps;
  const B0 = 2.5; // Tesla
  return B0 * R0 / (R0 + p.r * Math.cos(z));
}

function Jac(z, p) {
  const R0 = p.r / p.eps;
  return (R0 + p.r * Math.cos(z)) * p.q / (R0);
}

// ─── Drawing ───
function resize() {
  dpr = window.devicePixelRatio || 1;
  const wrap = canvas.parentElement;
  W = wrap.clientWidth;
  H = Math.min(W * 0.7, 400);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const p = getParams();

  const ml = 52, mr = 16, mt = 30, mb = 36;
  const pw = W - ml - mr;
  const ph = H - mt - mb;

  // z axis
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(ml, mt + ph);
  ctx.lineTo(ml + pw, mt + ph);
  ctx.stroke();

  // z labels
  ctx.font = '400 9px IBM Plex Mono';
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.textAlign = 'center';
  const zLabels = [
    { z: -Math.PI, label: '-π' },
    { z: -Math.PI/2, label: '-π/2' },
    { z: 0, label: '0' },
    { z: Math.PI/2, label: 'π/2' },
    { z: Math.PI, label: 'π' },
  ];
  zLabels.forEach(zl => {
    const x = ml + ((zl.z + Math.PI) / (2 * Math.PI)) * pw;
    ctx.fillText(zl.label, x, mt + ph + 14);

    ctx.beginPath();
    ctx.moveTo(x, mt);
    ctx.lineTo(x, mt + ph);
    ctx.strokeStyle = zl.z === 0 ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.03)';
    ctx.lineWidth = zl.z === 0 ? 1 : 0.5;
    ctx.stroke();
  });
  ctx.textAlign = 'left';

  ctx.font = '400 8px IBM Plex Mono';
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.textAlign = 'center';
  ctx.fillText('inboard', ml + pw * 0.04, mt + ph + 27);
  ctx.fillText('outboard', ml + pw * 0.5, mt + ph + 27);
  ctx.fillText('inboard', ml + pw * 0.96, mt + ph + 27);
  ctx.textAlign = 'left';

  // Compute all values for scaling
  const N = 300;
  const zArr = [];
  const gxxArr = [], gyyArr = [], gxyArr = [], bArr = [], jArr = [];
  for (let i = 0; i <= N; i++) {
    const z = -Math.PI + (i / N) * 2 * Math.PI;
    zArr.push(z);
    gxxArr.push(gxx(z, p));
    gyyArr.push(gyy(z, p));
    gxyArr.push(gxy(z, p));
    bArr.push(Bmag(z, p));
    jArr.push(Jac(z, p));
  }

  let curves = [];
  if (activeTab === 'gxx') {
    curves = [{ data: gxxArr, color: 'var(--gxx)', label: 'g^xx' }];
  } else if (activeTab === 'gyy') {
    curves = [{ data: gyyArr, color: 'var(--gyy)', label: 'g^yy' }];
  } else if (activeTab === 'gxy') {
    curves = [{ data: gxyArr, color: 'var(--gxy)', label: 'g^xy' }];
  } else {
    curves = [
      { data: gyyArr, color: '#c084fc', label: 'g^yy' },
      { data: gxxArr, color: '#f87171', label: 'g^xx' },
      { data: gxyArr, color: '#fbbf24', label: 'g^xy' },
      { data: bArr, color: '#60a5fa', label: '|B|' },
      { data: jArr, color: '#34d399', label: 'J' },
    ];
  }

  // Find global min/max for current view
  let allVals = [];
  curves.forEach(c => allVals.push(...c.data));
  let vMin = Math.min(...allVals);
  let vMax = Math.max(...allVals);
  // Add padding
  const vRange = vMax - vMin || 1;
  vMin -= vRange * 0.1;
  vMax += vRange * 0.15;

  // Zero line if range spans zero
  if (vMin < 0 && vMax > 0) {
    const zeroY = mt + ph - ((0 - vMin) / (vMax - vMin)) * ph;
    ctx.beginPath();
    ctx.moveTo(ml, zeroY);
    ctx.lineTo(ml + pw, zeroY);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '300 8px IBM Plex Mono';
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillText('0', ml - 12, zeroY + 3);
  }

  // Y axis ticks
  ctx.font = '300 8px IBM Plex Mono';
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  const nTicks = 5;
  for (let i = 0; i <= nTicks; i++) {
    const v = vMin + (i / nTicks) * (vMax - vMin);
    const y = mt + ph - (i / nTicks) * ph;
    ctx.fillText(v.toFixed(1), ml - 30, y + 3);
    ctx.beginPath();
    ctx.moveTo(ml - 3, y);
    ctx.lineTo(ml, y);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Draw curves
  curves.forEach(curve => {
    // Fill under curve (subtle)
    if (curves.length === 1) {
      ctx.beginPath();
      const zeroY = mt + ph - ((0 - vMin) / (vMax - vMin)) * ph;
      const baseY = Math.min(mt + ph, Math.max(mt, zeroY));
      ctx.moveTo(ml, baseY);
      for (let i = 0; i <= N; i++) {
        const x = ml + (i / N) * pw;
        const y = mt + ph - ((curve.data[i] - vMin) / (vMax - vMin)) * ph;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(ml + pw, baseY);
      ctx.closePath();

      const tc = curve.color.startsWith('var') ?
        (curve.label === 'g^xx' ? '#f87171' : curve.label === 'g^yy' ? '#c084fc' : '#fbbf24') :
        curve.color;
      ctx.fillStyle = hexToRgba(tc, 0.06);
      ctx.fill();
    }

    // Line
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const x = ml + (i / N) * pw;
      const y = mt + ph - ((curve.data[i] - vMin) / (vMax - vMin)) * ph;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }

    const tc = curve.color.startsWith('var') ?
      (curve.label === 'g^xx' ? '#f87171' : curve.label === 'g^yy' ? '#c084fc' : '#fbbf24') :
      curve.color;
    ctx.strokeStyle = tc;
    ctx.lineWidth = curves.length === 1 ? 2.5 : 1.8;
    ctx.stroke();

    // Label at end
    const endY = mt + ph - ((curve.data[N] - vMin) / (vMax - vMin)) * ph;
    ctx.font = '600 9px IBM Plex Mono';
    ctx.fillStyle = tc;
    ctx.fillText(curve.label, ml + pw - 40, endY - 6);
  });

  // Title
  ctx.font = '600 11px IBM Plex Mono';
  const titleColor = activeTab === 'gxx' ? '#f87171' : activeTab === 'gyy' ? '#c084fc' : activeTab === 'gxy' ? '#fbbf24' : '#60a5fa';
  ctx.fillStyle = titleColor;
  const titleText = activeTab === 'all' ? 'All geometric coefficients vs z' :
    `${curves[0].label}(z) — ${activeTab === 'gxx' ? 'radial metric' : activeTab === 'gyy' ? 'binormal metric' : 'shear cross-term'}`;
  ctx.fillText(titleText, ml, mt - 10);

  // Show values at midplane and edges
  if (curves.length === 1) {
    const midVal = curves[0].data[N / 2];
    const edgeVal = curves[0].data[0];

    ctx.font = '300 8px IBM Plex Mono';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';

    const midY = mt + ph - ((midVal - vMin) / (vMax - vMin)) * ph;
    ctx.fillText(`z=0: ${midVal.toFixed(2)}`, ml + pw / 2 + 8, midY - 8);

    const edgeY = mt + ph - ((edgeVal - vMin) / (vMax - vMin)) * ph;
    ctx.fillText(`z=-π: ${edgeVal.toFixed(2)}`, ml + 8, edgeY - 8);

    // Dots at key points
    [0, N / 2, N].forEach(idx => {
      const x = ml + (idx / N) * pw;
      const y = mt + ph - ((curves[0].data[idx] - vMin) / (vMax - vMin)) * ph;
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fillStyle = titleColor;
      ctx.fill();
    });
  }

  // Sample table in the canvas
  if (curves.length === 1) {
    const tableX = ml + pw * 0.58;
    const tableY = mt + 8;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(tableX - 5, tableY - 5, 155, 95);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(tableX - 5, tableY - 5, 155, 95);

    ctx.font = '500 7px IBM Plex Mono';
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText('z', tableX, tableY + 6);
    ctx.fillText('location', tableX + 35, tableY + 6);
    ctx.fillText('value', tableX + 100, tableY + 6);

    const samples = [
      { z: -Math.PI, loc: 'inboard' },
      { z: -Math.PI / 2, loc: 'top' },
      { z: 0, loc: 'outboard' },
      { z: Math.PI / 2, loc: 'bottom' },
      { z: Math.PI, loc: 'inboard' },
    ];

    ctx.font = '400 7px IBM Plex Mono';
    samples.forEach((s, i) => {
      const y = tableY + 20 + i * 14;
      const fn = activeTab === 'gxx' ? gxx : activeTab === 'gyy' ? gyy : gxy;
      const val = fn(s.z, p);

      ctx.fillStyle = 'rgba(96,165,250,0.5)';
      ctx.fillText(s.z === 0 ? ' 0' : s.z.toFixed(2), tableX, y);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillText(s.loc, tableX + 35, y);
      ctx.fillStyle = titleColor;
      ctx.fillText(val.toFixed(3), tableX + 100, y);
    });
  }
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ─── Tabs ───
function buildTabs() {
  const el = document.getElementById('tabs');
  TABS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (t.id === activeTab ? ' active' : '');
    btn.textContent = t.label;
    btn.dataset.id = t.id;
    btn.onclick = () => switchTab(t.id);
    el.appendChild(btn);
  });
}

function switchTab(id) {
  activeTab = id;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  draw();
  const info = document.getElementById('info');
  const data = INFO[id];
  info.innerHTML = `<h3 style="color:${data.titleColor}">${data.title}</h3>${data.html}`;
  info.style.animation = 'none';
  info.offsetHeight;
  info.style.animation = 'fadeIn 0.3s ease';
}

// ─── Init ───
window.addEventListener('resize', () => { resize(); draw(); });
resize();
buildTabs();
switchTab('gyy');
</script>
