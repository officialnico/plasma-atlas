const STEPS = [
  {
    id: "dna-basics",
    title: "What DNA Actually Is",
    icon: "🧬",
    color: "#22c55e",
    content: {
      main: `Think of DNA as source code. Every cell in Rosie's body contains the same massive codebase — about 2.4 billion characters long, written in a 4-letter alphabet: A, T, C, G.

This "code" is split into ~20,000 files called GENES. Each gene contains instructions to build one specific PROTEIN. Proteins are the actual machines that do everything in the body — they're like the compiled executables that the DNA source code produces.

The process works like a build pipeline:`,
      diagram: "dna-to-protein",
      details: `DNA doesn't run directly (like source code doesn't run without compiling). Instead, when a cell needs a protein, it:

1. Opens the relevant gene (a section of the DNA)
2. Makes a temporary copy called mRNA (messenger RNA) — think of this as a build artifact
3. Sends that mRNA to a ribosome (the compiler/runtime)
4. The ribosome reads the mRNA and assembles the protein

The mRNA is temporary — it gets destroyed after use. It never changes the original DNA. This is important later.`
    }
  },
  {
    id: "mutation",
    title: "What a Mutation Is",
    icon: "🐛",
    color: "#ef4444",
    content: {
      main: `A mutation is literally a bug in the source code. When cells copy themselves, sometimes they make typos — an A gets changed to a T, a section gets deleted, or extra characters get inserted.

Most mutations are harmless (like a comment typo). But sometimes a mutation hits a critical gene — say, one that controls cell growth — and the compiled protein comes out wrong.`,
      diagram: "mutation",
      details: `In Rosie's case, mutations hit a gene called c-KIT. Normally, c-KIT produces a protein that sits on the cell surface and helps regulate when the cell should grow and divide. Think of it as a traffic light — it tells the cell "grow" or "stop growing."

The mutation broke the traffic light so it's stuck on green permanently. The cell keeps dividing uncontrollably. That's cancer.

But here's the key insight: the broken protein LOOKS DIFFERENT from the normal one. The mutation changed the source code, so the compiled output (the protein) has a different shape. The broken protein sticks out on the surface of every tumor cell like a weird antenna that healthy cells don't have.`
    }
  },
  {
    id: "sequencing",
    title: "The Diff: Sequencing Both Genomes",
    icon: "🔍",
    color: "#3b82f6",
    content: {
      main: `Conyngham paid $3,000 to have two things sequenced:

1. DNA from Rosie's healthy blood cells (the "main" branch)
2. DNA from Rosie's tumor cells (the "buggy" branch)

The sequencing machine reads both, producing ~320 GB of raw data. Then software aligns them and runs what is essentially a diff.`,
      diagram: "diff",
      details: `The output is a VCF file — a list of every position where the tumor code differs from the healthy code. Think of it as:

git diff main..tumor-branch

Each line says: "At position 28,018,505 on chromosome 13, healthy DNA has an A, but tumor DNA has a T."

Rosie's tumor had thousands of mutations, but most were passenger mutations (harmless noise). The challenge was finding the DRIVER mutations — the ones actually causing the cancer. This is where AI helped Conyngham sift through the list and identify which mutations were in critical genes like c-KIT.`
    }
  },
  {
    id: "neoantigen",
    title: "Finding the Target: Neoantigens",
    icon: "🎯",
    color: "#f59e0b",
    content: {
      main: `Every cell in Rosie's body constantly displays fragments of its internal proteins on its surface. Think of it like each process advertising its loaded modules in a system registry. The immune system constantly scans these surface fragments looking for anything abnormal.

Normal cells display normal protein fragments → immune system ignores them.

Tumor cells display MUTANT protein fragments → these are called NEOANTIGENS (literally "new antigens" — markers the body has never seen before).`,
      diagram: "neoantigen",
      details: `Here's the problem: Rosie's immune system SHOULD have caught these and killed the tumor cells. But cancer is sneaky — it uses several tricks to hide:

• It can downregulate the "display" mechanism so fewer neoantigens show on the surface
• It can send chemical signals that tell nearby immune cells to stand down
• It can create a microenvironment that suppresses immune response

So the neoantigens ARE there, but the immune system either can't see them well enough or has been told to ignore them. The vaccine's job is to force the immune system to wake up and pay attention to these specific targets.

Using AI, Conyngham analyzed the mutations to predict which ones would produce the most visible, distinctive neoantigens — the ones most likely to provoke a strong immune response. Not all mutations make good targets. You want ones that produce protein fragments that:
1. Actually get displayed on the cell surface
2. Look very different from any normal protein
3. The immune system's T-cells can physically grab onto`
    }
  },
  {
    id: "vaccine-design",
    title: "Writing the Vaccine: mRNA as Code Injection",
    icon: "💉",
    color: "#a855f7",
    content: {
      main: `Now here's where it all comes together. Remember the build pipeline:

DNA → mRNA → Protein

An mRNA vaccine SKIPS the DNA entirely. You directly write the mRNA instructions — the build artifact — that tell any cell to produce a specific protein fragment. You are literally writing synthetic code that will execute inside living cells.`,
      diagram: "vaccine-design",
      details: `Here's exactly what was designed:

1. From the VCF diff, they identified the best neoantigen targets — say, 10-20 mutant protein fragments unique to Rosie's tumor.

2. For each target, they wrote the mRNA sequence that encodes that protein fragment. mRNA uses a slightly different alphabet than DNA (A, U, C, G instead of A, T, C, G), and every 3 letters (called a CODON) maps to one amino acid in the protein. It's literally a lookup table:
   AUG → Methionine (start signal)
   UUU → Phenylalanine
   GCA → Alanine
   UAA → Stop signal

3. They strung multiple neoantigen-encoding sequences together into ONE long mRNA strand, separated by linker sequences. Think of it as a single source file with multiple function definitions.

4. They added regulatory sequences at the start and end (like a header and footer) that tell the cell's ribosome: "this is valid mRNA, start reading here, stop there."

This is the step where Conyngham used Grok (an AI) to design the final construct — the exact sequence of A, U, C, G letters that would encode all the chosen neoantigens.

The UNSW RNA Institute then physically manufactured this mRNA strand in a lab using enzymes that assemble RNA from a DNA template. It's a well-established biochemistry process — you provide the sequence, the enzymes build it.`
    }
  },
  {
    id: "delivery",
    title: "Packaging: Lipid Nanoparticles",
    icon: "📦",
    color: "#06b6d4",
    content: {
      main: `Raw mRNA is incredibly fragile. If you just injected it, enzymes in the body would shred it in minutes. It also can't get inside cells on its own — cell membranes are designed to keep foreign stuff out.

Solution: wrap the mRNA in tiny fat bubbles called LIPID NANOPARTICLES (LNPs). This is the same delivery tech used in the Pfizer and Moderna COVID vaccines.`,
      diagram: "lnp",
      details: `An LNP is about 100 nanometers across — roughly 1/1000th the width of a human hair. It's made of four types of fat molecules arranged in a sphere:

• Ionizable lipids — positively charged at low pH, which helps them bond to the negatively charged mRNA during manufacturing. At body pH they're neutral, reducing toxicity.
• Structural lipids — form the shell of the bubble
• Cholesterol — stabilizes the structure
• PEG-lipids — coat the outside to prevent the immune system from eating the particle before it reaches cells

When an LNP reaches a cell, the cell naturally absorbs it (cells eat fat particles all the time — it's called endocytosis). Once inside, the acidic environment of the endosome triggers the ionizable lipids to disrupt the membrane, releasing the mRNA into the cell's cytoplasm.

Now the mRNA is inside a living cell, ready to execute.`
    }

  {
    id: "execution",
    title: "Execution: The Cell Builds Neoantigens",
    icon: "⚙️",
    color: "#10b981",
    content: {
      main: `Once the mRNA is inside a cell (usually a muscle cell near the injection site, or an immune cell), the cell's own ribosome reads it and builds the protein fragments — the neoantigens from Rosie's tumor.

This is exactly like the cell's normal protein-building process. The cell doesn't know or care that this mRNA came from a syringe rather than its own DNA. It just executes the instructions.`,
      diagram: "execution",
      details: `The cell then does something crucial: it takes these freshly built neoantigen fragments and DISPLAYS them on its surface using a molecule called MHC (Major Histocompatibility Complex). Think of MHC as a display shelf on the outside of the cell.

This is the same mechanism every cell uses to show the immune system what it's currently building. Normally it displays fragments of normal proteins. But now it's displaying fragments of tumor-specific mutant proteins — the same weird markers that Rosie's tumor cells have.

The mRNA itself degrades within hours to days. The cell stops producing neoantigens. No permanent changes are made to any DNA. It's like running a script that auto-deletes after execution.

But the immune system has now SEEN the targets.`

    id: "immune",
    title: "The Kill: Immune System Activation",
    icon: "⚔️",
    color: "#ef4444",
    content: {
      main: `Here's where the immune system becomes a search-and-destroy program. There are two key players:

DENDRITIC CELLS — think of these as the security team that processes intelligence. They pick up the displayed neoantigens and carry them to lymph nodes, where they present them to...

T-CELLS — the actual assassins. Specifically, CD8+ cytotoxic T-cells. Each T-cell has a unique receptor (like a lock) that fits one specific protein fragment shape (the key).`,
      diagram: "immune",
      details: `When a dendritic cell shows a neoantigen to thousands of T-cells in a lymph node, the T-cells whose receptor happens to match that neoantigen shape get ACTIVATED. They start rapidly cloning themselves — one matching T-cell becomes millions.

These activated T-cells then flood into the bloodstream and scan every cell in the body. When they encounter a cell displaying the matching neoantigen on its surface — which is ONLY the tumor cells — they kill it.

The killing mechanism is direct: the T-cell docks onto the tumor cell, injects enzymes called perforin and granzyme that punch holes in the cell membrane and trigger programmed cell death (apoptosis). The tumor cell self-destructs.

Crucially, the immune system also creates MEMORY T-cells — long-lived versions that patrol the body for months or years. If any new tumor cells pop up with the same mutations, the memory T-cells recognize and destroy them immediately. This is why vaccines can have lasting effects.

This is why Rosie's tennis-ball-sized tumor shrank by 75%. Millions of T-cells specifically trained to recognize her tumor's neoantigens swarmed the tumor and systematically killed the cells carrying those markers.

And this is also why one tumor DIDN'T respond — it likely had different driver mutations producing different neoantigens that weren't included in the first vaccine. The T-cells trained by the vaccine didn't recognize those cells. That's why they're now sequencing that tumor to design a second vaccine with different targets.`
    }
  }

};

function VaccineExplainer() {
  const [activeStep, setActiveStep] = useState(0);
  const [showDetails, setShowDetails] = useState(false);

  const step = STEPS[activeStep];
  const DiagramComponent = DIAGRAMS[step.content.diagram];

  return (
    <div style={{
      minHeight: "100vh", background: "#0a0e1a",
      fontFamily: "'Inter', 'Helvetica Neue', sans-serif", color: "#e2e8f0"
    }}>

        {/* Header */}

          WebkitOverflowScrolling: "touch"
        }}>

            <button
              key={s.id}
              onClick={() => { setActiveStep(i); setShowDetails(false); }}
              style={{
                display: "flex", alignItems: "center", gap: 6,
                padding: "8px 12px", borderRadius: 10, border: "none", cursor: "pointer",
                background: activeStep === i ? s.color + "1a" : "rgba(255,255,255,0.03)",

                <div style={{
                  fontSize: 9, fontWeight: 700, color: activeStep === i ? s.color : "#475569",
                  textTransform: "uppercase", letterSpacing: "0.05em"
                }}>
                  Step {i + 1}
                </div>
                <div style={{
                  fontSize: 10, color: activeStep === i ? "#cbd5e1" : "#334155",
                  whiteSpace: "nowrap", fontWeight: 500
                }}>
                  {s.title}
                </div>
              </div>
            </button>
          ))}
        </div>

        {/* Progress */}
        <div style={{
          display: "flex", gap: 3, marginBottom: 20
        }}>
          {STEPS.map((s, i) => (
            <div key={i} style={{
              flex: 1, height: 3, borderRadius: 2,
              background: i <= activeStep ? s.color : "rgba(255,255,255,0.06)",
              transition: "background 0.3s"
            }} />
          ))}
        </div>

        {/* Content Card */}
        <div style={{
          background: "rgba(255,255,255,0.02)", borderRadius: 16,
          border: `1px solid ${step.color}22`, overflow: "hidden"

              disabled={activeStep === 0}
              style={{
                padding: "8px 16px", borderRadius: 8, border: "none",
                background: activeStep === 0 ? "transparent" : "rgba(255,255,255,0.05)",
                color: activeStep === 0 ? "#1e293b" : "#94a3b8",
                cursor: activeStep === 0 ? "default" : "pointer", fontSize: 12, fontWeight: 600
              }}
            >
              ← Previous
            </button>
            <button
              onClick={() => { setActiveStep(Math.min(STEPS.length - 1, activeStep + 1)); setShowDetails(false); }}

                padding: "8px 16px", borderRadius: 8, border: "none",
                background: activeStep === STEPS.length - 1 ? "transparent" : step.color + "22",
                color: activeStep === STEPS.length - 1 ? "#1e293b" : step.color,

        </div>
