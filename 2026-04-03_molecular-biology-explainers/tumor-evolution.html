// ==================== SIMULATION ====================

function TumorSimulation() {
  const [cells, setCells] = useState([]);
  const [generation, setGeneration] = useState(0);
  const [running, setRunning] = useState(false);
  const [log, setLog] = useState([]);
  const [immuneKills, setImmuneKills] = useState(0);
  const [stats, setStats] = useState({ visible: 0, hidden: 0, suppressing: 0, mhcDown: 0, total: 0 });
  const intervalRef = useRef(null);

  const GRID = 20;

  const initCells = () => {
    const initial = [];
    for (let i = 0; i < 12; i++) {
      initial.push({
        id: Math.random(),
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID),
        hidesMHC: false,
        suppressesImmune: false,
        decoySignal: false,
        mutations: 0,
        age: 0,
      });
    }
    return initial;
  };

  const reset = () => {
    setRunning(false);
    if (intervalRef.current) clearInterval(intervalRef.current);
    setCells(initCells());
    setGeneration(0);
    setLog([{ gen: 0, text: "Tumor starts: 12 cells, all visible to immune system", color: "#94a3b8" }]);
    setImmuneKills(0);
  };

  useEffect(() => { reset(); return () => { if (intervalRef.current) clearInterval(intervalRef.current); }; }, []);

  const step = () => {
    setCells(prev => {
      let newCells = [...prev];
      let killed = 0;
      const newLogs = [];
      const gen = generation + 1;

      // Immune system tries to kill visible cells
      newCells = newCells.filter(c => {
        const canSee = !c.hidesMHC;
        const suppressed = newCells.some(other =>
          other.suppressesImmune && other.id !== c.id &&
          Math.abs(other.x - c.x) <= 2 && Math.abs(other.y - c.y) <= 2
        );

        if (canSee && !suppressed && Math.random() < 0.35) {
          killed++;
          return false;
        }
        return true;
      });

      if (killed > 0) {
        setImmuneKills(k => k + killed);
      }

      // Surviving cells divide
      const offspring = [];
      newCells.forEach(c => {
        if (newCells.length + offspring.length > 180) return;
        if (Math.random() < 0.45) {
          const child = {
            ...c,
            id: Math.random(),
            x: Math.min(GRID - 1, Math.max(0, c.x + Math.floor(Math.random() * 3) - 1)),
            y: Math.min(GRID - 1, Math.max(0, c.y + Math.floor(Math.random() * 3) - 1)),
            age: 0,
            mutations: c.mutations,
          };

          // Random mutations during division
          if (Math.random() < 0.08 && !child.hidesMHC) {
            child.hidesMHC = true;
            child.mutations++;
            newLogs.push({ gen, text: `Gen ${gen}: A cell randomly mutated to hide its MHC display — immune system can't see it now`, color: "#ef4444" });
          }
          if (Math.random() < 0.06 && !child.suppressesImmune) {
            child.suppressesImmune = true;
            child.mutations++;
            newLogs.push({ gen, text: `Gen ${gen}: A cell randomly started producing immune-suppressing signals — nearby cells now protected`, color: "#a855f7" });
          }
          if (Math.random() < 0.05 && !child.decoySignal) {
            child.decoySignal = true;
            child.mutations++;
            newLogs.push({ gen, text: `Gen ${gen}: A cell randomly gained a "don't eat me" surface protein — tells immune cells to ignore it`, color: "#f59e0b" });
          }

          offspring.push(child);
        }
        c.age++;
      });

      const result = [...newCells, ...offspring];

      // Update stats
      const visible = result.filter(c => !c.hidesMHC && !c.suppressesImmune && !c.decoySignal).length;
      const hidden = result.filter(c => c.hidesMHC).length;
      const suppressing = result.filter(c => c.suppressesImmune).length;
      const decoy = result.filter(c => c.decoySignal).length;
      setStats({ visible, hidden, suppressing, mhcDown: hidden, decoy, total: result.length });

      if (newLogs.length > 0) {
        setLog(prev => [...prev, ...newLogs].slice(-15));
      }

      return result;
    });
    setGeneration(g => g + 1);
  };

  useEffect(() => {
    if (running) {
      intervalRef.current = setInterval(step, 600);
    } else {
      if (intervalRef.current) clearInterval(intervalRef.current);
    }
    return () => { if (intervalRef.current) clearInterval(intervalRef.current); };
  }, [running, generation]);

  const getCellColor = (c) => {
    if (c.suppressesImmune) return "#a855f7";
    if (c.hidesMHC) return "#ef4444";
    if (c.decoySignal) return "#f59e0b";
    return "#4ade80";
  };

  const getCellOpacity = (c) => {
    if (c.hidesMHC) return 0.9;
    return 0.7;
  };

  return (
    <div style={{ padding: "16px 0" }}>
      {/* Controls */}
      <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap", alignItems: "center" }}>
        <button onClick={() => setRunning(!running)} style={{
          padding: "8px 20px", borderRadius: 8, border: "none", cursor: "pointer",
          background: running ? "#ef444422" : "#22c55e22",
          color: running ? "#ef4444" : "#22c55e", fontWeight: 700, fontSize: 13
        }}>
          {running ? "⏸ Pause" : "▶ Start"}
        </button>
        <button onClick={reset} style={{
          padding: "8px 16px", borderRadius: 8, border: "none", cursor: "pointer",
          background: "rgba(255,255,255,0.05)", color: "#94a3b8", fontWeight: 600, fontSize: 12
        }}>
          Reset
        </button>
        <span style={{ fontSize: 11, color: "#475569", marginLeft: 4 }}>
          Gen: <strong style={{ color: "#94a3b8" }}>{generation}</strong>
          &nbsp;&nbsp;Cells: <strong style={{ color: "#94a3b8" }}>{stats.total}</strong>
          &nbsp;&nbsp;Immune kills: <strong style={{ color: "#22c55e" }}>{immuneKills}</strong>
        </span>
      </div>

      {/* Grid */}
      <div style={{
        display: "grid",
        gridTemplateColumns: `repeat(${GRID}, 1fr)`,
        gap: 1, background: "#0a0e18", borderRadius: 12, padding: 4,
        border: "1px solid rgba(255,255,255,0.06)", aspectRatio: "1/1", maxWidth: 400
      }}>
        {Array.from({ length: GRID * GRID }).map((_, idx) => {
          const x = idx % GRID;
          const y = Math.floor(idx / GRID);
          const cellsHere = cells.filter(c => c.x === x && c.y === y);
          const topCell = cellsHere[cellsHere.length - 1];

          return (
            <div key={idx} style={{
              aspectRatio: "1/1", borderRadius: 2,
              background: topCell ? getCellColor(topCell) : "rgba(255,255,255,0.015)",
              opacity: topCell ? getCellOpacity(topCell) : 1,
              transition: "all 0.3s",
              boxShadow: topCell?.suppressesImmune ? `0 0 6px ${getCellColor(topCell)}66` : "none",
              position: "relative",
            }}>
              {cellsHere.length > 1 && (
                <div style={{
                  position: "absolute", top: 0, right: 1, fontSize: 6,
                  color: "#fff", fontWeight: 700
                }}>
                  {cellsHere.length}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Legend */}
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 12 }}>
        {[
          { color: "#4ade80", label: "Visible to immune system", desc: "can be killed" },
          { color: "#ef4444", label: "MHC hidden", desc: "invisible to T-cells" },
          { color: "#a855f7", label: "Immune suppressor", desc: "protects nearby cells" },
          { color: "#f59e0b", label: "Decoy signal", desc: "\"don't eat me\" protein" },
        ].map((item, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 10 }}>
            <div style={{ width: 10, height: 10, borderRadius: 2, background: item.color, flexShrink: 0 }} />
            <span style={{ color: "#94a3b8" }}><strong style={{ color: item.color }}>{item.label}</strong> — {item.desc}</span>
          </div>
        ))}
      </div>

      {/* Stat bars */}
      <div style={{ marginTop: 14, display: "flex", gap: 4, height: 16, borderRadius: 8, overflow: "hidden", background: "rgba(255,255,255,0.03)" }}>
        {stats.total > 0 && (
          <>
            <div style={{ width: `${(stats.visible / stats.total) * 100}%`, background: "#4ade80", transition: "width 0.3s", minWidth: stats.visible > 0 ? 2 : 0 }} />
            <div style={{ width: `${(stats.hidden / stats.total) * 100}%`, background: "#ef4444", transition: "width 0.3s", minWidth: stats.hidden > 0 ? 2 : 0 }} />
            <div style={{ width: `${(stats.suppressing / stats.total) * 100}%`, background: "#a855f7", transition: "width 0.3s", minWidth: stats.suppressing > 0 ? 2 : 0 }} />
            <div style={{ width: `${(stats.decoy / stats.total) * 100}%`, background: "#f59e0b", transition: "width 0.3s", minWidth: stats.decoy > 0 ? 2 : 0 }} />
          </>
        )}
      </div>
      <div style={{ fontSize: 9, color: "#475569", marginTop: 4 }}>
        Composition — watch how resistant (red/purple/yellow) cells take over as the immune system kills the visible (green) ones
      </div>

      {/* Event log */}
      <div style={{
        marginTop: 14, background: "#0a0e18", borderRadius: 10, padding: "10px 12px",
        border: "1px solid rgba(255,255,255,0.05)", maxHeight: 160, overflowY: "auto",
        fontFamily: "'JetBrains Mono', monospace", fontSize: 10
      }}>
        <div style={{ fontSize: 9, color: "#334155", marginBottom: 6, fontFamily: "'Inter', sans-serif", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.1em" }}>
          Mutation Event Log
        </div>
        {log.map((entry, i) => (
          <div key={i} style={{ color: entry.color, padding: "2px 0", lineHeight: 1.5 }}>
            {entry.text}
          </div>
        ))}
      </div>

      <div style={{
        marginTop: 12, padding: "10px 14px", borderRadius: 10,
        background: "rgba(239,68,68,0.06)", border: "1px solid rgba(239,68,68,0.15)",
        fontSize: 12, color: "#fca5a5", lineHeight: 1.6
      }}>
        <strong>Key observation:</strong> Nobody told the red/purple/yellow cells to evolve evasion. The immune system killed the easy targets (green), and what was LEFT was whatever randomly happened to have a mutation that helped it survive. Run it a few times — you'll see different "strategies" win each time, purely by chance.
      </div>
    </div>
  );
}

          display: "flex", gap: 4, overflowX: "auto", padding: "4px 0 16px",
          WebkitOverflowScrolling: "touch"
        }}>
          {SECTIONS.map((s, i) => (
            <button key={s.id} onClick={() => setActiveSection(i)} style={{
              display: "flex", alignItems: "center", gap: 6,
              padding: "8px 12px", borderRadius: 10, border: "none", cursor: "pointer",
              background: activeSection === i ? s.color + "1a" : "rgba(255,255,255,0.03)",
              outline: activeSection === i ? `1px solid ${s.color}44` : "none",
              flexShrink: 0, transition: "all 0.2s"
            }}>
              <span style={{ fontSize: 16 }}>{s.icon}</span>
              <span style={{
                fontSize: 10, fontWeight: 600,
                color: activeSection === i ? s.color : "#475569",
                whiteSpace: "nowrap"
              }}>
                {s.title.length > 25 ? s.title.slice(0, 25) + "…" : s.title}
              </span>
            </button>
          ))}
        </div>

        {/* Progress */}
        <div style={{ display: "flex", gap: 3, marginBottom: 20 }}>
          {SECTIONS.map((s, i) => (
            <div key={i} style={{
              flex: 1, height: 3, borderRadius: 2,
              background: i <= activeSection ? s.color : "rgba(255,255,255,0.06)",
              transition: "background 0.3s"
            }} />
          ))}
        </div>

        {/* Content */}
        <div style={{
          background: "rgba(255,255,255,0.02)", borderRadius: 16,
          border: `1px solid ${SECTIONS[activeSection].color}22`, overflow: "hidden"
        }}>
          <div style={{
            padding: "14px 18px", borderBottom: `1px solid ${SECTIONS[activeSection].color}15`,
            display: "flex", alignItems: "center", gap: 10
          }}>
            <span style={{ fontSize: 24 }}>{SECTIONS[activeSection].icon}</span>
            <div style={{ fontSize: 16, fontWeight: 700, color: "#f1f5f9" }}>
              {SECTIONS[activeSection].title}
            </div>
          </div>

          <div style={{ padding: "16px 18px" }}>
            {SECTIONS[activeSection].body && (
              <div style={{ fontSize: 13, color: "#cbd5e1", lineHeight: 1.75, whiteSpace: "pre-wrap", marginBottom: SECTIONS[activeSection].hasSimulation || SECTIONS[activeSection].hasTricks || SECTIONS[activeSection].hasTimeline ? 8 : 0 }}>
                {SECTIONS[activeSection].body}
              </div>
            )}

            {SECTIONS[activeSection].hasSimulation && <TumorSimulation />}
            {SECTIONS[activeSection].hasTricks && <TricksList />}
            {SECTIONS[activeSection].hasTimeline && <Timeline />}
          </div>

          {/* Navigation */}
          <div style={{
            padding: "12px 18px", borderTop: "1px solid rgba(255,255,255,0.04)",
            display: "flex", justifyContent: "space-between"
          }}>
            <button
              onClick={() => setActiveSection(Math.max(0, activeSection - 1))}
              disabled={activeSection === 0}
              style={{
                padding: "8px 16px", borderRadius: 8, border: "none",
                background: activeSection === 0 ? "transparent" : "rgba(255,255,255,0.05)",
                color: activeSection === 0 ? "#1e293b" : "#94a3b8",
                cursor: activeSection === 0 ? "default" : "pointer", fontSize: 12, fontWeight: 600
              }}>← Previous</button>
            <button
              onClick={() => setActiveSection(Math.min(SECTIONS.length - 1, activeSection + 1))}
              disabled={activeSection === SECTIONS.length - 1}
              style={{
                padding: "8px 16px", borderRadius: 8, border: "none",
                background: activeSection === SECTIONS.length - 1 ? "transparent" : SECTIONS[activeSection].color + "22",
                color: activeSection === SECTIONS.length - 1 ? "#1e293b" : SECTIONS[activeSection].color,
                cursor: activeSection === SECTIONS.length - 1 ? "default" : "pointer", fontSize: 12, fontWeight: 700
              }}>Next →</button>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(TumorEvolutionExplainer));
</script>
<script>window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+='\n'+e.message;});</script>
