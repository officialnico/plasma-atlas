<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>partial derivative gradient</title>
<style>html,body{margin:0;background:#0c0d10;color:#e8eaf0;font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif}
#root{min-height:100vh}#err{display:none;white-space:pre-wrap;padding:24px;color:#f0736a;font:13px/1.5 ui-monospace,Menlo,monospace}</style>
<div id="root"></div><pre id="err"></pre>
<script src="../_lib/react/libs-base.js"></script>
<script src="../_lib/react/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect,useReducer,useContext,createContext,forwardRef,memo,Fragment,Children,cloneElement} = React;



function PartialDerivativeVisualization() {
  const canvasRef = useRef(null);
  const [pointX, setPointX] = useState(0.8);
  const [pointY, setPointY] = useState(0.8);
  const [showSliceX, setShowSliceX] = useState(true);
  const [showSliceY, setShowSliceY] = useState(true);
  const [showTangentX, setShowTangentX] = useState(true);
  const [showTangentY, setShowTangentY] = useState(true);
  const [showGradient, setShowGradient] = useState(true);
  const [rotationY, setRotationY] = useState(0.6);
  const [rotationX, setRotationX] = useState(0.35);
  const [isDragging, setIsDragging] = useState(false);
  const [lastMouse, setLastMouse] = useState({ x: 0, y: 0 });
  const [zoom, setZoom] = useState(1);
  const [resolution, setResolution] = useState(40);

  // f(x,y) = x²y² + x² + y³
  const f = (x, y) => x * x * y * y + x * x + y * y * y;
  
  // ∂f/∂x = 2xy² + 2x
  const dfdx = (x, y) => 2 * x * y * y + 2 * x;
  
  // ∂f/∂y = 2x²y + 3y²
  const dfdy = (x, y) => 2 * x * x * y + 3 * y * y;
  
  const fValue = f(pointX, pointY);
  const partialXValue = dfdx(pointX, pointY);
  const partialYValue = dfdy(pointX, pointY);
  
  // Gradient magnitude
  const gradientMag = Math.sqrt(partialXValue * partialXValue + partialYValue * partialYValue);

  const project = (x, y, z, width, height) => {
    let tempX = x * Math.cos(rotationY) - z * Math.sin(rotationY);
    let tempZ = x * Math.sin(rotationY) + z * Math.cos(rotationY);
    x = tempX;
    z = tempZ;

    let tempY = y * Math.cos(rotationX) - z * Math.sin(rotationX);
    tempZ = y * Math.sin(rotationX) + z * Math.cos(rotationX);
    y = tempY;
    z = tempZ;

    const scale = 50 * zoom;
    const perspective = 600;
    const factor = perspective / (perspective + z + 5);
    
    return {
      x: width / 2 + x * scale * factor,
      y: height / 2 - y * scale * factor,
      z: z
    };
  };

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    ctx.clearRect(0, 0, width, height);
    
    const bgGradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width/2);
    bgGradient.addColorStop(0, '#1e2a4a');
    bgGradient.addColorStop(1, '#0f1525');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, width, height);

    const range = 2;
    const step = (range * 2) / resolution;
    const zScale = 0.12;

    const polygons = [];

    // Build surface mesh
    for (let xi = -range; xi < range; xi += step) {
      for (let yi = -range; yi < range; yi += step) {
        const x1 = xi, y1 = yi;
        const x2 = xi + step, y2 = yi + step;
        
        const z1 = f(x1, y1) * zScale;
        const z2 = f(x2, y1) * zScale;
        const z3 = f(x2, y2) * zScale;
        const z4 = f(x1, y2) * zScale;
        
        const p1 = project(x1, z1, y1, width, height);
        const p2 = project(x2, z2, y1, width, height);
        const p3 = project(x2, z3, y2, width, height);
        const p4 = project(x1, z4, y2, width, height);
        
        const avgZ = (p1.z + p2.z + p3.z + p4.z) / 4;
        const avgHeight = (z1 + z2 + z3 + z4) / 4;
        
        const shade = 0.5 + avgHeight * 0.3;
        const hue = 210 + avgHeight * 40;
        const sat = 65 + shade * 15;
        const light = 30 + shade * 25;
        
        polygons.push({
          type: 'surface',
          points: [p1, p2, p3, p4],
          z: avgZ,
          fill: `hsla(${hue}, ${sat}%, ${light}%, 0.9)`,
          stroke: `hsla(${hue + 20}, ${sat}%, ${light + 15}%, 0.35)`
        });
      }
    }

    polygons.sort((a, b) => b.z - a.z);

    // Draw surface
    for (const item of polygons) {
      ctx.fillStyle = item.fill;
      ctx.beginPath();
      ctx.moveTo(item.points[0].x, item.points[0].y);
      for (let i = 1; i < item.points.length; i++) {
        ctx.lineTo(item.points[i].x, item.points[i].y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = item.stroke;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // Slice X (yellow)
    if (showSliceX) {
      const slicePoints = [];
      for (let xi = -range; xi <= range; xi += 0.02) {
        const z = f(xi, pointY) * zScale;
        const p = project(xi, z, pointY, width, height);
        slicePoints.push(p);
      }
      
      ctx.shadowColor = '#f1c40f';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = '#f1c40f';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(slicePoints[0].x, slicePoints[0].y);
      for (let i = 1; i < slicePoints.length; i++) {
        ctx.lineTo(slicePoints[i].x, slicePoints[i].y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // Slice Y (purple)
    if (showSliceY) {
      const slicePoints = [];
      for (let yi = -range; yi <= range; yi += 0.02) {
        const z = f(pointX, yi) * zScale;
        const p = project(pointX, z, yi, width, height);
        slicePoints.push(p);
      }
      
      ctx.shadowColor = '#9b59b6';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = '#9b59b6';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(slicePoints[0].x, slicePoints[0].y);
      for (let i = 1; i < slicePoints.length; i++) {
        ctx.lineTo(slicePoints[i].x, slicePoints[i].y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    const pointZ = fValue * zScale;
    const pointProj = project(pointX, pointZ, pointY, width, height);
    
    // Tangent X
    let tangentXEnd = null;
    if (showTangentX) {
      const tangentLength = 0.7;
      const slope = partialXValue * zScale;
      
      const t1x = pointX - tangentLength;
      const t1z = pointZ - slope * tangentLength;
      const t2x = pointX + tangentLength;
      const t2z = pointZ + slope * tangentLength;
      
      const t1 = project(t1x, t1z, pointY, width, height);
      const t2 = project(t2x, t2z, pointY, width, height);
      tangentXEnd = t2;
      
      ctx.shadowColor = '#f39c12';
      ctx.shadowBlur = 10;
      ctx.strokeStyle = '#f39c12';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(t1.x, t1.y);
      ctx.lineTo(t2.x, t2.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // Tangent Y
    let tangentYEnd = null;
    if (showTangentY) {
      const tangentLength = 0.7;
      const slope = partialYValue * zScale;
      
      const t1y = pointY - tangentLength;
      const t1z = pointZ - slope * tangentLength;
      const t2y = pointY + tangentLength;
      const t2z = pointZ + slope * tangentLength;
      
      const t1 = project(pointX, t1z, t1y, width, height);
      const t2 = project(pointX, t2z, t2y, width, height);
      tangentYEnd = t2;
      
      ctx.shadowColor = '#8e44ad';
      ctx.shadowBlur = 10;
      ctx.strokeStyle = '#8e44ad';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(t1.x, t1.y);
      ctx.lineTo(t2.x, t2.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // GRADIENT VECTOR - shown on the xy-plane (base) pointing in direction of steepest ascent
    if (showGradient && gradientMag > 0.01) {
      const gradScale = 0.12;
      
      // Gradient shown at the base (xy-plane) under the point
      const baseX = pointX;
      const baseY = pointY;
      const baseZ = 0;
      
      const gradEndX = baseX + partialXValue * gradScale;
      const gradEndY = baseY + partialYValue * gradScale;
      
      const gradStart = project(baseX, baseZ, baseY, width, height);
      const gradEnd = project(gradEndX, baseZ, gradEndY, width, height);
      
      // Draw gradient arrow
      ctx.shadowColor = '#00ff88';
      ctx.shadowBlur = 15;
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(gradStart.x, gradStart.y);
      ctx.lineTo(gradEnd.x, gradEnd.y);
      ctx.stroke();
      
      // Arrowhead
      const angle = Math.atan2(gradEnd.y - gradStart.y, gradEnd.x - gradStart.x);
      const headLen = 15;
      ctx.fillStyle = '#00ff88';
      ctx.beginPath();
      ctx.moveTo(gradEnd.x, gradEnd.y);
      ctx.lineTo(gradEnd.x - headLen * Math.cos(angle - Math.PI/6), gradEnd.y - headLen * Math.sin(angle - Math.PI/6));
      ctx.lineTo(gradEnd.x - headLen * Math.cos(angle + Math.PI/6), gradEnd.y - headLen * Math.sin(angle + Math.PI/6));
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      
      // Label for gradient
      ctx.fillStyle = '#00ff88';
      ctx.font = 'bold 14px Arial';
      ctx.shadowColor = 'rgba(0,0,0,0.9)';
      ctx.shadowBlur = 4;
      ctx.fillText(`∇f = ⟨${partialXValue.toFixed(1)}, ${partialYValue.toFixed(1)}⟩`, gradEnd.x + 12, gradEnd.y);
      ctx.shadowBlur = 0;
    }

    // Labels next to tangent lines
    ctx.font = 'bold 14px Arial';
    
    if (showTangentX && tangentXEnd) {
      ctx.fillStyle = '#f39c12';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 4;
      ctx.fillText(`∂f/∂x = ${partialXValue.toFixed(2)}`, tangentXEnd.x + 8, tangentXEnd.y - 5);
      ctx.shadowBlur = 0;
    }

    if (showTangentY && tangentYEnd) {
      ctx.fillStyle = '#8e44ad';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 4;
      ctx.fillText(`∂f/∂y = ${partialYValue.toFixed(2)}`, tangentYEnd.x + 8, tangentYEnd.y + 15);
      ctx.shadowBlur = 0;
    }

    // Vertical guide
    const baseProj = project(pointX, 0, pointY, width, height);
    ctx.strokeStyle = 'rgba(46, 204, 113, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(baseProj.x, baseProj.y);
    ctx.lineTo(pointProj.x, pointProj.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Point (always on top)
    ctx.shadowColor = '#2ecc71';
    ctx.shadowBlur = 25;
    ctx.fillStyle = '#2ecc71';
    ctx.beginPath();
    ctx.arc(pointProj.x, pointProj.y, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(pointProj.x - 3, pointProj.y - 3, 4, 0, Math.PI * 2);
    ctx.fill();

    // Point label
    ctx.fillStyle = 'white';
    ctx.font = 'bold 12px Arial';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 4;
    ctx.fillText(`f = ${fValue.toFixed(2)}`, pointProj.x + 18, pointProj.y + 4);
    ctx.shadowBlur = 0;

    // Axes
    const axisLen = 2.8;
    const origin = project(0, 0, 0, width, height);
    const xEnd = project(axisLen, 0, 0, width, height);
    const yEnd = project(0, 2.5, 0, width, height);
    const zEnd = project(0, 0, axisLen, width, height);

    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    
    ctx.strokeStyle = 'rgba(255,100,100,0.8)';
    ctx.beginPath();
    ctx.moveTo(origin.x, origin.y);
    ctx.lineTo(xEnd.x, xEnd.y);
    ctx.stroke();
    
    ctx.strokeStyle = 'rgba(100,255,100,0.8)';
    ctx.beginPath();
    ctx.moveTo(origin.x, origin.y);
    ctx.lineTo(yEnd.x, yEnd.y);
    ctx.stroke();
    
    ctx.strokeStyle = 'rgba(100,100,255,0.8)';
    ctx.beginPath();
    ctx.moveTo(origin.x, origin.y);
    ctx.lineTo(zEnd.x, zEnd.y);
    ctx.stroke();

    ctx.font = 'bold 16px Arial';
    ctx.fillStyle = 'rgba(255,100,100,0.9)';
    ctx.fillText('x', xEnd.x + 8, xEnd.y + 5);
    ctx.fillStyle = 'rgba(100,255,100,0.9)';
    ctx.fillText('f', yEnd.x - 5, yEnd.y - 12);
    ctx.fillStyle = 'rgba(100,100,255,0.9)';
    ctx.fillText('y', zEnd.x + 8, zEnd.y + 5);

  }, [pointX, pointY, rotationX, rotationY, showSliceX, showSliceY, showTangentX, showTangentY, showGradient, fValue, partialXValue, partialYValue, gradientMag, zoom, resolution]);

  const handleMouseDown = (e) => {
    setIsDragging(true);
    setLastMouse({ x: e.clientX, y: e.clientY });
  };

  const handleMouseMove = (e) => {
    if (!isDragging) return;
    const dx = e.clientX - lastMouse.x;
    const dy = e.clientY - lastMouse.y;
    setRotationY(prev => prev + dx * 0.008);
    setRotationX(prev => Math.max(-1.2, Math.min(1.2, prev + dy * 0.008)));
    setLastMouse({ x: e.clientX, y: e.clientY });
  };

  const handleMouseUp = () => setIsDragging(false);
  
  const handleWheel = (e) => {
    e.preventDefault();
    setZoom(prev => Math.max(0.5, Math.min(2.5, prev - e.deltaY * 0.001)));
  };

  return (
    <div className="min-h-screen bg-gray-900 text-white p-4">
      <h1 className="text-2xl font-bold mb-1 text-center">Partial Derivatives & Gradient</h1>
      <p className="text-center text-gray-400 mb-3">f(x,y) = x²y² + x² + y³</p>
      
      <div className="flex flex-col lg:flex-row gap-4 max-w-7xl mx-auto">
        <div className="flex-1">
          <canvas
            ref={canvasRef}
            width={700}
            height={600}
            className="border border-gray-700 rounded-xl cursor-grab active:cursor-grabbing w-full bg-gray-900"
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
            onWheel={handleWheel}
          />
          <p className="text-gray-500 text-xs mt-2 text-center">Drag to rotate • Scroll to zoom</p>
        </div>

        <div className="lg:w-80 space-y-3">
          
          {/* Point controls */}
          <div className="bg-gray-800/80 p-4 rounded-xl">
            <h2 className="font-semibold mb-3 text-sm">Point Location</h2>
            <div className="space-y-3">
              <div>
                <label className="flex justify-between mb-1 text-sm">
                  <span className="text-red-400">x</span>
                  <span className="font-mono text-green-400">{pointX.toFixed(2)}</span>
                </label>
                <input
                  type="range" min="-1.8" max="1.8" step="0.05" value={pointX}
                  onChange={(e) => setPointX(parseFloat(e.target.value))}
                  className="w-full accent-red-500 h-2"
                />
              </div>
              <div>
                <label className="flex justify-between mb-1 text-sm">
                  <span className="text-blue-400">y</span>
                  <span className="font-mono text-green-400">{pointY.toFixed(2)}</span>
                </label>
                <input
                  type="range" min="-1.5" max="1.8" step="0.05" value={pointY}
                  onChange={(e) => setPointY(parseFloat(e.target.value))}
                  className="w-full accent-blue-500 h-2"
                />
              </div>
            </div>
          </div>

          {/* ∂f/∂x section */}
          <div className="bg-yellow-900/30 border border-yellow-600/50 p-4 rounded-xl">
            <div className="flex items-center justify-between mb-2">
              <h2 className="font-semibold text-yellow-400 text-sm flex items-center gap-2">
                <div className="w-3 h-3 bg-yellow-400 rounded-full"></div>
                ∂f/∂x
              </h2>
              <span className="font-mono text-yellow-400 text-xl">{partialXValue.toFixed(2)}</span>
            </div>
            <p className="text-xs text-gray-400 mb-2">= 2xy² + 2x</p>
            <div className="flex gap-3">
              <label className="flex items-center gap-1 cursor-pointer text-xs">
                <input type="checkbox" checked={showSliceX} onChange={(e) => setShowSliceX(e.target.checked)} className="accent-yellow-500 w-3 h-3" />
                <span>Slice</span>
              </label>
              <label className="flex items-center gap-1 cursor-pointer text-xs">
                <input type="checkbox" checked={showTangentX} onChange={(e) => setShowTangentX(e.target.checked)} className="accent-orange-500 w-3 h-3" />
                <span>Tangent</span>
              </label>
            </div>
          </div>

          {/* ∂f/∂y section */}
          <div className="bg-purple-900/30 border border-purple-600/50 p-4 rounded-xl">
            <div className="flex items-center justify-between mb-2">
              <h2 className="font-semibold text-purple-400 text-sm flex items-center gap-2">
                <div className="w-3 h-3 bg-purple-400 rounded-full"></div>
                ∂f/∂y
              </h2>
              <span className="font-mono text-purple-400 text-xl">{partialYValue.toFixed(2)}</span>
            </div>
            <p className="text-xs text-gray-400 mb-2">= 2x²y + 3y²</p>
            <div className="flex gap-3">
              <label className="flex items-center gap-1 cursor-pointer text-xs">
                <input type="checkbox" checked={showSliceY} onChange={(e) => setShowSliceY(e.target.checked)} className="accent-purple-500 w-3 h-3" />
                <span>Slice</span>
              </label>
              <label className="flex items-center gap-1 cursor-pointer text-xs">
                <input type="checkbox" checked={showTangentY} onChange={(e) => setShowTangentY(e.target.checked)} className="accent-purple-500 w-3 h-3" />
                <span>Tangent</span>
              </label>
            </div>
          </div>

          {/* Gradient section */}
          <div className="bg-emerald-900/30 border border-emerald-500/50 p-4 rounded-xl">
            <div className="flex items-center justify-between mb-2">
              <h2 className="font-semibold text-emerald-400 text-sm flex items-center gap-2">
                <div className="w-3 h-3 bg-emerald-400 rounded-full"></div>
                ∇f (Gradient)
              </h2>
              <label className="flex items-center gap-1 cursor-pointer text-xs">
                <input type="checkbox" checked={showGradient} onChange={(e) => setShowGradient(e.target.checked)} className="accent-emerald-500 w-4 h-4" />
                <span>Show</span>
              </label>
            </div>
            <p className="font-mono text-lg text-emerald-400">
              ⟨<span className="text-yellow-400">{partialXValue.toFixed(2)}</span>, <span className="text-purple-400">{partialYValue.toFixed(2)}</span>⟩
            </p>
            <p className="text-xs text-gray-400 mt-2">
              |∇f| = {gradientMag.toFixed(2)} <span className="text-gray-500">(how steep)</span>
            </p>
            <p className="text-xs text-emerald-400/70 mt-1">
              Green arrow on floor = direction of steepest climb
            </p>
          </div>

          {/* Function value */}
          <div className="bg-gray-800/80 p-4 rounded-xl">
            <div className="flex items-center justify-between">
              <span className="text-sm text-gray-400">f({pointX.toFixed(1)}, {pointY.toFixed(1)})</span>
              <span className="font-mono text-white text-xl">{fValue.toFixed(2)}</span>
            </div>
          </div>

          {/* Resolution */}
          <div className="bg-gray-800/80 p-3 rounded-xl">
            <label className="flex justify-between mb-1 text-xs">
              <span>Resolution</span>
              <span className="font-mono text-gray-400">{resolution}</span>
            </label>
            <input
              type="range" min="20" max="60" step="5" value={resolution}
              onChange={(e) => setResolution(parseInt(e.target.value))}
              className="w-full accent-blue-500 h-1"
            />
          </div>

          {/* ML connection */}
          <div className="bg-rose-900/20 border border-rose-700/50 p-3 rounded-xl text-xs">
            <p className="text-rose-300 font-semibold mb-1">Gradient Descent:</p>
            <p className="text-gray-400">
              Walk opposite to ∇f (downhill) to minimize. That's how neural networks learn — follow −∇f repeatedly.
            </p>
          </div>

        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(PartialDerivativeVisualization));
</script>
<script>window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+='\n'+e.message;});</script>
