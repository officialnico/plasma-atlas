<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>determinant viz</title>
<style>html,body{margin:0;background:#0c0d10;color:#e8eaf0;font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif}
#root{min-height:100vh}#err{display:none;white-space:pre-wrap;padding:24px;color:#f0736a;font:13px/1.5 ui-monospace,Menlo,monospace}</style>
<div id="root"></div><pre id="err"></pre>
<script src="../_lib/react/libs-base.js"></script>
<script src="../_lib/react/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect,useReducer,useContext,createContext,forwardRef,memo,Fragment,Children,cloneElement} = React;



function DeterminantVisualization() {
  const canvasRef = useRef(null);
  const [vectorA, setVectorA] = useState({ x: 3, y: 1 });
  const [vectorB, setVectorB] = useState({ x: 1, y: 3 });
  const [dragging, setDragging] = useState(null);

  const scale = 45;
  const originX = 250;
  const originY = 250;

  // Determinant = a1*b2 - a2*b1 (signed area of parallelogram)
  const determinant = vectorA.x * vectorB.y - vectorA.y * vectorB.x;
  const area = Math.abs(determinant);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, width, height);

    // Draw grid
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    for (let i = -6; i <= 6; i++) {
      ctx.beginPath();
      ctx.moveTo(originX + i * scale, 0);
      ctx.lineTo(originX + i * scale, height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, originY + i * scale);
      ctx.lineTo(width, originY + i * scale);
      ctx.stroke();
    }

    // Draw axes
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, originY);
    ctx.lineTo(width, originY);
    ctx.moveTo(originX, 0);
    ctx.lineTo(originX, height);
    ctx.stroke();

    // Canvas coordinates
    const ax = originX + vectorA.x * scale;
    const ay = originY - vectorA.y * scale;
    const bx = originX + vectorB.x * scale;
    const by = originY - vectorB.y * scale;
    
    // Fourth corner of parallelogram (A + B)
    const cx = originX + (vectorA.x + vectorB.x) * scale;
    const cy = originY - (vectorA.y + vectorB.y) * scale;

    // Draw parallelogram
    ctx.fillStyle = determinant >= 0 
      ? 'rgba(46, 204, 113, 0.25)' 
      : 'rgba(231, 76, 60, 0.25)';
    ctx.beginPath();
    ctx.moveTo(originX, originY);
    ctx.lineTo(ax, ay);
    ctx.lineTo(cx, cy);
    ctx.lineTo(bx, by);
    ctx.closePath();
    ctx.fill();

    // Parallelogram outline
    ctx.strokeStyle = determinant >= 0 
      ? 'rgba(46, 204, 113, 0.6)' 
      : 'rgba(231, 76, 60, 0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Dashed lines showing the parallelogram completion
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(cx, cy);
    ctx.moveTo(bx, by);
    ctx.lineTo(cx, cy);
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw arrows
    const drawArrow = (fromX, fromY, toX, toY, color, lineWidth = 3) => {
      const headLen = 12;
      const dx = toX - fromX;
      const dy = toY - fromY;
      const angle = Math.atan2(dy, dx);
      const length = Math.sqrt(dx*dx + dy*dy);
      
      if (length < 5) return;
      
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();
      
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI / 6), toY - headLen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI / 6), toY - headLen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
    };

    // Draw vectors
    drawArrow(originX, originY, ax, ay, '#e74c3c', 4);
    drawArrow(originX, originY, bx, by, '#3498db', 4);

    // Draw rotation indicator (curved arrow showing orientation)
    if (area > 0.5) {
      const arcRadius = 30;
      const angleA = Math.atan2(-vectorA.y, vectorA.x);
      const angleB = Math.atan2(-vectorB.y, vectorB.x);
      
      ctx.strokeStyle = determinant >= 0 ? '#2ecc71' : '#e74c3c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      
      if (determinant >= 0) {
        // Counter-clockwise from A to B
        ctx.arc(originX, originY, arcRadius, angleA, angleB, angleA > angleB);
      } else {
        // Clockwise from A to B
        ctx.arc(originX, originY, arcRadius, angleA, angleB, angleA < angleB);
      }
      ctx.stroke();
      
      // Small arrowhead on the arc
      const arrowAngle = determinant >= 0 ? angleB : angleB;
      const arrowDir = determinant >= 0 ? 1 : -1;
      const arrowX = originX + arcRadius * Math.cos(arrowAngle);
      const arrowY = originY + arcRadius * Math.sin(arrowAngle);
      
      ctx.fillStyle = determinant >= 0 ? '#2ecc71' : '#e74c3c';
      ctx.beginPath();
      const perpAngle = arrowAngle + (arrowDir * Math.PI / 2);
      ctx.moveTo(arrowX + 8 * Math.cos(perpAngle), arrowY + 8 * Math.sin(perpAngle));
      ctx.lineTo(arrowX + 8 * Math.cos(perpAngle + 2.5), arrowY + 8 * Math.sin(perpAngle + 2.5));
      ctx.lineTo(arrowX + 8 * Math.cos(perpAngle - 2.5), arrowY + 8 * Math.sin(perpAngle - 2.5));
      ctx.closePath();
      ctx.fill();
    }

    // Draggable points
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(ax, ay, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#3498db';
    ctx.beginPath();
    ctx.arc(bx, by, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Labels
    ctx.font = 'bold 20px Arial';
    ctx.fillStyle = '#e74c3c';
    ctx.fillText('A', ax + 12, ay - 8);
    ctx.fillStyle = '#3498db';
    ctx.fillText('B', bx + 12, by - 8);

    // Area label in center of parallelogram
    if (area > 1) {
      const centerX = originX + (vectorA.x + vectorB.x) / 2 * scale;
      const centerY = originY - (vectorA.y + vectorB.y) / 2 * scale;
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.font = 'bold 16px Arial';
      ctx.fillText(`Area = ${area.toFixed(1)}`, centerX - 40, centerY);
    }

  }, [vectorA, vectorB, determinant, area]);

  const handleMouseDown = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);

    const ax = originX + vectorA.x * scale;
    const ay = originY - vectorA.y * scale;
    const bx = originX + vectorB.x * scale;
    const by = originY - vectorB.y * scale;

    const distA = Math.sqrt((x - ax) ** 2 + (y - ay) ** 2);
    const distB = Math.sqrt((x - bx) ** 2 + (y - by) ** 2);

    if (distA < 25) setDragging('A');
    else if (distB < 25) setDragging('B');
  };

  const handleMouseMove = (e) => {
    if (!dragging) return;
    
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);

    const vx = Math.round((x - originX) / scale * 2) / 2;
    const vy = Math.round((originY - y) / scale * 2) / 2;
    const clamp = (val) => Math.max(-5, Math.min(5, val));

    if (dragging === 'A') {
      setVectorA({ x: clamp(vx), y: clamp(vy) });
    } else if (dragging === 'B') {
      setVectorB({ x: clamp(vx), y: clamp(vy) });
    }
  };

  const handleMouseUp = () => {
    setDragging(null);
  };

  const signColor = determinant >= 0 ? 'text-green-400' : 'text-red-400';
  const signBg = determinant >= 0 ? 'bg-green-900/40 border-green-600' : 'bg-red-900/40 border-red-600';

  return (
    <div className="min-h-screen bg-gray-900 text-white p-6">
      <h1 className="text-2xl font-bold mb-2 text-center">Determinant = Signed Area</h1>
      <p className="text-center text-gray-400 mb-4">The determinant tells you the area of the parallelogram (with a sign for orientation)</p>
      
      <div className="flex flex-col lg:flex-row gap-6 max-w-5xl mx-auto">
        <div className="flex-1">
          <canvas
            ref={canvasRef}
            width={500}
            height={500}
            className="border border-gray-600 rounded-lg cursor-grab active:cursor-grabbing w-full"
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
          />
          <p className="text-gray-400 text-sm mt-2 text-center">
            Drag <span className="text-red-400">A</span> and <span className="text-blue-400">B</span> to change the parallelogram
          </p>
        </div>

        <div className="lg:w-80 space-y-4">
          
          {/* Main result */}
          <div className={`p-4 rounded-lg border-2 ${signBg}`}>
            <h2 className="text-sm text-gray-400 mb-1">Determinant</h2>
            <div className={`text-4xl font-bold font-mono ${signColor}`}>
              {determinant.toFixed(1)}
            </div>
            <div className="mt-2 text-sm">
              <span className="text-gray-400">Area = </span>
              <span className="font-mono">{area.toFixed(1)}</span>
              <span className="text-gray-400"> square units</span>
            </div>
          </div>

          {/* The formula */}
          <div className="bg-gray-800 p-4 rounded-lg">
            <h2 className="font-semibold mb-3">The 2×2 Determinant</h2>
            <div className="font-mono text-sm space-y-2">
              <div className="flex items-center gap-2">
                <div className="text-gray-400">det</div>
                <div className="border border-gray-600 px-2 py-1">
                  <div><span className="text-red-400">{vectorA.x}</span> <span className="text-blue-400">{vectorB.x}</span></div>
                  <div><span className="text-red-400">{vectorA.y}</span> <span className="text-blue-400">{vectorB.y}</span></div>
                </div>
                <div>=</div>
              </div>
              <p className="text-gray-400 text-xs">(a₁)(b₂) − (a₂)(b₁)</p>
              <p>= (<span className="text-red-400">{vectorA.x}</span>)(<span className="text-blue-400">{vectorB.y}</span>) − (<span className="text-red-400">{vectorA.y}</span>)(<span className="text-blue-400">{vectorB.x}</span>)</p>
              <p>= {(vectorA.x * vectorB.y).toFixed(1)} − {(vectorA.y * vectorB.x).toFixed(1)}</p>
              <p className={`font-bold text-lg ${signColor}`}>= {determinant.toFixed(1)}</p>
            </div>
          </div>

          {/* Sign meaning */}
          <div className={`p-4 rounded-lg ${signBg}`}>
            <h2 className="font-semibold mb-2">What the sign means:</h2>
            <p className="text-sm">
              {determinant > 0 && (
                <span className="text-green-400">
                  <strong>Positive:</strong> Going from A to B is counter-clockwise. The vectors form a "right-handed" system.
                </span>
              )}
              {determinant < 0 && (
                <span className="text-red-400">
                  <strong>Negative:</strong> Going from A to B is clockwise. The vectors form a "left-handed" system.
                </span>
              )}
              {determinant === 0 && (
                <span className="text-yellow-400">
                  <strong>Zero:</strong> The vectors are parallel (or one is zero). No parallelogram — just a line!
                </span>
              )}
            </p>
          </div>

          {/* Vectors */}
          <div className="bg-gray-800 p-4 rounded-lg">
            <h2 className="font-semibold mb-2">Vectors</h2>
            <div className="space-y-1 font-mono text-sm">
              <p><span className="text-red-400 font-bold">A</span> = ⟨{vectorA.x}, {vectorA.y}⟩</p>
              <p><span className="text-blue-400 font-bold">B</span> = ⟨{vectorB.x}, {vectorB.y}⟩</p>
            </div>
          </div>

          {/* Try these */}
          <div className="bg-gray-800 p-4 rounded-lg text-sm">
            <h3 className="font-semibold mb-2">Try:</h3>
            <ul className="space-y-1 text-gray-300">
              <li>• Make A and B parallel → det = 0</li>
              <li>• Swap A and B's positions → sign flips</li>
              <li>• Make a unit square (A=⟨1,0⟩, B=⟨0,1⟩) → det = 1</li>
            </ul>
          </div>

          {/* Key insight */}
          <div className="bg-blue-900/30 border border-blue-700 p-4 rounded-lg text-sm">
            <p className="font-semibold mb-2">Key insight:</p>
            <p className="text-gray-300">
              The determinant measures how much "space" two vectors span. If they're parallel, they span no area. If they're perpendicular, they span maximum area for their lengths.
            </p>
          </div>

        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(DeterminantVisualization));
</script>
<script>window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+='\n'+e.message;});</script>
