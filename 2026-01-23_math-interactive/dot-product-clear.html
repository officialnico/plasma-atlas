<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>dot product clear</title>
<style>html,body{margin:0;background:#0c0d10;color:#e8eaf0;font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif}
#root{min-height:100vh}#err{display:none;white-space:pre-wrap;padding:24px;color:#f0736a;font:13px/1.5 ui-monospace,Menlo,monospace}</style>
<div id="root"></div><pre id="err"></pre>
<script src="../_lib/react/libs-base.js"></script>
<script src="../_lib/react/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect,useReducer,useContext,createContext,forwardRef,memo,Fragment,Children,cloneElement} = React;



function DotProductVisualization() {
  const canvasRef = useRef(null);
  const [vectorA, setVectorA] = useState({ x: 3, y: 4 });
  const [vectorB, setVectorB] = useState({ x: 5, y: 1 });
  const [dragging, setDragging] = useState(null);

  const scale = 40;
  const originX = 250;
  const originY = 250;

  // Calculate dot product algebraically
  const dotProduct = vectorA.x * vectorB.x + vectorA.y * vectorB.y;
  
  // Calculate magnitudes
  const magA = Math.sqrt(vectorA.x * vectorA.x + vectorA.y * vectorA.y);
  const magB = Math.sqrt(vectorB.x * vectorB.x + vectorB.y * vectorB.y);
  
  // Calculate angle
  const cosTheta = magA > 0 && magB > 0 ? dotProduct / (magA * magB) : 0;
  const theta = Math.acos(Math.max(-1, Math.min(1, cosTheta)));
  const thetaDegrees = (theta * 180 / Math.PI);

  // Shadow length (projection of A onto B direction) = |A|cos(θ)
  const shadowLength = magA * cosTheta;

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, width, height);

    // Draw grid
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    for (let i = -6; i <= 6; i++) {
      ctx.beginPath();
      ctx.moveTo(originX + i * scale, 0);
      ctx.lineTo(originX + i * scale, height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, originY + i * scale);
      ctx.lineTo(width, originY + i * scale);
      ctx.stroke();
    }

    // Draw axes
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, originY);
    ctx.lineTo(width, originY);
    ctx.moveTo(originX, 0);
    ctx.lineTo(originX, height);
    ctx.stroke();

    // Helper function to draw arrow
    const drawArrow = (fromX, fromY, toX, toY, color, lineWidth = 3) => {
      const headLen = 12;
      const dx = toX - fromX;
      const dy = toY - fromY;
      const angle = Math.atan2(dy, dx);
      
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();
      
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI / 6), toY - headLen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI / 6), toY - headLen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
    };

    // Convert to canvas coordinates
    const ax = originX + vectorA.x * scale;
    const ay = originY - vectorA.y * scale;
    const bx = originX + vectorB.x * scale;
    const by = originY - vectorB.y * scale;
    
    // Shadow endpoint (projection point along B's direction)
    const projX = magB > 0 ? shadowLength * (vectorB.x / magB) : 0;
    const projY = magB > 0 ? shadowLength * (vectorB.y / magB) : 0;
    const px = originX + projX * scale;
    const py = originY - projY * scale;

    // Draw angle arc
    if (magA > 0.1 && magB > 0.1) {
      const arcRadius = 45;
      const angleA = Math.atan2(-vectorA.y, vectorA.x);
      const angleB = Math.atan2(-vectorB.y, vectorB.x);
      
      ctx.strokeStyle = '#9b59b6';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(originX, originY, arcRadius, Math.min(angleA, angleB), Math.max(angleA, angleB));
      ctx.stroke();
      
      const midAngle = (angleA + angleB) / 2;
      const labelRadius = arcRadius + 15;
      ctx.fillStyle = '#9b59b6';
      ctx.font = 'bold 18px Arial';
      ctx.fillText('θ', originX + labelRadius * Math.cos(midAngle) - 6, originY + labelRadius * Math.sin(midAngle) + 5);
    }

    // Draw projection (shadow)
    if (magB > 0.1) {
      // Dashed line from A down to the projection point
      ctx.strokeStyle = 'rgba(241, 196, 15, 0.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(px, py);
      ctx.stroke();
      ctx.setLineDash([]);

      // The shadow line itself
      ctx.strokeStyle = '#f1c40f';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(originX, originY);
      ctx.lineTo(px, py);
      ctx.stroke();

      // Shadow endpoint
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      ctx.arc(px, py, 5, 0, Math.PI * 2);
      ctx.fill();

      // Right angle marker
      const perpX = -vectorB.y / magB * 12;
      const perpY = vectorB.x / magB * 12;
      const alongX = vectorB.x / magB * 12;
      const alongY = -vectorB.y / magB * 12;
      
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(px + perpX, py + perpY);
      ctx.lineTo(px + perpX - alongX, py + perpY - alongY);
      ctx.lineTo(px - alongX, py - alongY);
      ctx.stroke();
    }

    // Draw vector B (green)
    drawArrow(originX, originY, bx, by, '#2ecc71', 4);
    
    // Draw vector A (red)
    drawArrow(originX, originY, ax, ay, '#e74c3c', 4);

    // Draw draggable points
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(ax, ay, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#2ecc71';
    ctx.beginPath();
    ctx.arc(bx, by, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Labels
    ctx.font = 'bold 20px Arial';
    ctx.fillStyle = '#e74c3c';
    ctx.fillText('A', ax + 12, ay - 10);
    ctx.fillStyle = '#2ecc71';
    ctx.fillText('B', bx + 12, by - 10);

  }, [vectorA, vectorB, dotProduct, magA, magB, shadowLength]);

  const handleMouseDown = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);

    const ax = originX + vectorA.x * scale;
    const ay = originY - vectorA.y * scale;
    const bx = originX + vectorB.x * scale;
    const by = originY - vectorB.y * scale;

    const distA = Math.sqrt((x - ax) ** 2 + (y - ay) ** 2);
    const distB = Math.sqrt((x - bx) ** 2 + (y - by) ** 2);

    if (distA < 25) setDragging('A');
    else if (distB < 25) setDragging('B');
  };

  const handleMouseMove = (e) => {
    if (!dragging) return;
    
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);

    const vx = Math.round((x - originX) / scale * 2) / 2;
    const vy = Math.round((originY - y) / scale * 2) / 2;

    const clamp = (val) => Math.max(-5.5, Math.min(5.5, val));

    if (dragging === 'A') {
      setVectorA({ x: clamp(vx), y: clamp(vy) });
    } else if (dragging === 'B') {
      setVectorB({ x: clamp(vx), y: clamp(vy) });
    }
  };

  const handleMouseUp = () => {
    setDragging(null);
  };

  const signColor = dotProduct > 0 ? 'text-green-400' : dotProduct < 0 ? 'text-red-400' : 'text-yellow-400';
  const signBg = dotProduct > 0 ? 'bg-green-900/40 border-green-600' : dotProduct < 0 ? 'bg-red-900/40 border-red-600' : 'bg-yellow-900/40 border-yellow-600';

  return (
    <div className="min-h-screen bg-gray-900 text-white p-6">
      <h1 className="text-2xl font-bold mb-2 text-center">Dot Product Visualization</h1>
      
      <div className="flex flex-col lg:flex-row gap-6 max-w-5xl mx-auto">
        <div className="flex-1">
          <canvas
            ref={canvasRef}
            width={500}
            height={500}
            className="border border-gray-600 rounded-lg cursor-grab active:cursor-grabbing w-full"
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
          />
          <p className="text-gray-400 text-sm mt-2 text-center">Drag the dots to move the vectors</p>
        </div>

        <div className="lg:w-96 space-y-4">
          
          {/* THE KEY EQUATION */}
          <div className="bg-gray-800 p-5 rounded-lg border-2 border-gray-600">
            <h2 className="text-center text-gray-400 mb-3">The dot product is:</h2>
            
            <div className="flex items-center justify-center gap-3 text-2xl font-mono">
              <div className="text-center">
                <div className="text-yellow-400 font-bold">{Math.abs(shadowLength).toFixed(2)}</div>
                <div className="text-xs text-yellow-400/70">shadow</div>
              </div>
              <div className="text-gray-400">×</div>
              <div className="text-center">
                <div className="text-green-400 font-bold">{magB.toFixed(2)}</div>
                <div className="text-xs text-green-400/70">|B|</div>
              </div>
              <div className="text-gray-400">=</div>
              <div className="text-center">
                <div className={`font-bold ${signColor}`}>{dotProduct.toFixed(1)}</div>
                <div className={`text-xs ${signColor}/70`}>A·B</div>
              </div>
            </div>

            {shadowLength < 0 && (
              <p className="text-center text-xs text-gray-500 mt-2">(shadow is negative because A points away from B)</p>
            )}
          </div>

          {/* Visual bar representation */}
          <div className="bg-gray-800 p-4 rounded-lg">
            <h2 className="text-sm font-semibold mb-3 text-gray-400">Visual breakdown:</h2>
            
            <div className="space-y-3">
              <div>
                <div className="flex justify-between text-sm mb-1">
                  <span className="text-yellow-400">Shadow length</span>
                  <span className="font-mono">{Math.abs(shadowLength).toFixed(2)}</span>
                </div>
                <div className="h-3 bg-gray-700 rounded-full overflow-hidden">
                  <div 
                    className="h-full bg-yellow-400 rounded-full transition-all"
                    style={{ width: `${Math.min(Math.abs(shadowLength) / 8 * 100, 100)}%` }}
                  />
                </div>
              </div>
              
              <div>
                <div className="flex justify-between text-sm mb-1">
                  <span className="text-green-400">|B| length</span>
                  <span className="font-mono">{magB.toFixed(2)}</span>
                </div>
                <div className="h-3 bg-gray-700 rounded-full overflow-hidden">
                  <div 
                    className="h-full bg-green-400 rounded-full transition-all"
                    style={{ width: `${Math.min(magB / 8 * 100, 100)}%` }}
                  />
                </div>
              </div>
              
              <div className="pt-2 border-t border-gray-700">
                <div className="flex justify-between text-sm mb-1">
                  <span className={signColor}>Dot product (multiply them)</span>
                  <span className="font-mono">{dotProduct.toFixed(1)}</span>
                </div>
                <div className="h-4 bg-gray-700 rounded-full overflow-hidden">
                  <div 
                    className={`h-full rounded-full transition-all ${dotProduct >= 0 ? 'bg-green-500' : 'bg-red-500'}`}
                    style={{ width: `${Math.min(Math.abs(dotProduct) / 40 * 100, 100)}%` }}
                  />
                </div>
              </div>
            </div>
          </div>

          {/* Explanation */}
          <div className="bg-yellow-900/20 border border-yellow-700/50 p-4 rounded-lg">
            <p className="text-sm text-gray-300">
              <span className="text-yellow-400 font-semibold">Yellow shadow</span> = how much of A points in B's direction
            </p>
            <p className="text-sm text-gray-300 mt-2">
              Then multiply by <span className="text-green-400 font-semibold">|B|</span> to get the dot product.
            </p>
            <p className="text-sm text-gray-400 mt-2 italic">
              That's why changing B's length changes the dot product, even if the shadow stays the same!
            </p>
          </div>

          {/* Vectors info */}
          <div className="bg-gray-800 p-4 rounded-lg">
            <div className="space-y-1 font-mono text-sm">
              <p><span className="text-red-400 font-bold">A</span> = ⟨{vectorA.x}, {vectorA.y}⟩ <span className="text-gray-500">|A| = {magA.toFixed(2)}</span></p>
              <p><span className="text-green-400 font-bold">B</span> = ⟨{vectorB.x}, {vectorB.y}⟩ <span className="text-gray-500">|B| = {magB.toFixed(2)}</span></p>
              <p className="text-purple-400">θ = {thetaDegrees.toFixed(1)}°</p>
            </div>
          </div>

        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(DotProductVisualization));
</script>
<script>window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+='\n'+e.message;});</script>
