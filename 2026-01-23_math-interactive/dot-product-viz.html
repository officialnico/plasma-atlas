<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>dot product viz</title>
<style>html,body{margin:0;background:#0c0d10;color:#e8eaf0;font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif}
#root{min-height:100vh}#err{display:none;white-space:pre-wrap;padding:24px;color:#f0736a;font:13px/1.5 ui-monospace,Menlo,monospace}</style>
<div id="root"></div><pre id="err"></pre>
<script src="../_lib/react/libs-base.js"></script>
<script src="../_lib/react/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect,useReducer,useContext,createContext,forwardRef,memo,Fragment,Children,cloneElement} = React;



function DotProductVisualization() {
  const canvasRef = useRef(null);
  const [vectorA, setVectorA] = useState({ x: 3, y: 4 });
  const [vectorB, setVectorB] = useState({ x: 5, y: 1 });
  const [dragging, setDragging] = useState(null);
  const [showProjection, setShowProjection] = useState(true);

  const scale = 40;
  const originX = 250;
  const originY = 250;

  // Calculate dot product algebraically
  const dotProduct = vectorA.x * vectorB.x + vectorA.y * vectorB.y;
  
  // Calculate magnitudes
  const magA = Math.sqrt(vectorA.x * vectorA.x + vectorA.y * vectorA.y);
  const magB = Math.sqrt(vectorB.x * vectorB.x + vectorB.y * vectorB.y);
  
  // Calculate angle
  const cosTheta = dotProduct / (magA * magB);
  const theta = Math.acos(Math.max(-1, Math.min(1, cosTheta)));
  const thetaDegrees = (theta * 180 / Math.PI);
  
  // Projection of A onto B
  const projScalar = dotProduct / (magB * magB);
  const projX = projScalar * vectorB.x;
  const projY = projScalar * vectorB.y;
  const projMag = Math.abs(dotProduct) / magB;

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, width, height);

    // Draw grid
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    for (let i = -6; i <= 6; i++) {
      ctx.beginPath();
      ctx.moveTo(originX + i * scale, 0);
      ctx.lineTo(originX + i * scale, height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, originY + i * scale);
      ctx.lineTo(width, originY + i * scale);
      ctx.stroke();
    }

    // Draw axes
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, originY);
    ctx.lineTo(width, originY);
    ctx.moveTo(originX, 0);
    ctx.lineTo(originX, height);
    ctx.stroke();

    // Helper function to draw arrow
    const drawArrow = (fromX, fromY, toX, toY, color, lineWidth = 3) => {
      const headLen = 12;
      const dx = toX - fromX;
      const dy = toY - fromY;
      const angle = Math.atan2(dy, dx);
      
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();
      
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI / 6), toY - headLen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI / 6), toY - headLen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
    };

    // Convert to canvas coordinates
    const ax = originX + vectorA.x * scale;
    const ay = originY - vectorA.y * scale;
    const bx = originX + vectorB.x * scale;
    const by = originY - vectorB.y * scale;
    const px = originX + projX * scale;
    const py = originY - projY * scale;

    // Draw angle arc
    const arcRadius = 40;
    const angleA = Math.atan2(-vectorA.y, vectorA.x);
    const angleB = Math.atan2(-vectorB.y, vectorB.x);
    
    ctx.strokeStyle = '#9b59b6';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(originX, originY, arcRadius, Math.min(angleA, angleB), Math.max(angleA, angleB));
    ctx.stroke();
    
    // Label angle
    const midAngle = (angleA + angleB) / 2;
    const labelRadius = arcRadius + 15;
    ctx.fillStyle = '#9b59b6';
    ctx.font = 'bold 16px Arial';
    ctx.fillText('θ', originX + labelRadius * Math.cos(midAngle) - 5, originY + labelRadius * Math.sin(midAngle) + 5);

    // Draw projection if enabled
    if (showProjection) {
      // Dashed line from A to projection point
      ctx.strokeStyle = 'rgba(241, 196, 15, 0.6)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(px, py);
      ctx.stroke();
      ctx.setLineDash([]);

      // Projection vector
      ctx.strokeStyle = '#f1c40f';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(originX, originY);
      ctx.lineTo(px, py);
      ctx.stroke();

      // Projection point
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      ctx.arc(px, py, 6, 0, Math.PI * 2);
      ctx.fill();

      // Right angle marker at projection
      if (magB > 0.1) {
        const perpX = -vectorB.y / magB * 10;
        const perpY = vectorB.x / magB * 10;
        const alongX = vectorB.x / magB * 10;
        const alongY = -vectorB.y / magB * 10;
        
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(px + perpX, py + perpY);
        ctx.lineTo(px + perpX - alongX, py + perpY - alongY);
        ctx.lineTo(px - alongX, py - alongY);
        ctx.stroke();
      }
    }

    // Draw vector B (green)
    drawArrow(originX, originY, bx, by, '#2ecc71', 3);
    
    // Draw vector A (red/orange)
    drawArrow(originX, originY, ax, ay, '#e74c3c', 3);

    // Draw draggable points
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(ax, ay, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#2ecc71';
    ctx.beginPath();
    ctx.arc(bx, by, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Labels
    ctx.font = 'bold 18px Arial';
    ctx.fillStyle = '#e74c3c';
    ctx.fillText('A', ax + 12, ay - 8);
    ctx.fillStyle = '#2ecc71';
    ctx.fillText('B', bx + 12, by - 8);
    
    if (showProjection) {
      ctx.fillStyle = '#f1c40f';
      ctx.font = '14px Arial';
      ctx.fillText('proj', px + 10, py + 20);
    }

  }, [vectorA, vectorB, showProjection, projX, projY]);

  const handleMouseDown = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);

    const ax = originX + vectorA.x * scale;
    const ay = originY - vectorA.y * scale;
    const bx = originX + vectorB.x * scale;
    const by = originY - vectorB.y * scale;

    const distA = Math.sqrt((x - ax) ** 2 + (y - ay) ** 2);
    const distB = Math.sqrt((x - bx) ** 2 + (y - by) ** 2);

    if (distA < 20) setDragging('A');
    else if (distB < 20) setDragging('B');
  };

  const handleMouseMove = (e) => {
    if (!dragging) return;
    
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);

    const vx = Math.round((x - originX) / scale * 2) / 2;
    const vy = Math.round((originY - y) / scale * 2) / 2;

    const clamp = (val) => Math.max(-5.5, Math.min(5.5, val));

    if (dragging === 'A') {
      setVectorA({ x: clamp(vx), y: clamp(vy) });
    } else if (dragging === 'B') {
      setVectorB({ x: clamp(vx), y: clamp(vy) });
    }
  };

  const handleMouseUp = () => {
    setDragging(null);
  };

  const dotProductSign = dotProduct > 0 ? 'positive' : dotProduct < 0 ? 'negative' : 'zero';
  const signColor = dotProduct > 0 ? 'text-green-400' : dotProduct < 0 ? 'text-red-400' : 'text-gray-400';
  const signBg = dotProduct > 0 ? 'bg-green-900/30 border-green-700' : dotProduct < 0 ? 'bg-red-900/30 border-red-700' : 'bg-gray-700 border-gray-600';

  return (
    <div className="min-h-screen bg-gray-900 text-white p-6">
      <h1 className="text-2xl font-bold mb-4 text-center">Dot Product Visualization</h1>
      
      <div className="flex flex-col lg:flex-row gap-6 max-w-6xl mx-auto">
        <div className="flex-1">
          <canvas
            ref={canvasRef}
            width={500}
            height={500}
            className="border border-gray-600 rounded-lg cursor-grab active:cursor-grabbing w-full"
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
          />
          <p className="text-gray-400 text-sm mt-2 text-center">Drag the vector tips to move them</p>
        </div>

        <div className="lg:w-96 space-y-4">
          <div className="bg-gray-800 p-4 rounded-lg">
            <h2 className="text-lg font-semibold mb-3">Vectors</h2>
            <div className="space-y-2 font-mono">
              <p><span className="text-red-400 font-bold">A</span> = ⟨{vectorA.x}, {vectorA.y}⟩ <span className="text-gray-400">|A| = {magA.toFixed(2)}</span></p>
              <p><span className="text-green-400 font-bold">B</span> = ⟨{vectorB.x}, {vectorB.y}⟩ <span className="text-gray-400">|B| = {magB.toFixed(2)}</span></p>
            </div>
          </div>

          <div className={`p-4 rounded-lg border ${signBg}`}>
            <h2 className="text-lg font-semibold mb-3">Dot Product Result</h2>
            <p className={`text-3xl font-bold font-mono ${signColor}`}>{dotProduct.toFixed(2)}</p>
            <p className={`text-sm mt-1 ${signColor}`}>
              {dotProduct > 0 && "Vectors point in similar directions (acute angle)"}
              {dotProduct < 0 && "Vectors point in opposite directions (obtuse angle)"}
              {dotProduct === 0 && "Vectors are perpendicular!"}
            </p>
          </div>

          <div className="bg-gray-800 p-4 rounded-lg">
            <h2 className="text-lg font-semibold mb-3">Algebraic View</h2>
            <div className="font-mono text-sm space-y-1">
              <p className="text-gray-400">A · B = a₁b₁ + a₂b₂</p>
              <p>A · B = ({vectorA.x})({vectorB.x}) + ({vectorA.y})({vectorB.y})</p>
              <p>A · B = {(vectorA.x * vectorB.x).toFixed(1)} + {(vectorA.y * vectorB.y).toFixed(1)}</p>
              <p className="text-yellow-400 font-bold">A · B = {dotProduct.toFixed(2)}</p>
            </div>
          </div>

          <div className="bg-gray-800 p-4 rounded-lg">
            <h2 className="text-lg font-semibold mb-3">Geometric View</h2>
            <div className="font-mono text-sm space-y-1">
              <p className="text-gray-400">A · B = |A||B|cos θ</p>
              <p><span className="text-purple-400">θ = {thetaDegrees.toFixed(1)}°</span></p>
              <p>A · B = ({magA.toFixed(2)})({magB.toFixed(2)})(cos {thetaDegrees.toFixed(1)}°)</p>
              <p>A · B = ({magA.toFixed(2)})({magB.toFixed(2)})({cosTheta.toFixed(3)})</p>
              <p className="text-yellow-400 font-bold">A · B = {(magA * magB * cosTheta).toFixed(2)}</p>
            </div>
          </div>

          <div className="bg-gray-800 p-4 rounded-lg">
            <div className="flex items-center justify-between mb-3">
              <h2 className="text-lg font-semibold">Projection of A onto B</h2>
              <button
                onClick={() => setShowProjection(!showProjection)}
                className={`px-3 py-1 rounded text-sm ${showProjection ? 'bg-yellow-600' : 'bg-gray-600'}`}
              >
                {showProjection ? 'Hide' : 'Show'}
              </button>
            </div>
            {showProjection && (
              <div className="font-mono text-sm space-y-1">
                <p className="text-gray-400">proj_B(A) = (A·B / |B|²) B</p>
                <p className="text-yellow-400">Length = |A|cos θ = {projMag.toFixed(2)}</p>
                <p className="text-gray-400 text-xs mt-2">
                  The projection shows "how much" of A points in the direction of B
                </p>
              </div>
            )}
          </div>

          <div className="bg-gray-800 p-4 rounded-lg text-sm">
            <h3 className="font-semibold mb-2">Try These!</h3>
            <ul className="space-y-1 text-gray-300">
              <li>• Make vectors perpendicular (dot = 0)</li>
              <li>• Make vectors point opposite (dot &lt; 0)</li>
              <li>• Align vectors perfectly (dot = |A||B|)</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(DotProductVisualization));
</script>
<script>window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+='\n'+e.message;});</script>
