<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>gradient descent training</title>
<style>html,body{margin:0;background:#0c0d10;color:#e8eaf0;font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif}
#root{min-height:100vh}#err{display:none;white-space:pre-wrap;padding:24px;color:#f0736a;font:13px/1.5 ui-monospace,Menlo,monospace}</style>
<div id="root"></div><pre id="err"></pre>
<script src="../_lib/react/libs-base.js"></script>
<script src="../_lib/react/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect,useReducer,useContext,createContext,forwardRef,memo,Fragment,Children,cloneElement} = React;



function GradientDescentLLM() {
  const canvasRef = useRef(null);
  const [isTraining, setIsTraining] = useState(false);
  const [step, setStep] = useState(0);
  const [weights, setWeights] = useState({ w1: -2.0, w2: 2.0 });
  const [history, setHistory] = useState([]);
  const [learningRate, setLearningRate] = useState(0.12);
  const [speed, setSpeed] = useState(300);
  const [currentExample, setCurrentExample] = useState(0);
  
  // Training dataset - what the model learns from
  const trainingData = [
    { context: "The cat sat on the", answer: "mat", wrong: ["dog", "sky", "fish"] },
    { context: "I need to open the", answer: "door", wrong: ["cat", "very", "blue"] },
    { context: "She ate a red", answer: "apple", wrong: ["quickly", "house", "the"] },
    { context: "The sun is very", answer: "bright", wrong: ["table", "walked", "the"] },
    { context: "He drove his new", answer: "car", wrong: ["happy", "very", "loud"] },
    { context: "They went to the", answer: "store", wrong: ["quick", "ran", "blue"] },
    { context: "The bird flew over the", answer: "tree", wrong: ["fast", "very", "did"] },
    { context: "I drink my morning", answer: "coffee", wrong: ["loud", "the", "went"] },
  ];
  
  const currentData = trainingData[currentExample];
  const allWords = [currentData.answer, ...currentData.wrong];
  
  // Scores based on weights - different patterns for different correct answers
  const getScores = (w1, w2, exampleIdx) => {
    const patterns = [
      [[1.2, 0.3], [-0.5, 0.8], [0.2, -1.1], [-0.8, 0.4]],   // mat
      [[0.9, 0.7], [-0.3, -0.5], [0.4, 0.2], [-0.6, -0.8]],  // door
      [[0.5, 1.1], [0.3, -0.7], [-0.9, 0.4], [0.2, -0.3]],   // apple
      [[1.0, 0.4], [-0.4, 0.6], [0.1, -0.9], [-0.7, 0.3]],   // bright
      [[0.8, 0.9], [-0.6, -0.4], [0.3, 0.1], [-0.5, -0.6]],  // car
      [[0.7, 0.8], [0.2, -0.6], [-0.8, 0.5], [-0.4, -0.7]],  // store
      [[1.1, 0.5], [-0.2, -0.9], [0.4, 0.3], [-0.9, 0.2]],   // tree
      [[0.6, 1.0], [-0.5, 0.4], [0.3, -0.8], [-0.7, -0.5]],  // coffee
    ];
    
    const p = patterns[exampleIdx % patterns.length];
    return [
      w1 * p[0][0] + w2 * p[0][1] + 1.0,
      w1 * p[1][0] + w2 * p[1][1] + 0.5,
      w1 * p[2][0] + w2 * p[2][1] + 0.3,
      w1 * p[3][0] + w2 * p[3][1] + 0.2,
    ];
  };
  
  const softmax = (scores) => {
    const maxScore = Math.max(...scores);
    const exps = scores.map(s => Math.exp(s - maxScore));
    const sum = exps.reduce((a, b) => a + b, 0);
    return exps.map(e => e / sum);
  };
  
  const getLoss = (w1, w2, exampleIdx) => {
    const scores = getScores(w1, w2, exampleIdx);
    const probs = softmax(scores);
    return -Math.log(probs[0] + 1e-10); // Index 0 is always the correct answer
  };
  
  // Average loss across all training examples
  const getTotalLoss = (w1, w2) => {
    let total = 0;
    for (let i = 0; i < trainingData.length; i++) {
      total += getLoss(w1, w2, i);
    }
    return total / trainingData.length;
  };
  
  const getGradient = (w1, w2, exampleIdx) => {
    const eps = 0.001;
    const dw1 = (getLoss(w1 + eps, w2, exampleIdx) - getLoss(w1 - eps, w2, exampleIdx)) / (2 * eps);
    const dw2 = (getLoss(w1, w2 + eps, exampleIdx) - getLoss(w1, w2 - eps, exampleIdx)) / (2 * eps);
    return { dw1, dw2 };
  };
  
  const currentLoss = getLoss(weights.w1, weights.w2, currentExample);
  const totalLoss = getTotalLoss(weights.w1, weights.w2);
  const currentScores = getScores(weights.w1, weights.w2, currentExample);
  const currentProbs = softmax(currentScores);
  const currentGradient = getGradient(weights.w1, weights.w2, currentExample);
  
  const trainStep = useCallback(() => {
    const exampleIdx = step % trainingData.length;
    setCurrentExample(exampleIdx);
    
    setWeights(prev => {
      const grad = getGradient(prev.w1, prev.w2, exampleIdx);
      const newW1 = prev.w1 - learningRate * grad.dw1;
      const newW2 = prev.w2 - learningRate * grad.dw2;
      
      const clampedW1 = Math.max(-3, Math.min(3, newW1));
      const clampedW2 = Math.max(-3, Math.min(3, newW2));
      
      setHistory(h => [...h, { 
        w1: prev.w1, 
        w2: prev.w2, 
        loss: getLoss(prev.w1, prev.w2, exampleIdx),
        example: exampleIdx 
      }]);
      
      return { w1: clampedW1, w2: clampedW2 };
    });
    
    setStep(s => s + 1);
  }, [learningRate, step]);
  
  useEffect(() => {
    if (!isTraining) return;
    if (totalLoss < 0.15 || step > 100) {
      setIsTraining(false);
      return;
    }
    
    const timer = setTimeout(trainStep, speed);
    return () => clearTimeout(timer);
  }, [isTraining, trainStep, totalLoss, step, speed]);
  
  // Draw loss surface
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, width, height);
    
    const range = 3;
    const toCanvasX = (w1) => (w1 + range) / (2 * range) * width;
    const toCanvasY = (w2) => (range - w2) / (2 * range) * height;
    
    // Draw average loss landscape
    const resolution = 4;
    for (let px = 0; px < width; px += resolution) {
      for (let py = 0; py < height; py += resolution) {
        const w1 = (px / width) * 2 * range - range;
        const w2 = range - (py / height) * 2 * range;
        const loss = getTotalLoss(w1, w2);
        
        const normalized = Math.min(loss / 3, 1);
        const hue = (1 - normalized) * 120;
        const lightness = 20 + (1 - normalized) * 25;
        
        ctx.fillStyle = `hsl(${hue}, 70%, ${lightness}%)`;
        ctx.fillRect(px, py, resolution, resolution);
      }
    }
    
    // Draw history path with color coding by example
    if (history.length > 1) {
      for (let i = 1; i < history.length; i++) {
        const hue = (history[i].example / trainingData.length) * 360;
        ctx.strokeStyle = `hsla(${hue}, 80%, 60%, 0.8)`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(toCanvasX(history[i-1].w1), toCanvasY(history[i-1].w2));
        ctx.lineTo(toCanvasX(history[i].w1), toCanvasY(history[i].w2));
        ctx.stroke();
      }
      
      // Line to current position
      if (history.length > 0) {
        const last = history[history.length - 1];
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.moveTo(toCanvasX(last.w1), toCanvasY(last.w2));
        ctx.lineTo(toCanvasX(weights.w1), toCanvasY(weights.w2));
        ctx.stroke();
      }
    }
    
    // Gradient arrow
    const arrowScale = 0.4;
    const gradLen = Math.sqrt(currentGradient.dw1 ** 2 + currentGradient.dw2 ** 2);
    if (gradLen > 0.01) {
      const normDw1 = currentGradient.dw1 / gradLen;
      const normDw2 = currentGradient.dw2 / gradLen;
      
      const startX = toCanvasX(weights.w1);
      const startY = toCanvasY(weights.w2);
      const endX = toCanvasX(weights.w1 - normDw1 * arrowScale);
      const endY = toCanvasY(weights.w2 - normDw2 * arrowScale);
      
      ctx.strokeStyle = '#3498db';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();
      
      const angle = Math.atan2(endY - startY, endX - startX);
      ctx.fillStyle = '#3498db';
      ctx.beginPath();
      ctx.moveTo(endX, endY);
      ctx.lineTo(endX - 10 * Math.cos(angle - 0.4), endY - 10 * Math.sin(angle - 0.4));
      ctx.lineTo(endX - 10 * Math.cos(angle + 0.4), endY - 10 * Math.sin(angle + 0.4));
      ctx.closePath();
      ctx.fill();
    }
    
    // Current position
    ctx.shadowColor = '#f39c12';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#f39c12';
    ctx.beginPath();
    ctx.arc(toCanvasX(weights.w1), toCanvasY(weights.w2), 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Labels
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '12px Arial';
    ctx.fillText('weight₁ →', width - 70, height - 8);
    ctx.fillText('↑ weight₂', 5, 15);
    
  }, [weights, history, currentGradient, currentExample]);
  
  const reset = () => {
    setWeights({ w1: -2.0, w2: 2.0 });
    setHistory([]);
    setStep(0);
    setCurrentExample(0);
    setIsTraining(false);
  };
  
  const maxProbIndex = currentProbs.indexOf(Math.max(...currentProbs));
  
  return (
    <div className="min-h-screen bg-gray-900 text-white p-4">
      <h1 className="text-2xl font-bold mb-1 text-center">Gradient Descent: Learning from Data</h1>
      <p className="text-center text-gray-400 mb-4 text-sm">Watch the model learn from each training example</p>
      
      <div className="flex flex-col lg:flex-row gap-4 max-w-7xl mx-auto">
        
        {/* Left: Loss surface */}
        <div className="lg:w-1/2">
          <div className="bg-gray-800 rounded-xl p-4">
            <h2 className="font-semibold mb-2 text-sm">Loss Landscape (average over all examples)</h2>
            <canvas
              ref={canvasRef}
              width={400}
              height={350}
              className="rounded-lg w-full"
            />
            <div className="flex items-center gap-3 mt-2 text-xs text-gray-400">
              <div className="flex items-center gap-1">
                <div className="w-3 h-3 rounded-full bg-orange-500"></div>
                <span>Position</span>
              </div>
              <div className="flex items-center gap-1">
                <div className="w-3 h-1 bg-blue-500"></div>
                <span>Gradient</span>
              </div>
            </div>
          </div>
          
          {/* Training data list */}
          <div className="bg-gray-800 rounded-xl p-4 mt-3">
            <h2 className="font-semibold mb-2 text-sm">Training Dataset</h2>
            <div className="space-y-1 max-h-48 overflow-y-auto">
              {trainingData.map((data, i) => (
                <div 
                  key={i}
                  className={`text-xs p-2 rounded font-mono transition-all ${
                    i === currentExample 
                      ? 'bg-yellow-600/30 border border-yellow-500' 
                      : 'bg-gray-900/50'
                  }`}
                >
                  <span className="text-gray-400">"{data.context} </span>
                  <span className="text-green-400 font-bold">{data.answer}</span>
                  <span className="text-gray-400">"</span>
                  {i === currentExample && (
                    <span className="ml-2 text-yellow-400">← training on this</span>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
        
        {/* Right panel */}
        <div className="lg:w-1/2 space-y-3">
          
          {/* Current training example - HIGHLIGHTED */}
          <div className="bg-yellow-900/40 border-2 border-yellow-500 rounded-xl p-4">
            <div className="flex items-center gap-2 mb-2">
              <div className="bg-yellow-500 text-black text-xs font-bold px-2 py-1 rounded">
                STEP {step + 1}
              </div>
              <span className="text-sm text-yellow-400">Training on example {currentExample + 1}/{trainingData.length}</span>
            </div>
            <div className="bg-gray-900 rounded-lg p-3 font-mono">
              <span className="text-gray-400">"{currentData.context} </span>
              <span className="text-yellow-400 font-bold text-lg">___</span>
              <span className="text-gray-400">"</span>
            </div>
            <div className="mt-2 flex items-center gap-2">
              <span className="text-xs text-gray-500">Correct answer:</span>
              <span className="text-green-400 font-bold font-mono">{currentData.answer}</span>
            </div>
          </div>
          
          {/* Model predictions for current example */}
          <div className="bg-gray-800 rounded-xl p-4">
            <h2 className="font-semibold mb-3 text-sm">Model's Current Predictions</h2>
            <div className="space-y-2">
              {allWords.map((word, i) => (
                <div key={word} className="flex items-center gap-2">
                  <span className={`font-mono text-sm w-16 ${i === 0 ? 'text-green-400' : 'text-gray-400'}`}>
                    {word}
                    {i === 0 && <span className="text-green-600 ml-1">✓</span>}
                  </span>
                  <div className="flex-1 bg-gray-700 rounded-full h-5 overflow-hidden">
                    <div 
                      className={`h-full transition-all duration-300 ${
                        i === 0 ? 'bg-green-500' : 
                        i === maxProbIndex && i !== 0 ? 'bg-red-500' : 'bg-gray-500'
                      }`}
                      style={{ width: `${currentProbs[i] * 100}%` }}
                    />
                  </div>
                  <span className="font-mono text-xs w-14 text-right">
                    {(currentProbs[i] * 100).toFixed(1)}%
                  </span>
                </div>
              ))}
            </div>
            <div className="mt-3 pt-3 border-t border-gray-700 flex justify-between items-center">
              <span className="text-xs text-gray-500">Model predicts:</span>
              <span className={`font-bold font-mono ${maxProbIndex === 0 ? 'text-green-400' : 'text-red-400'}`}>
                "{allWords[maxProbIndex]}"
                {maxProbIndex === 0 ? ' ✓ Correct!' : ' ✗ Wrong'}
              </span>
            </div>
          </div>
          
          {/* Loss display */}
          <div className="grid grid-cols-2 gap-3">
            <div className={`rounded-xl p-3 ${currentLoss < 0.5 ? 'bg-green-900/40 border border-green-600' : 'bg-red-900/40 border border-red-600'}`}>
              <div className="text-xs text-gray-400">Loss (this example)</div>
              <div className="font-mono text-2xl">{currentLoss.toFixed(3)}</div>
            </div>
            <div className={`rounded-xl p-3 ${totalLoss < 0.5 ? 'bg-green-900/40 border border-green-600' : 'bg-orange-900/40 border border-orange-600'}`}>
              <div className="text-xs text-gray-400">Avg Loss (all data)</div>
              <div className="font-mono text-2xl">{totalLoss.toFixed(3)}</div>
            </div>
          </div>
          
          {/* Gradient */}
          <div className="bg-gray-800 rounded-xl p-3">
            <h2 className="font-semibold mb-1 text-sm">Gradient from this example</h2>
            <div className="font-mono text-sm flex gap-4">
              <span>
                <span className="text-gray-500">∂L/∂w₁ = </span>
                <span className="text-blue-400">{currentGradient.dw1.toFixed(3)}</span>
              </span>
              <span>
                <span className="text-gray-500">∂L/∂w₂ = </span>
                <span className="text-blue-400">{currentGradient.dw2.toFixed(3)}</span>
              </span>
            </div>
          </div>
          
          {/* Controls */}
          <div className="bg-gray-800 rounded-xl p-4">
            <div className="flex gap-2 mb-3">
              <button
                onClick={() => setIsTraining(!isTraining)}
                className={`flex-1 py-2 rounded-lg font-semibold transition-all ${
                  isTraining 
                    ? 'bg-red-600 hover:bg-red-700' 
                    : 'bg-green-600 hover:bg-green-700'
                }`}
              >
                {isTraining ? 'Pause' : 'Train'}
              </button>
              <button
                onClick={trainStep}
                disabled={isTraining}
                className="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg font-semibold disabled:opacity-50"
              >
                Step
              </button>
              <button
                onClick={reset}
                className="px-4 py-2 bg-gray-600 hover:bg-gray-700 rounded-lg font-semibold"
              >
                Reset
              </button>
            </div>
            
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="flex justify-between text-xs mb-1">
                  <span>Learning Rate</span>
                  <span className="font-mono">{learningRate.toFixed(2)}</span>
                </label>
                <input
                  type="range" min="0.01" max="0.3" step="0.01" value={learningRate}
                  onChange={(e) => setLearningRate(parseFloat(e.target.value))}
                  className="w-full accent-green-500 h-1"
                />
              </div>
              <div>
                <label className="flex justify-between text-xs mb-1">
                  <span>Speed</span>
                  <span className="font-mono">{speed}ms</span>
                </label>
                <input
                  type="range" min="50" max="800" step="50" value={speed}
                  onChange={(e) => setSpeed(parseInt(e.target.value))}
                  className="w-full accent-blue-500 h-1"
                />
              </div>
            </div>
          </div>
          
          {/* Weights */}
          <div className="bg-gray-800 rounded-xl p-3">
            <div className="flex justify-between items-center">
              <span className="text-sm font-semibold">Weights</span>
              <div className="font-mono text-sm">
                w₁ = <span className="text-orange-400">{weights.w1.toFixed(3)}</span>
                {' · '}
                w₂ = <span className="text-orange-400">{weights.w2.toFixed(3)}</span>
              </div>
            </div>
          </div>
          
          {/* Explanation */}
          <div className="bg-blue-900/20 border border-blue-700/50 p-3 rounded-xl text-xs">
            <p className="text-gray-300">
              <strong className="text-blue-400">Each step:</strong> Pick a training example → 
              compute how wrong we are → compute gradient → nudge weights to be less wrong on that example.
              Cycle through all examples repeatedly. Over time, the model gets better at <em>all</em> of them.
            </p>
          </div>
          
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(GradientDescentLLM));
</script>
<script>window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+='\n'+e.message;});</script>
