<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Constant Spectrum — an interactive map of physical constants</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">

<style>
:root{
  /* Ground: the dark of a spectrograph plate */
  --void:#080512;
  --void-2:#0F0A1E;
  --void-3:#171029;
  --ink:#EFEAF7;
  --muted:#9C8FB6;
  --faint:#5D5175;

  /* Emission lines — each family sits at a real wavelength */
  --uv:#9B5CFF;      /* 380 nm  couplings        */
  --blue:#6E7BFF;    /* 434 nm  atomic & quantum */
  --cyan:#45D6F0;    /* 486 nm  electromagnetic  */
  --green:#5CE39B;   /* 546 nm  thermal          */
  --amber:#FFC24A;   /* 589 nm  SI defining      */
  --red:#FF4E58;     /* 656 nm  gravity & Planck */
  --ir:#D8436F;      /* 700 nm+ cosmological     */

  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --display:'Bricolage Grotesque','IBM Plex Sans',sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--void);
  color:var(--ink);
  font-family:var(--sans);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1100px 700px at 20% 0%,rgba(110,123,255,.13),transparent 60%),
    radial-gradient(900px 650px at 85% 100%,rgba(216,67,111,.11),transparent 60%);
}

/* ───────── header ───────── */
header{
  position:fixed;top:0;left:0;right:0;z-index:20;
  padding:14px 20px 12px;
  background:linear-gradient(180deg,rgba(8,5,18,.94) 55%,rgba(8,5,18,0));
  pointer-events:none;
}
.title-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;pointer-events:auto}
h1{
  font-family:var(--display);
  font-weight:800;font-size:clamp(19px,3.2vw,27px);
  letter-spacing:-.03em;margin:0;line-height:1;
}
h1 em{font-style:normal;color:var(--amber)}
.sub{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);
}

/* the spectrum legend — a real 380→700nm strip */
.spectrum{
  margin-top:11px;position:relative;pointer-events:auto;
  max-width:820px;
}
.strip{
  height:5px;border-radius:3px;
  background:linear-gradient(90deg,#9B5CFF 0%,#6E7BFF 16%,#45D6F0 36%,#5CE39B 56%,#FFC24A 72%,#FF4E58 88%,#D8436F 100%);
  opacity:.85;
}
.ticks{display:flex;margin-top:7px;gap:2px}
.tick{
  flex:1;background:none;border:0;padding:5px 2px 4px;cursor:pointer;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;
  color:var(--faint);text-align:left;border-top:1px solid transparent;
  transition:color .18s,border-color .18s;line-height:1.35;
}
.tick b{display:block;font-weight:500;font-size:10px}
.tick:hover,.tick:focus-visible{color:var(--ink);border-top-color:currentColor}
.tick.off{opacity:.3}
.tick .nm{opacity:.6}

/* ───────── canvas ───────── */
#stage{position:fixed;inset:0;z-index:1;touch-action:none;cursor:grab}
#stage.grabbing{cursor:grabbing}
#stage.overnode{cursor:pointer}

/* ───────── search / index ───────── */
.finder{
  position:fixed;left:20px;bottom:20px;z-index:20;width:min(300px,calc(100vw - 40px));
}
.finder input{
  width:100%;padding:10px 13px;border-radius:9px;
  background:rgba(23,16,41,.92);border:1px solid rgba(156,143,182,.28);
  color:var(--ink);font-family:var(--mono);font-size:12.5px;
  backdrop-filter:blur(8px);
}
.finder input::placeholder{color:var(--faint)}
.finder input:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}
#results{
  list-style:none;margin:0 0 8px;padding:0;max-height:min(46vh,340px);overflow-y:auto;
  border-radius:9px;background:rgba(15,10,30,.96);backdrop-filter:blur(8px);
  border:1px solid rgba(156,143,182,.2);
}
#results:empty{display:none}
#results li{border-bottom:1px solid rgba(156,143,182,.1)}
#results li:last-child{border:0}
#results button{
  width:100%;display:flex;align-items:center;gap:10px;
  background:none;border:0;padding:8px 12px;cursor:pointer;text-align:left;color:var(--ink);
}
#results button:hover,#results button:focus-visible{background:rgba(156,143,182,.13);outline:none}
#results .s{font-family:var(--mono);font-size:14px;width:34px;flex:none}
#results .n{font-size:12px;color:var(--muted)}

/* ───────── drawer ───────── */
#drawer{
  position:fixed;top:0;right:0;bottom:0;z-index:30;
  width:min(470px,100vw);
  background:linear-gradient(180deg,var(--void-2),var(--void));
  border-left:1px solid rgba(156,143,182,.2);
  transform:translateX(102%);transition:transform .38s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;box-shadow:-30px 0 70px rgba(0,0,0,.6);
}
#drawer.open{transform:none}
.d-head{padding:20px 22px 14px;border-bottom:1px solid rgba(156,143,182,.16);position:relative;flex:none}
.d-close{
  position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:8px;
  background:rgba(156,143,182,.12);border:0;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;
}
.d-close:hover{background:rgba(156,143,182,.25);color:var(--ink)}
.d-fam{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:9px}
.d-sym{font-family:var(--mono);font-size:40px;line-height:1;margin:0 0 6px;font-weight:500}
.d-name{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.2}
.d-val{
  margin-top:14px;padding:11px 13px;border-radius:8px;
  background:rgba(0,0,0,.35);border:1px solid rgba(156,143,182,.14);
  font-family:var(--mono);font-size:13.5px;word-break:break-word;line-height:1.5;
}
.d-val .u{color:var(--muted)}
.d-exact{
  display:inline-block;margin-top:9px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:4px;
  border:1px solid currentColor;opacity:.85;
}
.d-body{padding:18px 22px 60px;overflow-y:auto;flex:1;font-size:14.5px;line-height:1.68}
.d-body p{margin:0 0 14px;color:#DCD4EA}
h3.lbl{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);margin:24px 0 10px;padding-bottom:6px;
  border-bottom:1px solid rgba(156,143,182,.14);
}
.eqbox{
  padding:14px 12px;margin:0 0 14px;border-radius:8px;overflow-x:auto;overflow-y:hidden;
  background:rgba(0,0,0,.3);border:1px solid rgba(156,143,182,.13);
  border-left:2px solid currentColor;
}
.eqcap{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin:-6px 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
button.ref,button.chip{
  font-family:var(--mono);font-size:12.5px;cursor:pointer;color:inherit;
  background:rgba(156,143,182,.13);border:1px solid rgba(156,143,182,.22);
  border-radius:6px;padding:4px 9px;transition:background .16s,border-color .16s;
}
button.chip .cn{font-family:var(--sans);font-size:11px;color:var(--muted);margin-left:6px}
button.ref{padding:1px 5px;font-size:.95em;border-radius:4px}
button.ref:hover,button.chip:hover,button.ref:focus-visible,button.chip:focus-visible{
  background:rgba(156,143,182,.28);border-color:currentColor;outline:none;
}
.note{
  font-size:13px;color:var(--muted);border-left:2px solid rgba(156,143,182,.3);
  padding:2px 0 2px 13px;margin:16px 0 0;line-height:1.6;
}
sub{font-size:.68em;letter-spacing:0}
.katex{font-size:1.02em}
.katex-display{margin:0}

/* ───────── hint ───────── */
.hint{
  position:fixed;right:20px;bottom:20px;z-index:15;
  font-family:var(--mono);font-size:10.5px;color:var(--faint);
  text-align:right;line-height:1.7;pointer-events:none;
}
.hint kbd{
  font-family:var(--mono);background:rgba(156,143,182,.14);
  padding:1px 5px;border-radius:3px;color:var(--muted);
}

@media (max-width:760px){
  #drawer{top:auto;height:82vh;width:100%;border-left:0;border-top:1px solid rgba(156,143,182,.2);
    border-radius:16px 16px 0 0;transform:translateY(102%)}
  #drawer.open{transform:none}
  .hint{display:none}
  .finder{left:12px;right:12px;bottom:12px;width:auto}
  .spectrum{max-width:none}
  .tick{font-size:8.5px}
  .tick .nm{display:none}
}
@media (prefers-reduced-motion:reduce){
  #drawer{transition:none}
}
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>The Constant <em>Spectrum</em></h1>
    <span class="sub">37 constants · 48 derivations · tap any bubble</span>
  </div>
  <div class="spectrum">
    <div class="strip"></div>
    <div class="ticks" id="ticks"></div>
  </div>
</header>

<canvas id="stage"></canvas>

<div class="finder">
  <ul id="results"></ul>
  <input id="search" type="text" placeholder="Search a constant — try “fine structure”" autocomplete="off" spellcheck="false" aria-label="Search constants">
</div>

<div class="hint">
  drag to pan · scroll to zoom<br>
  <kbd>Esc</kbd> closes · <kbd>/</kbd> searches
</div>

<aside id="drawer" role="dialog" aria-label="Constant detail" aria-hidden="true">
  <div class="d-head" id="dHead"></div>
  <div class="d-body" id="dBody"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script>
/* ============================================================
   FAMILIES — positioned at their real emission wavelengths
   ============================================================ */
const FAM = {
  coupling: {label:'Couplings',      nm:380, color:'#9B5CFF', blurb:'Pure numbers. The actual strengths.'},
  atomic:   {label:'Atomic',         nm:434, color:'#6E7BFF', blurb:'The scale of atoms and electrons.'},
  em:       {label:'Electromagnetic',nm:486, color:'#45D6F0', blurb:'Fields, charge, and the vacuum.'},
  thermal:  {label:'Thermal',        nm:546, color:'#5CE39B', blurb:'Heat, radiation, and moles.'},
  si:       {label:'SI defining',    nm:589, color:'#FFC24A', blurb:'The seven exact anchors of the SI.'},
  gravity:  {label:'Gravity',        nm:656, color:'#FF4E58', blurb:'Gravitation and the Planck scale.'},
  cosmo:    {label:'Cosmological',   nm:700, color:'#D8436F', blurb:'The universe at largest scale.'}
};

/* ============================================================
   THE CONSTANTS
   from  = which constants it is built out of (draws an edge)
   def   = the defining equation
   units = the same equation in units, showing what cancels
   ============================================================ */
const C = [
/* ---------- SI defining constants (exact by definition) ---------- */
{id:'c', sym:'c', name:'Speed of light in vacuum', fam:'si', tier:1, exact:true,
 val:'299\u202F792\u202F458', unit:'m\u00A0s⁻¹',
 blurb:`Not really "the speed of light" — it is the speed of <em>causality</em>, the maximum rate at which any influence can travel. Light happens to move at it because photons are massless. Since 1983 it is not measured at all: it is defined exactly, and the metre is defined <em>from</em> it as the distance light covers in 1/299\u202F792\u202F458 of a second.`,
 def:'c = \\frac{1\\ \\mathrm{m}}{(1/299\\,792\\,458)\\ \\mathrm{s}} = 299\\,792\\,458\\ \\mathrm{m\\,s^{-1}}',
 units:'\\frac{\\underbrace{\\mathrm{m}}_{\\text{distance}}}{\\underbrace{\\mathrm{s}}_{\\text{time}}} = \\mathrm{m\\,s^{-1}}',
 note:'Fixing c is what turned the metre into a derived unit. The second came first — see {{dnuCs}}.'},

{id:'h', sym:'h', name:'Planck constant', fam:'si', tier:1, exact:true,
 val:'6.626\u202F070\u202F15 × 10⁻³⁴', unit:'J\u00A0s',
 blurb:`The quantum of action. It sets how much "wave" a given amount of energy carries: a photon of frequency ν has energy hν. Because it is so tiny, quantum graininess is invisible at human scale. Since 2019 it is exact, and the kilogram is defined from it.`,
 def:'E = h\\nu \\qquad\\Longrightarrow\\qquad h = \\frac{E}{\\nu}',
 units:'\\frac{\\underbrace{\\mathrm{J}}_{E}}{\\underbrace{\\mathrm{s^{-1}}}_{\\nu}} = \\mathrm{J\\,s}',
 note:'J\u00A0s is the unit of <em>action</em> — energy × time, the same dimensions as angular momentum.'},

{id:'e', sym:'e', name:'Elementary charge', fam:'si', tier:1, exact:true,
 val:'1.602\u202F176\u202F634 × 10⁻¹⁹', unit:'C',
 blurb:`The charge of a proton, and the magnitude of an electron's charge. Every free particle ever observed carries an integer multiple of it (quarks carry ⅓ and ⅔, but are never found alone). Exact since 2019 — it now <em>defines</em> the coulomb.`,
 def:'1\\ \\mathrm{C} = \\frac{1}{1.602176634\\times10^{-19}}\\ e',
 units:'\\underbrace{\\mathrm{C}}_{\\text{coulomb}} = \\underbrace{\\mathrm{A}}_{\\text{amp}}\\times\\underbrace{\\mathrm{s}}_{\\text{second}}',
 note:'e is an input to {{alpha}}, {{muB}}, {{a0}} and {{F}} — almost everything electric traces back here.'},

{id:'kB', sym:'k_B', name:'Boltzmann constant', fam:'si', tier:1, exact:true,
 val:'1.380\u202F649 × 10⁻²³', unit:'J\u00A0K⁻¹',
 blurb:`The exchange rate between temperature and energy. Temperature is not a fundamental thing — it is bookkeeping for the average energy per degree of freedom, and k<sub>B</sub> is the conversion factor. Exact since 2019; it defines the kelvin.`,
 def:'\\bar{E} = \\tfrac{1}{2}k_B T \\quad\\text{per degree of freedom}',
 units:'\\underbrace{\\mathrm{J\\,K^{-1}}}_{k_B}\\times\\underbrace{\\mathrm{K}}_{T} = \\mathrm{J}',
 note:'The kelvin cancels away entirely — which is the point. Temperature is energy in disguise.'},

{id:'NA', sym:'N_A', name:'Avogadro constant', fam:'si', tier:2, exact:true,
 val:'6.022\u202F140\u202F76 × 10²³', unit:'mol⁻¹',
 blurb:`How many entities are in one mole. It is a pure counting number with a unit bolted on, and since 2019 it simply <em>defines</em> the mole rather than being measured from silicon spheres.`,
 def:'1\\ \\mathrm{mol} = 6.02214076\\times10^{23}\\ \\text{entities}',
 units:'\\frac{\\underbrace{\\text{entities}}_{\\text{pure number}}}{\\underbrace{\\mathrm{mol}}_{\\text{amount}}} = \\mathrm{mol^{-1}}',
 note:'Bridges the atomic world to the laboratory: it turns {{kB}} into {{R}} and {{e}} into {{F}}.'},

{id:'dnuCs', sym:'Δν_Cs', name:'Caesium hyperfine frequency', fam:'si', tier:3, exact:true,
 val:'9\u202F192\u202F631\u202F770', unit:'Hz',
 blurb:`The frequency of the microwave photon emitted when the electron spin in a caesium-133 atom flips relative to the nuclear spin. This one number defines the second — and therefore, downstream, the metre, the kilogram, and almost everything else.`,
 def:'1\\ \\mathrm{s} = \\frac{9\\,192\\,631\\,770}{\\Delta\\nu_{\\mathrm{Cs}}}',
 units:'\\frac{\\underbrace{\\text{cycles}}_{\\text{pure number}}}{\\underbrace{\\mathrm{Hz}=\\mathrm{s^{-1}}}_{\\Delta\\nu}} = \\mathrm{s}',
 note:'The root of the entire SI. Everything else is calibrated against this atomic tick.'},

{id:'Kcd', sym:'K_cd', name:'Luminous efficacy at 540 THz', fam:'si', tier:3, exact:true,
 val:'683', unit:'lm\u00A0W⁻¹',
 blurb:`The odd one out. It defines the candela by declaring how bright one watt of green light "looks" to a standard human eye. It is the only SI constant that encodes biology rather than physics.`,
 def:'K_{\\mathrm{cd}} = \\frac{\\Phi_v}{\\Phi_e}\\ \\text{at}\\ \\nu=540\\ \\mathrm{THz}',
 units:'\\frac{\\underbrace{\\mathrm{lm}}_{\\text{perceived}}}{\\underbrace{\\mathrm{W}}_{\\text{radiant}}} = \\mathrm{lm\\,W^{-1}}',
 note:'540 THz is green, around 555 nm — where the light-adapted eye is most sensitive.'},

/* ---------- Electromagnetic ---------- */
{id:'hbar', sym:'ħ', name:'Reduced Planck constant', fam:'atomic', tier:1, from:['h'],
 val:'1.054\u202F571\u202F817 × 10⁻³⁴', unit:'J\u00A0s',
 blurb:`Planck's constant divided by 2π — "h-bar". Whenever you work in angular frequency ω rather than cycles-per-second ν, this is the version you want, and that is nearly always in quantum mechanics. It is also the quantum of spin angular momentum.`,
 def:'\\hbar = \\frac{h}{2\\pi}',
 units:'\\frac{\\underbrace{\\mathrm{J\\,s}}_{h}}{\\underbrace{2\\pi}_{\\text{pure number}}} = \\mathrm{J\\,s}',
 note:'Dividing by a dimensionless number leaves the units untouched — ħ and {{h}} carry identical dimensions.'},

{id:'mu0', sym:'μ₀', name:'Vacuum permeability', fam:'em', tier:2,
 val:'1.256\u202F637\u202F062\u202F12 × 10⁻⁶', unit:'N\u00A0A⁻²',
 blurb:`How readily the vacuum supports a magnetic field. It sets the force between two current-carrying wires. Until 2019 it was exactly 4π × 10⁻⁷; now it is measured, with its uncertainty inherited from {{alpha}}.`,
 def:'\\mu_0 = \\frac{4\\pi\\alpha\\hbar}{e^{2}c}',
 units:'\\frac{\\overbrace{\\mathrm{J\\,s}}^{\\hbar}}{\\underbrace{\\mathrm{C^{2}}}_{e^{2}}\\times\\underbrace{\\mathrm{m\\,s^{-1}}}_{c}} = \\frac{\\mathrm{N\\,m\\,s}}{\\mathrm{C^{2}\\,m\\,s^{-1}}} = \\mathrm{N\\,A^{-2}}',
 note:'Using J = N\u00A0m and A = C\u00A0s⁻¹, the metres cancel and the seconds fold into amps squared.'},

{id:'eps0', sym:'ε₀', name:'Vacuum permittivity', fam:'em', tier:1, from:['mu0','c'],
 val:'8.854\u202F187\u202F8128 × 10⁻¹²', unit:'F\u00A0m⁻¹  (C²\u00A0N⁻¹\u00A0m⁻²)',
 blurb:`"Epsilon-nought", the electric constant. It measures how much the vacuum resists having an electric field set up in it — how strongly empty space pushes back when you separate charge. Together with {{mu0}} it fixes the speed of light.`,
 def:'\\varepsilon_0 = \\frac{1}{\\mu_0 c^{2}}',
 units:'\\frac{1}{\\underbrace{\\mathrm{N\\,A^{-2}}}_{\\mu_0}\\times\\underbrace{\\mathrm{m^{2}\\,s^{-2}}}_{c^{2}}} = \\mathrm{N^{-1}A^{2}s^{2}m^{-2}} = \\mathrm{C^{2}\\,N^{-1}\\,m^{-2}}',
 note:'A²\u00A0s² = (A\u00A0s)² = C². That single substitution turns the messy form into the familiar one.'},

{id:'ke', sym:'k_e', name:'Coulomb constant', fam:'em', tier:1, from:['eps0'],
 val:'8.987\u202F551\u202F7862 × 10⁹', unit:'N\u00A0m²\u00A0C⁻²',
 blurb:`The number that turns "two charges and a distance" into an actual force in newtons. Without it, Coulomb's law only tells you the <em>shape</em> of the relationship. The 4π buried inside it is the surface area of a sphere — real geometry, because a point charge radiates equally in all directions.`,
 def:'F = k_e\\frac{q_1q_2}{r^{2}},\\qquad k_e = \\frac{1}{4\\pi\\varepsilon_0}',
 units:'\\underbrace{\\mathrm{N\\,m^{2}\\,C^{-2}}}_{k_e}\\times\\frac{\\overbrace{\\mathrm{C}\\times\\mathrm{C}}^{q_1q_2}}{\\underbrace{\\mathrm{m^{2}}}_{r^{2}}} = \\mathrm{N}',
 note:'The C² cancels, the m² cancels, and pure newtons survive. Its strange units are reverse-engineered to make exactly that happen.'},

{id:'Z0', sym:'Z₀', name:'Impedance of free space', fam:'em', tier:3, from:['mu0','c'],
 val:'376.730\u202F313\u202F668', unit:'Ω',
 blurb:`The vacuum has an electrical impedance, just like a cable does. For any electromagnetic wave in empty space, the electric field divided by the magnetic field equals this number. Antenna engineers design around it every day.`,
 def:'Z_0 = \\frac{|\\mathbf{E}|}{|\\mathbf{H}|} = \\mu_0 c = \\sqrt{\\frac{\\mu_0}{\\varepsilon_0}}',
 units:'\\underbrace{\\mathrm{N\\,A^{-2}}}_{\\mu_0}\\times\\underbrace{\\mathrm{m\\,s^{-1}}}_{c} = \\mathrm{kg\\,m^{2}\\,s^{-3}\\,A^{-2}} = \\Omega',
 note:'Expanding N = kg\u00A0m\u00A0s⁻² gives exactly the ohm — a volt per amp.'},

/* ---------- Couplings ---------- */
{id:'alpha', sym:'α', name:'Fine structure constant', fam:'coupling', tier:1, from:['e','eps0','hbar','c'],
 val:'7.297\u202F352\u202F5693 × 10⁻³   ≈ 1/137.035\u202F999', unit:'dimensionless',
 blurb:`The single most important number in physics that nobody can derive. It is {{ke}} stripped of human units: the true strength of the electromagnetic interaction, the probability amplitude for an electron to absorb a photon. Aliens using different units would get a different {{ke}} — but the same 1/137.`,
 def:'\\alpha = \\frac{k_e e^{2}}{\\hbar c} = \\frac{e^{2}}{4\\pi\\varepsilon_0\\hbar c}',
 units:'\\frac{\\overbrace{\\mathrm{N\\,m^{2}\\,C^{-2}}}^{k_e}\\times\\overbrace{\\mathrm{C^{2}}}^{e^{2}}}{\\underbrace{\\mathrm{J\\,s}}_{\\hbar}\\times\\underbrace{\\mathrm{m\\,s^{-1}}}_{c}} = \\frac{\\mathrm{N\\,m^{2}}}{\\mathrm{N\\,m^{2}}} = 1',
 note:'Top and bottom both reduce to N\u00A0m² and annihilate. Named for the fine splitting of spectral lines, which scales as α² — Sommerfeld, 1916. It also <em>runs</em>: at LEP energies it climbs to about 1/128.'},

{id:'alphaS', sym:'α_s', name:'Strong coupling constant', fam:'coupling', tier:3,
 val:'≈ 0.1179  (at the Z boson mass)', unit:'dimensionless',
 blurb:`The equivalent of {{alpha}} for the strong nuclear force. It is far larger — which is why quarks cannot be pulled apart — and it runs steeply, weakening at high energy ("asymptotic freedom") and exploding at low energy ("confinement").`,
 def:'\\alpha_s(Q^{2}) \\approx \\frac{12\\pi}{(33-2n_f)\\ln(Q^{2}/\\Lambda_{\\mathrm{QCD}}^{2})}',
 units:'\\frac{\\underbrace{\\text{pure number}}_{12\\pi}}{\\underbrace{\\text{pure number}}_{\\ln(\\cdots)}} = 1\\quad\\text{(dimensionless)}',
 note:'Quoting α_s without an energy scale is meaningless — unlike {{alpha}}, it changes by a factor of several across accessible energies.'},

{id:'sin2W', sym:'sin²θ_W', name:'Weak mixing angle', fam:'coupling', tier:3, from:['alpha'],
 val:'≈ 0.231\u202F21', unit:'dimensionless',
 blurb:`The rotation angle that mixes the two raw electroweak fields into the photon and the Z boson we actually observe. It is the hinge of electroweak unification — the number that says how much "electromagnetism" and "weak force" are the same thing seen from different directions.`,

/* ============================================================
   GRAPH CONSTRUCTION
   ============================================================ */
const byId = Object.fromEntries(C.map(n=>[n.id,n]));
const EDGES = [];
C.forEach(n=>(n.from||[]).forEach(f=>{ if(byId[f]) EDGES.push({a:n.id,b:f}); }));
C.forEach(n=>{ n.feeds = C.filter(m=>(m.from||[]).includes(n.id)).map(m=>m.id); });

const RADIUS = {1:34,2:27,3:21};
const famOrder = Object.keys(FAM);

/* seed positions in a ring, family by family, so clusters form fast */
C.forEach(n=>{
  const fi = famOrder.indexOf(n.fam);
  const ang = (fi/famOrder.length)*Math.PI*2 - Math.PI/2;
  n.ax = Math.cos(ang)*330;               // family anchor
  n.ay = Math.sin(ang)*330;
  n.x  = n.ax + (Math.random()-.5)*150;
  n.y  = n.ay + (Math.random()-.5)*150;
  n.vx = 0; n.vy = 0;
  n.r  = RADIUS[n.tier];
  n.color = FAM[n.fam].color;
});

/* ============================================================
   CANVAS + VIEW
   ============================================================ */
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
const view = {s:1, tx:0, ty:0};
let selected=null, hovered=null, hiddenFams=new Set();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize(){
  DPR = Math.min(devicePixelRatio||1,2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  view.s = Math.min(1, Math.min(W,H)/900);
  view.tx = W/2; view.ty = H/2 + (W<760 ? -10 : 10);
}
resize();
addEventListener('resize',resize);

const toWorld = (px,py)=>({x:(px-view.tx)/view.s, y:(py-view.ty)/view.s});

/* ============================================================
   FORCE SIMULATION
   ============================================================ */
/* interaction state lives here because step() reads dragNode,
   and the render loop starts before the handlers are wired up */
let dragNode=null, panning=false, last={x:0,y:0}, moved=0;
let alphaSim = 1;
function step(){
  const active = C.filter(n=>!hiddenFams.has(n.fam));
  // pairwise repulsion
  for(let i=0;i<active.length;i++){
    const a=active[i];
    for(let j=i+1;j<active.length;j++){
      const b=active[j];
      let dx=b.x-a.x, dy=b.y-a.y;
      let d2=dx*dx+dy*dy; if(d2<1) d2=1;
      const d=Math.sqrt(d2);
      const min=a.r+b.r+16;
      let f = 5200/d2;
      if(d<min) f += (min-d)*0.55;      // hard-ish collision
      const fx=dx/d*f, fy=dy/d*f;
      a.vx-=fx; a.vy-=fy; b.vx+=fx; b.vy+=fy;
    }
  }
  // springs
  EDGES.forEach(e=>{
    const a=byId[e.a], b=byId[e.b];
    if(hiddenFams.has(a.fam)||hiddenFams.has(b.fam)) return;
    const dx=b.x-a.x, dy=b.y-a.y;
    const d=Math.hypot(dx,dy)||1;
    const rest = 132;
    const f = (d-rest)*0.0075;
    a.vx+=dx/d*f; a.vy+=dy/d*f;
    b.vx-=dx/d*f; b.vy-=dy/d*f;
  });
  // family anchoring + gentle centring
  C.forEach(n=>{
    n.vx += (n.ax-n.x)*0.0042 - n.x*0.0009;
    n.vy += (n.ay-n.y)*0.0042 - n.y*0.0009;
    if(n===dragNode) return;
    n.vx*=0.86; n.vy*=0.86;
    n.x+=n.vx*alphaSim; n.y+=n.vy*alphaSim;
  });
}

/* ============================================================
   RENDERING
   ============================================================ */
function neighboursOf(id){
  const s=new Set();
  EDGES.forEach(e=>{ if(e.a===id) s.add(e.b); if(e.b===id) s.add(e.a); });
  return s;
}

/* Split "m_e" into base + subscript. Canvas has no rich text, so a
   subscripted symbol has to be drawn as two measured runs. */
const symCache={};
function symParts(sym){
  if(symCache[sym]) return symCache[sym];
  const m = sym.match(/^(.+?)_(.+)$/);
  return symCache[sym] = m ? {base:m[1], sub:m[2]} : {base:sym, sub:''};
}
/* HTML equivalent, for chips, search results and inline references */
function htmlSym(sym){
  const p=symParts(sym);
  return p.sub ? `${p.base}<sub>${p.sub}</sub>` : p.base;
}

/* Draw a symbol centred in its bubble, shrinking to fit if it is wide */
function drawSym(n,bright){
  const p=symParts(n.sym);
  const fit=n.r*1.68;
  ctx.textBaseline='middle';
  ctx.fillStyle = bright ? '#fff' : '#EFEAF7';

  if(!p.sub){
    let size=Math.round(n.r*0.72);
    ctx.font=`500 ${size}px 'IBM Plex Mono',monospace`;
    const w=ctx.measureText(p.base).width;
    if(w>fit){ size=Math.max(8,Math.floor(size*fit/w));
               ctx.font=`500 ${size}px 'IBM Plex Mono',monospace`; }
    ctx.textAlign='center';
    ctx.fillText(p.base,n.x,n.y+1);
    return;
  }

  let size=Math.round(n.r*0.7), sub=Math.max(7,Math.round(size*0.58));
  const measure=()=>{
    ctx.font=`500 ${size}px 'IBM Plex Mono',monospace`;
    const wb=ctx.measureText(p.base).width;
    ctx.font=`500 ${sub}px 'IBM Plex Mono',monospace`;
    const ws=ctx.measureText(p.sub).width;
    return {wb,ws,total:wb+ws+size*0.06};
  };
  let m=measure();
  if(m.total>fit){
    const k=fit/m.total;
    size=Math.max(8,Math.floor(size*k));
    sub=Math.max(7,Math.floor(sub*k));
    m=measure();
  }
  const x0=n.x-m.total/2;
  ctx.textAlign='left';
  ctx.font=`500 ${size}px 'IBM Plex Mono',monospace`;
  ctx.fillText(p.base,x0,n.y);
  ctx.font=`500 ${sub}px 'IBM Plex Mono',monospace`;
  ctx.globalAlpha*=0.92;
  ctx.fillText(p.sub,x0+m.wb+size*0.06,n.y+size*0.3);
  ctx.globalAlpha/=0.92;
  ctx.textAlign='center';
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(view.tx,view.ty);
  ctx.scale(view.s,view.s);

  const focus = selected || hovered;
  const near  = focus ? neighboursOf(focus.id) : null;

  /* edges */
  EDGES.forEach(e=>{
    const a=byId[e.a], b=byId[e.b];
    if(hiddenFams.has(a.fam)||hiddenFams.has(b.fam)) return;
    const lit = focus && (e.a===focus.id||e.b===focus.id);
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    // slight curve so parallel links read separately
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    ctx.quadraticCurveTo(mx+(b.y-a.y)*0.07, my-(b.x-a.x)*0.07, b.x,b.y);
    const grad=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
    grad.addColorStop(0,a.color); grad.addColorStop(1,b.color);
    ctx.strokeStyle=grad;
    ctx.globalAlpha = lit ? 0.95 : (focus ? 0.06 : 0.22);
    ctx.lineWidth = lit ? 2.1 : 1;
    if(lit){ ctx.shadowColor=a.color; ctx.shadowBlur=14; }
    ctx.stroke();
    ctx.shadowBlur=0;
  });
  ctx.globalAlpha=1;

  /* nodes */
  C.forEach(n=>{
    if(hiddenFams.has(n.fam)) return;
    const isFocus = focus===n;
    const isNear  = near && near.has(n.id);
    const dim = focus && !isFocus && !isNear;
    ctx.globalAlpha = dim ? 0.16 : 1;

    // halo
    const g=ctx.createRadialGradient(n.x,n.y,n.r*0.4,n.x,n.y,n.r*2.5);
    g.addColorStop(0,n.color+'55');
    g.addColorStop(1,n.color+'00');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r*2.5,0,7); ctx.fill();

    // body
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,7);
    const bg=ctx.createRadialGradient(n.x-n.r*.35,n.y-n.r*.4,1,n.x,n.y,n.r);
    bg.addColorStop(0, isFocus? n.color+'EE' : n.color+'40');
    bg.addColorStop(1, isFocus? n.color+'70' : '#0F0A1EEE');
    ctx.fillStyle=bg; ctx.fill();
    ctx.lineWidth = isFocus?2.4:1.4;
    ctx.strokeStyle = isFocus? '#fff' : n.color+(isNear?'FF':'AA');
    if(isFocus||isNear){ ctx.shadowColor=n.color; ctx.shadowBlur=isFocus?26:12; }
    ctx.stroke(); ctx.shadowBlur=0;

    // symbol
    drawSym(n, isFocus);

    // name under bubble, only when zoomed enough or focused
    if(view.s>0.62 || isFocus || isNear){
      ctx.globalAlpha = dim?0.1:(isFocus?0.95:0.5);
      ctx.fillStyle='#9C8FB6';
      ctx.font=`400 10px 'IBM Plex Sans',sans-serif`;
      ctx.fillText(n.name.length>26?n.name.slice(0,24)+'…':n.name, n.x, n.y+n.r+13);
    }
    ctx.globalAlpha=1;
  });
  ctx.restore();
}

function loop(){
  if(alphaSim>0.02){ step(); alphaSim*= reduced?0.90:0.995; }
  else if(dragNode){ step(); }
  draw();
  requestAnimationFrame(loop);
}
loop();
const reheat = ()=>{ alphaSim = Math.max(alphaSim,0.7); };

/* ============================================================
   INTERACTION
   ============================================================ */
function pick(px,py){
  const w=toWorld(px,py);
  for(let i=C.length-1;i>=0;i--){
    const n=C[i];
    if(hiddenFams.has(n.fam)) continue;
    if(Math.hypot(w.x-n.x,w.y-n.y)<=n.r+4) return n;
  }
  return null;
}

cv.addEventListener('pointerdown',ev=>{
  cv.setPointerCapture(ev.pointerId);
  moved=0; last={x:ev.clientX,y:ev.clientY};
  const n=pick(ev.clientX,ev.clientY);
  if(n){ dragNode=n; n.vx=n.vy=0; }
  else { panning=true; cv.classList.add('grabbing'); }
});
cv.addEventListener('pointermove',ev=>{
  const dx=ev.clientX-last.x, dy=ev.clientY-last.y;
  moved += Math.abs(dx)+Math.abs(dy);
  last={x:ev.clientX,y:ev.clientY};
  if(dragNode){
    const w=toWorld(ev.clientX,ev.clientY);
    dragNode.x=w.x; dragNode.y=w.y; dragNode.vx=dragNode.vy=0;
    reheat();
  } else if(panning){
    view.tx+=dx; view.ty+=dy;
  } else {
    const n=pick(ev.clientX,ev.clientY);
    if(n!==hovered){ hovered=n; cv.classList.toggle('overnode',!!n); }
  }
});
cv.addEventListener('pointerup',ev=>{
  if(moved<6){
    const n=pick(ev.clientX,ev.clientY);
    n ? open(n) : close();
  }
  dragNode=null; panning=false; cv.classList.remove('grabbing');
});
cv.addEventListener('pointerleave',()=>{ hovered=null; dragNode=null; panning=false; });

cv.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const k=Math.exp(-ev.deltaY*0.0013);
  const ns=Math.min(2.6,Math.max(0.33,view.s*k));
  const f=ns/view.s;
  view.tx = ev.clientX-(ev.clientX-view.tx)*f;
  view.ty = ev.clientY-(ev.clientY-view.ty)*f;
  view.s=ns;
},{passive:false});

function centreOn(n){
  view.tx = W/2 - n.x*view.s;
  view.ty = (W<760 ? H*0.28 : H/2) - n.y*view.s;
}

/* ============================================================
   DRAWER
   ============================================================ */
const drawer=document.getElementById('drawer');
const dHead=document.getElementById('dHead');
const dBody=document.getElementById('dBody');

function tex(s,display){
  try{ return katex.renderToString(s,{displayMode:!!display,throwOnError:false,output:'html'}); }
  catch(e){ return '<code>'+s+'</code>'; }
}
/* {{id}} in prose becomes a clickable jump */
function links(html){
  return html.replace(/\{\{(\w+)\}\}/g,(m,id)=>{
    const n=byId[id];
    return n ? `<button class="ref" data-go="${id}" title="${n.name}" style="color:${n.color}">${htmlSym(n.sym)}</button>` : m;
  });
}

function open(n){
  selected=n; hovered=null;
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false');
  centreOn(n);

  dHead.innerHTML = `
    <button class="d-close" aria-label="Close">✕</button>
    <div class="d-fam" style="color:${n.color}">${FAM[n.fam].label} · ${FAM[n.fam].nm} nm</div>
    <div class="d-sym" style="color:${n.color}">${htmlSym(n.sym)}</div>
    <h2 class="d-name">${n.name}</h2>
    <div class="d-val">${n.val} <span class="u">${n.unit}</span></div>
    ${n.exact?`<span class="d-exact" style="color:${n.color}">exact by definition</span>`:''}
  `;

  const dep = (n.from||[]).map(id=>byId[id]).filter(Boolean);
  const out = (n.feeds||[]).map(id=>byId[id]).filter(Boolean);
  const chip = m=>`<button class="chip" data-go="${m.id}" style="color:${m.color}">${htmlSym(m.sym)}<span class="cn">${m.name}</span></button>`;

  dBody.innerHTML = `
    <p>${links(n.blurb)}</p>

    <h3 class="lbl">Definition</h3>
    <div class="eqbox" style="color:${n.color}">${tex(n.def,true)}</div>

    <h3 class="lbl">Units — and what cancels</h3>
    <div class="eqbox" style="color:${n.color}">${tex(n.units,true)}</div>
    <p class="eqcap">every symbol shown with its unit; identical units above and below annihilate</p>

    ${n.note?`<p class="note">${links(n.note)}</p>`:''}

    ${dep.length?`<h3 class="lbl">Built from</h3><div class="chips">${dep.map(chip).join('')}</div>`:''}
    ${out.length?`<h3 class="lbl">Feeds into</h3><div class="chips">${out.map(chip).join('')}</div>`:''}
  `;
  dBody.scrollTop=0;
  reheat();
}
function close(){
  selected=null;
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden','true');
}
document.addEventListener('click',ev=>{
  const go=ev.target.closest('[data-go]');
  if(go){ open(byId[go.dataset.go]); return; }
  if(ev.target.closest('.d-close')) close();
});

/* ============================================================
   SPECTRUM LEGEND (filters by family)
   ============================================================ */
const ticks=document.getElementById('ticks');
famOrder.forEach(k=>{
  const f=FAM[k];
  const b=document.createElement('button');
  b.className='tick'; b.style.color=f.color;
  b.innerHTML=`<b>${f.label}</b><span class="nm">${f.nm} nm · ${C.filter(n=>n.fam===k).length}</span>`;
  b.onclick=()=>{
    hiddenFams.has(k)?hiddenFams.delete(k):hiddenFams.add(k);
    b.classList.toggle('off',hiddenFams.has(k));
    if(selected&&hiddenFams.has(selected.fam)) close();
    reheat();
  };
  ticks.appendChild(b);
});

/* ============================================================
   SEARCH
   ============================================================ */
const search=document.getElementById('search');
const results=document.getElementById('results');
function render(list){
  results.innerHTML = list.map(n=>`
    <li><button data-go="${n.id}">
      <span class="s" style="color:${n.color}">${htmlSym(n.sym)}</span>
      <span class="n">${n.name}</span>
    </button></li>`).join('');
}
search.addEventListener('input',()=>{
  const q=search.value.trim().toLowerCase();
  if(!q){ results.innerHTML=''; return; }
  render(C.filter(n=>(n.name+' '+n.sym+' '+n.id+' '+FAM[n.fam].label).toLowerCase().includes(q)).slice(0,8));
});
search.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const first=results.querySelector('button');
    if(first) first.click();
  }
});
results.addEventListener('click',()=>{ search.value=''; results.innerHTML=''; });

addEventListener('keydown',e=>{
  if(e.key==='Escape'){ close(); search.blur(); results.innerHTML=''; }
  if(e.key==='/' && document.activeElement!==search){ e.preventDefault(); search.focus(); }
});

/* open on the constant that started all this */
setTimeout(()=>open(byId['ke']), 700);
</script>
</body>
</html>
