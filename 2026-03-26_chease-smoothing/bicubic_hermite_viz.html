<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect,useReducer,useContext,createContext,forwardRef,memo,Fragment,Children,cloneElement} = React;



// Hermite basis functions for t in [0,1]
const h00 = (t) => 2*t*t*t - 3*t*t + 1;       // value at start
const h10 = (t) => t*t*t - 2*t*t + t;           // derivative at start
const h01 = (t) => -2*t*t*t + 3*t*t;            // value at end
const h11 = (t) => t*t*t - t*t;                  // derivative at end

// 1D Hermite interpolation between two nodes
function hermiteInterp1D(p0, m0, p1, m1, t) {
  return h00(t)*p0 + h10(t)*m0 + h01(t)*p1 + h11(t)*m1;
}

// Linear interpolation
function lerp(a, b, t) { return a + (b - a) * t; }

// Bicubic Hermite patch evaluation
// corners: [{val, ddr, ddz, ddrdz}] in order [00, 10, 01, 11]
function bicubicHermite(corners, u, v) {
  const [c00, c10, c01, c11] = corners;
  
  // Interpolate along u for each pair of z-rows
  const val_z0 = hermiteInterp1D(c00.val, c00.ddr, c10.val, c10.ddr, u);
  const val_z1 = hermiteInterp1D(c01.val, c01.ddr, c11.val, c11.ddr, u);
  const ddz_z0 = hermiteInterp1D(c00.ddz, c00.ddrdz, c10.ddz, c10.ddrdz, u);
  const ddz_z1 = hermiteInterp1D(c01.ddz, c01.ddrdz, c11.ddz, c11.ddrdz, u);
  
  // Interpolate along v
  return hermiteInterp1D(val_z0, ddz_z0, val_z1, ddz_z1, v);
}

// Bilinear patch evaluation
function bilinear(corners, u, v) {
  const [c00, c10, c01, c11] = corners;
  return lerp(lerp(c00.val, c10.val, u), lerp(c01.val, c11.val, u), v);
}

// Generate a smooth test function (tokamak-ish flux)
function trueFunction(r, z) {
  const rn = (r - 0.5) * 2;
  const zn = (z - 0.5) * 2;
  return Math.exp(-(rn*rn + zn*zn) * 1.2) * (1 + 0.3*Math.sin(rn*3)*Math.cos(zn*2));
}

function trueDR(r, z) {
  const h = 0.001;
  return (trueFunction(r+h, z) - trueFunction(r-h, z)) / (2*h);
}

function trueDZ(r, z) {
  const h = 0.001;
  return (trueFunction(r, z+h) - trueFunction(r, z-h)) / (2*h);
}

function trueDRDZ(r, z) {
  const h = 0.001;
  return (trueFunction(r+h, z+h) - trueFunction(r+h, z-h) - trueFunction(r-h, z+h) + trueFunction(r-h, z-h)) / (4*h*h);
}

// Color maps
function fluxColor(val, min, max) {
  const t = Math.max(0, Math.min(1, (val - min) / (max - min || 1)));
  const r = Math.floor(10 + 60*t + 180*(t**2.5));
  const g = Math.floor(8 + 180*t - 80*(t**2));
  const b = Math.floor(80 + 120*(1-t));
  return `rgb(${r},${g},${b})`;
}

function errorColor(val) {
  const t = Math.min(1, Math.abs(val) * 12);
  const r = Math.floor(255 * t);
  const g = Math.floor(60 * (1-t));
  const b = Math.floor(80 * (1-t));
  return `rgb(${r},${g},${b})`;
}

const GRID_SIZES = [3, 4, 5, 7];

function SurfaceCanvas({ evalFn, width, height, res, colorFn, minMax }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const cw = width / res;
    const ch = height / res;
    for (let j = 0; j < res; j++) {
      for (let i = 0; i < res; i++) {
        const u = (i + 0.5) / res;
        const v = (j + 0.5) / res;
        const val = evalFn(u, v);
        ctx.fillStyle = colorFn(val, minMax[0], minMax[1]);
        ctx.fillRect(i * cw, j * ch, cw + 1, ch + 1);
      }
    }
  }, [evalFn, width, height, res, colorFn, minMax]);
  return <canvas ref={canvasRef} width={width} height={height} style={{ borderRadius: 6, display: "block" }} />;
}

// Interactive 1D Hermite demo
function Hermite1DDemo() {
  const canvasRef = useRef(null);
  const [dragging, setDragging] = useState(null);
  const [nodes, setNodes] = useState([
    { x: 0.1, y: 0.6, dy: 0.5 },
    { x: 0.5, y: 0.8, dy: -0.3 },
    { x: 0.9, y: 0.35, dy: -0.8 }
  ]);

  const W = 560;
  const H = 200;
  const pad = { l: 10, r: 10, t: 10, b: 10 };
  const pw = W - pad.l - pad.r;
  const ph = H - pad.t - pad.b;

  const toScreen = (x, y) => [pad.l + x * pw, pad.t + (1 - y) * ph];
  const fromScreen = (sx, sy) => [(sx - pad.l) / pw, 1 - (sy - pad.t) / ph];

  const draw = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = "rgba(15,17,28,1)";
    ctx.fillRect(0, 0, W, H);

    // Grid
    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 10; i++) {
      const x = pad.l + (i/10)*pw;
      ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, pad.t+ph); ctx.stroke();
      const y = pad.t + (i/10)*ph;
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l+pw, y); ctx.stroke();
    }

    // Draw linear interpolation (dashed)
    ctx.strokeStyle = "rgba(251,146,60,0.5)";
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    for (let i = 0; i < nodes.length; i++) {
      const [sx, sy] = toScreen(nodes[i].x, nodes[i].y);
      i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw Hermite spline (solid)
    ctx.strokeStyle = "#60a5fa";
    ctx.lineWidth = 3;
    ctx.beginPath();
    let first = true;
    for (let seg = 0; seg < nodes.length - 1; seg++) {
      const n0 = nodes[seg], n1 = nodes[seg + 1];
      const dx = n1.x - n0.x;
      for (let s = 0; s <= 40; s++) {
        const t = s / 40;
        const x = n0.x + t * dx;
        const y = hermiteInterp1D(n0.y, n0.dy * dx, n1.y, n1.dy * dx, t);
        const [sx, sy] = toScreen(x, y);
        first ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
        first = false;
      }
    }
    ctx.stroke();

    // Draw nodes and tangent handles
    nodes.forEach((node, idx) => {
      const [nx, ny] = toScreen(node.x, node.y);

      // Tangent line
      const tanLen = 40;
      const angle = Math.atan(node.dy);
      const tx1 = nx - tanLen * Math.cos(angle);
      const ty1 = ny + tanLen * Math.sin(angle);
      const tx2 = nx + tanLen * Math.cos(angle);
      const ty2 = ny - tanLen * Math.sin(angle);

      ctx.strokeStyle = "rgba(167,139,250,0.6)";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(tx1, ty1); ctx.lineTo(tx2, ty2); ctx.stroke();

      // Tangent handle dots
      ctx.fillStyle = "#a78bfa";
      ctx.beginPath(); ctx.arc(tx2, ty2, 5, 0, Math.PI*2); ctx.fill();

      // Node dot
      ctx.fillStyle = "#60a5fa";
      ctx.strokeStyle = "#1e3a5f";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(nx, ny, 7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    });

    // Labels
    ctx.fillStyle = "#60a5fa";
    ctx.font = "500 11px 'JetBrains Mono', monospace";
    ctx.fillText("Hermite", pad.l + 4, pad.t + 14);
    ctx.fillStyle = "rgba(251,146,60,0.7)";
    ctx.fillText("Linear", pad.l + 4, pad.t + 28);
    ctx.fillStyle = "#a78bfa";
    ctx.font = "400 10px 'JetBrains Mono', monospace";
    ctx.fillText("drag nodes or purple handles", W - 220, H - 8);

  }, [nodes]);

  useEffect(() => { draw(); }, [draw]);

  const handleMouseDown = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const my = (e.clientY - rect.top) * (H / rect.height);

    for (let i = 0; i < nodes.length; i++) {
      const [nx, ny] = toScreen(nodes[i].x, nodes[i].y);
      
      // Check tangent handle
      const tanLen = 40;
      const angle = Math.atan(nodes[i].dy);
      const tx = nx + tanLen * Math.cos(angle);
      const ty = ny - tanLen * Math.sin(angle);
      if (Math.hypot(mx - tx, my - ty) < 14) {
        setDragging({ idx: i, type: "tangent" });
        return;
      }

      // Check node
      if (Math.hypot(mx - nx, my - ny) < 14) {
        setDragging({ idx: i, type: "node" });
        return;
      }
    }
  };

  const handleMouseMove = (e) => {
    if (!dragging) return;
    const rect = canvasRef.current.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const my = (e.clientY - rect.top) * (H / rect.height);
    const [fx, fy] = fromScreen(mx, my);

    setNodes(prev => {
      const next = [...prev];
      if (dragging.type === "node") {
        const minX = dragging.idx === 0 ? 0.05 : next[dragging.idx - 1].x + 0.05;
        const maxX = dragging.idx === next.length - 1 ? 0.95 : next[dragging.idx + 1].x - 0.05;
        next[dragging.idx] = {
          ...next[dragging.idx],
          x: Math.max(minX, Math.min(maxX, fx)),
          y: Math.max(0.05, Math.min(0.95, fy))
        };
      } else {
        const [nx, ny] = toScreen(next[dragging.idx].x, next[dragging.idx].y);
        const dx = mx - nx;
        const dy = -(my - ny);
        if (Math.abs(dx) > 2) {
          next[dragging.idx] = { ...next[dragging.idx], dy: Math.max(-3, Math.min(3, dy / dx)) };
        }
      }
      return next;
    });
  };

  const handleMouseUp = () => setDragging(null);

  const handleTouchStart = (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    handleMouseDown({ clientX: touch.clientX, clientY: touch.clientY });
  };
  const handleTouchMove = (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    handleMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
  };

  return (
    <canvas
      ref={canvasRef} width={W} height={H}
      style={{ borderRadius: 8, display: "block", cursor: dragging ? "grabbing" : "grab", touchAction: "none" }}
      onMouseDown={handleMouseDown}
      onMouseMove={handleMouseMove}
      onMouseUp={handleMouseUp}
      onMouseLeave={handleMouseUp}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleMouseUp}
    />
  );
}

        </svg>
        <div style={{ fontSize: 10, color: "#8a8aaa", lineHeight: 1.7 }}>

// 2D comparison: bilinear vs bicubic hermite vs truth
function Comparison2D({ gridSize }) {
  const SIZE = 170;
  const RES = 80;

  // Build grid nodes
  const n = gridSize;
  const nodesGrid = [];
  for (let j = 0; j < n; j++) {
    const row = [];
    for (let i = 0; i < n; i++) {
      const r = i / (n - 1);
      const z = j / (n - 1);
      row.push({
        val: trueFunction(r, z),
        ddr: trueDR(r, z) / (n - 1),
        ddz: trueDZ(r, z) / (n - 1),
        ddrdz: trueDRDZ(r, z) / ((n-1)*(n-1))
      });
    }
    nodesGrid.push(row);
  }

  const evalBilinear = useCallback((u, v) => {
    const ci = u * (n - 1);
    const cj = v * (n - 1);
    const i0 = Math.min(Math.floor(ci), n - 2);
    const j0 = Math.min(Math.floor(cj), n - 2);
    const lu = ci - i0;
    const lv = cj - j0;
    const corners = [nodesGrid[j0][i0], nodesGrid[j0][i0+1], nodesGrid[j0+1][i0], nodesGrid[j0+1][i0+1]];
    return bilinear(corners, lu, lv);
  }, [n, nodesGrid]);

  const evalHermite = useCallback((u, v) => {
    const ci = u * (n - 1);
    const cj = v * (n - 1);
    const i0 = Math.min(Math.floor(ci), n - 2);
    const j0 = Math.min(Math.floor(cj), n - 2);
    const lu = ci - i0;
    const lv = cj - j0;
    const corners = [nodesGrid[j0][i0], nodesGrid[j0][i0+1], nodesGrid[j0+1][i0], nodesGrid[j0+1][i0+1]];
    return bicubicHermite(corners, lu, lv);
  }, [n, nodesGrid]);

  const evalTrue = useCallback((u, v) => trueFunction(u, v), []);
  const evalErrBilinear = useCallback((u, v) => Math.abs(bilinear(
    [nodesGrid[Math.min(Math.floor(v*(n-1)),n-2)][Math.min(Math.floor(u*(n-1)),n-2)],
     nodesGrid[Math.min(Math.floor(v*(n-1)),n-2)][Math.min(Math.floor(u*(n-1)),n-2)+1],
     nodesGrid[Math.min(Math.floor(v*(n-1)),n-2)+1][Math.min(Math.floor(u*(n-1)),n-2)],
     nodesGrid[Math.min(Math.floor(v*(n-1)),n-2)+1][Math.min(Math.floor(u*(n-1)),n-2)+1]],
    u*(n-1) - Math.min(Math.floor(u*(n-1)),n-2),
    v*(n-1) - Math.min(Math.floor(v*(n-1)),n-2)
  ) - trueFunction(u, v)), [n, nodesGrid]);

  const evalErrHermite = useCallback((u, v) => Math.abs(evalHermite(u, v) - trueFunction(u, v)), [evalHermite]);

  const mm = [0, 1.1];

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 8 }}>
        <div>
          <div style={{ fontSize: 10, color: "#fb923c", marginBottom: 4, textAlign: "center" }}>
            Bilinear ({n}×{n})
          </div>
          <SurfaceCanvas evalFn={evalBilinear} width={SIZE} height={SIZE} res={RES} colorFn={fluxColor} minMax={mm} />
        </div>
        <div>
          <div style={{ fontSize: 10, color: "#60a5fa", marginBottom: 4, textAlign: "center" }}>
            Bicubic Hermite ({n}×{n})
          </div>
          <SurfaceCanvas evalFn={evalHermite} width={SIZE} height={SIZE} res={RES} colorFn={fluxColor} minMax={mm} />
        </div>
        <div>
          <div style={{ fontSize: 10, color: "#6b7094", marginBottom: 4, textAlign: "center" }}>
            True function
          </div>
          <SurfaceCanvas evalFn={evalTrue} width={SIZE} height={SIZE} res={RES} colorFn={fluxColor} minMax={mm} />
        </div>
      </div>
      {/* Error maps */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
        <div>
          <div style={{ fontSize: 9, color: "#9a7a6a", marginBottom: 3, textAlign: "center" }}>error</div>
          <SurfaceCanvas evalFn={evalErrBilinear} width={SIZE} height={SIZE} res={RES} colorFn={errorColor} minMax={[0, 0.15]} />
        </div>
        <div>
          <div style={{ fontSize: 9, color: "#7a8aaa", marginBottom: 3, textAlign: "center" }}>error</div>
          <SurfaceCanvas evalFn={evalErrHermite} width={SIZE} height={SIZE} res={RES} colorFn={errorColor} minMax={[0, 0.15]} />
        </div>
        <div>
          <div style={{ fontSize: 9, color: "#555", marginBottom: 3, textAlign: "center" }}>reference</div>
          <div style={{
            width: SIZE, height: SIZE, borderRadius: 6,
            background: "rgb(0,60,80)", display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 10, color: "#4a6a7a"
          }}>zero error</div>
        </div>
      </div>
    </div>
  );
}

              }}>
                <div style={{ color: "#fb923c", fontWeight: 600, marginBottom: 6 }}>EFIT: 65×65 grid</div>
                <div style={{ color: "#8a7a6a", lineHeight: 1.7 }}>
                  65 × 65 × <span style={{ color: "#fb923c" }}>1</span> = 4,225 unknowns<br />
                  Derivatives: finite difference of neighbors<br />
                  Continuity: C⁰ (values match, derivatives may jump)
                </div>
              </div>
              <div style={{
                background: "rgba(96,165,250,0.05)", borderRadius: 8, padding: 12,
                border: "1px solid rgba(96,165,250,0.12)"
              }}>
                <div style={{ color: "#60a5fa", fontWeight: 600, marginBottom: 6 }}>CHEASE: 65×65 grid</div>
                <div style={{ color: "#8a8aaa", lineHeight: 1.7 }}>
                  65 × 65 × <span style={{ color: "#60a5fa" }}>4</span> = 16,900 unknowns<br />
                  Derivatives: solved for directly by the PDE<br />
                  Continuity: C¹ (values <i>and</i> derivatives match)
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {tab === 1 && (
        <div>
          <div style={{
            background: "rgba(20,22,38,0.8)",
            border: "1px solid rgba(255,255,255,0.06)",
            borderRadius: 10, padding: 16, marginBottom: 14
          }}>
            <div style={{ fontSize: 12, color: "#b0b2cc", lineHeight: 1.7, marginBottom: 12 }}>
              Drag the <span style={{ color: "#60a5fa" }}>blue nodes</span> to move them. 
              Drag the <span style={{ color: "#a78bfa" }}>purple handles</span> to change derivatives.
              Notice how the Hermite curve stays smooth while the linear interpolation makes sharp corners.
            </div>
            <Hermite1DDemo />
          </div>

          <div style={{
            background: "rgba(20,22,38,0.8)",
            border: "1px solid rgba(255,255,255,0.06)",
            borderRadius: 10, padding: 14, fontSize: 11, color: "#7a7d98", lineHeight: 1.8
          }}>
            <span style={{ color: "#60a5fa" }}>Key insight:</span> between any two nodes, the Hermite 
            interpolant uses 4 pieces of information (value + slope at each end) vs 2 for linear (just 
            values). The cubic polynomial that satisfies all 4 constraints is unique and C¹ continuous 
            at every node boundary. In 2D this becomes 16 constraints per cell (4 corners × 4 quantities).
          </div>
        </div>
      )}

      {tab === 2 && (
        <div>
          <div style={{
            display: "flex", alignItems: "center", justifyContent: "center",
            gap: 8, marginBottom: 14
          }}>
            <span style={{ fontSize: 10, color: "#6b7094" }}>Grid:</span>
            {GRID_SIZES.map((g, i) => (
              <button key={i} onClick={() => setGridIdx(i)} style={{
                background: i === gridIdx ? "rgba(96,165,250,0.2)" : "rgba(255,255,255,0.03)",
                border: "1px solid",
                borderColor: i === gridIdx ? "rgba(96,165,250,0.4)" : "rgba(255,255,255,0.06)",
                color: i === gridIdx ? "#60a5fa" : "#5a5d78",
                borderRadius: 6, padding: "5px 10px",
                fontFamily: "inherit", fontSize: 11, cursor: "pointer"
              }}>
                {g}×{g}
              </button>
            ))}
          </div>

          <div style={{
            background: "rgba(20,22,38,0.8)",
            border: "1px solid rgba(255,255,255,0.06)",
            borderRadius: 10, padding: 14
          }}>
            <Comparison2D gridSize={GRID_SIZES[gridIdx]} />
          </div>

          <div style={{
            marginTop: 12, fontSize: 10, color: "#5a5d78", textAlign: "center", lineHeight: 1.7
          }}>
            Top row: reconstructed surface. Bottom row: absolute error (red = high).
            <br />
            Same grid points, same function — Hermite is dramatically more accurate because it uses derivative info.
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(BicubicHermiteViz));
</script>
<script>window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+='\n'+e.message;});</script>
