<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>what is r</title>
<style>html,body{margin:0;background:#0c0d10;color:#e8eaf0;font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif}
#root{min-height:100vh}#err{display:none;white-space:pre-wrap;padding:24px;color:#f0736a;font:13px/1.5 ui-monospace,Menlo,monospace}</style>
<div id="root"></div><pre id="err"></pre>
<script src="../_lib/react/libs-base.js"></script>
<script src="../_lib/react/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect,useReducer,useContext,createContext,forwardRef,memo,Fragment,Children,cloneElement} = React;



function WhatIsR() {
  const [view, setView] = useState("topdown");
  const [hoveredR, setHoveredR] = useState(null);

  const svgW = 600, svgH = 550;
  const cx = svgW / 2, cy = svgH / 2 + 10;

  // Scale: 1 meter = 150 pixels
  const scale = 140;

  // Cross section params
  const pad = { l: 60, r: 30, t: 50, b: 50 };
  const plotW = svgW - pad.l - pad.r;
  const plotH = svgH - pad.t - pad.b;
  const Rmin_view = -0.3, Rmax_view = 2.2;
  const toX = (R) => pad.l + ((R - Rmin_view) / (Rmax_view - Rmin_view)) * plotW;
  const toY = (Z) => pad.t + ((1.2 - Z) / 2.4) * plotH;

  const R0_plasma = 1.18; // plasma center
  const a = 0.42; // minor radius

  return (
    <div style={{
      fontFamily: "'IBM Plex Mono', monospace",
      background: "#0a0e14",
      color: "#c5cdd9",
      minHeight: "100vh",
      padding: "20px",
      boxSizing: "border-box",
    }}>
      <div style={{ maxWidth: 880, margin: "0 auto" }}>
        <h1 style={{ fontSize: 18, color: "#e6ecf2", margin: "0 0 4px" }}>
          WHAT DOES R MEASURE?
        </h1>
        <p style={{ fontSize: 11, color: "#5c6a7a", margin: "0 0 16px", letterSpacing: 1 }}>
          R IS FROM THE CENTRAL AXIS — NOT FROM THE PLASMA CENTER
        </p>

        <div style={{ display: "flex", gap: 4, marginBottom: 16 }}>
          {[
            { id: "topdown", label: "Top-down (looking down at donut)" },
            { id: "cross", label: "Cross-section (EQDSK view)" },
          ].map(v => (
            <button
              key={v.id}
              onClick={() => setView(v.id)}
              style={{
                padding: "8px 14px",
                background: view === v.id ? "#1a2a3a" : "#12171f",
                border: view === v.id ? "1px solid #4ecdc4" : "1px solid #1e2630",
                borderRadius: 4,
                color: view === v.id ? "#4ecdc4" : "#5c6a7a",
                fontSize: 11, fontFamily: "inherit", cursor: "pointer",
                fontWeight: view === v.id ? 700 : 400,
              }}
            >
              {v.label}
            </button>
          ))}
        </div>

        <div style={{ display: "flex", gap: 20, flexWrap: "wrap" }}>
          <div style={{
            background: "#0d1117",
            borderRadius: 6,
            border: "1px solid #1e2630",
            padding: 10,
          }}>
            <svg width={svgW} height={svgH} style={{ display: "block" }}>
              {view === "topdown" ? (
                <>
                  <rect x={0} y={0} width={svgW} height={svgH} fill="#060a0e" />

                  {/* Central axis - the point in the middle */}
                  <circle cx={cx} cy={cy} r={6} fill="#ff6b6b" />
                  <text x={cx} y={cy - 18} textAnchor="middle" fill="#ff6b6b" fontSize={13} fontWeight={700}>
                    R = 0
                  </text>
                  <text x={cx} y={cy - 5} textAnchor="middle" fill="#ff6b6b" fontSize={10}>
                    central axis
                  </text>

                  {/* Central solenoid */}
                  <circle cx={cx} cy={cy} r={0.2 * scale} fill="rgba(201,124,76,0.2)" stroke="#c97c4c" strokeWidth={2} />
                  <text x={cx} y={cy + 0.2 * scale + 14} textAnchor="middle" fill="#c97c4c" fontSize={9}>central solenoid</text>

                  {/* Donut hole space */}
                  <circle cx={cx} cy={cy} r={0.6 * scale} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth={1} strokeDasharray="4,4" />

                  {/* Plasma ring */}
                  <circle cx={cx} cy={cy} r={R0_plasma * scale}
                    fill="none" stroke="rgba(78,205,196,0.15)" strokeWidth={a * 2 * scale} />
                  <circle cx={cx} cy={cy} r={R0_plasma * scale}
                    fill="none" stroke="rgba(78,205,196,0.4)" strokeWidth={1.5} strokeDasharray="6,4" />

                  {/* R measurement arrows */}
                  {/* R to inner edge of plasma */}
                  <line x1={cx} y1={cy + 40} x2={cx + (R0_plasma - a) * scale} y2={cy + 40}
                    stroke="#8ab4f8" strokeWidth={1.5} />
                  <circle cx={cx} cy={cy + 40} r={3} fill="#ff6b6b" />
                  <circle cx={cx + (R0_plasma - a) * scale} cy={cy + 40} r={3} fill="#8ab4f8" />
                  <text x={cx + (R0_plasma - a) * scale / 2} y={cy + 55}
                    textAnchor="middle" fill="#8ab4f8" fontSize={10}>
                    R = {(R0_plasma - a).toFixed(2)}m (inner edge)
                  </text>

                  {/* R to plasma center */}
                  <line x1={cx} y1={cy + 75} x2={cx + R0_plasma * scale} y2={cy + 75}
                    stroke="#4ecdc4" strokeWidth={2} />
                  <circle cx={cx} cy={cy + 75} r={3} fill="#ff6b6b" />
                  <circle cx={cx + R0_plasma * scale} cy={cy + 75} r={5} fill="none" stroke="#4ecdc4" strokeWidth={2} />
                  <text x={cx + R0_plasma * scale / 2} y={cy + 90}
                    textAnchor="middle" fill="#4ecdc4" fontSize={11} fontWeight={700}>
                    R = {R0_plasma.toFixed(2)}m (plasma center)
                  </text>

                  {/* R to outer edge */}
                  <line x1={cx} y1={cy + 110} x2={cx + (R0_plasma + a) * scale} y2={cy + 110}
                    stroke="#c9a3f5" strokeWidth={1.5} />
                  <circle cx={cx} cy={cy + 110} r={3} fill="#ff6b6b" />
                  <circle cx={cx + (R0_plasma + a) * scale} cy={cy + 110} r={3} fill="#c9a3f5" />
                  <text x={cx + (R0_plasma + a) * scale / 2} y={cy + 125}
                    textAnchor="middle" fill="#c9a3f5" fontSize={10}>
                    R = {(R0_plasma + a).toFixed(2)}m (outer edge)
                  </text>

                  {/* Labels on the donut */}
                  <text x={cx + R0_plasma * scale} y={cy - a * scale - 10}
                    textAnchor="middle" fill="rgba(78,205,196,0.6)" fontSize={10}>
                    plasma
                  </text>

                  {/* Arrow showing R always starts from center */}
                  <text x={cx - 10} y={cy + 140} textAnchor="end" fill="#5c6a7a" fontSize={10}>
                    Every R measurement
                  </text>
                  <text x={cx - 10} y={cy + 153} textAnchor="end" fill="#5c6a7a" fontSize={10}>
                    starts from this point →
                  </text>

                  {/* Annotation: donut hole */}
                  <text x={cx + 0.4 * scale} y={cy - 0.35 * scale}
                    fill="#3a4a5a" fontSize={9} fontStyle="italic">
                    donut hole
                  </text>
                  <text x={cx + 0.4 * scale} y={cy - 0.23 * scale}
                    fill="#3a4a5a" fontSize={9} fontStyle="italic">
                    (empty space)
                  </text>

                  {/* Title */}
                  <text x={svgW / 2} y={25} textAnchor="middle" fill="#e6ecf2" fontSize={13} fontWeight={700}>
                    Looking straight down at the tokamak
                  </text>
                  <text x={svgW / 2} y={42} textAnchor="middle" fill="#5c6a7a" fontSize={11}>
                    R = distance from the center point to anywhere
                  </text>
                </>
              ) : (
                <>
                  <rect x={pad.l} y={pad.t} width={plotW} height={plotH} fill="#060a0e" stroke="#1e2630" />

                  {/* Title */}
                  <text x={svgW / 2} y={25} textAnchor="middle" fill="#e6ecf2" fontSize={13} fontWeight={700}>
                    Cross-section — slicing the donut in half
                  </text>
                  <text x={svgW / 2} y={42} textAnchor="middle" fill="#5c6a7a" fontSize={11}>
                    R goes left to right. Z goes up and down.
                  </text>

                  {/* Central axis at R=0 */}
                  <line x1={toX(0)} y1={pad.t} x2={toX(0)} y2={pad.t + plotH}
                    stroke="#ff6b6b" strokeWidth={3} />
                  <text x={toX(0)} y={pad.t + 20} textAnchor="middle" fill="#ff6b6b" fontSize={12} fontWeight={700}>
                    R = 0
                  </text>
                  <text x={toX(0)} y={pad.t + 34} textAnchor="middle" fill="#ff6b6b" fontSize={9}>
                    central axis
                  </text>

                  {/* Central solenoid */}
                  <rect x={toX(-0.12)} y={toY(0.9)} width={toX(0.12) - toX(-0.12)} height={toY(-0.9) - toY(0.9)}
                    fill="rgba(201,124,76,0.2)" stroke="#c97c4c" rx={4} />
                  <text x={toX(0)} y={toY(0) + 4} textAnchor="middle" fill="#c97c4c" fontSize={8}>CS</text>

                  {/* Empty space label */}
                  <text x={toX(0.3)} y={toY(0.1)} textAnchor="middle" fill="#3a4a5a" fontSize={10} fontStyle="italic">
                    empty
                  </text>
                  <text x={toX(0.3)} y={toY(-0.05)} textAnchor="middle" fill="#3a4a5a" fontSize={10} fontStyle="italic">
                    space
                  </text>

                  {/* Wall */}
                  {(() => {
                    const pts = [];
                    const asin_d = Math.asin(0.40);
                    for (let t = 0; t <= 200; t++) {
                      const theta = (2 * Math.PI * t) / 200;
                      const R = R0_plasma + 0.55 * Math.cos(theta + asin_d * Math.sin(theta));
                      const Z = 0.95 * Math.sin(theta);
                      pts.push(`${toX(R)},${toY(Z)}`);
                    }
                    return <polygon points={pts.join(" ")} fill="none" stroke="rgba(255,255,255,0.12)" strokeWidth={2.5} />;
                  })()}

                  {/* Plasma boundary */}
                  {(() => {
                    const pts = [];
                    const asin_d = Math.asin(0.40);
                    for (let t = 0; t <= 200; t++) {
                      const theta = (2 * Math.PI * t) / 200;
                      const R = R0_plasma + a * Math.cos(theta + asin_d * Math.sin(theta));
                      const Z = 1.75 * a * Math.sin(theta);
                      pts.push(`${toX(R)},${toY(Z)}`);
                    }
                    return <polygon points={pts.join(" ")} fill="rgba(78,205,196,0.08)" stroke="#4ecdc4" strokeWidth={1.5} />;
                  })()}

                  {/* Magnetic axis dot */}
                  <circle cx={toX(R0_plasma)} cy={toY(0)} r={5} fill="#4ecdc4" />

                  {/* R dimension lines */}
                  {/* R = 0 to inner plasma edge */}
                  <line x1={toX(0)} y1={toY(-0.85)} x2={toX(R0_plasma - a)} y2={toY(-0.85)}
                    stroke="#8ab4f8" strokeWidth={1.5} />
                  <circle cx={toX(0)} cy={toY(-0.85)} r={3} fill="#ff6b6b" />
                  <circle cx={toX(R0_plasma - a)} cy={toY(-0.85)} r={3} fill="#8ab4f8" />
                  <line x1={toX(R0_plasma - a)} y1={toY(-0.85) - 5} x2={toX(R0_plasma - a)} y2={toY(-0.85) + 5}
                    stroke="#8ab4f8" strokeWidth={1.5} />
                  <text x={(toX(0) + toX(R0_plasma - a)) / 2} y={toY(-0.85) - 8}
                    textAnchor="middle" fill="#8ab4f8" fontSize={10} fontWeight={600}>
                    R = {(R0_plasma - a).toFixed(2)}m
                  </text>

                  {/* R = 0 to plasma center */}
                  <line x1={toX(0)} y1={toY(-1.0)} x2={toX(R0_plasma)} y2={toY(-1.0)}
                    stroke="#4ecdc4" strokeWidth={2} />
                  <circle cx={toX(0)} cy={toY(-1.0)} r={3} fill="#ff6b6b" />
                  <circle cx={toX(R0_plasma)} cy={toY(-1.0)} r={5} fill="none" stroke="#4ecdc4" strokeWidth={2} />
                  <text x={(toX(0) + toX(R0_plasma)) / 2} y={toY(-1.0) - 8}
                    textAnchor="middle" fill="#4ecdc4" fontSize={11} fontWeight={700}>
                    R = {R0_plasma.toFixed(2)}m (plasma center)
                  </text>

                  {/* R = 0 to outer plasma edge */}
                  <line x1={toX(0)} y1={toY(-1.15)} x2={toX(R0_plasma + a)} y2={toY(-1.15)}
                    stroke="#c9a3f5" strokeWidth={1.5} />
                  <circle cx={toX(0)} cy={toY(-1.15)} r={3} fill="#ff6b6b" />
                  <circle cx={toX(R0_plasma + a)} cy={toY(-1.15)} r={3} fill="#c9a3f5" />
                  <text x={(toX(0) + toX(R0_plasma + a)) / 2} y={toY(-1.15) - 8}
                    textAnchor="middle" fill="#c9a3f5" fontSize={10} fontWeight={600}>
                    R = {(R0_plasma + a).toFixed(2)}m
                  </text>

                  {/* Minor radius label */}
                  <line x1={toX(R0_plasma)} y1={toY(0.6)} x2={toX(R0_plasma + a)} y2={toY(0.6)}
                    stroke="#c9b87c" strokeWidth={1.5} strokeDasharray="4,3" />
                  <text x={(toX(R0_plasma) + toX(R0_plasma + a)) / 2} y={toY(0.6) - 8}
                    textAnchor="middle" fill="#c9b87c" fontSize={10}>
                    a = {a}m (minor radius)
                  </text>

                  {/* R axis */}
                  {[0, 0.5, 1.0, 1.5, 2.0].map(R => (
                    <text key={R} x={toX(R)} y={svgH - 10} textAnchor="middle" fill="#5c6a7a" fontSize={10}>
                      {R.toFixed(1)}
                    </text>
                  ))}
                  <text x={svgW / 2} y={svgH - 0} textAnchor="middle" fill="#7a8a9a" fontSize={10}>
                    R (meters from central axis) →
                  </text>

                  {/* Z axis */}
                  {[-1.0, -0.5, 0.0, 0.5, 1.0].map(Z => (
                    <text key={Z} x={pad.l - 10} y={toY(Z) + 4} textAnchor="end" fill="#5c6a7a" fontSize={9}>
                      {Z.toFixed(1)}
                    </text>
                  ))}
                </>
              )}
            </svg>
          </div>

          {/* Explanation */}
          <div style={{ flex: 1, minWidth: 220 }}>
            <div style={{
              padding: 16,
              background: "#12171f",
              borderRadius: 6,
              border: "1px solid #1e2630",
              marginBottom: 12,
            }}>
              <div style={{ fontSize: 10, color: "#4ecdc4", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>
                {view === "topdown" ? "Top-down view" : "Cross-section view"}
              </div>
              <div style={{ fontSize: 12, color: "#8a95a5", lineHeight: 1.9 }}>
                {view === "topdown" ? (
                  <>
                    R is the distance from the center point to anywhere. It's like a radius on a dartboard — measured from the bullseye outward.
                    <br /><br />
                    The donut hole is the space between R=0 and R≈0.6. The central solenoid sits there. No plasma.
                    <br /><br />
                    The plasma lives in a ring between R≈0.76 (inner edge) and R≈1.60 (outer edge). The center of the plasma ring is at R≈1.18.
                    <br /><br />
                    Every R measurement starts from the same center point. R = 0 is NEVER inside the plasma. It's always in the donut hole.
                  </>
                ) : (
                  <>
                    Same thing, different view. Now you're looking at the cross-section (the EQDSK view).
                    <br /><br />
                    The red line on the left is R=0 — the central axis. The orange box is the central solenoid. Everything between R=0 and the plasma is just empty space.
                    <br /><br />
                    The teal shape is the plasma. Its center is at R = 1.18m — that's 1.18 meters away from the central axis.
                    <br /><br />
                    The yellow dashed line shows the minor radius "a" = 0.42m. That's the radius of the plasma itself, measured from the plasma center outward. Don't confuse this with R — they measure from different starting points.
                  </>
                )}
              </div>
            </div>

            <div style={{
              padding: 16,
              background: "#12171f",
              borderRadius: 6,
              border: "1px solid #1e2630",
              marginBottom: 12,
            }}>
              <div style={{ fontSize: 10, color: "#ff6b6b", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>
                Two different "centers" — don't confuse them
              </div>
              <div style={{ fontSize: 12, color: "#8a95a5", lineHeight: 1.9 }}>
                <span style={{ color: "#ff6b6b", fontWeight: 700 }}>R = 0</span> — the central axis of the whole machine. The pole in the middle of the donut hole. Where the central solenoid is. No plasma here ever.
                <br /><br />
                <span style={{ color: "#4ecdc4", fontWeight: 700 }}>R = 1.18m</span> — the center of the plasma (magnetic axis). This is where ψ = 0 and the flux surfaces are nested around. This is 1.18 meters away from R = 0.
                <br /><br />
                When the EQDSK file says rmagx = 1.18, it means "the plasma center is 1.18 meters from the machine center."
              </div>
            </div>

            <div style={{
              padding: 16,
              background: "#12171f",
              borderRadius: 6,
              border: "1px solid #1e2630",
            }}>
              <div style={{ fontSize: 10, color: "#c9b87c", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>
                R vs minor radius
              </div>
              <div style={{ fontSize: 12, color: "#8a95a5", lineHeight: 1.9 }}>
                <span style={{ color: "#c9b87c", fontWeight: 700 }}>R</span> — always measured from R=0 (machine center). The plasma inner edge is at R = 0.76m, outer edge at R = 1.60m.
                <br /><br />
                <span style={{ color: "#c9b87c", fontWeight: 700 }}>a (minor radius)</span> — measured from the plasma center outward. a = 0.42m. This is the "size" of the plasma cross-section.
                <br /><br />
                Inner edge R = 1.18 - 0.42 = 0.76m
                <br />
                Outer edge R = 1.18 + 0.42 = 1.60m
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(WhatIsR));
</script>
<script>window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+='\n'+e.message;});</script>
