const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect,useReducer,useContext,createContext,forwardRef,memo,Fragment,Children,cloneElement} = React;



// Generate realistic 1D profiles
function genProfile(n, type) {
  const arr = [];
  for (let i = 0; i < n; i++) {
    const psiN = i / (n - 1); // 0 to 1
    let val;
    switch (type) {
      case "pressure":
        val = 2.63e6 * Math.pow(1 - psiN * psiN, 2); // Peaked, zero at edge
        break;
      case "fpol":
        val = 5.6 - 0.3 * psiN * psiN; // Slowly decreasing
        break;
      case "ffprime":
        val = -0.6 * psiN * (1 - psiN); // Negative, zero at axis and edge
        break;
      case "pprime":
        val = -5.2e6 * (1 - psiN * psiN); // Negative (pressure decreases outward)
        break;
      case "q":
        val = 0.95 + 0.05 * psiN + 0.5 * psiN * psiN + 2.7 * Math.pow(psiN, 4); // Monotonically increasing
        break;
      default:
        val = 0;
    }
    arr.push(val);
  }
  return arr;
}

// Generate 2D psi grid
function genPsi(nR, nZ) {
  const grid = [];
  const R0 = 1.15, a = 0.42, kappa = 1.75, delta = 0.40;
  const Rmin = 0.60, Rmax = 1.80, Zmin = -1.0, Zmax = 1.0;
  for (let j = 0; j < nZ; j++) {
    const row = [];
    for (let i = 0; i < nR; i++) {
      const R = Rmin + i * (Rmax - Rmin) / (nR - 1);
      const Z = Zmin + j * (Zmax - Zmin) / (nZ - 1);
      const dRn = (R - R0) / a;
      const dZn = Z / (a * kappa);
      const triShift = -delta * dZn * dZn;
      const rhoSq = (dRn - triShift) ** 2 + dZn ** 2;
      const rho = Math.sqrt(rhoSq);
      const psi = Math.min(rho + 0.08 * (R - R0) / a * rhoSq, 2.5);
      // Convert to real units (Weber/rad)
      row.push(psi * 0.85); // scale to ~0.85 Wb/rad at boundary
    }
    grid.push(row);
  }
  return grid;
}

const N = 65;
const pressure = genProfile(N, "pressure");
const fpol = genProfile(N, "fpol");
const ffprime = genProfile(N, "ffprime");
const pprime = genProfile(N, "pprime");
const qpsi = genProfile(N, "q");
const psi2d = genPsi(N, N);

  { name: "zmid", val: "0.000", unit: "m", desc: "Z at middle of grid" },

  { name: "zmagx", val: "0.000", unit: "m", desc: "Z of magnetic axis" },
  { name: "simagx", val: "0.000", unit: "Wb/rad", desc: "ψ at magnetic axis" },
  { name: "sibdry", val: "0.850", unit: "Wb/rad", desc: "ψ at plasma boundary" },

];

const sections = [

    desc: "f = R × B_toroidal at each flux surface. This encodes how the toroidal field varies across the plasma. Slowly decreasing from center to edge because the field is stronger on the inboard side.",

    yLabel: "f = R·Btor",
  },
  {
    id: "pressure",
    label: "pressure(ψ)",
    count: "65 numbers",
    desc: "Plasma pressure at each flux surface in Pascals. Hot and dense in the center (~2.6 MPa), dropping to basically zero at the edge. This is T×n that we talked about.",

  },
  {
    id: "ffprime",

    desc: "f times the derivative of f with respect to ψ. This is one of the two source terms on the right side of the Grad-Shafranov equation. Related to the current distribution.",
    data: ffprime,

  },
  {
    id: "pprime",
    label: "P'(ψ)",

    data: pprime,
    unit: "Pa/(Wb/rad)",
    yLabel: "P'",
  },
  {
    id: "psi2d",
    label: "ψ(R,Z) grid",
    count: "65 × 65 = 4,225 numbers",
    desc: "THE main data. Poloidal magnetic flux at every grid point. This is the 2D map that encodes the entire magnetic geometry. Everything else could technically be derived from this.",
  },
  {
    id: "qpsi",
    label: "q(ψ)",
    count: "65 numbers",
    desc: "Safety factor at each flux surface. Starts near 1 at the center, rises to ~4 at the edge. Tells you how twisted the field lines are — how many long laps per short lap.",
    data: qpsi,
    unit: "",

  },
  {
    id: "boundary",

  },

function MiniPlot({ data, yLabel, unit, color = "#4ecdc4", width = 380, height = 180 }) {
  if (!data) return null;
  const pad = { l: 55, r: 15, t: 10, b: 30 };
  const pw = width - pad.l - pad.r;
  const ph = height - pad.t - pad.b;
  const minV = Math.min(...data);
  const maxV = Math.max(...data);
  const range = maxV - minV || 1;

  const points = data.map((v, i) => {
    const x = pad.l + (i / (data.length - 1)) * pw;
    const y = pad.t + ph - ((v - minV) / range) * ph;
    return `${x},${y}`;
  }).join(" ");

  const formatNum = (v) => {
    if (Math.abs(v) >= 1e5 || (Math.abs(v) < 0.01 && v !== 0)) return v.toExponential(1);
    if (Math.abs(v) >= 100) return v.toFixed(0);
    if (Math.abs(v) >= 1) return v.toFixed(2);
    return v.toFixed(3);
  };

  return (
    <svg width={width} height={height} style={{ display: "block" }}>
      <rect x={pad.l} y={pad.t} width={pw} height={ph} fill="#080c12" stroke="#1e2630" />
      <polyline points={points} fill="none" stroke={color} strokeWidth={2} />
      {/* Y axis labels */}
      <text x={pad.l - 5} y={pad.t + 10} textAnchor="end" fill="#5c6a7a" fontSize={9}>{formatNum(maxV)}</text>
      <text x={pad.l - 5} y={pad.t + ph} textAnchor="end" fill="#5c6a7a" fontSize={9}>{formatNum(minV)}</text>
      <text x={pad.l - 5} y={pad.t + ph / 2 + 3} textAnchor="end" fill="#7a8a9a" fontSize={10}>{yLabel}</text>
      {/* X axis */}
      <text x={pad.l} y={height - 5} fill="#5c6a7a" fontSize={9}>ψ=0 (center)</text>
      <text x={pad.l + pw} y={height - 5} textAnchor="end" fill="#5c6a7a" fontSize={9}>ψ=1 (edge)</text>
      {/* Grid point markers every 16 */}
      {data.filter((_, i) => i % 16 === 0).map((v, idx) => {
        const i = idx * 16;
        const x = pad.l + (i / (data.length - 1)) * pw;
        const y = pad.t + ph - ((v - minV) / range) * ph;
        return <circle key={i} cx={x} cy={y} r={3} fill={color} opacity={0.7} />;
      })}
    </svg>
  );
}

function PsiHeatmap({ grid, width = 380, height = 380 }) {
  const n = grid.length;
  const pad = { l: 35, r: 10, t: 10, b: 30 };
  const pw = width - pad.l - pad.r;
  const ph = height - pad.t - pad.b;
  const cellW = pw / n;
  const cellH = ph / n;

  const maxPsi = 0.85 * 2.5;
  const psiColor = (psi) => {
    const norm = psi / 0.85;
    if (norm > 1.0) {
      const t = Math.min(1, (norm - 1.0) / 1.5);
      return `rgb(${Math.round(10 + t * 5)},${Math.round(15 + t * 5)},${Math.round(25 + t * 10)})`;
    }
    const t = Math.max(0, Math.min(1, norm));
    return `rgb(${Math.round(8 + t * 15)},${Math.round(210 - t * 170)},${Math.round(210 - t * 90)})`;
  };

  // Sample every 4th point for performance
  const step = 2;
  const rects = [];
  for (let j = 0; j < n; j += step) {
    for (let i = 0; i < n; i += step) {
      rects.push(
        <rect
          key={`${i}-${j}`}
          x={pad.l + i * cellW}
          y={pad.t + (n - 1 - j) * cellH}
          width={cellW * step + 1}
          height={cellH * step + 1}
          fill={psiColor(grid[j][i])}
        />
      );
    }
  }

  return (
    <svg width={width} height={height} style={{ display: "block" }}>
      <rect x={pad.l} y={pad.t} width={pw} height={ph} fill="#080c12" />
      {rects}
      <text x={pad.l} y={height - 5} fill="#5c6a7a" fontSize={9}>R=0.6m</text>
      <text x={pad.l + pw} y={height - 5} textAnchor="end" fill="#5c6a7a" fontSize={9}>R=1.8m</text>
      <text x={pad.l - 3} y={pad.t + 10} textAnchor="end" fill="#5c6a7a" fontSize={9}>Z=1.0</text>
      <text x={pad.l - 3} y={pad.t + ph} textAnchor="end" fill="#5c6a7a" fontSize={9}>Z=-1.0</text>
    </svg>
  );
}

function RawNumbers({ data, label, perLine = 5, maxLines = 4 }) {
  if (!data) return null;
  const lines = [];
  for (let i = 0; i < Math.min(data.length, perLine * maxLines); i += perLine) {
    const chunk = data.slice(i, i + perLine);
    lines.push(chunk.map(v => {
      const s = v.toExponential(9).toUpperCase();
      return (v >= 0 ? " " : "") + s.replace("E+", "E+").replace("E-", "E-");
    }).join(""));
  }
  if (data.length > perLine * maxLines) {
    lines.push(`  ... (${data.length - perLine * maxLines} more values)`);
  }
  return (
    <pre style={{
      fontSize: 10,
      color: "#6a8a7a",
      background: "#060a0e",
      padding: "8px 10px",
      borderRadius: 4,
      margin: "8px 0 0 0",
      overflow: "auto",
      lineHeight: 1.5,
    }}>
      <span style={{ color: "#3a5a4a" }}>{'// ' + label + ' (' + data.length + ' values, shown ' + perLine + ' per line)\n'}</span>
      {lines.join("\n")}
    </pre>
  );
}

{` 1.200000000E+00 2.000000000E+00 1.150000000E+00 6.000000000E-01 0.000000000E+00
