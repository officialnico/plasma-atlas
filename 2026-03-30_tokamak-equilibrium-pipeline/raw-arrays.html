<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>raw arrays</title>
<style>html,body{margin:0;background:#0c0d10;color:#e8eaf0;font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif}
#root{min-height:100vh}#err{display:none;white-space:pre-wrap;padding:24px;color:#f0736a;font:13px/1.5 ui-monospace,Menlo,monospace}</style>
<div id="root"></div><pre id="err"></pre>
<script src="../_lib/react/libs-base.js"></script>
<script src="../_lib/react/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect,useReducer,useContext,createContext,forwardRef,memo,Fragment,Children,cloneElement} = React;



function RawArrays() {
  const [selectedCell, setSelectedCell] = useState({ i: 5, j: 6 });
  const [gridLayer, setGridLayer] = useState("psi");
  const [expandedFpol, setExpandedFpol] = useState(null);
  const [expandedPressure, setExpandedPressure] = useState(null);
  const [expandedQ, setExpandedQ] = useState(null);

  // Small grid
  const nR = 9, nZ = 11;
  const Rmin = 0.60, Rmax = 1.80;
  const Zmin = -1.0, Zmax = 1.0;
  const dR = (Rmax - Rmin) / (nR - 1);
  const dZ = (Zmax - Zmin) / (nZ - 1);

  const R0 = 1.18, a = 0.42, kappa = 1.75, delta = 0.40;
  const bcentr = 12.2, rcentr = 1.15;
  const constant = bcentr * rcentr;

  function getPsi(R, Z) {
    const dRn = (R - R0) / a;
    const dZn = Z / (a * kappa);
    const triShift = -delta * dZn * dZn;
    const rhoSq = (dRn - triShift) ** 2 + dZn ** 2;
    return Math.min(Math.sqrt(rhoSq) + 0.08 * (R - R0) / a * rhoSq, 2.5);
  }

  // Build complete grid data
  const gridData = [];
  const psiFlat = []; // The 2D array flattened as stored in file
  for (let j = 0; j < nZ; j++) {
    const row = [];
    for (let i = 0; i < nR; i++) {
      const R = Rmin + i * dR;
      const Z = Zmax - j * dZ;
      const psi = getPsi(R, Z);
      row.push({ R, Z, psi, i, j });
      psiFlat.push(psi);
    }
    gridData.push(row);
  }

  // 1D profiles - 9 values each (matching nR grid points on the psi axis)
  const nProf = nR;
  const profiles = {
    fpol: Array.from({ length: nProf }, (_, k) => {
      const psiN = k / (nProf - 1);
      return constant - 0.4 * psiN * psiN;
    }),
    pressure: Array.from({ length: nProf }, (_, k) => {
      const psiN = k / (nProf - 1);
      return 2.63e6 * Math.pow(1 - psiN * psiN, 2);
    }),
    q: Array.from({ length: nProf }, (_, k) => {
      const psiN = k / (nProf - 1);
      return 0.95 + 0.05 * psiN + 0.5 * psiN * psiN + 2.7 * Math.pow(psiN, 4);
    }),
  };

  // Selected cell info
  const sc = gridData[selectedCell.j][selectedCell.i];
  const flatIdx = selectedCell.j * nR + selectedCell.i;
  const psiN_selected = Math.min(sc.psi, 1.0);
  const profIdx = Math.round(psiN_selected * (nProf - 1));
  const profIdxClamped = Math.min(Math.max(profIdx, 0), nProf - 1);

  // Find all cells on the same flux surface (similar psi)
  const sameSurface = [];
  gridData.forEach((row, j) => row.forEach((cell, i) => {
    if (Math.abs(cell.psi - sc.psi) < 0.08 && !(i === selectedCell.i && j === selectedCell.j)) {
      sameSurface.push({ i, j });
    }
  }));

  const cellW = 38, cellH = 28;

  function fmt(v) {
    if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(2) + "M";
    if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(0) + "k";
    return v.toFixed(2);
  }

  return (
    <div style={{
      fontFamily: "'IBM Plex Mono', monospace",
      background: "#0a0e14",
      color: "#c5cdd9",
      minHeight: "100vh",
      padding: "16px",
      boxSizing: "border-box",
    }}>
      <div style={{ maxWidth: 960, margin: "0 auto" }}>
        <h1 style={{ fontSize: 16, color: "#e6ecf2", margin: "0 0 4px" }}>
          RAW ARRAYS — TAP A CELL, SEE IT IN THE FILE
        </h1>
        <p style={{ fontSize: 10, color: "#5c6a7a", margin: "0 0 12px", letterSpacing: 1 }}>
          2D GRID ON LEFT → RAW ARRAYS ON RIGHT — HIGHLIGHTED WHEN SELECTED
        </p>

        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          {/* Grid */}
          <div>
            <div style={{ fontSize: 10, color: "#4ecdc4", marginBottom: 6, textTransform: "uppercase", letterSpacing: 1 }}>
              The 2D grid — tap a cell
            </div>
            {/* Layer selector */}
            <div style={{ display: "flex", gap: 2, marginBottom: 6, flexWrap: "wrap" }}>
              {[
                { id: "psi", label: "ψ", color: "#4ecdc4" },
                { id: "fpol", label: "fpol", color: "#c9a3f5" },
                { id: "Btor", label: "B_tor", color: "#8ab4f8" },
                { id: "pressure", label: "P", color: "#ff6b6b" },
                { id: "q", label: "q", color: "#4ecdc4" },
              ].map(l => (
                <button key={l.id} onClick={() => setGridLayer(l.id)}
                  style={{
                    padding: "4px 8px", fontSize: 9, fontFamily: "inherit",
                    background: gridLayer === l.id ? "#1a2a3a" : "#12171f",
                    border: `1px solid ${gridLayer === l.id ? l.color : "#1e2630"}`,
                    color: gridLayer === l.id ? l.color : "#5c6a7a",
                    borderRadius: 3, cursor: "pointer",
                    fontWeight: gridLayer === l.id ? 700 : 400,
                  }}
                >
                  {l.label}
                </button>
              ))}
            </div>
            <div style={{
              background: "#0d1117",
              borderRadius: 6,
              border: "1px solid #1e2630",
              padding: 8,
            }}>
              <svg width={nR * cellW + 35} height={nZ * cellH + 25} style={{ display: "block" }}>
                {/* R labels */}
                {Array.from({ length: nR }, (_, i) => (
                  <text key={`r${i}`} x={35 + i * cellW + cellW / 2} y={10}
                    textAnchor="middle" fill="#3a4a5a" fontSize={7}>
                    {(Rmin + i * dR).toFixed(2)}
                  </text>
                ))}
                {/* Z labels */}
                {Array.from({ length: nZ }, (_, j) => (
                  <text key={`z${j}`} x={30} y={20 + j * cellH + cellH / 2 + 3}
                    textAnchor="end" fill="#3a4a5a" fontSize={7}>
                    {(Zmax - j * dZ).toFixed(1)}
                  </text>
                ))}

                {gridData.map((row, j) => row.map((cell, i) => {
                  const x = 35 + i * cellW;
                  const y = 16 + j * cellH;
                  const isSelected = selectedCell.i === i && selectedCell.j === j;
                  const isSameSurface = sameSurface.some(s => s.i === i && s.j === j);
                  const inside = cell.psi <= 1.0;

                  const psiN_cell = Math.min(cell.psi, 1.0);
                  const pidx = Math.min(Math.max(Math.round(psiN_cell * (nProf - 1)), 0), nProf - 1);
                  const cellFpol = profiles.fpol[pidx];
                  const cellBtor = cellFpol / cell.R;
                  const cellPressure = profiles.pressure[pidx];
                  const cellQ = profiles.q[pidx];

                  // Color and text based on selected layer
                  let fill, cellText;
                  if (gridLayer === "psi") {
                    if (cell.psi > 1.0) { fill = "#0d1218"; }
                    else { const t = cell.psi; fill = `rgb(${Math.round(10 + t * 15)},${Math.round(180 - t * 140)},${Math.round(180 - t * 60)})`; }
                    cellText = cell.psi.toFixed(2);
                  } else if (gridLayer === "fpol") {
                    if (!inside) { fill = "#0d1218"; cellText = ""; }
                    else { const t = (cellFpol - 13.5) / 0.6; fill = `rgb(${Math.round(100 + t * 100)},${Math.round(80 + t * 60)},${Math.round(180 + t * 40)})`; cellText = cellFpol.toFixed(2); }
                  } else if (gridLayer === "Btor") {
                    if (!inside) { fill = "#0d1218"; cellText = ""; }
                    else { const t = (cellBtor - 8) / 12; fill = `rgb(${Math.round(40 + t * 200)},${Math.round(60 + (1 - t) * 120)},${Math.round(180 - t * 80)})`; cellText = cellBtor.toFixed(1); }
                  } else if (gridLayer === "pressure") {
                    if (!inside) { fill = "#0d1218"; cellText = ""; }
                    else { const t = cellPressure / 2.63e6; fill = `rgb(${Math.round(30 + t * 225)},${Math.round(40 + (1 - t) * 60)},${Math.round(40 + (1 - t) * 60)})`; cellText = cellPressure >= 1e6 ? (cellPressure / 1e6).toFixed(1) + "M" : cellPressure >= 1e3 ? (cellPressure / 1e3).toFixed(0) + "k" : "0"; }
                  } else if (gridLayer === "q") {
                    if (!inside) { fill = "#0d1218"; cellText = ""; }
                    else { const t = (cellQ - 0.95) / 3.3; fill = `rgb(${Math.round(30 + t * 50)},${Math.round(180 - t * 100)},${Math.round(160 + t * 40)})`; cellText = cellQ.toFixed(1); }
                  }

                  return (
                    <g key={`${i}-${j}`}
                      onClick={() => setSelectedCell({ i, j })}
                      style={{ cursor: "pointer" }}
                    >
                      <rect x={x} y={y} width={cellW - 1} height={cellH - 1}
                        fill={fill}
                        stroke={isSelected ? "#ffffff" : isSameSurface ? "#c9a3f5" : "#1a2030"}
                        strokeWidth={isSelected ? 2 : isSameSurface ? 1.5 : 0.5}
                        rx={2}
                      />
                      <text x={x + cellW / 2} y={y + cellH / 2 + 3}
                        textAnchor="middle"
                        fill={isSelected ? "#ffffff" : inside || gridLayer === "psi" ? "#c0d0e0" : "#2a3040"}
                        fontSize={cellText && cellText.length > 5 ? 7 : 8}
                        fontWeight={isSelected ? 700 : 400}
                      >
                        {cellText}
                      </text>
                    </g>
                  );
                }))}
              </svg>
            </div>
            <div style={{ fontSize: 9, color: "#3a4a5a", marginTop: 4 }}>
              White border = selected · Purple border = same flux surface
            </div>

            {/* Selected cell info */}
            <div style={{
              marginTop: 8, padding: 10,
              background: "#12171f", borderRadius: 4, border: "1px solid #1e2630",
            }}>
              <div style={{ fontSize: 10, color: "#4ecdc4", marginBottom: 6 }}>SELECTED: [{selectedCell.i}, {selectedCell.j}]</div>
              <div style={{ fontSize: 11, color: "#8a95a5", lineHeight: 1.8 }}>
                R = {sc.R.toFixed(3)}m, Z = {sc.Z.toFixed(3)}m
                <br />
                ψ = {sc.psi.toFixed(4)}
                {sc.psi <= 1.0 && <>
                  <br />
                  Profile index: {profIdxClamped} of {nProf - 1}
                  <br />
                  fpol = {profiles.fpol[profIdxClamped].toFixed(3)}
                  <br />
                  B_tor = {profiles.fpol[profIdxClamped].toFixed(3)} / {sc.R.toFixed(3)} = <span style={{ color: "#8ab4f8", fontWeight: 700 }}>{(profiles.fpol[profIdxClamped] / sc.R).toFixed(2)} T</span>
                </>}
              </div>
            </div>
          </div>

          {/* Raw arrays */}
          <div style={{ flex: 1, minWidth: 280 }}>
            {/* PSI flat array */}
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 10, color: "#4ecdc4", marginBottom: 4, textTransform: "uppercase", letterSpacing: 1 }}>
                ψ array — {nR * nZ} values stored in file (5 per line)
              </div>
              <div style={{
                background: "#0d1117", borderRadius: 6, border: "1px solid #1e2630",
                padding: 8, maxHeight: 170, overflowY: "auto",
              }}>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 2 }}>
                  {psiFlat.map((v, idx) => {
                    const isSelected = idx === flatIdx;
                    const cellI = idx % nR;
                    const cellJ = Math.floor(idx / nR);
                    const cellPsi = gridData[cellJ][cellI].psi;
                    const isSameSurface = Math.abs(cellPsi - sc.psi) < 0.08 && !isSelected;
                    // Line break every 5 (Fortran convention)
                    const isLineStart = idx % 5 === 0;

                    return (
                      <span key={idx}
                        onClick={() => setSelectedCell({ i: cellI, j: cellJ })}
                        style={{
                          display: "inline-block",
                          padding: "2px 3px",
                          fontSize: 9,
                          fontWeight: isSelected ? 700 : 400,
                          color: isSelected ? "#ffffff" : isSameSurface ? "#c9a3f5" : "#5c6a7a",
                          background: isSelected ? "#4ecdc4" : isSameSurface ? "rgba(201,163,245,0.1)" : "transparent",
                          borderRadius: 2,
                          cursor: "pointer",
                          minWidth: 38,
                          textAlign: "right",
                        }}
                      >
                        {v.toFixed(2)}
                      </span>
                    );
                  })}
                </div>
                <div style={{ fontSize: 9, color: "#3a4a5a", marginTop: 6 }}>
                  Position {flatIdx} of {psiFlat.length - 1} · Row {selectedCell.j}, Col {selectedCell.i}
                </div>
              </div>
            </div>

            {/* 1D profiles */}
            {[
              { name: "fpol", label: "fpol(ψ)", unit: "T·m", color: "#c9a3f5", data: profiles.fpol,
                simple: "The toroidal magnetic field strength at each surface, pre-multiplied by R so it compresses to 1D. Divide by R at any point to get the actual field strength there.",
                technical: "f = R·B_toroidal. Constant on each flux surface because of axisymmetry. In vacuum it would be flat everywhere (just bcentr × rcentr). The plasma current modifies it by ~2%, and that modification is what EFIT solves for. Its derivative ff' is one of the two source terms in the Grad-Shafranov equation.",
                relevance: "fpol feeds into the gyrokinetic equation as part of the magnetic geometry. GENE needs it to compute the magnetic field direction and strength at every point in the simulation domain. It affects how particles orbit, how turbulence aligns with the field, and how the collision operator (your quantum target) operates. Wrong fpol = wrong field geometry = wrong turbulence prediction.",
              },
              { name: "pressure", label: "P(ψ)", unit: "Pa", color: "#ff6b6b", data: profiles.pressure,
                simple: "How hard the plasma pushes outward at each surface. Temperature × density = pressure. Hot dense center pushes hard. Cool sparse edge barely pushes at all.",
                technical: "Total plasma pressure in Pascals: P = n_e·T_e + n_i·T_i. Its derivative P'(ψ) is the other source term in the Grad-Shafranov equation. The pressure gradient drives the outward force that the magnetic field must balance. Higher pressure gradients also drive the turbulent instabilities that GENE simulates.",
                relevance: "The pressure gradient is THE driver of turbulence. The steeper the gradient (faster pressure drop from center to edge), the stronger the turbulent transport. When GENE computes turbulent heat flux, it's computing how much the pressure gradient drives eddies that leak heat outward. The collision operator affects how those eddies dissipate. So pressure → gradients → turbulence drive → collision operator handles the dissipation → your quantum target.",
              },
              { name: "q", label: "q(ψ)", unit: "", color: "#4ecdc4", data: profiles.q,
                simple: "How twisted the magnetic field lines are. A field line at q=2 goes around the donut twice the long way before completing one loop the short way. Low q at center (~1), high q at edge (~4).",
                technical: "The safety factor. q = number of toroidal transits per poloidal transit for a field line. Determined by the ratio of toroidal to poloidal field. Rational surfaces (q = 1, 3/2, 2) are special — MHD instabilities and tearing modes localize there. The q profile shape (shear) strongly affects turbulence stability.",
                relevance: "q determines the magnetic geometry that the gyrokinetic simulation runs in. The twist of field lines (magnetic shear, related to how q changes with radius) is one of the main things that stabilizes or destabilizes turbulence. GENE uses q to construct its field-aligned coordinate system. The collision operator operates in velocity space on each flux surface, and the surface geometry (set by q) determines how particles are trapped and scattered. Different q profiles → different trapped particle fractions → different collision physics → directly affects what your quantum collision operator needs to compute.",
              },
            ].map(prof => {
              const isInside = sc.psi <= 1.0;
              const expanded = prof.name === "fpol" ? expandedFpol : prof.name === "pressure" ? expandedPressure : expandedQ;
              const setExpanded = prof.name === "fpol" ? setExpandedFpol : prof.name === "pressure" ? setExpandedPressure : setExpandedQ;
              return (
                <div key={prof.name} style={{ marginBottom: 10 }}>
                  <div style={{ fontSize: 10, color: prof.color, marginBottom: 4, textTransform: "uppercase", letterSpacing: 1 }}>
                    {prof.label} — {nProf} values (1D)
                  </div>
                  <div style={{
                    background: "#0d1117", borderRadius: 6, border: "1px solid #1e2630",
                    padding: 8,
                  }}>
                    <div style={{ display: "flex", gap: 2, flexWrap: "wrap" }}>
                      {prof.data.map((v, idx) => {
                        const isSelected = isInside && idx === profIdxClamped;
                        return (
                          <div key={idx} style={{
                            padding: "3px 4px",
                            fontSize: 9,
                            color: isSelected ? "#ffffff" : "#5c6a7a",
                            background: isSelected ? prof.color : "transparent",
                            borderRadius: 2,
                            fontWeight: isSelected ? 700 : 400,
                            minWidth: 42,
                            textAlign: "right",
                          }}>
                            {fmt(v)}
                          </div>
                        );
                      })}
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
                      <span style={{ fontSize: 8, color: "#3a4a5a" }}>ψ=0 (center)</span>
                      <span style={{ fontSize: 8, color: "#3a4a5a" }}>ψ=1 (edge)</span>
                    </div>
                    {isInside && (
                      <div style={{ fontSize: 9, color: prof.color, marginTop: 4 }}>
                        → Index {profIdxClamped}: {fmt(prof.data[profIdxClamped])} {prof.unit}
                        {prof.name === "fpol" && (
                          <span style={{ color: "#8ab4f8" }}>
                            {" "}→ B = {fmt(prof.data[profIdxClamped])} / {sc.R.toFixed(2)} = {(prof.data[profIdxClamped] / sc.R).toFixed(2)} T
                          </span>
                        )}
                      </div>
                    )}
                    {!isInside && (
                      <div style={{ fontSize: 9, color: "#3a4a5a", marginTop: 4 }}>
                        Selected point is outside plasma — profiles don't apply
                      </div>
                    )}

                    {/* Explainer buttons */}
                    <div style={{ display: "flex", gap: 3, marginTop: 8 }}>
                      {[
                        { id: "simple", label: "Simple", icon: "💡" },
                        { id: "technical", label: "Technical", icon: "🔧" },
                        { id: "relevance", label: "Why it matters for us", icon: "⚡" },
                      ].map(btn => (
                        <button key={btn.id}
                          onClick={() => setExpanded(expanded === btn.id ? null : btn.id)}
                          style={{
                            padding: "4px 8px",
                            fontSize: 8,
                            fontFamily: "inherit",
                            background: expanded === btn.id ? `${prof.color}20` : "#0a0e14",
                            border: `1px solid ${expanded === btn.id ? prof.color : "#1e2630"}`,
                            color: expanded === btn.id ? prof.color : "#5c6a7a",
                            borderRadius: 3,
                            cursor: "pointer",
                          }}
                        >
                          {btn.icon} {btn.label}
                        </button>
                      ))}
                    </div>

                    {/* Expanded explanation */}
                    {expanded && (
                      <div style={{
                        marginTop: 6,
                        padding: "8px 10px",
                        background: expanded === "relevance" ? "rgba(78,205,196,0.05)" : "#0a0e14",
                        borderRadius: 4,
                        borderLeft: `2px solid ${expanded === "relevance" ? "#4ecdc4" : prof.color}`,
                        fontSize: 10,
                        color: "#8a95a5",
                        lineHeight: 1.8,
                      }}>
                        {expanded === "simple" && prof.simple}
                        {expanded === "technical" && prof.technical}
                        {expanded === "relevance" && (
                          <>
                            <span style={{ color: "#4ecdc4", fontWeight: 700, fontSize: 9, textTransform: "uppercase", letterSpacing: 1 }}>
                              Connection to quantum collision operator
                            </span>
                            <br />
                            {prof.relevance}
                          </>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}

            {/* The connection */}
            <div style={{
              padding: 10, background: "rgba(78,205,196,0.05)",
              borderRadius: 6, border: "1px solid rgba(78,205,196,0.15)",
            }}>
              <div style={{ fontSize: 10, color: "#4ecdc4", marginBottom: 4 }}>HOW THEY CONNECT</div>
              <div style={{ fontSize: 10, color: "#7a8a9a", lineHeight: 1.8 }}>
                1. You pick a grid point → it has a ψ value ({sc.psi.toFixed(2)})
                <br />
                2. That ψ maps to index {profIdxClamped} in the 1D arrays
                <br />
                3. All {sameSurface.length + 1} grid points with ψ ≈ {sc.psi.toFixed(2)} map to the SAME index
                <br />
                4. So they all get the same fpol, same pressure, same q
                <br />
                5. B_toroidal differs because each point has different R
              </div>
            </div>

            {/* WHY R×B COMPRESSES — concrete demo */}
            {sc.psi <= 1.0 && (
              <div style={{
                marginTop: 10, padding: 10, background: "#12171f",
                borderRadius: 6, border: "1px solid #c9a3f5",
              }}>
                <div style={{ fontSize: 10, color: "#c9a3f5", marginBottom: 8, textTransform: "uppercase", letterSpacing: 1 }}>
                  Why R × B compresses to 1D — with your selected surface
                </div>

                <div style={{ fontSize: 10, color: "#5c6a7a", marginBottom: 8, lineHeight: 1.7 }}>
                  These are all points on the same flux surface (ψ ≈ {sc.psi.toFixed(2)}). 
                  Each point is at a different R, so B_toroidal is different everywhere.
                  But watch what happens when you multiply B × R:
                </div>

                <div style={{
                  background: "#0a0e14", borderRadius: 4, padding: 8,
                  fontFamily: "inherit",
                }}>
                  {/* Header */}
                  <div style={{
                    display: "flex", gap: 4, marginBottom: 6, paddingBottom: 4,
                    borderBottom: "1px solid #1e2630",
                  }}>
                    <span style={{ flex: 1, fontSize: 8, color: "#5c6a7a", textAlign: "center" }}>Point</span>
                    <span style={{ flex: 1, fontSize: 8, color: "#5c6a7a", textAlign: "center" }}>R</span>
                    <span style={{ flex: 1, fontSize: 8, color: "#8ab4f8", textAlign: "center" }}>B_tor</span>
                    <span style={{ flex: 1, fontSize: 8, color: "#5c6a7a", textAlign: "center" }}></span>
                    <span style={{ flex: 1, fontSize: 8, color: "#c9a3f5", textAlign: "center" }}>R × B</span>
                  </div>

                  {/* Selected point */}
                  {(() => {
                    const fpolVal = profiles.fpol[profIdxClamped];
                    const Btor = fpolVal / sc.R;
                    return (
                      <div style={{
                        display: "flex", gap: 4, alignItems: "center", padding: "3px 0",
                        background: "rgba(255,255,255,0.05)", borderRadius: 2, marginBottom: 2,
                      }}>
                        <span style={{ flex: 1, fontSize: 9, color: "#ffffff", textAlign: "center", fontWeight: 700 }}>Selected</span>
                        <span style={{ flex: 1, fontSize: 9, color: "#e6ecf2", textAlign: "center" }}>{sc.R.toFixed(3)}</span>
                        <span style={{ flex: 1, fontSize: 9, color: "#8ab4f8", textAlign: "center", fontWeight: 700 }}>{Btor.toFixed(2)}</span>
                        <span style={{ flex: 1, fontSize: 9, color: "#3a4a5a", textAlign: "center" }}>=</span>
                        <span style={{ flex: 1, fontSize: 9, color: "#c9a3f5", textAlign: "center", fontWeight: 700 }}>{fpolVal.toFixed(2)}</span>
                      </div>
                    );
                  })()}

                  {/* Same-surface points */}
                  {sameSurface.slice(0, 6).map((s, idx) => {
                    const cell = gridData[s.j][s.i];
                    const psiN_s = Math.min(cell.psi, 1.0);
                    const pidx_s = Math.min(Math.max(Math.round(psiN_s * (nProf - 1)), 0), nProf - 1);
                    const fpolVal = profiles.fpol[pidx_s];
                    const Btor = fpolVal / cell.R;
                    return (
                      <div key={idx} style={{
                        display: "flex", gap: 4, alignItems: "center", padding: "3px 0",
                        borderBottom: idx < Math.min(sameSurface.length, 6) - 1 ? "1px solid #1a2030" : "none",
                      }}>
                        <span style={{ flex: 1, fontSize: 9, color: "#5c6a7a", textAlign: "center" }}>[{s.i},{s.j}]</span>
                        <span style={{ flex: 1, fontSize: 9, color: "#8a95a5", textAlign: "center" }}>{cell.R.toFixed(3)}</span>
                        <span style={{ flex: 1, fontSize: 9, color: "#8ab4f8", textAlign: "center" }}>{Btor.toFixed(2)}</span>
                        <span style={{ flex: 1, fontSize: 9, color: "#3a4a5a", textAlign: "center" }}>=</span>
                        <span style={{ flex: 1, fontSize: 9, color: "#c9a3f5", textAlign: "center" }}>{fpolVal.toFixed(2)}</span>
                      </div>
                    );
                  })}
                </div>

                <div style={{ marginTop: 8, fontSize: 10, lineHeight: 1.8 }}>
                  <span style={{ color: "#8ab4f8" }}>B_toroidal</span>
                  <span style={{ color: "#5c6a7a" }}> — all different (</span>
                  <span style={{ color: "#8ab4f8" }}>
                    {(() => {
                      const fpolVal = profiles.fpol[profIdxClamped];
                      const allB = [fpolVal / sc.R, ...sameSurface.slice(0, 6).map(s => {
                        const cell = gridData[s.j][s.i];
                        const psiN_s = Math.min(cell.psi, 1.0);
                        const pidx_s = Math.min(Math.max(Math.round(psiN_s * (nProf - 1)), 0), nProf - 1);
                        return profiles.fpol[pidx_s] / cell.R;
                      })];
                      return `${Math.min(...allB).toFixed(1)} to ${Math.max(...allB).toFixed(1)}`;
                    })()}
                  </span>
                  <span style={{ color: "#5c6a7a" }}>) → need 4,225 numbers to store</span>
                  <br />
                  <span style={{ color: "#c9a3f5" }}>R × B</span>
                  <span style={{ color: "#5c6a7a" }}> — all the same (</span>
                  <span style={{ color: "#c9a3f5", fontWeight: 700 }}>{profiles.fpol[profIdxClamped].toFixed(2)}</span>
                  <span style={{ color: "#5c6a7a" }}>) → only need 65 numbers to store</span>
                </div>

                <div style={{
                  marginTop: 8, padding: "6px 8px",
                  background: "rgba(201,163,245,0.08)", borderRadius: 4,
                  fontSize: 10, color: "#c9a3f5", lineHeight: 1.7,
                }}>
                  That's the compression. B varies wildly across the grid. But B×R is the same on each surface. Store B×R (65 numbers) instead of B (4,225 numbers). When you need B at a specific point, just divide by that point's R.
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(RawArrays));
</script>
<script>window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+='\n'+e.message;});</script>
