<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>profiles on cross</title>
<style>html,body{margin:0;background:#0c0d10;color:#e8eaf0;font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif}
#root{min-height:100vh}#err{display:none;white-space:pre-wrap;padding:24px;color:#f0736a;font:13px/1.5 ui-monospace,Menlo,monospace}</style>
<div id="root"></div><pre id="err"></pre>
<script src="../_lib/react/libs-base.js"></script>
<script src="../_lib/react/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect,useReducer,useContext,createContext,forwardRef,memo,Fragment,Children,cloneElement} = React;



// Profile generators
function genProfiles(n) {
  const profiles = { pressure: [], fpol: [], ffprime: [], pprime: [], q: [] };
  for (let i = 0; i < n; i++) {
    const psiN = i / (n - 1);
    profiles.pressure.push(2.63e6 * Math.pow(1 - psiN * psiN, 2));
    profiles.fpol.push(5.6 - 0.3 * psiN * psiN);
    profiles.ffprime.push(-0.6 * psiN * (1 - psiN));
    profiles.pprime.push(-5.2e6 * (1 - psiN * psiN));
    profiles.q.push(0.95 + 0.05 * psiN + 0.5 * psiN * psiN + 2.7 * Math.pow(psiN, 4));
  }
  return profiles;
}

const N = 65;
const profiles = genProfiles(N);

const profileInfo = [
  {
    id: "pressure",
    label: "P(ψ) — Pressure",
    unit: "Pascals",
    color: "#ff6b6b",
    desc: "How hard the plasma pushes outward at each flux surface. Highest in the center (hot + dense), drops to zero at the edge. This is T×n — temperature times density.",
    data: profiles.pressure,
  },
  {
    id: "fpol",
    label: "f(ψ) = R·Btoroidal",
    unit: "T·m",
    color: "#8ab4f8",
    desc: "The toroidal field function. R times the toroidal magnetic field at each flux surface. In vacuum this would be constant (because B falls as 1/R and multiplying by R cancels it out). The slight decrease from center to edge shows the plasma current modifying the vacuum field.",
    data: profiles.fpol,
  },
  {
    id: "pprime",
    label: "P'(ψ) — Pressure derivative",
    unit: "Pa/(Wb/rad)",
    color: "#ff9f43",
    desc: "How fast pressure changes per unit of ψ. This is one of the two source terms in the Grad-Shafranov equation — it tells EFIT how much outward force the pressure gradient creates. Negative because pressure DECREASES as ψ increases (moving outward).",
    data: profiles.pprime,
  },
  {
    id: "ffprime",
    label: "ff'(ψ) — Current-related",
    unit: "T²·m²/(Wb/rad)",
    color: "#c9a3f5",
    desc: "f times the derivative of f. The other source term in the Grad-Shafranov equation. Encodes how the plasma current is distributed across flux surfaces. Together with P', this completely determines the right-hand side of the equilibrium equation.",
    data: profiles.ffprime,
  },
  {
    id: "q",
    label: "q(ψ) — Safety factor",
    unit: "(dimensionless)",
    color: "#4ecdc4",
    desc: "How many times a field line goes the long way around the donut before completing one short-way loop. q ≈ 1 at center, rising to ~4 at the edge. Surfaces where q is a simple fraction (1, 3/2, 2) are special — instabilities like to live there.",
    data: profiles.q,
  },
];

function ProfilesOnCrossSection() {
  const [activeProfile, setActiveProfile] = useState("pressure");
  const [hoveredPsiN, setHoveredPsiN] = useState(null);

  const profile = profileInfo.find(p => p.id === activeProfile);

  // Cross section geometry
  const svgW = 480, svgH = 480;
  const padCS = { l: 10, r: 10, t: 10, b: 10 };
  const csW = svgW - padCS.l - padCS.r;
  const csH = svgH - padCS.t - padCS.b;
  const Rmin = 0.55, Rmax = 1.85, Zmin = -1.1, Zmax = 1.1;
  const toX = (R) => padCS.l + ((R - Rmin) / (Rmax - Rmin)) * csW;
  const toY = (Z) => padCS.t + ((Zmax - Z) / (Zmax - Zmin)) * csH;

  const R0 = 1.18, a = 0.42, kappa = 1.75, delta = 0.40;
  const asin_d = Math.asin(delta);

  function getContour(psiN, nPts = 150) {
    const pts = [];
    for (let t = 0; t <= nPts; t++) {
      const theta = (2 * Math.PI * t) / nPts;
      const r = a * psiN;
      const R = R0 + r * Math.cos(theta + asin_d * Math.sin(theta));
      const Z = kappa * r * Math.sin(theta);
      pts.push({ R, Z });
    }
    return pts;
  }

  function contourPath(psiN) {
    const pts = getContour(psiN);
    return pts.map((p, i) => `${i === 0 ? "M" : "L"} ${toX(p.R)} ${toY(p.Z)}`).join(" ") + " Z";
  }

  // All 65 surfaces — one per stored profile value
  const surfaceLevels = Array.from({ length: 64 }, (_, i) => (i + 1) / 64);

  // Wall
  const wallPath = useMemo(() => {
    const pts = [];
    for (let t = 0; t <= 200; t++) {
      const theta = (2 * Math.PI * t) / 200;
      const R = R0 + 0.55 * Math.cos(theta + asin_d * Math.sin(theta));
      const Z = 0.95 * Math.sin(theta);
      pts.push(`${toX(R)},${toY(Z)}`);
    }
    return pts.join(" ");
  }, []);

  // Get profile value at a given psiN
  function getValueAt(psiN) {
    const idx = psiN * (N - 1);
    const lo = Math.floor(idx);
    const hi = Math.min(lo + 1, N - 1);
    const frac = idx - lo;
    return profile.data[lo] * (1 - frac) + profile.data[hi] * frac;
  }

  // Profile value coloring on surfaces
  function surfaceColor(psiN) {
    const val = getValueAt(psiN);
    const minV = Math.min(...profile.data);
    const maxV = Math.max(...profile.data);
    const range = maxV - minV || 1;
    const t = (val - minV) / range;

    // Parse the profile color and blend
    const hex = profile.color;
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${0.1 + t * 0.6})`;
  }

  // Format number for display
  function fmt(v) {
    if (Math.abs(v) >= 1e5 || (Math.abs(v) < 0.01 && v !== 0)) return v.toExponential(2);
    if (Math.abs(v) >= 100) return v.toFixed(0);
    if (Math.abs(v) >= 1) return v.toFixed(2);
    return v.toFixed(4);
  }

  // Profile chart dimensions
  const chartW = 400, chartH = 160;
  const chartPad = { l: 65, r: 15, t: 15, b: 30 };
  const cpW = chartW - chartPad.l - chartPad.r;
  const cpH = chartH - chartPad.t - chartPad.b;

  const minV = Math.min(...profile.data);
  const maxV = Math.max(...profile.data);
  const rangeV = maxV - minV || 1;
  const chartToX = (psiN) => chartPad.l + psiN * cpW;
  const chartToY = (v) => chartPad.t + cpH - ((v - minV) / rangeV) * cpH;

  const profileLine = profile.data.map((v, i) => {
    const psiN = i / (N - 1);
    return `${i === 0 ? "M" : "L"} ${chartToX(psiN)} ${chartToY(v)}`;
  }).join(" ");

  return (
    <div style={{
      fontFamily: "'IBM Plex Mono', monospace",
      background: "#0a0e14",
      color: "#c5cdd9",
      minHeight: "100vh",
      padding: "20px",
      boxSizing: "border-box",
    }}>
      <div style={{ maxWidth: 960, margin: "0 auto" }}>
        <h1 style={{ fontSize: 18, color: "#e6ecf2", margin: "0 0 4px" }}>
          1D PROFILES ON THE CROSS-SECTION
        </h1>
        <p style={{ fontSize: 11, color: "#5c6a7a", margin: "0 0 16px", letterSpacing: 1 }}>
          EACH PROFILE IS ONE VALUE PER FLUX SURFACE — HOVER SURFACES TO READ VALUES
        </p>

        {/* Profile selector */}
        <div style={{ display: "flex", gap: 3, marginBottom: 16, flexWrap: "wrap" }}>
          {profileInfo.map(p => (
            <button
              key={p.id}
              onClick={() => setActiveProfile(p.id)}
              style={{
                padding: "8px 12px",
                background: activeProfile === p.id ? "#1a2a3a" : "#12171f",
                border: `1px solid ${activeProfile === p.id ? p.color : "#1e2630"}`,
                borderRadius: 4,
                color: activeProfile === p.id ? p.color : "#5c6a7a",
                fontSize: 10, fontFamily: "inherit", cursor: "pointer",
                fontWeight: activeProfile === p.id ? 700 : 400,
              }}
            >
              {p.label.split(" — ")[0]}
            </button>
          ))}
        </div>

        <div style={{ display: "flex", gap: 20, flexWrap: "wrap" }}>
          {/* Cross section with colored surfaces */}
          <div style={{
            background: "#0d1117",
            borderRadius: 6,
            border: "1px solid #1e2630",
            padding: 10,
            flexShrink: 0,
          }}>
            <svg width={svgW} height={svgH} style={{ display: "block" }}>
              <rect x={padCS.l} y={padCS.t} width={csW} height={csH} fill="#060a0e" />

              {/* Wall */}
              <polygon points={wallPath} fill="none" stroke="rgba(255,255,255,0.12)" strokeWidth={2.5} />

              {/* Filled flux surfaces from outside in */}
              {[...surfaceLevels].reverse().map(psiN => (
                <path
                  key={psiN}
                  d={contourPath(psiN)}
                  fill={surfaceColor(psiN)}
                  stroke="none"
                />
              ))}

              {/* Surface hit targets (wide invisible paths for easy hover/tap) */}
              {surfaceLevels.map(psiN => {
                const isHovered = hoveredPsiN !== null && Math.abs(psiN - hoveredPsiN) < 0.002;
                const isBoundary = Math.abs(psiN - 1.0) < 0.001;
                return (
                  <g key={`o${psiN}`}>
                    {/* Invisible wide hit target */}
                    <path
                      d={contourPath(psiN)}
                      fill="none"
                      stroke="transparent"
                      strokeWidth={8}
                      style={{ cursor: "pointer" }}
                      onMouseEnter={() => setHoveredPsiN(psiN)}
                      onMouseLeave={() => setHoveredPsiN(null)}
                      onClick={() => setHoveredPsiN(hoveredPsiN === psiN ? null : psiN)}
                    />
                    {/* Visible thin line */}
                    <path
                      d={contourPath(psiN)}
                      fill="none"
                      stroke={isHovered ? "#ffffff" : isBoundary ? profile.color : `rgba(255,255,255,0.08)`}
                      strokeWidth={isHovered ? 2.5 : isBoundary ? 2 : 0.3}
                      pointerEvents="none"
                    />
                  </g>
                );
              })}

              {/* Magnetic axis */}
              <circle cx={toX(R0)} cy={toY(0)} r={4} fill="none" stroke="#e6ecf2" strokeWidth={1.5} />
              <circle cx={toX(R0)} cy={toY(0)} r={1.5} fill="#e6ecf2" />

              {/* Hovered surface value label */}
              {hoveredPsiN !== null && (
                <>
                  {/* Value label on the surface */}
                  {(() => {
                    const pts = getContour(hoveredPsiN);
                    const rightmost = pts.reduce((a, b) => b.R > a.R ? b : a);
                    const val = getValueAt(hoveredPsiN);
                    return (
                      <g>
                        <rect
                          x={toX(rightmost.R) + 6} y={toY(rightmost.Z) - 22}
                          width={130} height={38} rx={4}
                          fill="#1a2a3a" stroke={profile.color} opacity={0.95}
                        />
                        <text x={toX(rightmost.R) + 12} y={toY(rightmost.Z) - 7}
                          fill="#8a95a5" fontSize={9}>
                          ψ = {hoveredPsiN.toFixed(2)}
                        </text>
                        <text x={toX(rightmost.R) + 12} y={toY(rightmost.Z) + 8}
                          fill={profile.color} fontSize={12} fontWeight={700}>
                          {fmt(val)} {profile.unit === "(dimensionless)" ? "" : profile.unit.split("/")[0]}
                        </text>
                      </g>
                    );
                  })()}
                </>
              )}

              {/* Key annotations */}
              <text x={toX(R0)} y={toY(0) + 18} textAnchor="middle" fill="#5c6a7a" fontSize={9}>
                ψ = 0
              </text>
              <text x={toX(R0 + a) + 8} y={toY(0) + 4} fill="#5c6a7a" fontSize={9}>
                ψ = 1
              </text>

              {/* Color legend */}
              <text x={padCS.l + 8} y={padCS.t + 15} fill={profile.color} fontSize={10} fontWeight={700}>
                {profile.label.split(" — ")[1] || profile.label.split(" — ")[0]}
              </text>
              <text x={padCS.l + 8} y={padCS.t + 28} fill="#5c6a7a" fontSize={9}>
                Bright = high value · Dark = low value
              </text>
            </svg>
          </div>

          {/* Right panel: chart + info */}
          <div style={{ flex: 1, minWidth: 250 }}>
            {/* Profile chart */}
            <div style={{
              padding: 12,
              background: "#12171f",
              borderRadius: 6,
              border: "1px solid #1e2630",
              marginBottom: 12,
            }}>
              <svg width={chartW} height={chartH} style={{ display: "block", maxWidth: "100%" }}>
                <rect x={chartPad.l} y={chartPad.t} width={cpW} height={cpH} fill="#080c12" stroke="#1e2630" />

                {/* Profile line */}
                <path d={profileLine} fill="none" stroke={profile.color} strokeWidth={2} />

                {/* Hovered point */}
                {hoveredPsiN !== null && (
                  <>
                    <line
                      x1={chartToX(hoveredPsiN)} y1={chartPad.t}
                      x2={chartToX(hoveredPsiN)} y2={chartPad.t + cpH}
                      stroke="rgba(255,255,255,0.3)" strokeWidth={1} strokeDasharray="3,3"
                    />
                    <circle
                      cx={chartToX(hoveredPsiN)}
                      cy={chartToY(getValueAt(hoveredPsiN))}
                      r={5} fill={profile.color}
                    />
                    <text
                      x={chartToX(hoveredPsiN) + 8}
                      y={chartToY(getValueAt(hoveredPsiN)) - 5}
                      fill="#e6ecf2" fontSize={10} fontWeight={700}
                    >
                      {fmt(getValueAt(hoveredPsiN))}
                    </text>
                  </>
                )}

                {/* Axes */}
                <text x={chartPad.l - 5} y={chartPad.t + 10} textAnchor="end" fill="#5c6a7a" fontSize={8}>{fmt(maxV)}</text>
                <text x={chartPad.l - 5} y={chartPad.t + cpH} textAnchor="end" fill="#5c6a7a" fontSize={8}>{fmt(minV)}</text>
                <text x={chartPad.l} y={chartH - 5} fill="#5c6a7a" fontSize={9}>ψ=0</text>
                <text x={chartPad.l + cpW} y={chartH - 5} textAnchor="end" fill="#5c6a7a" fontSize={9}>ψ=1</text>
                <text x={chartPad.l + cpW / 2} y={chartH - 5} textAnchor="middle" fill="#3a4a5a" fontSize={9}>center → edge</text>
              </svg>
            </div>

            {/* Profile description */}
            <div style={{
              padding: 16,
              background: "#12171f",
              borderRadius: 6,
              border: `1px solid ${profile.color}33`,
              marginBottom: 12,
            }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: profile.color, marginBottom: 6 }}>
                {profile.label}
              </div>
              <div style={{ fontSize: 10, color: "#5c6a7a", marginBottom: 8 }}>
                {profile.unit}
              </div>
              <div style={{ fontSize: 12, color: "#8a95a5", lineHeight: 1.8 }}>
                {profile.desc}
              </div>
            </div>

            {/* Key values table */}
            <div style={{
              padding: 16,
              background: "#12171f",
              borderRadius: 6,
              border: "1px solid #1e2630",
              marginBottom: 12,
            }}>
              <div style={{ fontSize: 10, color: "#4ecdc4", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>
                Values at key locations
              </div>
              {[
                { psiN: 0, label: "Magnetic axis (ψ=0)" },
                { psiN: 0.25, label: "Inner core (ψ=0.25)" },
                { psiN: 0.5, label: "Mid-radius (ψ=0.5)" },
                { psiN: 0.75, label: "Outer core (ψ=0.75)" },
                { psiN: 1.0, label: "Boundary (ψ=1.0)" },
              ].map(({ psiN, label }) => {
                const val = getValueAt(psiN);
                const isHovered = hoveredPsiN !== null && Math.abs(psiN - hoveredPsiN) < 0.06;
                return (
                  <div key={psiN} style={{
                    display: "flex",
                    justifyContent: "space-between",
                    padding: "4px 0",
                    borderBottom: "1px solid #1a2030",
                    background: isHovered ? `${profile.color}11` : "transparent",
                  }}>
                    <span style={{ fontSize: 11, color: "#5c6a7a" }}>{label}</span>
                    <span style={{ fontSize: 11, color: profile.color, fontWeight: 600 }}>{fmt(val)}</span>
                  </div>
                );
              })}
            </div>

            {/* The key insight */}
            <div style={{
              padding: 16,
              background: "rgba(78,205,196,0.05)",
              borderRadius: 6,
              border: "1px solid rgba(78,205,196,0.15)",
            }}>
              <div style={{ fontSize: 10, color: "#4ecdc4", textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>
                Key concept
              </div>
              <div style={{ fontSize: 12, color: "#8a95a5", lineHeight: 1.7 }}>
                You're looking at all 64 flux surfaces stored in the file (ψ = 1/64, 2/64, ... 64/64). Each surface is one ring with one value. 65 values total including the axis at ψ=0. The value is constant everywhere on a given surface — pressure at the top equals pressure at the bottom on the same ring. That's why 1D profiles work.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ProfilesOnCrossSection));
</script>
<script>window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+='\n'+e.message;});</script>
