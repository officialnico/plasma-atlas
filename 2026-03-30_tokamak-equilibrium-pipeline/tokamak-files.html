  {

    plain: "This describes where every magnet coil is and how much current it carries. Each row is one coil. That's it. The whole magnetic cage holding a 100-million-degree plasma is described by ~30 rows in a CSV.",

  },
  {
    id: "wall",
    name: "Wall Contour",
    stage: "Stage 1 → feeds into Stage 2",
    plain: "The inner wall of the vacuum vessel — the physical boundary the plasma can't cross. Just a list of (R,Z) points that trace the outline. Like connecting the dots to draw the wall shape.",
    note: "Because the tokamak is a donut, you only need the 2D cross-section. Spin this shape around the central axis and you get the full 3D wall.",
    format: "Plain text — list of (R,Z) coordinate pairs",
    content: `# First wall / limiter contour
# Just (R,Z) points tracing the wall outline
# in meters. Connect the dots = wall shape.
#
# R(m)    Z(m)

 1.680    0.000`,
  },
  {
    id: "eqdsk",
    name: "G-EQDSK (the big one)",
    stage: "Output of Stage 2 → Input to everything else",
    plain: "This is THE file. The entire magnetic shape of the plasma — where every magnetic field line goes, what shape the plasma is, how twisted the field is — all packed into one ASCII text file. Every code downstream reads this. It's ugly old Fortran formatting but it's the universal language of tokamak physics.",
    note: "The key thing in here is the 2D grid of psi values — that's a map of magnetic flux. From that one 2D array you can derive the shape of every nested donut surface the plasma sits on.",
    format: ".geqdsk — ASCII text, Fortran fixed-width columns",
    content: `  EFITD    03/15/2026    #184802  3500ms        3  65  65
   0.170000000E+01  0.170000000E+01  0.122000000E+01  0.810000000E+00
   0.000000000E+00  0.100000000E+01  0.000000000E+00  0.100000000E+01
   0.000000000E+00
  ^^^ LINE 1: code name, date, shot#, time, grid size (65x65)
  ^^^ LINE 2-3: geometry params (R_center, grid_width, R_magnetic_axis, etc)

  [THEN: 65 values of f = R*B_toroidal across the plasma]
   0.560000000E+01  0.559800000E+01  0.559200000E+01  0.558200000E+01  0.556800000E+01
   0.555000000E+01  0.552800000E+01  0.550200000E+01  ...
   ^^^ This tells you the toroidal field strength at each flux surface

  [THEN: 65 values of pressure across the plasma]  
   0.350000000E+06  0.348000000E+06  0.342000000E+06  0.332000000E+06  0.318000000E+06
   0.300000000E+06  0.278000000E+06  0.252000000E+06  ...
   ^^^ Pressure in Pascals from center to edge — same info as the profile file but now mapped to flux coordinates

  [THEN: 65x65 = 4225 values of poloidal flux psi(R,Z)]
   0.000000000E+00  0.120000000E-02  0.480000000E-02  0.108000000E-01  0.192000000E-01
   0.300000000E-01  0.432000000E-01  0.588000000E-01  ...
   ^^^ THIS IS THE CORE DATA
   ^^^ A 2D heatmap of magnetic flux
   ^^^ Contour lines of this = the nested donut surfaces the plasma lives on
   ^^^ From this single 2D array you derive ALL the magnetic geometry

  [THEN: 65 values of safety factor q]
   0.950000000E+00  0.960000000E+00  0.990000000E+00  0.104000000E+01  0.112000000E+01
   0.124000000E+01  0.141000000E+01  0.165000000E+01  ...
   ^^^ How many times a field line goes around the long way 
   ^^^ before it comes back to where it started going the short way
   ^^^ q=1 means once around each way. q=3 means 3 laps the long way per 1 short way.

  [THEN: plasma boundary points and wall/limiter points]
      89   25
   0.120000000E+01  0.850000000E+00  0.121000000E+01  0.848000000E+00  ...
   ^^^ (R,Z) pairs tracing the plasma edge and wall`,
  },
  {
    id: "gene_input",
    name: "GENE Input File",
    stage: "Stage 5 — setting up the turbulence simulation",
    plain: "This is the control file for GENE. It tells the code: what species are in the plasma, what resolution to use, what physics to include, what collision model to run. It's a Fortran namelist — basically a config file with named parameters.",
    note: "The collision operator choice (collision_op) is where your quantum replacement would plug in. Everything else stays the same.",
    format: "Fortran namelist (.in)",
    content: `&parallelization
n_procs_s = 2       ! processors for species dimension
n_procs_v = 4       ! processors for velocity dimension  
n_procs_w = 2       ! processors for mu dimension
n_procs_x = 8       ! processors for radial dimension
n_procs_y = 1       ! processors for binormal dimension
n_procs_z = 4       ! processors for parallel dimension
/

&box
n_spec  = 3          ! number of species (deuterium, tritium, electrons)
nx0     = 192        ! radial grid points
nky0    = 64         ! binormal modes  
nz0     = 24         ! parallel grid points
nv0     = 48         ! parallel velocity grid points
nw0     = 16         ! magnetic moment grid points
/
! ^^^ So the total grid is 192 × 64 × 24 × 48 × 16 = 5.7 BILLION points
! ^^^ ...and you need to time-step this for thousands of steps
! ^^^ THIS is why it costs millions of CPU-hours

&in_out
diagdir = '/scratch/gene_run_042/output/'
read_checkpoint = .F.
istep_nrg = 10       ! write energy diagnostics every 10 steps
istep_field = 100    ! write field snapshots every 100 steps  
/

&general
nonlinear  = .T.     ! yes, include the nonlinear turbulence term
electromagnetic = .T. ! include magnetic fluctuations  
bpar       = .T.     ! include parallel B perturbations
collision_op = 'landau' 
! ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
! THIS IS WHERE YOUR QUANTUM CODE PLUGS IN
! Replace 'landau' with your quantum collision operator
! Everything else in this file stays exactly the same
! ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
beta       = 0.025   ! plasma pressure / magnetic pressure
/

&species
name   = 'deuterium'
mass   = 2.0         ! in units of proton mass
charge = 1.0         ! in units of proton charge  
temp   = 1.0         ! temperature normalized to reference
dens   = 0.5         ! density (50% of total ions)
omt    = 8.5         ! -R/T * dT/dr  (temperature gradient — drives turbulence!)
omn    = 2.2         ! -R/n * dn/dr  (density gradient)
/

&species
name   = 'tritium'
mass   = 3.0
charge = 1.0
temp   = 1.0
dens   = 0.5         ! other 50% of ions
omt    = 8.5
omn    = 2.2
/

&species
name   = 'electron'
mass   = 0.000272    ! electron mass / proton mass
charge = -1.0
temp   = 1.0
dens   = 1.0         ! quasi-neutrality: n_e = n_D + n_T
omt    = 8.5
omn    = 2.2
/`,
  },
  {
    id: "gene_output",
    name: "GENE Output — The Answer",
    stage: "Stage 5 output → feeds into Stage 6",
    plain: "After burning millions of CPU-hours, this is what you get: how much heat is leaking out of the plasma due to turbulence. It's a time series — the flux bounces around chaotically and you take the average. That average number is what the transport solver needs.",
    note: "All that compute, all that complexity, ultimately produces a handful of numbers: the time-averaged heat flux for each species. Those few numbers are worth millions of dollars in compute.",
    format: "HDF5 (.h5) or ASCII time traces (.dat)",
    content: `# GENE output: nrg file (energy/flux diagnostics)
# Each row = one timestep
# Columns (per species):
#   time | Q_es (electrostatic heat flux) | Q_em (electromagnetic) | Gamma (particle flux)
#
# Flux units: "gyro-Bohm" units (normalized)
# Multiply by n*T*c_s*rho_s^2/a^2 to get MW/m²
#
# time      Q_es_deut   Q_em_deut   Gamma_deut  Q_es_trit   Q_em_trit  ...
  0.000     0.0000      0.0000      0.0000      0.0000      0.0000
  0.500     0.0012      0.0001      0.0003      0.0011      0.0001
  1.000     0.0287      0.0032      0.0071      0.0265      0.0029
  ...
  # (turbulence grows exponentially at first)
  ...
  50.000    4.2310      0.3812      0.9523      3.9870      0.3590
  50.500    5.1892      0.4201      1.1045      4.8901      0.3961
  51.000    3.8710      0.3102      0.8234      3.6420      0.2918
  51.500    6.0123      0.5034      1.3201      5.6612      0.4738
  52.000    4.5670      0.3890      0.9876      4.2980      0.3661
  ...
  # (saturated turbulence — chaotic fluctuations around a mean)
  # 
  # FINAL ANSWER after averaging from t=30 to t=200:
  # <Q_deuterium> = 4.82 ± 0.45 (gyro-Bohm units)
  # <Q_tritium>   = 4.54 ± 0.42
  # <Q_electron>  = 6.21 ± 0.58
  #
  # ^ THESE FEW NUMBERS are what Stage 6 needs
  # ^ This is what millions of CPU-hours produced`,
  },
  {
    id: "gacode",
    name: "input.gacode (all-in-one profiles)",
    stage: "Used by CGYRO / GACODE suite",
    plain: "This is the GACODE suite's way of bundling ALL the plasma profile info into one file. Instead of separate files for temperature, density, etc., everything goes here. It's what CGYRO reads.",
    note: "This is basically a more organized version of having separate profile files. One file, all species, all quantities.",
    format: "Structured text file",
    content: `# input.gacode — all plasma profiles in one file

#

  },

function FileViewer() {
  const [active, setActive] = useState("profiles");
  const current = files.find((f) => f.id === active);

  return (
    <div style={{
      fontFamily: "'IBM Plex Mono', 'SF Mono', monospace",
      background: "#0a0e14",
      color: "#c5cdd9",
      minHeight: "100vh",
      padding: "20px",
      boxSizing: "border-box",
    }}>
      <div style={{ maxWidth: 900, margin: "0 auto" }}>
        <h1 style={{ fontSize: 18, color: "#e6ecf2", margin: "0 0 4px 0", fontWeight: 700 }}>
          WHAT THE FILES ACTUALLY LOOK LIKE
        </h1>
        <p style={{ fontSize: 11, color: "#5c6a7a", margin: "0 0 20px 0", letterSpacing: 1, textTransform: "uppercase" }}>
          Real data formats in the tokamak simulation pipeline
        </p>

        {/* File tabs */}
        <div style={{ display: "flex", gap: 3, flexWrap: "wrap", marginBottom: 20 }}>
          {files.map((f) => (
            <button
              key={f.id}
              onClick={() => setActive(f.id)}
              style={{
                padding: "8px 12px",
                background: active === f.id ? "#1a2a3a" : "#12171f",
                border: active === f.id ? "1px solid #4ecdc4" : "1px solid #1e2630",
                borderRadius: 4,
                color: active === f.id ? "#4ecdc4" : "#5c6a7a",
                fontSize: 11,
                fontFamily: "inherit",
                cursor: "pointer",
                fontWeight: active === f.id ? 700 : 400,
              }}
            >
              {f.name}
            </button>
          ))}
        </div>

        {current && (
          <div>
            {/* Header */}
            <div style={{
              padding: "16px 20px",
              background: "#1a2a3a",
              borderRadius: "6px 6px 0 0",
              borderLeft: "3px solid #4ecdc4",
            }}>
              <div style={{ fontSize: 16, fontWeight: 700, color: "#4ecdc4" }}>
                {current.name}
              </div>
              <div style={{ fontSize: 11, color: "#5c6a7a", marginTop: 4 }}>
                {current.stage} — Format: {current.format}
              </div>
            </div>

            {/* Plain English */}
            <div style={{
              padding: "16px 20px",
              background: "#12171f",
              borderLeft: "3px solid #2a3a4a",
            }}>
              <div style={{ fontSize: 13, lineHeight: 1.7, color: "#a0aab8" }}>
                {current.plain}
              </div>
              <div style={{
                fontSize: 12,
                lineHeight: 1.6,
                color: "#7a8a9a",
                marginTop: 10,
                padding: "10px 14px",
                background: "#0a0e14",
                borderRadius: 4,
                borderLeft: "2px solid #3a4a5a",
              }}>
                {current.note}
              </div>
            </div>

            {/* The actual file content */}
            <div style={{
              padding: "16px 20px",
              background: "#080c12",
              borderRadius: "0 0 6px 6px",
              border: "1px solid #1e2630",
              borderTop: "none",
              overflowX: "auto",
            }}>
              <div style={{
                fontSize: 10,
                color: "#5c6a7a",
                textTransform: "uppercase",
                letterSpacing: 1,
                marginBottom: 10,
              }}>
                What the file actually looks like
              </div>
              <pre style={{
                fontSize: 12,
                lineHeight: 1.6,
                color: "#8ab4f8",
                margin: 0,
                whiteSpace: "pre-wrap",
                wordBreak: "break-all",
              }}>
                {current.content}
              </pre>
            </div>
          </div>
        )}

        {/* Flow summary */}
        <div style={{
          marginTop: 24,
          padding: 16,
          background: "#12171f",
          borderRadius: 6,
          border: "1px solid #1e2630",
          fontSize: 12,
          color: "#7a8a9a",
          lineHeight: 1.8,
        }}>
          <span style={{ color: "#4ecdc4", fontWeight: 700 }}>The data flow in plain English: </span>
          Temperature/density text files + coil CSV + wall points → EFIT solves the force balance → spits out one EQDSK file with the full magnetic map → that EQDSK feeds into GENE along with a config file → GENE burns millions of CPU-hours → produces a time series of heat flux numbers → transport solver reads those numbers and adjusts the profiles → loop repeats until stable.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(FileViewer));
</script>
<script>window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+='\n'+e.message;});</script>
