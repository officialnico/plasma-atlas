const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect,useReducer,useContext,createContext,forwardRef,memo,Fragment,Children,cloneElement} = React;



// Robust LaTeX rendering: poll for KaTeX availability, re-render on every change

let katexLoadPromise = null;
function loadKaTeX() {
  if (katexLoadPromise) return katexLoadPromise;
  katexLoadPromise = new Promise((resolve) => {
    if (window.katex) { resolve(); return; }
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css";
    document.head.appendChild(link);
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js";
    script.onload = () => resolve();
    script.onerror = () => {
      // Fallback to MathJax if KaTeX fails
      const mjScript = document.createElement("script");
      mjScript.src = "https://cdn.jsdelivr.net/npm/[email protected]/es5/tex-mml-chtml.js";
      mjScript.onload = () => resolve();
      document.head.appendChild(mjScript);
    };
    document.head.appendChild(script);
  });
  return katexLoadPromise;
}

function Tex({ children, display = false }) {
  const ref = useRef(null);
  const [ready, setReady] = useState(!!window.katex);

  useEffect(() => {
    loadKaTeX().then(() => setReady(true));
  }, []);

  useEffect(() => {
    if (!ready || !ref.current) return;
    if (window.katex) {
      try {
        window.katex.render(children, ref.current, {
          displayMode: display,
          throwOnError: false,
          output: "html",
          trust: false,
          strict: false
        });
      } catch (e) {
        ref.current.textContent = children;
      }
    } else {
      ref.current.textContent = children;
    }
  }, [children, display, ready]);

  return <span ref={ref} className="tex-render" style={{ display: display ? "block" : "inline" }}>{!ready ? children : null}</span>;
}

        <div className="display" style={{ fontSize: 20, fontStyle: "italic", color: "#ffd166", marginBottom: 10 }}>
          The big idea
        </div>
        <div style={{ fontSize: 14, color: "#e8e8ee", lineHeight: 1.65 }}>
          Charge comes in two flavors: <span style={{ color: "#ffd166" }}>positive (+)</span> and <span style={{ color: "#3ec6c2" }}>negative (−)</span>. Charges don't pull on each other directly across empty space — instead, each charge creates an <em>electric field</em> in the space around it, and that field pushes other charges.
        </div>
        <div className="formula-display">
          <Tex display>{"\\vec{F} = q\\vec{E}"}</Tex>
        </div>
        <div style={{ fontSize: 13, color: "#b0b0bc", lineHeight: 1.6 }}>
          The field <Tex>{"\\vec{E}"}</Tex> at any point tells you exactly which way and how hard a charge <Tex>{"q"}</Tex> placed there will be pushed.

      </div>

      <CoulombDemo />
      <FieldFromChargeDemo />
      <TwoChargesDemo />
      <GaussDemo />

      <div className="viz-card" style={{ background: "#0d0d18" }}>
        <div className="display" style={{ fontSize: 18, fontStyle: "italic", color: "#ffd166", marginBottom: 10 }}>

        </div>
        <div style={{ fontSize: 13, color: "#b0b0bc", lineHeight: 1.7 }}>
          Charges create electric fields <Tex>{"\\vec{E}"}</Tex> in the space around them.<br/>
          The field at a point is force-per-unit-charge: <Tex>{"\\vec{F} = q\\vec{E}"}</Tex>.<br/>
          Coulomb's law: the field from a point charge falls off as <Tex>{"1/r^2"}</Tex>.<br/>

function CoulombDemo() {
  const [q1, setQ1] = useState(1);
  const [q2, setQ2] = useState(1);
  const [r, setR] = useState(2);
  const F = (q1 * q2) / (r * r);

  return (
    <div className="viz-card">
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        COULOMB'S LAW
      </div>
      <div className="formula-display">
        <Tex display>{"F = \\frac{k \\, q_1 q_2}{r^2}"}</Tex>
      </div>
      <div style={{ fontSize: 13, color: "#b0b0bc", marginBottom: 12, lineHeight: 1.55 }}>
        The force between two point charges. Same sign → repulsive; opposite sign → attractive. Falls off as <Tex>{"1/r^2"}</Tex>.
      </div>
      <svg width="100%" viewBox="0 0 480 160" style={{ background: "#08080d", borderRadius: 4 }}>
        <circle cx={100} cy={80} r={14} fill={q1 > 0 ? "#ffd166" : "#3ec6c2"} stroke="#0a0a0f" strokeWidth="2" />
        <text x={100} y={85} fontSize="14" fill="#0a0a0f" textAnchor="middle" fontWeight="700">{q1 > 0 ? "+" : "−"}</text>
        <text x={100} y={50} fontSize="11" fill="#b0b0bc" textAnchor="middle">{`q₁ = ${q1 >= 0 ? "+" : ""}${q1.toFixed(2)}`}</text>

        <circle cx={100 + r * 60} cy={80} r={14} fill={q2 > 0 ? "#ffd166" : "#3ec6c2"} stroke="#0a0a0f" strokeWidth="2" />
        <text x={100 + r * 60} y={85} fontSize="14" fill="#0a0a0f" textAnchor="middle" fontWeight="700">{q2 > 0 ? "+" : "−"}</text>
        <text x={100 + r * 60} y={50} fontSize="11" fill="#b0b0bc" textAnchor="middle">{`q₂ = ${q2 >= 0 ? "+" : ""}${q2.toFixed(2)}`}</text>

        <line x1={100} y1={110} x2={100 + r * 60} y2={110} stroke="#666" strokeWidth="1" />
        <text x={100 + r * 30} y={130} fontSize="11" fill="#888" textAnchor="middle">{`r = ${r.toFixed(2)}`}</text>

        {Math.abs(F) > 0.001 && (() => {
          const arrowLen = Math.min(80, Math.abs(F) * 60);
          const dir = F > 0 ? 1 : -1;
          return (
            <g>
              <line x1={100 - 16} y1={80} x2={100 - 16 - dir * arrowLen} y2={80} stroke="#ff5c3a" strokeWidth="2" markerEnd="url(#fhead)" />
              <line x1={100 + r * 60 + 16} y1={80} x2={100 + r * 60 + 16 + dir * arrowLen} y2={80} stroke="#ff5c3a" strokeWidth="2" markerEnd="url(#fhead)" />
            </g>
          );
        })()}

        <defs>
          <marker id="fhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <polygon points="0 0, 6 3, 0 6" fill="#ff5c3a" />
          </marker>
        </defs>
      </svg>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14, marginTop: 14 }}>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>q₁</span><span style={{ color: "#fff" }}>{q1 >= 0 ? "+" : ""}{q1.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="-2" max="2" step="0.01" value={q1} onChange={e => setQ1(parseFloat(e.target.value))} />
        </div>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>q₂</span><span style={{ color: "#fff" }}>{q2 >= 0 ? "+" : ""}{q2.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="-2" max="2" step="0.01" value={q2} onChange={e => setQ2(parseFloat(e.target.value))} />
        </div>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>distance r</span><span style={{ color: "#fff" }}>{r.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="0.5" max="5" step="0.01" value={r} onChange={e => setR(parseFloat(e.target.value))} />
        </div>
      </div>

      <div className="formula-block">
        <Tex>{`F = \\frac{q_1 q_2}{r^2} = \\frac{(${q1.toFixed(2)})(${q2.toFixed(2)})}{(${r.toFixed(2)})^2} = ${F.toFixed(3)}`}</Tex>
        <div style={{ fontSize: 12, color: F > 0.01 ? "#ff5c3a" : F < -0.01 ? "#3ec6c2" : "#888", marginTop: 6 }}>
          {F > 0.01 && "repulsive — pushing apart"}
          {F < -0.01 && "attractive — pulling together"}
          {Math.abs(F) <= 0.01 && "approximately zero"}
        </div>
      </div>
    </div>
  );
}

function FieldFromChargeDemo() {
  const [Q, setQ] = useState(1);
  const [showField, setShowField] = useState(true);
  const [showLines, setShowLines] = useState(true);
  const W = 480, H = 280;
  const cx = W/2, cy = H/2;

  const arrows = [];
  const grid = 7;
  for (let i = -grid; i <= grid; i++) {
    for (let j = -Math.floor(grid * 0.55); j <= Math.floor(grid * 0.55); j++) {
      const x = i * 30, y = j * 30;
      if (x === 0 && y === 0) continue;
      const r2 = x * x + y * y;
      if (r2 < 400) continue;
      const r = Math.sqrt(r2);
      const mag = Q / r2 * 800;
      const len = Math.min(20, Math.abs(mag));
      const dir = Q > 0 ? 1 : -1;
      arrows.push({
        x1: cx + x - dir * (x / r) * len * 0.5,
        y1: cy + y - dir * (y / r) * len * 0.5,
        x2: cx + x + dir * (x / r) * len * 0.5,
        y2: cy + y + dir * (y / r) * len * 0.5
      });
    }
  }

  return (
    <div className="viz-card">
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        ELECTRIC FIELD AROUND A POINT CHARGE
      </div>
      <div className="formula-display">
        <Tex display>{"\\vec{E}(\\vec{r}) = \\frac{kq}{r^2}\\hat{r}"}</Tex>
      </div>
      <div style={{ fontSize: 13, color: "#b0b0bc", marginBottom: 12, lineHeight: 1.55 }}>
        A charge creates a field <em>everywhere</em> in space. Each arrow shows the force a small positive test charge would feel.
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ background: "#08080d", borderRadius: 4 }}>
        {showField && arrows.map((a, i) => (
          <line key={i} x1={a.x1} y1={a.y1} x2={a.x2} y2={a.y2} stroke="#7af0a8" strokeWidth="1.2" markerEnd="url(#earrow)" opacity="0.7" />
        ))}
        {showLines && [0, 1, 2, 3].map(i => (
          <circle key={i} cx={cx} cy={cy} r={(i + 1) * 30} fill="none" stroke="#7af0a8" strokeOpacity={0.15} strokeDasharray="2,3" />
        ))}
        <circle cx={cx} cy={cy} r="14" fill={Q > 0 ? "#ffd166" : "#3ec6c2"} stroke="#0a0a0f" strokeWidth="2" />
        <text x={cx} y={cy + 5} fontSize="16" fill="#0a0a0f" textAnchor="middle" fontWeight="700">{Q > 0 ? "+" : "−"}</text>
        <defs>
          <marker id="earrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
            <polygon points="0 0, 5 2.5, 0 5" fill="#7af0a8" />
          </marker>
        </defs>
      </svg>
      <div style={{ display: "grid", gridTemplateColumns: "1fr auto auto", gap: 14, marginTop: 12, alignItems: "center" }}>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>charge Q</span><span style={{ color: "#fff" }}>{Q >= 0 ? "+" : ""}{Q.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="-2" max="2" step="0.01" value={Q} onChange={e => setQ(parseFloat(e.target.value))} />
        </div>
        <button className={`control-btn ${showField ? "active" : ""}`} onClick={() => setShowField(s => !s)}>field</button>
        <button className={`control-btn ${showLines ? "active" : ""}`} onClick={() => setShowLines(s => !s)}>circles</button>
      </div>
    </div>
  );
}

function TwoChargesDemo() {
  const [q1, setQ1] = useState(1);
  const [q2, setQ2] = useState(-1);
  const W = 520, H = 280;
  const c1x = 160, c1y = H/2;
  const c2x = 360, c2y = H/2;
  const arrows = [];
  for (let i = 0; i < 16; i++) {
    for (let j = 0; j < 9; j++) {
      const px = (i + 0.5) * (W / 16);
      const py = (j + 0.5) * (H / 9);
      const r1x = px - c1x, r1y = py - c1y;
      const r1_2 = r1x * r1x + r1y * r1y;
      if (r1_2 < 200) continue;
      const r1 = Math.sqrt(r1_2);
      const E1x = q1 * r1x / (r1_2 * r1) * 1000;
      const E1y = q1 * r1y / (r1_2 * r1) * 1000;
      const r2x = px - c2x, r2y = py - c2y;
      const r2_2 = r2x * r2x + r2y * r2y;
      if (r2_2 < 200) continue;
      const r2 = Math.sqrt(r2_2);
      const E2x = q2 * r2x / (r2_2 * r2) * 1000;
      const E2y = q2 * r2y / (r2_2 * r2) * 1000;
      const Ex = E1x + E2x, Ey = E1y + E2y;
      const Emag = Math.sqrt(Ex*Ex + Ey*Ey);
      if (Emag < 0.3 || Emag > 30) continue;
      const len = Math.min(16, Emag * 1.5);
      arrows.push({ px, py, ux: Ex/Emag, uy: Ey/Emag, len });
    }
  }

  return (
    <div className="viz-card">
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        SUPERPOSITION
      </div>
      <div className="formula-display">
        <Tex display>{"\\vec{E}_{\\rm total} = \\vec{E}_1 + \\vec{E}_2"}</Tex>
      </div>
      <div style={{ fontSize: 13, color: "#b0b0bc", marginBottom: 12, lineHeight: 1.55 }}>
        E fields from multiple charges add as vectors. Try +/+ vs +/− to see different patterns.
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ background: "#08080d", borderRadius: 4 }}>
        {arrows.map((a, i) => (
          <line key={i}
            x1={a.px - a.ux * a.len/2} y1={a.py - a.uy * a.len/2}
            x2={a.px + a.ux * a.len/2} y2={a.py + a.uy * a.len/2}
            stroke="#7af0a8" strokeWidth="1.2" markerEnd="url(#earrow2)" opacity="0.7"
          />
        ))}
        <circle cx={c1x} cy={c1y} r="14" fill={q1 > 0 ? "#ffd166" : "#3ec6c2"} stroke="#0a0a0f" strokeWidth="2" />
        <text x={c1x} y={c1y + 5} fontSize="16" fill="#0a0a0f" textAnchor="middle" fontWeight="700">{q1 > 0 ? "+" : "−"}</text>
        <circle cx={c2x} cy={c2y} r="14" fill={q2 > 0 ? "#ffd166" : "#3ec6c2"} stroke="#0a0a0f" strokeWidth="2" />
        <text x={c2x} y={c2y + 5} fontSize="16" fill="#0a0a0f" textAnchor="middle" fontWeight="700">{q2 > 0 ? "+" : "−"}</text>
        <defs>
          <marker id="earrow2" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
            <polygon points="0 0, 5 2.5, 0 5" fill="#7af0a8" />
          </marker>
        </defs>
      </svg>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginTop: 12 }}>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>q₁ (left)</span><span style={{ color: "#fff" }}>{q1 >= 0 ? "+" : ""}{q1.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="-2" max="2" step="0.01" value={q1} onChange={e => setQ1(parseFloat(e.target.value))} />
        </div>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>q₂ (right)</span><span style={{ color: "#fff" }}>{q2 >= 0 ? "+" : ""}{q2.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="-2" max="2" step="0.01" value={q2} onChange={e => setQ2(parseFloat(e.target.value))} />
        </div>
      </div>
    </div>
  );
}

function ParticlePathDemo() {
  const [E, setE] = useState({ x: 0.3, y: 0 });
  const [B, setB] = useState(1);
  const stateRef = useRef({ x: 100, y: 120, vx: 1, vy: 0 });
  const trailRef = useRef([]);
  const [, setTick] = useState(0);
  const lastFrameRef = useRef(performance.now());

  useEffect(() => {
    let raf;
    const loop = (now) => {
      const dt = Math.min(0.04, (now - lastFrameRef.current) / 1000);
      lastFrameRef.current = now;
      const s = stateRef.current;
      const Fx = E.x + s.vy * B;
      const Fy = E.y - s.vx * B;
      s.vx += Fx * dt;
      s.vy += Fy * dt;
      s.x += s.vx * dt * 30;
      s.y += s.vy * dt * 30;
      if (s.x < 20) s.x = 460;
      if (s.x > 460) s.x = 20;
      if (s.y < 20) s.y = 220;
      if (s.y > 220) s.y = 20;
      trailRef.current.push({ x: s.x, y: s.y });
      if (trailRef.current.length > 200) trailRef.current.shift();
      setTick(t => t + 1);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [E.x, E.y, B]);

  const W = 480, H = 240;
  const s = stateRef.current;

  return (
    <div className="viz-card">
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        FREE-FORM EXPLORER
      </div>
      <div className="formula-display">
        <Tex display>{"m\\frac{d\\vec{v}}{dt} = q(\\vec{E} + \\vec{v} \\times \\vec{B})"}</Tex>
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ background: "#08080d", borderRadius: 4 }}>
        {[0.15, 0.4, 0.65, 0.9].map((fy, j) => (

          ))
        ))}
        {trailRef.current.map((p, i) => (
          <circle key={i} cx={p.x} cy={p.y} r={1.5} fill="#ffd166" opacity={i / trailRef.current.length} />
        ))}
        <circle cx={s.x} cy={s.y} r="5" fill="#ffd166" />
      </svg>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14, marginTop: 12 }}>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>E_x</span><span style={{ color: "#fff" }}>{E.x.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="-1" max="1" step="0.01" value={E.x} onChange={e => setE({...E, x: parseFloat(e.target.value)})} />
        </div>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>E_y</span><span style={{ color: "#fff" }}>{E.y.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="-1" max="1" step="0.01" value={E.y} onChange={e => setE({...E, y: parseFloat(e.target.value)})} />
        </div>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>B</span><span style={{ color: "#fff" }}>{B.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="-2" max="2" step="0.01" value={B} onChange={e => setB(parseFloat(e.target.value))} />
        </div>
      </div>
      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        <button className="control-btn" onClick={() => { setE({x: 0.3, y: 0}); setB(0); }}>E only</button>
        <button className="control-btn" onClick={() => { setE({x: 0, y: 0}); setB(1); }}>B only</button>
        <button className="control-btn" onClick={() => { setE({x: 0.3, y: 0}); setB(1); }}>E×B drift</button>
      </div>
    </div>
  );
}

function Maxwell() {
  return (
    <div>
      <div className="section-num">SECTION 4</div>
      <h2 className="section-header">Maxwell's four equations</h2>
      <div style={{ fontSize: 13, color: "#b0b0bc", marginBottom: 20, lineHeight: 1.6 }}>
        Now you know E, B, and the Lorentz force. Maxwell's equations are the rules for how E and B themselves behave.
      </div>

      <div className="viz-card" style={{ background: "#0d0d18" }}>
        <div className="display" style={{ fontSize: 18, fontStyle: "italic", color: "#ffd166", marginBottom: 14, textAlign: "center" }}>
          The four equations
        </div>
        <div style={{ display: "grid", gap: 14 }}>
          <div>
            <div className="formula-display"><Tex display>{"\\nabla \\cdot \\vec{E} = \\frac{\\rho}{\\epsilon_0}"}</Tex></div>
            <div style={{ fontSize: 12, color: "#888", textAlign: "center" }}>Gauss · charges create E</div>
          </div>
          <div>
            <div className="formula-display"><Tex display>{"\\nabla \\cdot \\vec{B} = 0"}</Tex></div>
            <div style={{ fontSize: 12, color: "#888", textAlign: "center" }}>No monopoles</div>
          </div>
          <div>
            <div className="formula-display"><Tex display>{"\\nabla \\times \\vec{E} = -\\frac{\\partial \\vec{B}}{\\partial t}"}</Tex></div>
            <div style={{ fontSize: 12, color: "#888", textAlign: "center" }}>Faraday · changing B creates circulating E</div>
          </div>
          <div>
            <div className="formula-display"><Tex display>{"\\nabla \\times \\vec{B} = \\mu_0 \\vec{J} + \\mu_0 \\epsilon_0 \\frac{\\partial \\vec{E}}{\\partial t}"}</Tex></div>
            <div style={{ fontSize: 12, color: "#888", textAlign: "center" }}>Ampère-Maxwell · currents AND changing E create circulating B</div>
          </div>
        </div>
      </div>

      <FaradayDemo />
      <AmpereDemo />
      <EMWaveDemo />

      <div className="viz-card" style={{ background: "#0d0d18", borderLeft: "2px solid #ff5c3a" }}>
        <div className="display" style={{ fontSize: 18, fontStyle: "italic", color: "#ff5c3a", marginBottom: 10 }}>
          Now back to Vlasov
        </div>
        <div className="formula-display">
          <Tex display>{"\\frac{\\partial f_s}{\\partial t} + \\vec{v} \\cdot \\nabla_x f_s + \\frac{q_s}{m_s}(\\vec{E} + \\vec{v} \\times \\vec{B}) \\cdot \\nabla_v f_s = 0"}</Tex>
        </div>
        <div className="formula-display">
          <Tex display>{"\\rho = \\sum_s q_s \\int f_s \\, d^3v, \\quad \\vec{J} = \\sum_s q_s \\int \\vec{v} f_s \\, d^3v"}</Tex>
        </div>
        <div style={{ fontSize: 13, color: "#b0b0bc", lineHeight: 1.6, marginTop: 10 }}>
          Plus Maxwell's four equations. Self-consistent loop.
        </div>
      </div>
    </div>
  );
}

function FaradayDemo() {
  const [t, setT] = useState(0);
  const [amp, setAmp] = useState(0.5);
  useEffect(() => {
    let raf;
    let last = performance.now();
    const tick = (now) => {
      setT(prev => prev + (now - last) / 1000);
      last = now;
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  const W = 520, H = 260;
  const Bsize = 35 + amp * 30 * Math.sin(t * 1.5);
  const dBdt = amp * 30 * 1.5 * Math.cos(t * 1.5);

  return (
    <div className="viz-card">
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        FARADAY
      </div>
      <div className="formula-display">
        <Tex display>{"\\nabla \\times \\vec{E} = -\\frac{\\partial \\vec{B}}{\\partial t}"}</Tex>
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ background: "#08080d", borderRadius: 4 }}>
        <circle cx={W/2} cy={H/2} r={Bsize} fill="#9d8def" fillOpacity="0.3" stroke="#9d8def" strokeWidth="2" />
        <text x={W/2} y={H/2 + 5} fontSize="14" fill="#fff" textAnchor="middle">B(t)</text>
        {[80, 110, 140].map((r, i) => {
          const arrowAngle = (dBdt > 0 ? -1 : 1) * t * 0.5 + i * 0.3;
          const ax = W/2 + r * Math.cos(arrowAngle);
          const ay = H/2 + r * Math.sin(arrowAngle);
          const ax2 = W/2 + r * Math.cos(arrowAngle + (dBdt > 0 ? -0.3 : 0.3));
          const ay2 = H/2 + r * Math.sin(arrowAngle + (dBdt > 0 ? -0.3 : 0.3));
          return (
            <g key={i}>
              <circle cx={W/2} cy={H/2} r={r} fill="none" stroke="#7af0a8" strokeOpacity={0.4 - i * 0.1} strokeDasharray="3,3" />
              <line x1={ax} y1={ay} x2={ax2} y2={ay2} stroke="#7af0a8" strokeWidth="2" markerEnd="url(#fda)" />
            </g>
          );
        })}
        <defs>
          <marker id="fda" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <polygon points="0 0, 6 3, 0 6" fill="#7af0a8" />
          </marker>
        </defs>
      </svg>
      <div style={{ marginTop: 12 }}>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
          <span>oscillation amplitude</span><span style={{ color: "#fff" }}>{amp.toFixed(2)}</span>
        </div>
        <input className="smooth-slider" type="range" min="0" max="1" step="0.01" value={amp} onChange={e => setAmp(parseFloat(e.target.value))} />
      </div>
    </div>
  );
}

function AmpereDemo() {
  const [I, setI] = useState(1);
  const [t, setT] = useState(0);
  useEffect(() => {
    let raf;
    let last = performance.now();
    const tick = (now) => {
      setT(prev => prev + (now - last) / 1000);
      last = now;
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  const W = 520, H = 260;

  return (
    <div className="viz-card">
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        AMPÈRE-MAXWELL
      </div>
      <div className="formula-display">
        <Tex display>{"\\nabla \\times \\vec{B} = \\mu_0 \\vec{J} + \\mu_0 \\epsilon_0 \\frac{\\partial \\vec{E}}{\\partial t}"}</Tex>
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ background: "#08080d", borderRadius: 4 }}>
        <line x1={W/2} y1={H - 20} x2={W/2} y2={20} stroke="#ffd166" strokeWidth={3 + Math.abs(I) * 4} markerEnd={I > 0 ? "url(#aja)" : undefined} markerStart={I < 0 ? "url(#aja2)" : undefined} />
        {[60, 95, 130].map((r, i) => {
          const arrowAngle = I > 0 ? -t * 0.6 + i * 0.4 : t * 0.6 + i * 0.4;
          const ax = W/2 + r * Math.cos(arrowAngle);
          const ay = H/2 + r * Math.sin(arrowAngle) * 0.4;
          const ax2 = W/2 + r * Math.cos(arrowAngle + (I > 0 ? -0.3 : 0.3));
          const ay2 = H/2 + r * Math.sin(arrowAngle + (I > 0 ? -0.3 : 0.3)) * 0.4;
          return (
            <g key={i}>
              <ellipse cx={W/2} cy={H/2} rx={r} ry={r * 0.4} fill="none" stroke="#9d8def" strokeOpacity={0.4 - i * 0.1} strokeDasharray="3,3" />
              <line x1={ax} y1={ay} x2={ax2} y2={ay2} stroke="#9d8def" strokeWidth="2" markerEnd="url(#aba)" />

        })}

          <marker id="aja" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <polygon points="0 0, 8 4, 0 8" fill="#ffd166" />
          </marker>
          <marker id="aja2" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
            <polygon points="8 0, 0 4, 8 8" fill="#ffd166" />
          </marker>
          <marker id="aba" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <polygon points="0 0, 6 3, 0 6" fill="#9d8def" />
          </marker>
        </defs>
      </svg>
      <div style={{ marginTop: 12 }}>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
          <span>current J</span><span style={{ color: "#fff" }}>{I.toFixed(2)}</span>
        </div>
        <input className="smooth-slider" type="range" min="-1.5" max="1.5" step="0.01" value={I} onChange={e => setI(parseFloat(e.target.value))} />
      </div>
    </div>
  );
}

function EMWaveDemo() {
  const [t, setT] = useState(0);
  const [freq, setFreq] = useState(1);
  useEffect(() => {
    let raf;
    let last = performance.now();
    const tick = (now) => {
      setT(prev => prev + (now - last) / 1000);
      last = now;
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  const W = 520, H = 240;
  const N = 80;

  let Epath = "";
  let Bpath = "";
  for (let i = 0; i <= N; i++) {
    const x = (i / N) * W;
    const phase = (i / N) * 4 * Math.PI - t * freq * 2;
    const Ey = Math.sin(phase);
    Epath += `${i === 0 ? "M" : "L"}${x},${H/2 - Ey * 50} `;
    Bpath += `${i === 0 ? "M" : "L"}${x},${H/2 - Ey * 50} `;
  }

  return (
    <div className="viz-card">
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        EM WAVE
      </div>
      <div className="formula-display">
        <Tex display>{"c = \\frac{1}{\\sqrt{\\mu_0 \\epsilon_0}} \\approx 3 \\times 10^8 \\text{ m/s}"}</Tex>
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ background: "#08080d", borderRadius: 4 }}>
        <line x1="0" y1={H/2} x2={W} y2={H/2} stroke="#1f1f2c" strokeDasharray="2,3" />
        <path d={Epath} fill="none" stroke="#7af0a8" strokeWidth="2" />
        <path d={Bpath} fill="none" stroke="#9d8def" strokeWidth="2" strokeOpacity="0.7" strokeDasharray="4,3" />
        <text x={20} y={20} fontSize="11" fill="#7af0a8">E (vertical)</text>
        <text x={20} y={36} fontSize="11" fill="#9d8def">B (out of page)</text>
      </svg>
      <div style={{ marginTop: 12 }}>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
          <span>frequency</span><span style={{ color: "#fff" }}>{freq.toFixed(2)}</span>
        </div>
        <input className="smooth-slider" type="range" min="0.3" max="3" step="0.01" value={freq} onChange={e => setFreq(parseFloat(e.target.value))} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(EMWaveDemo));
