<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>em explorer</title>
<style>html,body{margin:0;background:#0c0d10;color:#e8eaf0;font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif}
#root{min-height:100vh}#err{display:none;white-space:pre-wrap;padding:24px;color:#f0736a;font:13px/1.5 ui-monospace,Menlo,monospace}</style>
<div id="root"></div><pre id="err"></pre>
<script src="../_lib/react/libs-base.js"></script>
<script src="../_lib/react/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect,useReducer,useContext,createContext,forwardRef,memo,Fragment,Children,cloneElement} = React;



// ============================================================
// MATH RENDERING WITHOUT CDN
// Math rendered as styled HTML with Unicode symbols and CSS.
// No external dependencies. Works offline.
// ============================================================

function M({ children }) {
  return (
    <span style={{
      fontFamily: "'Cambria Math', 'STIX Two Math', 'Latin Modern Math', Georgia, serif",
      fontStyle: "italic",
      fontSize: "1.05em",
      whiteSpace: "nowrap",
      letterSpacing: "0.01em"
    }}>
      {children}
    </span>
  );
}

function MathBlock({ children, color = "#fff" }) {
  return (
    <div style={{
      background: "#08080d",
      padding: "16px 14px",
      borderRadius: 4,
      textAlign: "center",
      margin: "10px 0",
      fontFamily: "'Cambria Math', 'STIX Two Math', 'Latin Modern Math', Georgia, serif",
      fontSize: "20px",
      fontStyle: "italic",
      color,
      letterSpacing: "0.02em"
    }}>
      {children}
    </div>
  );
}

function Frac({ num, den }) {
  return (
    <span style={{
      display: "inline-flex",
      flexDirection: "column",
      verticalAlign: "middle",
      textAlign: "center",
      margin: "0 2px",
      fontSize: "0.9em"
    }}>
      <span style={{ borderBottom: "1px solid currentColor", padding: "0 6px" }}>{num}</span>
      <span style={{ padding: "0 6px" }}>{den}</span>
    </span>
  );
}

function Vec({ children }) {
  return (
    <span style={{ display: "inline-block", position: "relative", padding: "0 1px" }}>
      <span style={{
        position: "absolute",
        top: "-0.4em",
        left: 0,
        right: 0,
        textAlign: "center",
        fontSize: "0.7em",
        lineHeight: 1
      }}>→</span>
      <span style={{ fontWeight: 600 }}>{children}</span>
    </span>
  );
}

function Sub({ children }) { return <sub style={{ fontStyle: "normal" }}>{children}</sub>; }
function Sup({ children }) { return <sup style={{ fontStyle: "normal" }}>{children}</sup>; }

function EMExplorer() {
  const [section, setSection] = useState("electrostatics");

  return (
    <div style={{
      minHeight: "100vh",
      background: "#08080d",
      color: "#e8e8ee",
      fontFamily: "'JetBrains Mono', 'Courier New', monospace",
      padding: "32px 24px",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500;700&display=swap');
        * { box-sizing: border-box; }
        body { margin: 0; }
        .display { font-family: 'Fraunces', serif; }
        .control-btn {
          background: transparent; border: 1px solid #2a2a35;
          color: #e8e8ee; padding: 7px 12px;
          font-family: inherit; font-size: 11px; letter-spacing: 0.05em;
          cursor: pointer; transition: all 0.15s ease; text-transform: uppercase;
        }
        .control-btn:hover { border-color: #ff5c3a; color: #ff5c3a; }
        .control-btn.active { background: #ff5c3a; color: #0a0a0f; border-color: #ff5c3a; }
        .viz-card { background: #11111a; border: 1px solid #1f1f2c; padding: 18px; margin-bottom: 14px; }
        .smooth-slider {
          -webkit-appearance: none; appearance: none;
          background: transparent; width: 100%; height: 26px; touch-action: none;
        }
        .smooth-slider::-webkit-slider-runnable-track {
          height: 5px; background: linear-gradient(90deg, #1a1a26, #2a2a3a);
          border-radius: 3px; border: 1px solid #1f1f2c;
        }
        .smooth-slider::-moz-range-track {
          height: 5px; background: linear-gradient(90deg, #1a1a26, #2a2a3a);
          border-radius: 3px; border: 1px solid #1f1f2c;
        }
        .smooth-slider::-webkit-slider-thumb {
          -webkit-appearance: none; appearance: none;
          background: radial-gradient(circle at 30% 30%, #ff8c6a, #ff5c3a);
          height: 18px; width: 18px; border-radius: 50%; margin-top: -7px;
          cursor: grab;
          box-shadow: 0 2px 8px rgba(255,92,58,0.5);
          border: 2px solid #08080d;
        }
        .smooth-slider::-moz-range-thumb {
          background: radial-gradient(circle at 30% 30%, #ff8c6a, #ff5c3a);
          height: 18px; width: 18px; border-radius: 50%;
          cursor: grab; border: 2px solid #08080d;
          box-shadow: 0 2px 8px rgba(255,92,58,0.5);
        }
        .stat {
          background: #0d0d18; border: 1px solid #1f1f2c; padding: 10px 12px;
        }
        .stat .lbl { font-size: 9px; letter-spacing: 0.2em; color: #666; margin-bottom: 4px; }
        .stat .val { font-size: 16px; font-family: 'Fraunces', serif; font-style: italic; color: #fff; }
        .section-header {
          font-size: 32px; font-family: 'Fraunces', serif; font-style: italic; font-weight: 800;
          margin: 0 0 8px 0;
        }
        .formula-block {
          background: #08080d;
          border-left: 2px solid #ff5c3a;
          padding: 12px 16px;
          margin: 12px 0;
          font-family: 'Cambria Math', 'STIX Two Math', Georgia, serif;
          font-size: 17px;
          font-style: italic;
          color: #fff;
          line-height: 1.7;
        }
      `}</style>

      <div style={{ maxWidth: 1100, margin: "0 auto" }}>
        <div style={{ marginBottom: 24 }}>
          <div style={{ fontSize: 11, letterSpacing: "0.3em", color: "#ff5c3a", marginBottom: 10 }}>
            ELECTROMAGNETISM · GUIDED TOUR
          </div>
          <h1 className="display" style={{ fontSize: 38, lineHeight: 1.0, margin: 0, fontWeight: 800, fontStyle: "italic" }}>
            Fields, charges, and Maxwell
          </h1>
          <p style={{ fontSize: 13, color: "#b0b0bc", marginTop: 12, lineHeight: 1.6, maxWidth: 750 }}>
            From "what is an electric field?" to all four of Maxwell's equations.
          </p>
        </div>

        <div style={{ display: "flex", gap: 6, marginBottom: 20, flexWrap: "wrap" }}>
          {[
            { id: "electrostatics", label: "1 · Electrostatics" },
            { id: "magnetism", label: "2 · Magnetic fields" },
            { id: "lorentz", label: "3 · Lorentz force" },
            { id: "maxwell", label: "4 · Maxwell's eqs" }
          ].map(s => (
            <button key={s.id} className={`control-btn ${section === s.id ? "active" : ""}`} onClick={() => setSection(s.id)}>
              {s.label}
            </button>
          ))}
        </div>

        {section === "electrostatics" && <Electrostatics />}
        {section === "magnetism" && <Magnetism />}
        {section === "lorentz" && <Lorentz />}
        {section === "maxwell" && <Maxwell />}
      </div>
    </div>
  );
}

function Electrostatics() {
  return (
    <div>
      <div style={{ fontSize: 11, letterSpacing: "0.3em", color: "#ff5c3a" }}>SECTION 1</div>
      <h2 className="section-header">Electric fields & charges</h2>
      <div style={{ fontSize: 13, color: "#b0b0bc", marginBottom: 20, lineHeight: 1.6 }}>
        Everything in electromagnetism starts with charges and the fields they create.
      </div>

      <div className="viz-card" style={{ background: "#0d0d18" }}>
        <div className="display" style={{ fontSize: 20, fontStyle: "italic", color: "#ffd166", marginBottom: 10 }}>
          The big idea
        </div>
        <div style={{ fontSize: 14, color: "#e8e8ee", lineHeight: 1.65 }}>
          Charge comes in two flavors: <span style={{ color: "#ffd166" }}>positive (+)</span> and <span style={{ color: "#3ec6c2" }}>negative (−)</span>. Charges don't pull on each other directly across empty space — instead, each charge creates an <em>electric field</em> in the space around it, and that field pushes other charges.
        </div>
        <MathBlock>
          <Vec>F</Vec> = <span style={{ fontStyle: "normal" }}>q</span> <Vec>E</Vec>
        </MathBlock>
        <div style={{ fontSize: 13, color: "#b0b0bc", lineHeight: 1.6 }}>
          The field <M><Vec>E</Vec></M> at any point tells you exactly which way and how hard a charge <M>q</M> placed there will be pushed.
        </div>
      </div>

      <CoulombDemo />
      <FieldFromChargeDemo />
      <TwoChargesDemo />
      <GaussDemo />

      <div className="viz-card" style={{ background: "#0d0d18" }}>
        <div className="display" style={{ fontSize: 18, fontStyle: "italic", color: "#ffd166", marginBottom: 10 }}>
          What you now know
        </div>
        <div style={{ fontSize: 13, color: "#b0b0bc", lineHeight: 1.8 }}>
          Charges create electric fields <M><Vec>E</Vec></M> in the space around them.<br/>
          Force on a charge: <M><Vec>F</Vec> = q<Vec>E</Vec></M>.<br/>
          Coulomb's law: field from a point charge falls off as <M>1/r<Sup>2</Sup></M>.<br/>
          Gauss's law: <M>∇ · <Vec>E</Vec> = ρ/ε<Sub>0</Sub></M>.
        </div>
      </div>
    </div>
  );
}

function CoulombDemo() {
  const [q1, setQ1] = useState(1);
  const [q2, setQ2] = useState(1);
  const [r, setR] = useState(2);
  const F = (q1 * q2) / (r * r);

  return (
    <div className="viz-card">
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        COULOMB'S LAW
      </div>
      <MathBlock>
        F = <Frac num={<>k q<Sub>1</Sub> q<Sub>2</Sub></>} den={<>r<Sup>2</Sup></>} />
      </MathBlock>
      <div style={{ fontSize: 13, color: "#b0b0bc", marginBottom: 12, lineHeight: 1.55 }}>
        The force between two point charges. Big charges → big force. Far apart → tiny force (<M>1/r<Sup>2</Sup></M> falloff). Same sign → repulsive. Opposite sign → attractive.
      </div>
      <svg width="100%" viewBox="0 0 480 160" style={{ background: "#08080d", borderRadius: 4 }}>
        <circle cx={100} cy={80} r={14} fill={q1 > 0 ? "#ffd166" : "#3ec6c2"} stroke="#0a0a0f" strokeWidth="2" />
        <text x={100} y={85} fontSize="14" fill="#0a0a0f" textAnchor="middle" fontWeight="700">{q1 > 0 ? "+" : "−"}</text>
        <text x={100} y={50} fontSize="11" fill="#b0b0bc" textAnchor="middle" fontFamily="Cambria Math, Georgia, serif" fontStyle="italic">q₁ = {q1 >= 0 ? "+" : ""}{q1.toFixed(2)}</text>

        <circle cx={100 + r * 60} cy={80} r={14} fill={q2 > 0 ? "#ffd166" : "#3ec6c2"} stroke="#0a0a0f" strokeWidth="2" />
        <text x={100 + r * 60} y={85} fontSize="14" fill="#0a0a0f" textAnchor="middle" fontWeight="700">{q2 > 0 ? "+" : "−"}</text>
        <text x={100 + r * 60} y={50} fontSize="11" fill="#b0b0bc" textAnchor="middle" fontFamily="Cambria Math, Georgia, serif" fontStyle="italic">q₂ = {q2 >= 0 ? "+" : ""}{q2.toFixed(2)}</text>

        <line x1={100} y1={110} x2={100 + r * 60} y2={110} stroke="#666" strokeWidth="1" />
        <text x={100 + r * 30} y={130} fontSize="11" fill="#888" textAnchor="middle" fontStyle="italic">r = {r.toFixed(2)}</text>

        {Math.abs(F) > 0.001 && (() => {
          const arrowLen = Math.min(80, Math.abs(F) * 60);
          const dir = F > 0 ? 1 : -1;
          return (
            <g>
              <line x1={100 - 16} y1={80} x2={100 - 16 - dir * arrowLen} y2={80} stroke="#ff5c3a" strokeWidth="2" markerEnd="url(#fhead)" />
              <line x1={100 + r * 60 + 16} y1={80} x2={100 + r * 60 + 16 + dir * arrowLen} y2={80} stroke="#ff5c3a" strokeWidth="2" markerEnd="url(#fhead)" />
              <text x={100 - 16 - dir * arrowLen / 2} y={70} fontSize="10" fill="#ff5c3a" textAnchor="middle" fontStyle="italic">F</text>
            </g>
          );
        })()}

        <defs>
          <marker id="fhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <polygon points="0 0, 6 3, 0 6" fill="#ff5c3a" />
          </marker>
        </defs>
      </svg>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14, marginTop: 14 }}>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>q₁</span><span style={{ color: "#fff" }}>{q1 >= 0 ? "+" : ""}{q1.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="-2" max="2" step="0.01" value={q1} onChange={e => setQ1(parseFloat(e.target.value))} />
        </div>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>q₂</span><span style={{ color: "#fff" }}>{q2 >= 0 ? "+" : ""}{q2.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="-2" max="2" step="0.01" value={q2} onChange={e => setQ2(parseFloat(e.target.value))} />
        </div>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>distance r</span><span style={{ color: "#fff" }}>{r.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="0.5" max="5" step="0.01" value={r} onChange={e => setR(parseFloat(e.target.value))} />
        </div>
      </div>

      <div className="formula-block">
        F = <Frac num={<>q<Sub>1</Sub> q<Sub>2</Sub></>} den={<>r<Sup>2</Sup></>} /> = <Frac num={<>({q1.toFixed(2)})({q2.toFixed(2)})</>} den={<>({r.toFixed(2)})<Sup>2</Sup></>} /> = <span style={{ color: F > 0 ? "#ff5c3a" : F < 0 ? "#3ec6c2" : "#fff" }}>{F.toFixed(3)}</span>
        <div style={{ fontSize: 12, fontStyle: "normal", color: F > 0.01 ? "#ff5c3a" : F < -0.01 ? "#3ec6c2" : "#888", marginTop: 8, fontFamily: "'JetBrains Mono', monospace" }}>
          {F > 0.01 && "→ repulsive (pushing apart)"}
          {F < -0.01 && "→ attractive (pulling together)"}
          {Math.abs(F) <= 0.01 && "→ approximately zero"}
        </div>
      </div>
    </div>
  );
}

function FieldFromChargeDemo() {
  const [Q, setQ] = useState(1);
  const [showField, setShowField] = useState(true);
  const [showLines, setShowLines] = useState(true);
  const W = 480, H = 280;
  const cx = W/2, cy = H/2;

  const arrows = [];
  const grid = 7;
  for (let i = -grid; i <= grid; i++) {
    for (let j = -Math.floor(grid * 0.55); j <= Math.floor(grid * 0.55); j++) {
      const x = i * 30, y = j * 30;
      if (x === 0 && y === 0) continue;
      const r2 = x * x + y * y;
      if (r2 < 400) continue;
      const r = Math.sqrt(r2);
      const mag = Q / r2 * 800;
      const len = Math.min(20, Math.abs(mag));
      const dir = Q > 0 ? 1 : -1;
      arrows.push({
        x1: cx + x - dir * (x / r) * len * 0.5,
        y1: cy + y - dir * (y / r) * len * 0.5,
        x2: cx + x + dir * (x / r) * len * 0.5,
        y2: cy + y + dir * (y / r) * len * 0.5
      });
    }
  }

  return (
    <div className="viz-card">
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        ELECTRIC FIELD AROUND A POINT CHARGE
      </div>
      <MathBlock>
        <Vec>E</Vec>(<Vec>r</Vec>) = <Frac num={<>kq</>} den={<>r<Sup>2</Sup></>} /> r̂
      </MathBlock>
      <div style={{ fontSize: 13, color: "#b0b0bc", marginBottom: 12, lineHeight: 1.55 }}>
        A charge creates a field <em>everywhere in space</em>. Each arrow shows which way and how hard a small positive test charge would be pushed if you placed it there.
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ background: "#08080d", borderRadius: 4 }}>
        {showField && arrows.map((a, i) => (
          <line key={i} x1={a.x1} y1={a.y1} x2={a.x2} y2={a.y2} stroke="#7af0a8" strokeWidth="1.2" markerEnd="url(#earrow)" opacity="0.7" />
        ))}
        {showLines && [0, 1, 2, 3].map(i => (
          <circle key={i} cx={cx} cy={cy} r={(i + 1) * 30} fill="none" stroke="#7af0a8" strokeOpacity={0.15} strokeDasharray="2,3" />
        ))}
        <circle cx={cx} cy={cy} r="14" fill={Q > 0 ? "#ffd166" : "#3ec6c2"} stroke="#0a0a0f" strokeWidth="2" />
        <text x={cx} y={cy + 5} fontSize="16" fill="#0a0a0f" textAnchor="middle" fontWeight="700">{Q > 0 ? "+" : "−"}</text>

        <defs>
          <marker id="earrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
            <polygon points="0 0, 5 2.5, 0 5" fill="#7af0a8" />
          </marker>
        </defs>
      </svg>
      <div style={{ display: "grid", gridTemplateColumns: "1fr auto auto", gap: 14, marginTop: 12, alignItems: "center" }}>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>charge Q</span><span style={{ color: "#fff" }}>{Q >= 0 ? "+" : ""}{Q.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="-2" max="2" step="0.01" value={Q} onChange={e => setQ(parseFloat(e.target.value))} />
        </div>
        <button className={`control-btn ${showField ? "active" : ""}`} onClick={() => setShowField(s => !s)}>field</button>
        <button className={`control-btn ${showLines ? "active" : ""}`} onClick={() => setShowLines(s => !s)}>equipotentials</button>
      </div>
    </div>
  );
}

function TwoChargesDemo() {
  const [q1, setQ1] = useState(1);
  const [q2, setQ2] = useState(-1);
  const W = 520, H = 280;
  const c1x = 160, c1y = H/2;
  const c2x = 360, c2y = H/2;
  const arrows = [];
  for (let i = 0; i < 16; i++) {
    for (let j = 0; j < 9; j++) {
      const px = (i + 0.5) * (W / 16);
      const py = (j + 0.5) * (H / 9);
      const r1x = px - c1x, r1y = py - c1y;
      const r1_2 = r1x * r1x + r1y * r1y;
      if (r1_2 < 200) continue;
      const r1 = Math.sqrt(r1_2);
      const E1x = q1 * r1x / (r1_2 * r1) * 1000;
      const E1y = q1 * r1y / (r1_2 * r1) * 1000;
      const r2x = px - c2x, r2y = py - c2y;
      const r2_2 = r2x * r2x + r2y * r2y;
      if (r2_2 < 200) continue;
      const r2 = Math.sqrt(r2_2);
      const E2x = q2 * r2x / (r2_2 * r2) * 1000;
      const E2y = q2 * r2y / (r2_2 * r2) * 1000;
      const Ex = E1x + E2x, Ey = E1y + E2y;
      const Emag = Math.sqrt(Ex*Ex + Ey*Ey);
      if (Emag < 0.3 || Emag > 30) continue;
      const len = Math.min(16, Emag * 1.5);
      arrows.push({ px, py, ux: Ex/Emag, uy: Ey/Emag, len });
    }
  }

  return (
    <div className="viz-card">
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        SUPERPOSITION · TWO CHARGES
      </div>
      <MathBlock>
        <Vec>E</Vec><Sub>total</Sub> = <Vec>E</Vec><Sub>1</Sub> + <Vec>E</Vec><Sub>2</Sub>
      </MathBlock>
      <div style={{ fontSize: 13, color: "#b0b0bc", marginBottom: 12, lineHeight: 1.55 }}>
        E fields from multiple charges add as vectors. Try +/+ vs +/− to see different patterns.
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ background: "#08080d", borderRadius: 4 }}>
        {arrows.map((a, i) => (
          <line key={i}
            x1={a.px - a.ux * a.len/2} y1={a.py - a.uy * a.len/2}
            x2={a.px + a.ux * a.len/2} y2={a.py + a.uy * a.len/2}
            stroke="#7af0a8" strokeWidth="1.2" markerEnd="url(#earrow2)" opacity="0.7"
          />
        ))}
        <circle cx={c1x} cy={c1y} r="14" fill={q1 > 0 ? "#ffd166" : "#3ec6c2"} stroke="#0a0a0f" strokeWidth="2" />
        <text x={c1x} y={c1y + 5} fontSize="16" fill="#0a0a0f" textAnchor="middle" fontWeight="700">{q1 > 0 ? "+" : "−"}</text>
        <circle cx={c2x} cy={c2y} r="14" fill={q2 > 0 ? "#ffd166" : "#3ec6c2"} stroke="#0a0a0f" strokeWidth="2" />
        <text x={c2x} y={c2y + 5} fontSize="16" fill="#0a0a0f" textAnchor="middle" fontWeight="700">{q2 > 0 ? "+" : "−"}</text>
        <defs>
          <marker id="earrow2" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
            <polygon points="0 0, 5 2.5, 0 5" fill="#7af0a8" />
          </marker>
        </defs>
      </svg>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginTop: 12 }}>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>q₁ (left)</span><span style={{ color: "#fff" }}>{q1 >= 0 ? "+" : ""}{q1.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="-2" max="2" step="0.01" value={q1} onChange={e => setQ1(parseFloat(e.target.value))} />
        </div>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>

function ExBDriftDemo() {
  const [E, setE] = useState(0.5);

  const [t, setT] = useState(0);
  useEffect(() => {
    let raf;
    let last = performance.now();
    const tick = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      setT(prev => prev + dt);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  const vd = E / B;
  const W = 600, H = 240;
  const cx_ = 80 + (vd * t * 50) % (W - 100);
  const cy_ = H/2;
  const r = 30 / B;
  const omega = B * 2;
  const px = cx_ + r * Math.cos(omega * t);
  const py = cy_ + r * Math.sin(omega * t);

  return (
    <div className="viz-card">
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        E×B DRIFT
      </div>
      <MathBlock>
        <Vec>v</Vec><Sub>d</Sub> = <Frac num={<><Vec>E</Vec> × <Vec>B</Vec></>} den={<>B<Sup>2</Sup></>} />
      </MathBlock>
      <div style={{ fontSize: 13, color: "#b0b0bc", marginBottom: 12, lineHeight: 1.55 }}>
        With both E (rightward) and B (out of page), particles trace cycloids and drift sideways at velocity E/B regardless of charge sign or mass.
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ background: "#08080d", borderRadius: 4 }}>
        {[0.15, 0.4, 0.65, 0.85].map((fy, j) => (
          [0.1, 0.3, 0.5, 0.7, 0.9].map((fx, i) => (
            <circle key={`${i}${j}`} cx={W * fx} cy={H * fy} r="2" fill="#9d8def" opacity={0.3} />
          ))
        ))}
        {[40, 80, 120, 160, 200].map(y => (
          <line key={y} x1={20} y1={y} x2={W - 20} y2={y} stroke="#7af0a8" strokeOpacity="0.15" strokeWidth="1" />
        ))}
        <line x1={20} y1={20} x2={W - 20} y2={20} stroke="#7af0a8" strokeWidth="2" markerEnd="url(#exbE)" />
        <text x={W - 80} y={15} fontSize="11" fill="#7af0a8" fontStyle="italic">E →</text>
        <circle cx={px} cy={py} r="6" fill="#ffd166" />

          const tt = t - i * 0.05;
          if (tt < 0) return null;
          const tx = 80 + (vd * tt * 50) % (W - 100);

function ParticlePathDemo() {
  const [E, setE] = useState({ x: 0.3, y: 0 });
  const [B, setB] = useState(1);
  const stateRef = useRef({ x: 100, y: 120, vx: 1, vy: 0 });
  const trailRef = useRef([]);
  const [, setTick] = useState(0);
  const lastFrameRef = useRef(performance.now());

  useEffect(() => {
    let raf;
    const loop = (now) => {
      const dt = Math.min(0.04, (now - lastFrameRef.current) / 1000);
      lastFrameRef.current = now;
      const s = stateRef.current;
      const Fx = E.x + s.vy * B;
      const Fy = E.y - s.vx * B;
      s.vx += Fx * dt;
      s.vy += Fy * dt;
      s.x += s.vx * dt * 30;
      s.y += s.vy * dt * 30;
      if (s.x < 20) s.x = 460;
      if (s.x > 460) s.x = 20;
      if (s.y < 20) s.y = 220;
      if (s.y > 220) s.y = 20;
      trailRef.current.push({ x: s.x, y: s.y });
      if (trailRef.current.length > 200) trailRef.current.shift();
      setTick(t => t + 1);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(loop);
  }, [E.x, E.y, B]);

  const W = 480, H = 240;
  const s = stateRef.current;

  return (
    <div className="viz-card">
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        FREE-FORM EXPLORER
      </div>
      <MathBlock>
        m <Frac num={<>d<Vec>v</Vec></>} den="dt" /> = q (<Vec>E</Vec> + <Vec>v</Vec> × <Vec>B</Vec>)
      </MathBlock>
      <div style={{ fontSize: 13, color: "#b0b0bc", marginBottom: 12, lineHeight: 1.55 }}>
        Tweak the components and watch the trajectory. Three preset buttons demonstrate the canonical cases.
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ background: "#08080d", borderRadius: 4 }}>
        {[0.15, 0.4, 0.65, 0.9].map((fy, j) => (
          [0.1, 0.3, 0.5, 0.7, 0.9].map((fx, i) => (
            <circle key={`${i}${j}`} cx={W * fx} cy={H * fy} r="1.5" fill="#9d8def" opacity={0.3 * Math.abs(B)} />
          ))
        ))}
        {trailRef.current.map((p, i) => (
          <circle key={i} cx={p.x} cy={p.y} r={1.5} fill="#ffd166" opacity={i / trailRef.current.length} />
        ))}
        <circle cx={s.x} cy={s.y} r="5" fill="#ffd166" />
        <text x={20} y={20} fontSize="10" fill="#7af0a8" fontStyle="italic">E = ({E.x.toFixed(2)}, {E.y.toFixed(2)})</text>
        <text x={20} y={36} fontSize="10" fill="#9d8def" fontStyle="italic">B = (0, 0, {B.toFixed(2)})</text>
      </svg>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14, marginTop: 12 }}>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>E_x</span><span style={{ color: "#fff" }}>{E.x.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="-1" max="1" step="0.01" value={E.x} onChange={e => setE({...E, x: parseFloat(e.target.value)})} />
        </div>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>E_y</span><span style={{ color: "#fff" }}>{E.y.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="-1" max="1" step="0.01" value={E.y} onChange={e => setE({...E, y: parseFloat(e.target.value)})} />
        </div>
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
            <span>B</span><span style={{ color: "#fff" }}>{B.toFixed(2)}</span>
          </div>
          <input className="smooth-slider" type="range" min="-2" max="2" step="0.01" value={B} onChange={e => setB(parseFloat(e.target.value))} />
        </div>
      </div>
      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        <button className="control-btn" onClick={() => { setE({x: 0.3, y: 0}); setB(0); }}>E only</button>
        <button className="control-btn" onClick={() => { setE({x: 0, y: 0}); setB(1); }}>B only (gyration)</button>
        <button className="control-btn" onClick={() => { setE({x: 0.3, y: 0}); setB(1); }}>E×B drift</button>
      </div>
    </div>
  );
}

function EMWaveDemo() {
  const [t, setT] = useState(0);
  const [freq, setFreq] = useState(1);
  useEffect(() => {
    let raf;
    let last = performance.now();
    const tick = (now) => {
      setT(prev => prev + (now - last) / 1000);
      last = now;
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  const W = 520, H = 240;
  const N = 80;

  let Epath = "";
  let Bpath = "";
  for (let i = 0; i <= N; i++) {
    const x = (i / N) * W;
    const phase = (i / N) * 4 * Math.PI - t * freq * 2;
    const Ey = Math.sin(phase);
    const Bz = Math.sin(phase);
    Epath += `${i === 0 ? "M" : "L"}${x},${H/2 - Ey * 50} `;
    Bpath += `${i === 0 ? "M" : "L"}${x},${H/2 - Bz * 50} `;
  }

  return (
    <div className="viz-card">
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        ELECTROMAGNETIC WAVE
      </div>
      <MathBlock>
        c = <Frac num="1" den={<>√(μ<Sub>0</Sub>ε<Sub>0</Sub>)</>} /> ≈ 3 × 10<Sup>8</Sup> m/s
      </MathBlock>
      <div style={{ fontSize: 13, color: "#b0b0bc", marginBottom: 12, lineHeight: 1.55 }}>
        Combine Faraday and Ampère: changing B creates E, changing E creates B. Self-sustaining wave at the speed of light. <em>This is light.</em>
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ background: "#08080d", borderRadius: 4 }}>
        <line x1="0" y1={H/2} x2={W} y2={H/2} stroke="#1f1f2c" strokeDasharray="2,3" />
        <path d={Epath} fill="none" stroke="#7af0a8" strokeWidth="2" />
        <path d={Bpath} fill="none" stroke="#9d8def" strokeWidth="2" strokeOpacity="0.7" strokeDasharray="4,3" />
        <text x={20} y={20} fontSize="11" fill="#7af0a8" fontStyle="italic">E (vertical)</text>
        <text x={20} y={36} fontSize="11" fill="#9d8def" fontStyle="italic">B (out of page)</text>
        <text x={W - 10} y={H - 8} fontSize="11" fill="#888" textAnchor="end" fontStyle="italic">propagation →</text>
      </svg>
      <div style={{ marginTop: 12 }}>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", marginBottom: 4 }}>
          <span>frequency</span><span style={{ color: "#fff" }}>{freq.toFixed(2)}</span>
        </div>
        <input className="smooth-slider" type="range" min="0.3" max="3" step="0.01" value={freq} onChange={e => setFreq(parseFloat(e.target.value))} />
      </div>
    </div>
  );
}
