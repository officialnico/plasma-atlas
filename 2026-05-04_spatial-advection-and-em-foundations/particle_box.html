<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>particle box</title>
<style>html,body{margin:0;background:#0c0d10;color:#e8eaf0;font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif}
#root{min-height:100vh}#err{display:none;white-space:pre-wrap;padding:24px;color:#f0736a;font:13px/1.5 ui-monospace,Menlo,monospace}</style>
<div id="root"></div><pre id="err"></pre>
<script src="../_lib/react/libs-base.js"></script>
<script src="../_lib/react/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect,useReducer,useContext,createContext,forwardRef,memo,Fragment,Children,cloneElement} = React;



function ParticleBoxVisualizer() {
  const [running, setRunning] = useState(true);
  const [scenario, setScenario] = useState("gradient"); // "uniform", "gradient", "reverse"
  const [velocity, setVelocity] = useState(0.6);
  const [showTrails, setShowTrails] = useState(false);

  const W = 720;
  const H = 360;
  const xMin = 0;
  const xMax = 10;
  const xToPx = (x) => 30 + ((x - xMin) / (xMax - xMin)) * (W - 60);

  // observation window
  const winX = 5;
  const winHalf = 0.4;
  const winLeftPx = xToPx(winX - winHalf);
  const winRightPx = xToPx(winX + winHalf);
  const winWidthPx = winRightPx - winLeftPx;

  // density profile in the world (defines particle spawn rate per x-bin)
  const density = (x) => {
    if (scenario === "uniform") return 0.5;
    if (scenario === "gradient") {
      // higher density on the left, falls off going right
      // smooth ramp from ~0.9 at x=2 to ~0.15 at x=8
      return 0.55 + 0.4 * Math.tanh((4.5 - x) * 0.7);
    }
    if (scenario === "reverse") {
      return 0.55 + 0.4 * Math.tanh((x - 5.5) * 0.7);
    }
    return 0.5;
  };

  // df/dx at the window
  const dfdx = (() => {
    const h = 0.05;
    return (density(winX + h) - density(winX - h)) / (2 * h);
  })();
  const streamingTerm = velocity * dfdx; // v * df/dx

  // particle pool
  const particlesRef = useRef([]);
  const trailsRef = useRef([]);
  const timeRef = useRef(0);
  const lastFrameRef = useRef(performance.now());
  const countersRef = useRef({ inLeft: 0, outRight: 0, windowCount: 0, history: [] });

  const [tick, setTick] = useState(0);
  const [counters, setCounters] = useState({ inLeft: 0, outRight: 0, windowCount: 0, net: 0 });
  const [windowHistory, setWindowHistory] = useState([]);

  // initialize particles
  const initParticles = () => {
    const parts = [];
    const N = 320;
    for (let i = 0; i < N; i++) {
      // sample x according to density via rejection
      let x;
      let attempts = 0;
      while (attempts < 100) {
        x = xMin + Math.random() * (xMax - xMin);
        if (Math.random() < density(x) / 0.95) break;
        attempts++;
      }
      parts.push({
        x,
        y: 0.15 + Math.random() * 0.7,
        id: i,
        countedIn: false,
        countedOut: false,
      });
    }
    particlesRef.current = parts;
    countersRef.current = { inLeft: 0, outRight: 0, windowCount: 0, history: [] };
    timeRef.current = 0;
    setCounters({ inLeft: 0, outRight: 0, windowCount: 0, net: 0 });
    setWindowHistory([]);
  };

  useEffect(() => {
    initParticles();
  }, [scenario]);

  useEffect(() => {
    let raf;
    const tickFn = (now) => {
      const dt = Math.min(0.05, (now - lastFrameRef.current) / 1000);
      lastFrameRef.current = now;
      if (running) {
        timeRef.current += dt;
        const parts = particlesRef.current;
        for (const p of parts) {
          const prevX = p.x;
          p.x += velocity * dt;
          // wrap with re-sampling so density is preserved on the left edge
          if (p.x > xMax) {
            // resample x near left edge according to density
            let nx;
            let tries = 0;
            while (tries < 50) {
              nx = xMin + Math.random() * 2; // spawn in left 0-2 region
              if (Math.random() < density(nx) / 0.95) break;
              tries++;
            }
            p.x = nx ?? xMin;
            p.y = 0.15 + Math.random() * 0.7;
            p.countedIn = false;
            p.countedOut = false;
          }
          if (p.x < xMin) {
            p.x = xMax;
            p.countedIn = false;
            p.countedOut = false;
          }
          // counters - particle crossed left edge of window going right
          if (
            !p.countedIn &&
            prevX < winX - winHalf &&
            p.x >= winX - winHalf &&
            velocity > 0
          ) {
            countersRef.current.inLeft += 1;
            p.countedIn = true;
          }
          // particle crossed right edge of window going right
          if (
            !p.countedOut &&
            prevX < winX + winHalf &&
            p.x >= winX + winHalf &&
            velocity > 0
          ) {
            countersRef.current.outRight += 1;
            p.countedOut = true;
          }
          // optional trails
          if (showTrails && Math.random() < 0.12) {
            trailsRef.current.push({ x: p.x, y: p.y, age: 0 });
          }
        }
        // count particles currently in window
        let inside = 0;
        for (const p of parts) {
          if (p.x >= winX - winHalf && p.x <= winX + winHalf) inside++;
        }
        countersRef.current.windowCount = inside;

        // history every 0.1s
        if (
          countersRef.current.history.length === 0 ||
          timeRef.current -
            countersRef.current.history[countersRef.current.history.length - 1].t >
            0.1
        ) {
          countersRef.current.history.push({ t: timeRef.current, n: inside });
          if (countersRef.current.history.length > 80) countersRef.current.history.shift();
        }

        // age trails
        if (showTrails) {
          for (const tr of trailsRef.current) tr.age += dt;
          trailsRef.current = trailsRef.current.filter((tr) => tr.age < 0.6);
        }
      }
      setTick((t) => t + 1);
      setCounters({
        inLeft: countersRef.current.inLeft,
        outRight: countersRef.current.outRight,
        windowCount: countersRef.current.windowCount,
        net: countersRef.current.inLeft - countersRef.current.outRight,
      });
      setWindowHistory([...countersRef.current.history]);
      raf = requestAnimationFrame(tickFn);
    };
    raf = requestAnimationFrame(tickFn);
    return () => cancelAnimationFrame(raf);
  }, [running, velocity, showTrails]);

  const reset = () => {
    initParticles();
  };

  // density profile path (for the chart strip above the box)
  const densityPath = (() => {
    let d = "";
    for (let i = 0; i <= 100; i++) {
      const x = xMin + (i / 100) * (xMax - xMin);
      const px = xToPx(x);
      const py = 30 - density(x) * 22;
      d += `${i === 0 ? "M" : "L"}${px.toFixed(2)},${py.toFixed(2)} `;
    }
    return d;
  })();

  // history chart
  const histW = 720;
  const histH = 90;
  const histPath = (() => {
    if (windowHistory.length < 2) return "";
    const minT = windowHistory[0].t;
    const maxT = windowHistory[windowHistory.length - 1].t;
    const minN = Math.min(...windowHistory.map((h) => h.n));
    const maxN = Math.max(...windowHistory.map((h) => h.n));
    const range = Math.max(2, maxN - minN);
    let d = "";
    windowHistory.forEach((h, i) => {
      const px = 30 + ((h.t - minT) / Math.max(0.1, maxT - minT)) * (histW - 60);
      const py = histH - 15 - ((h.n - minN) / range) * (histH - 30);
      d += `${i === 0 ? "M" : "L"}${px.toFixed(2)},${py.toFixed(2)} `;
    });
    return d;
  })();

  const histLabel = (() => {
    if (scenario === "uniform") return "≈ FLAT — unchanging count";
    if (scenario === "gradient") return "↘ FALLING — count is dropping";
    if (scenario === "reverse") return "↗ RISING — count is climbing";
    return "";
  })();

  return (
    <div
      style={{
        minHeight: "100vh",
        background: "#0a0a0f",
        color: "#e8e8ee",
        fontFamily: "'JetBrains Mono', 'Courier New', monospace",
        padding: "32px 24px",
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500;700&display=swap');
        * { box-sizing: border-box; }
        body { margin: 0; }
        .display { font-family: 'Fraunces', serif; }
        .control-btn {
          background: transparent;
          border: 1px solid #2a2a35;
          color: #e8e8ee;
          padding: 8px 14px;
          font-family: inherit;
          font-size: 12px;
          letter-spacing: 0.05em;
          cursor: pointer;
          transition: all 0.15s ease;
          text-transform: uppercase;
        }
        .control-btn:hover { border-color: #ff5c3a; color: #ff5c3a; }
        .control-btn.active { background: #ff5c3a; color: #0a0a0f; border-color: #ff5c3a; }
        .viz-card { background: #11111a; border: 1px solid #1f1f2c; padding: 20px; }
        input[type="range"] {
          -webkit-appearance: none;
          appearance: none;
          background: transparent;
          width: 100%;
          height: 24px;
        }
        input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: #2a2a35; }
        input[type="range"]::-webkit-slider-thumb {
          -webkit-appearance: none; appearance: none;
          background: #ff5c3a; height: 14px; width: 14px; border-radius: 50%;
          margin-top: -6px; cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
          background: #ff5c3a; height: 14px; width: 14px; border-radius: 50%; border: none; cursor: pointer;
        }
        .stat {
          background: #0d0d18;
          border: 1px solid #1f1f2c;
          padding: 12px 14px;
          font-size: 12px;
        }
        .stat .lbl { font-size: 10px; letter-spacing: 0.2em; color: #666; margin-bottom: 6px; }
        .stat .val { font-size: 18px; font-family: 'Fraunces', serif; font-style: italic; color: #fff; }
      `}</style>

      <div style={{ maxWidth: 920, margin: "0 auto" }}>
        <div style={{ marginBottom: 28 }}>
          <div style={{ fontSize: 11, letterSpacing: "0.3em", color: "#ff5c3a", marginBottom: 12 }}>
            STREAMING · WHAT GOES IN VS WHAT GOES OUT
          </div>
          <h1 className="display" style={{ fontSize: 42, lineHeight: 1.0, margin: 0, fontWeight: 800, fontStyle: "italic" }}>
            The window experiment
          </h1>
          <p style={{ fontSize: 14, lineHeight: 1.6, maxWidth: 700, color: "#b0b0bc", marginTop: 14 }}>
            A small observation window sits at x = 5. Particles all stream rightward at speed v. Watch the count
            inside the window: when density is uniform (flat ∂f/∂x), count stays steady even though tons of
            particles flow through. When density has a gradient, "in" and "out" don't cancel — and the count drifts.
          </p>
        </div>

        {/* SCENARIO BUTTONS */}
        <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
          <button className={`control-btn ${scenario === "uniform" ? "active" : ""}`} onClick={() => setScenario("uniform")}>
            Uniform · ∂f/∂x = 0
          </button>
          <button className={`control-btn ${scenario === "gradient" ? "active" : ""}`} onClick={() => setScenario("gradient")}>
            Falling · ∂f/∂x &lt; 0
          </button>
          <button className={`control-btn ${scenario === "reverse" ? "active" : ""}`} onClick={() => setScenario("reverse")}>
            Rising · ∂f/∂x &gt; 0
          </button>
        </div>

        {/* MAIN VIZ */}
        <div className="viz-card" style={{ marginBottom: 16 }}>
          {/* density profile strip */}
          <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 6 }}>
            DENSITY f(x) — what you'd see if you averaged the box
          </div>
          <svg width="100%" viewBox={`0 0 ${W} 36`} style={{ display: "block" }}>
            {/* baseline */}
            <line x1="30" y1="32" x2={W - 30} y2="32" stroke="#2a2a35" />
            {/* density curve */}
            <path d={densityPath} fill="none" stroke="#5b8def" strokeWidth="2" />
            {/* window markers */}
            <line x1={winLeftPx} y1="0" x2={winLeftPx} y2="36" stroke="#ffd166" strokeDasharray="2,3" opacity="0.6" />
            <line x1={winRightPx} y1="0" x2={winRightPx} y2="36" stroke="#ffd166" strokeDasharray="2,3" opacity="0.6" />
          </svg>

          {/* particle box */}
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: "block", marginTop: 4 }}>
            {/* world floor and ceiling */}
            <line x1="30" y1="30" x2={W - 30} y2="30" stroke="#1f1f2c" />
            <line x1="30" y1={H - 40} x2={W - 30} y2={H - 40} stroke="#1f1f2c" />

            {/* particles */}
            {particlesRef.current.map((p) => {
              const inWindow = p.x >= winX - winHalf && p.x <= winX + winHalf;
              return (
                <circle
                  key={p.id}
                  cx={xToPx(p.x)}
                  cy={30 + p.y * (H - 70)}
                  r={inWindow ? 3.5 : 2.5}
                  fill={inWindow ? "#ffd166" : "#5b8def"}
                  opacity={inWindow ? 1 : 0.7}
                />
              );
            })}

            {/* trails */}
            {showTrails &&
              trailsRef.current.map((tr, i) => (
                <circle
                  key={`tr-${i}`}
                  cx={xToPx(tr.x)}
                  cy={30 + tr.y * (H - 70)}
                  r={1.5}
                  fill="#5b8def"
                  opacity={Math.max(0, 0.4 - tr.age * 0.6)}
                />
              ))}

            {/* observation window */}
            <rect
              x={winLeftPx}
              y={20}
              width={winWidthPx}
              height={H - 50}
              fill="#ffd166"
              fillOpacity="0.06"
              stroke="#ffd166"
              strokeWidth="2"
            />

            {/* in/out arrows */}
            <g>
              <text x={winLeftPx - 10} y={50} fontSize="10" fill="#7af0a8" textAnchor="end">IN</text>
              <line x1={winLeftPx - 35} y1={56} x2={winLeftPx - 5} y2={56} stroke="#7af0a8" strokeWidth="2" />
              <polygon points={`${winLeftPx - 5},56 ${winLeftPx - 11},52 ${winLeftPx - 11},60`} fill="#7af0a8" />
              <text x={winRightPx + 10} y={50} fontSize="10" fill="#ff7a7a">OUT</text>
              <line x1={winRightPx + 5} y1={56} x2={winRightPx + 35} y2={56} stroke="#ff7a7a" strokeWidth="2" />
              <polygon points={`${winRightPx + 35},56 ${winRightPx + 29},52 ${winRightPx + 29},60`} fill="#ff7a7a" />
            </g>

            {/* window label */}
            <text x={(winLeftPx + winRightPx) / 2} y={H - 18} fontSize="11" fill="#ffd166" textAnchor="middle" fontStyle="italic">
              window at x = 5
            </text>

            {/* x-axis ticks */}
            {[0, 2, 4, 6, 8, 10].map((tx) => (
              <text key={tx} x={xToPx(tx)} y={H - 5} fontSize="10" fill="#444" textAnchor="middle">
                {tx}
              </text>
            ))}
          </svg>

          {/* live counters */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 10, marginTop: 14 }}>
            <div className="stat">
              <div className="lbl">FLOWED IN (LEFT)</div>
              <div className="val" style={{ color: "#7af0a8" }}>{counters.inLeft}</div>
            </div>
            <div className="stat">
              <div className="lbl">FLOWED OUT (RIGHT)</div>
              <div className="val" style={{ color: "#ff7a7a" }}>{counters.outRight}</div>
            </div>
            <div className="stat">
              <div className="lbl">NET = IN − OUT</div>
              <div className="val" style={{ color: counters.net > 0 ? "#7af0a8" : counters.net < 0 ? "#ff7a7a" : "#888" }}>
                {counters.net > 0 ? "+" : ""}{counters.net}
              </div>
            </div>
            <div className="stat">
              <div className="lbl">CURRENTLY IN WINDOW</div>
              <div className="val" style={{ color: "#ffd166" }}>{counters.windowCount}</div>
            </div>
          </div>
        </div>

        {/* HISTORY CHART */}
        <div className="viz-card" style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
            <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666" }}>
              COUNT IN WINDOW OVER TIME
            </div>
            <div style={{ fontSize: 10, color: "#ffd166", letterSpacing: "0.1em" }}>{histLabel}</div>
          </div>
          <svg width="100%" viewBox={`0 0 ${histW} ${histH}`} style={{ display: "block" }}>
            <line x1="30" y1={histH - 15} x2={histW - 30} y2={histH - 15} stroke="#2a2a35" />
            <path d={histPath} fill="none" stroke="#ffd166" strokeWidth="2" />
          </svg>
        </div>

        {/* CONTROLS */}
        <div className="viz-card" style={{ marginBottom: 24 }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24, alignItems: "end" }}>
            <div>
              <div style={{ fontSize: 11, letterSpacing: "0.2em", color: "#666", marginBottom: 6 }}>
                STREAM SPEED · v = {velocity.toFixed(2)}
              </div>
              <input
                type="range"
                min="0.05"
                max="1.5"
                step="0.05"
                value={velocity}
                onChange={(e) => setVelocity(parseFloat(e.target.value))}
              />
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button className="control-btn" onClick={() => setRunning((r) => !r)}>
                {running ? "❚❚ Pause" : "▶ Play"}
              </button>
              <button className="control-btn" onClick={reset}>↺ Reset</button>
              <button className={`control-btn ${showTrails ? "active" : ""}`} onClick={() => setShowTrails((s) => !s)}>
                Trails
              </button>
            </div>
          </div>
        </div>

        {/* ANALYSIS */}
        <div className="viz-card" style={{ marginBottom: 20, background: "#0d0d18" }}>
          <h2 className="display" style={{ fontSize: 22, fontStyle: "italic", margin: "0 0 14px 0", fontWeight: 600 }}>
            What you're watching
          </h2>
          <div style={{ display: "grid", gap: 16 }}>
            <Block
              color="#7af0a8"
              title="UNIFORM · ∂f/∂x = 0"
              math="v · ∂f/∂x = v · 0 = 0"
              text="Tons of particles flow in from the left and tons flow out to the right — but the count inside the window stays roughly constant. IN ≈ OUT. Lots of motion, no change. This is exactly the case where 'particles passing by' ≠ 'streaming term.'"
            />
            <Block
              color="#ff7a7a"
              title="FALLING · ∂f/∂x < 0"
              math="v · ∂f/∂x < 0  →  ∂f/∂t > 0  ...wait, look at it"
              text="Density is high on the left, low on the right. Lots of particles flow IN from the dense left side; few flow OUT to the sparse right side. IN > OUT, so the count rises... but wait — actually we're watching f at the window get RESUPPLIED from a denser region behind it. The window count drifts depending on whether more dense or less dense material is arriving."
            />
            <Block
              color="#ffd166"
              title="THE INSIGHT"
              math="rate of change at the window = − v · ∂f/∂x"
              text="It's not how many particles pass through — it's the IMBALANCE between in and out. Big v means particles flow fast, but if they all carry the same density, the imbalance is still zero. You only get a nonzero streaming term when v ≠ 0 AND ∂f/∂x ≠ 0."
            />
          </div>
        </div>

        <div style={{ fontSize: 12, color: "#555", textAlign: "center" }}>
          Try: Uniform → IN and OUT counters tick up together. Falling → they drift apart. Crank v higher to see the imbalance grow proportionally.
        </div>
      </div>
    </div>
  );
}

function Block({ color, title, math, text }) {
  return (
    <div style={{ borderLeft: `2px solid ${color}`, paddingLeft: 16 }}>
      <div style={{ fontSize: 11, color, letterSpacing: "0.2em", marginBottom: 4 }}>{title}</div>
      <div className="display" style={{ fontSize: 16, fontStyle: "italic", color: "#fff", marginBottom: 6 }}>
        {math}
      </div>
      <div style={{ fontSize: 13, lineHeight: 1.55, color: "#b0b0bc" }}>{text}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Block));
</script>
<script>window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+='\n'+e.message;});</script>
