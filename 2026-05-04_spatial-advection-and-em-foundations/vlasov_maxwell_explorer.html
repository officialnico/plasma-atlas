const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect,useReducer,useContext,createContext,forwardRef,memo,Fragment,Children,cloneElement} = React;



// Comprehensive Vlasov-Maxwell explorer
// Click any term in the equations -> get explanations + visualization
// Levels: layperson, undergrad, advanced

function VlasovMaxwellExplorer() {
  const [selected, setSelected] = useState("dfdt");
  const [level, setLevel] = useState("intuitive"); // "intuitive" | "undergrad" | "advanced"

  return (
    <div style={{
      minHeight: "100vh",
      background: "#08080d",
      color: "#e8e8ee",
      fontFamily: "'JetBrains Mono', 'Courier New', monospace",
      padding: "32px 24px",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500;700&display=swap');
        * { box-sizing: border-box; }
        body { margin: 0; }
        .display { font-family: 'Fraunces', serif; }
        .control-btn {
          background: transparent; border: 1px solid #2a2a35;
          color: #e8e8ee; padding: 7px 12px;
          font-family: inherit; font-size: 11px; letter-spacing: 0.05em;
          cursor: pointer; transition: all 0.15s ease; text-transform: uppercase;
        }
        .control-btn:hover { border-color: #ff5c3a; color: #ff5c3a; }
        .control-btn.active { background: #ff5c3a; color: #0a0a0f; border-color: #ff5c3a; }
        .viz-card { background: #11111a; border: 1px solid #1f1f2c; padding: 18px; }
        .term {
          display: inline-block;
          padding: 6px 10px;
          margin: 2px;
          border-radius: 4px;
          cursor: pointer;
          font-family: 'Fraunces', serif;
          font-style: italic;
          transition: all 0.15s ease;
          border: 1px solid transparent;
          font-size: 24px;
        }
        .term:hover {
          background: #1f1f2c;
          border-color: #ff5c3a;
        }
        .term.active {
          background: #ff5c3a;
          color: #0a0a0f;
          border-color: #ff5c3a;
        }
        .term.dim { color: #555; font-size: 24px; padding: 6px 4px; }
        .level-btn {
          padding: 5px 10px; font-size: 10px;
        }
        .smooth-slider {
          -webkit-appearance: none; appearance: none;
          background: transparent; width: 100%; height: 26px; touch-action: none;
        }
        .smooth-slider::-webkit-slider-runnable-track {
          height: 5px; background: linear-gradient(90deg, #1a1a26, #2a2a3a);
          border-radius: 3px; border: 1px solid #1f1f2c;
        }
        .smooth-slider::-webkit-slider-thumb {
          -webkit-appearance: none; appearance: none;
          background: radial-gradient(circle at 30% 30%, #ff8c6a, #ff5c3a);
          height: 18px; width: 18px; border-radius: 50%; margin-top: -7px;
          cursor: grab;
          box-shadow: 0 2px 8px rgba(255,92,58,0.5);
          border: 2px solid #08080d;
        }
        .smooth-slider::-moz-range-thumb {
          background: radial-gradient(circle at 30% 30%, #ff8c6a, #ff5c3a);
          height: 18px; width: 18px; border-radius: 50%;
          cursor: grab; border: 2px solid #08080d;
          box-shadow: 0 2px 8px rgba(255,92,58,0.5);
        }
      `}</style>

      <div style={{ maxWidth: 1100, margin: "0 auto" }}>
        <div style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 11, letterSpacing: "0.3em", color: "#ff5c3a", marginBottom: 10 }}>
            VLASOV–MAXWELL · CLICKABLE EXPLORER
          </div>
          <h1 className="display" style={{ fontSize: 36, lineHeight: 1.0, margin: 0, fontWeight: 800, fontStyle: "italic" }}>
            Click any term
          </h1>
          <p style={{ fontSize: 13, color: "#b0b0bc", marginTop: 12, lineHeight: 1.6, maxWidth: 750 }}>
            The full Vlasov–Maxwell system. Tap any colored term to learn what it does, see its inputs and outputs, and play with a live visualization. Switch the explanation level depending on how deep you want to go.
          </p>
        </div>

        {/* LEVEL SWITCHER */}
        <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
          <button className={`control-btn level-btn ${level === "intuitive" ? "active" : ""}`} onClick={() => setLevel("intuitive")}>1 · Intuitive</button>
          <button className={`control-btn level-btn ${level === "undergrad" ? "active" : ""}`} onClick={() => setLevel("undergrad")}>2 · Undergrad</button>
          <button className={`control-btn level-btn ${level === "advanced" ? "active" : ""}`} onClick={() => setLevel("advanced")}>3 · Advanced</button>
        </div>

        {/* VLASOV EQUATION */}
        <div className="viz-card" style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 14 }}>
            VLASOV EQUATION (per species s)
          </div>
          <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", justifyContent: "center", gap: 4 }}>
            <Term id="dfdt" label="∂f_s/∂t" sel={selected} setSel={setSelected} color="#ff5c3a" />
            <span className="term dim">+</span>
            <Term id="streaming" label="v · ∇_x f_s" sel={selected} setSel={setSelected} color="#5b8def" />
            <span className="term dim">+</span>
            <Term id="qm" label="q_s/m_s" sel={selected} setSel={setSelected} color="#ffd166" />
            <span className="term dim">(</span>
            <Term id="E" label="E" sel={selected} setSel={setSelected} color="#7af0a8" />
            <span className="term dim">+</span>
            <Term id="vxB" label="v × B" sel={selected} setSel={setSelected} color="#9d8df1" />
            <span className="term dim">) ·</span>
            <Term id="dfdv" label="∇_v f_s" sel={selected} setSel={setSelected} color="#3ec6c2" />
            <span className="term dim">= 0</span>
          </div>
        </div>

        {/* SPECIES NOTE */}
        <div className="viz-card" style={{ marginBottom: 12, background: "#0d0d18", padding: "12px 16px" }}>
          <div style={{ fontSize: 12, color: "#b0b0bc", lineHeight: 1.55 }}>
            <span style={{ color: "#ff5c3a", fontWeight: 600 }}>"per species s"</span> — a plasma usually contains multiple particle types (electrons, ions, sometimes more). You write this same equation <em>once for each type</em>. Electrons and ions have different masses and charges (different q/m), so they obey different versions. They share the same E and B fields though — that's how they couple together.
          </div>
        </div>

        {/* MAXWELL'S EQUATIONS */}
        <div className="viz-card" style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 14 }}>
            MAXWELL'S EQUATIONS · how E and B are computed
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, alignItems: "center" }}>
            <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", justifyContent: "center", gap: 4 }}>
              <Term id="gauss" label="∇ · E = ρ/ε₀" sel={selected} setSel={setSelected} color="#7af0a8" />
              <span style={{ fontSize: 11, color: "#666", marginLeft: 12 }}>(Gauss — charges make E)</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", justifyContent: "center", gap: 4 }}>
              <Term id="nomonopoles" label="∇ · B = 0" sel={selected} setSel={setSelected} color="#9d8def" />
              <span style={{ fontSize: 11, color: "#666", marginLeft: 12 }}>(no magnetic monopoles)</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", justifyContent: "center", gap: 4 }}>
              <Term id="faraday" label="∇ × E = −∂B/∂t" sel={selected} setSel={setSelected} color="#7af0a8" />
              <span style={{ fontSize: 11, color: "#666", marginLeft: 12 }}>(Faraday — changing B makes E)</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", justifyContent: "center", gap: 4 }}>
              <Term id="ampere" label="∇ × B = μ₀J + μ₀ε₀ ∂E/∂t" sel={selected} setSel={setSelected} color="#9d8def" />
              <span style={{ fontSize: 11, color: "#666", marginLeft: 12 }}>(Ampère–Maxwell — currents and changing E make B)</span>
            </div>
          </div>
        </div>

        {/* COUPLING */}
        <div className="viz-card" style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 14 }}>
            COUPLING · how species feed Maxwell
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, alignItems: "center" }}>
            <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", justifyContent: "center", gap: 4 }}>
              <Term id="rho" label="ρ = Σ_s q_s ∫f_s d³v" sel={selected} setSel={setSelected} color="#ff7a7a" />
              <span style={{ fontSize: 11, color: "#666", marginLeft: 12 }}>(charge density from all species)</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", justifyContent: "center", gap: 4 }}>
              <Term id="J" label="J = Σ_s q_s ∫v f_s d³v" sel={selected} setSel={setSelected} color="#ffd166" />
              <span style={{ fontSize: 11, color: "#666", marginLeft: 12 }}>(current density from all species)</span>
            </div>
          </div>
        </div>

        {/* DETAIL PANEL */}
        <TermDetail termId={selected} level={level} />

        {/* THE LOOP */}
        <div className="viz-card" style={{ background: "#0d0d18", marginTop: 14 }}>
          <div className="display" style={{ fontSize: 18, fontStyle: "italic", marginBottom: 10 }}>
            How the whole loop fits together
          </div>
          <div style={{ display: "grid", gap: 10, fontSize: 13, color: "#b0b0bc", lineHeight: 1.55 }}>
            <div>1. Each species has its own f_s (electrons, ions, ...).</div>
            <div>2. Sum charges and currents across species → ρ and J.</div>
            <div>3. Plug ρ and J into Maxwell → get E and B everywhere.</div>
            <div>4. Plug E and B back into each species' Vlasov equation → get how each f_s evolves.</div>
            <div>5. Step forward in time. Repeat.</div>
            <div style={{ marginTop: 6, color: "#ffd166" }}>It's a self-consistent loop — the fields shape the particles, the particles shape the fields, both update together.</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Term({ id, label, sel, setSel, color }) {
  const isActive = sel === id;
  return (
    <span
      className={`term ${isActive ? "active" : ""}`}
      onClick={() => setSel(id)}
      style={{
        color: isActive ? "#0a0a0f" : color,
        background: isActive ? color : "transparent",
        borderColor: isActive ? color : "transparent",
      }}
    >
      {label}
    </span>
  );
}

// =================== DETAIL PANELS ===================
function TermDetail({ termId, level }) {
  const detail = DETAILS[termId];
  if (!detail) return null;
  const Viz = detail.viz;
  return (
    <div className="viz-card" style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        TERM · {detail.label}
      </div>
      <div className="display" style={{ fontSize: 26, fontStyle: "italic", color: detail.color, marginBottom: 14 }}>
        {detail.symbol}
      </div>
      <div style={{ fontSize: 13, color: "#e8e8ee", lineHeight: 1.65, marginBottom: 16 }}>
        {detail[level]}
      </div>
      <div style={{ display: "grid", gap: 12, marginBottom: 16 }}>
        <div style={{ background: "#0d0d18", padding: "10px 14px", borderLeft: "2px solid #7af0a8" }}>
          <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#7af0a8", marginBottom: 4 }}>INPUTS</div>
          <div style={{ fontSize: 12, color: "#b0b0bc", lineHeight: 1.55 }}>{detail.inputs}</div>
        </div>
        <div style={{ background: "#0d0d18", padding: "10px 14px", borderLeft: "2px solid #ff5c3a" }}>
          <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#ff5c3a", marginBottom: 4 }}>OUTPUT</div>
          <div style={{ fontSize: 12, color: "#b0b0bc", lineHeight: 1.55 }}>{detail.outputs}</div>
        </div>
      </div>
      {Viz && <div style={{ marginTop: 6 }}><Viz /></div>}
    </div>
  );
}

// =================== VIZ COMPONENTS ===================
function StreamingViz() {
  const [v, setV] = useState(1.0);
  const [t, setT] = useState(0);
  useEffect(() => {
    let raf;
    let last = performance.now();
    const tick = (now) => {
      const dt = (now - last) / 1000;
      last = now;
      setT(prev => (prev + dt * v) % 8);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [v]);

  const W = 480, H = 120;
  const f = (x) => Math.exp(-Math.pow((x - 2 - t) % 8 - 2, 2) / 0.6);
  let path = "";
  for (let i = 0; i <= 200; i++) {
    const x = (i / 200) * 8;
    const px = (x / 8) * W;
    const py = H - 20 - f(x) * 70;
    path += `${i === 0 ? "M" : "L"}${px.toFixed(2)},${py.toFixed(2)} `;
  }
  return (
    <div style={{ background: "#0d0d18", padding: 14, borderRadius: 4 }}>
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        f(x, t) STREAMING TO THE RIGHT AT v = {v.toFixed(2)}
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
        <line x1="0" y1={H - 20} x2={W} y2={H - 20} stroke="#1f1f2c" />
        <path d={path} fill="none" stroke="#5b8def" strokeWidth="2.5" />
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", margin: "6px 0 4px" }}>
        <span>v</span><span style={{ color: "#fff" }}>{v.toFixed(2)}</span>
      </div>
      <input className="smooth-slider" type="range" min="-2" max="2" step="0.01" value={v} onChange={e => setV(parseFloat(e.target.value))} />
    </div>
  );
}

function ForceViz() {
  // animated v vs E push
  const [E, setE] = useState(0.5);
  const [vTrack, setVTrack] = useState(0);
  useEffect(() => {
    let raf;
    let last = performance.now();
    const tick = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      setVTrack(prev => {
        let nv = prev + E * dt;
        if (Math.abs(nv) > 3) nv = -Math.sign(nv) * 3;
        return nv;
      });
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [E]);

  const W = 480, H = 100;
  return (
    <div style={{ background: "#0d0d18", padding: 14, borderRadius: 4 }}>
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        PARTICLE VELOCITY DRIFTS UP/DOWN AS E PUSHES IT
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
        <line x1="20" y1={H/2} x2={W - 20} y2={H/2} stroke="#1f1f2c" strokeDasharray="2,3" />
        <text x="10" y={H/2 + 3} fontSize="9" fill="#666" textAnchor="end">v=0</text>
        {/* particle */}
        <circle
          cx={W/2}
          cy={H/2 - vTrack * 14}
          r="8"
          fill="#7af0a8"
        />
        {/* arrow showing velocity */}
        <line
          x1={W/2 + 14} y1={H/2 - vTrack * 14}
          x2={W/2 + 14 + vTrack * 14} y2={H/2 - vTrack * 14}
          stroke="#7af0a8" strokeWidth="2"
        />
        <text x={W/2 - 30} y={20} fontSize="11" fill="#7af0a8" fontStyle="italic">
          current v = {vTrack.toFixed(2)}
        </text>
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", margin: "6px 0 4px" }}>
        <span>E (force, normalized)</span><span style={{ color: "#fff" }}>{E.toFixed(2)}</span>
      </div>
      <input className="smooth-slider" type="range" min="-1.5" max="1.5" step="0.01" value={E} onChange={e => setE(parseFloat(e.target.value))} />
    </div>
  );
}

function QMViz() {
  const W = 480, H = 120;
  return (
    <div style={{ background: "#0d0d18", padding: 14, borderRadius: 4 }}>
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        ELECTRON vs PROTON RESPONSE TO SAME FORCE
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
        <line x1="20" y1={H - 30} x2={W - 20} y2={H - 30} stroke="#1f1f2c" />
        {/* electron */}
        <circle cx="80" cy={H - 30} r="5" fill="#5b8def" />
        <text x="80" y={H - 40} fontSize="10" fill="#5b8def" textAnchor="middle">e⁻</text>
        <line x1="86" y1={H - 30} x2={W - 30} y2={H - 30} stroke="#5b8def" strokeWidth="2" markerEnd="url(#ar1)" />
        <text x={W/2} y={H - 38} fontSize="9" fill="#5b8def" textAnchor="middle">huge acceleration · q/m ≈ −1.76×10¹¹</text>

        {/* proton */}
        <circle cx="80" cy={30} r="7" fill="#ff7a7a" />
        <text x="80" y={20} fontSize="10" fill="#ff7a7a" textAnchor="middle">p⁺</text>
        <line x1="87" y1={30} x2={120} y2={30} stroke="#ff7a7a" strokeWidth="2" markerEnd="url(#ar2)" />
        <text x={W/2} y={22} fontSize="9" fill="#ff7a7a" textAnchor="middle">tiny acceleration · q/m ≈ +9.6×10⁷</text>

        <defs>
          <marker id="ar1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <polygon points="0 0, 6 3, 0 6" fill="#5b8def" />
          </marker>
          <marker id="ar2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <polygon points="0 0, 6 3, 0 6" fill="#ff7a7a" />
          </marker>
        </defs>
      </svg>
      <div style={{ fontSize: 11, color: "#888", marginTop: 8, lineHeight: 1.5 }}>
        Same E field, vastly different responses. Electrons are ~1836× lighter, so they respond ~1836× more strongly.
        This is why electrons do most of the "work" in plasma — shielding, waves, instabilities all happen on electron timescales.
      </div>
    </div>
  );
}

function VxBViz() {
  const [B, setB] = useState(1);
  const [t, setT] = useState(0);
  useEffect(() => {
    let raf;
    let last = performance.now();
    const tick = (now) => {
      const dt = (now - last) / 1000;
      last = now;
      setT(prev => prev + dt * B);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [B]);

  const W = 480, H = 200;
  const cx = W / 2, cy = H / 2;
  const r = 50;
  const px = cx + r * Math.cos(t * 2);
  const py = cy + r * Math.sin(t * 2);
  // velocity tangent
  const vx = -Math.sin(t * 2);
  const vy = Math.cos(t * 2);
  return (
    <div style={{ background: "#0d0d18", padding: 14, borderRadius: 4 }}>
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>
        v × B FORCES PARTICLES INTO CIRCULAR ORBITS · gyromotion
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
        {/* B field indicator: dots in plane (out of page) */}
        {[0.2, 0.4, 0.6, 0.8].map((fy, j) => (
          [0.1, 0.25, 0.4, 0.55, 0.7, 0.85].map((fx, i) => (
            <circle key={`${i}-${j}`} cx={W * fx} cy={H * fy} r="1.5" fill="#9d8df1" opacity="0.4" />
          ))
        ))}
        <text x={20} y={20} fontSize="10" fill="#9d8df1" fontStyle="italic">B out of page</text>

        {/* orbit */}
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="#9d8df1" strokeOpacity="0.3" strokeDasharray="3,3" />
        {/* particle */}
        <circle cx={px} cy={py} r="8" fill="#ffd166" />
        {/* velocity arrow */}
        <line x1={px} y1={py} x2={px + vx * 30} y2={py + vy * 30} stroke="#7af0a8" strokeWidth="2.5" markerEnd="url(#avhead)" />
        <text x={px + vx * 35} y={py + vy * 35} fontSize="10" fill="#7af0a8" fontStyle="italic">v</text>
        {/* force arrow (centripetal) */}
        <line x1={px} y1={py} x2={cx + (px - cx) * 0.4} y2={cy + (py - cy) * 0.4} stroke="#ff5c3a" strokeWidth="2.5" markerEnd="url(#fhead)" />
        <text x={cx + (px - cx) * 0.3} y={cy + (py - cy) * 0.3 - 4} fontSize="10" fill="#ff5c3a" fontStyle="italic">qv×B</text>

        <defs>
          <marker id="avhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <polygon points="0 0, 6 3, 0 6" fill="#7af0a8" />
          </marker>
          <marker id="fhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <polygon points="0 0, 6 3, 0 6" fill="#ff5c3a" />
          </marker>
        </defs>
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#666", margin: "6px 0 4px" }}>
        <span>|B|</span><span style={{ color: "#fff" }}>{B.toFixed(2)}</span>
      </div>
      <input className="smooth-slider" type="range" min="0.1" max="3" step="0.01" value={B} onChange={e => setB(parseFloat(e.target.value))} />
      <div style={{ fontSize: 11, color: "#888", marginTop: 8 }}>
        Stronger B → faster gyration → tighter orbits. The force is always perpendicular to v, so it bends the path but never speeds the particle up or slows it down.
      </div>
    </div>
  );
}

function GaussViz() {
  const [Q, setQ] = useState(1);
  const W = 480, H = 200;
  const cx = W/2, cy = H/2;
  // E field arrows pointing radially outward
  const arrows = [];
  for (let a = 0; a < 16; a++) {
    const ang = (a / 16) * Math.PI * 2;

  }
  return (
    <div style={{ background: "#0d0d18", padding: 14, borderRadius: 4 }}>
      <div style={{ fontSize: 10, letterSpacing: "0.2em", color: "#666", marginBottom: 8 }}>

      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
        {arrows.map((a, i) => {
          const x1 = a.sign > 0 ? a.x1 : a.x2;
          const x2 = a.sign > 0 ? a.x2 : a.x1;
          const y1 = a.sign > 0 ? a.y1 : a.y2;
          const y2 = a.sign > 0 ? a.y2 : a.y1;
          return (
            <g key={i}>
              <line x1={x1} y1={y1} x2={x2} y2={y2} stroke="#7af0a8" strokeWidth="1.5" markerEnd="url(#earrow)" />

        <text x={cx} y={cy + 5} fontSize="18" fill="#0a0a0f" textAnchor="middle" fontWeight="700">{Q > 0 ? "+" : "−"}</text>
        <defs>
          <marker id="earrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
