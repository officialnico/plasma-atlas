<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>lorentz force 3d</title>
<style>html,body{margin:0;background:#0c0d10;color:#e8eaf0;font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif}
#root{min-height:100vh}#err{display:none;white-space:pre-wrap;padding:24px;color:#f0736a;font:13px/1.5 ui-monospace,Menlo,monospace}</style>
<div id="root"></div><pre id="err"></pre>
<script src="../_lib/react/libs-base.js"></script>
<script src="../_lib/react/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect,useReducer,useContext,createContext,forwardRef,memo,Fragment,Children,cloneElement} = React;



const LorentzForce3D = () => {
  const canvasRef = useRef(null);
  const [rotationX, setRotationX] = useState(-20);
  const [rotationY, setRotationY] = useState(30);
  const [isDragging, setIsDragging] = useState(false);
  const [lastMouse, setLastMouse] = useState({ x: 0, y: 0 });
  
  // Physics parameters
  const [velocityTheta, setVelocityTheta] = useState(0); // Azimuthal angle (xy plane)
  const [velocityPhi, setVelocityPhi] = useState(90); // Polar angle from z-axis
  const [bFieldTheta, setBFieldTheta] = useState(270); // B field azimuthal
  const [bFieldPhi, setBFieldPhi] = useState(90); // B field polar (90 = in xy plane)
  const [charge, setCharge] = useState(1); // +1 or -1
  const [showParticlePath, setShowParticlePath] = useState(true);
  const [animating, setAnimating] = useState(false);
  const [particlePos, setParticlePos] = useState({ x: 0, y: 0, z: 0 });
  const [particleVel, setParticleVel] = useState(null);
  const animationRef = useRef(null);
  const [time, setTime] = useState(0);

  // Convert spherical to cartesian
  const sphericalToCartesian = (theta, phi, magnitude = 1) => {
    const thetaRad = (theta * Math.PI) / 180;
    const phiRad = (phi * Math.PI) / 180;
    return {
      x: magnitude * Math.sin(phiRad) * Math.cos(thetaRad),
      y: magnitude * Math.sin(phiRad) * Math.sin(thetaRad),
      z: magnitude * Math.cos(phiRad)
    };
  };

  // Cross product
  const crossProduct = (a, b) => ({
    x: a.y * b.z - a.z * b.y,
    y: a.z * b.x - a.x * b.z,
    z: a.x * b.y - a.y * b.x
  });

  // Vector magnitude
  const magnitude = (v) => Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);

  // Normalize vector
  const normalize = (v) => {
    const mag = magnitude(v);
    if (mag === 0) return { x: 0, y: 0, z: 0 };
    return { x: v.x / mag, y: v.y / mag, z: v.z / mag };
  };

  // Scale vector
  const scale = (v, s) => ({ x: v.x * s, y: v.y * s, z: v.z * s });

  // Add vectors
  const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y, z: a.z + b.z });

  // Get current vectors
  const getVectors = () => {
    const v = sphericalToCartesian(velocityTheta, velocityPhi, 1);
    const B = sphericalToCartesian(bFieldTheta, bFieldPhi, 1);
    const F = scale(crossProduct(v, B), charge);
    return { v, B, F };
  };

  // 3D rotation and projection
  const project3D = (point, rotX, rotY, scale = 100, offsetX = 250, offsetY = 200) => {
    const radX = (rotX * Math.PI) / 180;
    const radY = (rotY * Math.PI) / 180;
    
    // Rotate around Y axis
    let x = point.x * Math.cos(radY) - point.z * Math.sin(radY);
    let z = point.x * Math.sin(radY) + point.z * Math.cos(radY);
    let y = point.y;
    
    // Rotate around X axis
    let y2 = y * Math.cos(radX) - z * Math.sin(radX);
    let z2 = y * Math.sin(radX) + z * Math.cos(radX);
    
    // Project to 2D with perspective
    const perspective = 5;
    const factor = perspective / (perspective + z2);
    
    return {
      x: offsetX + x * scale * factor,
      y: offsetY - y2 * scale * factor,
      z: z2,
      factor
    };
  };

  // Draw arrow in 3D
  const drawArrow3D = (ctx, start, direction, color, label, rotX, rotY, arrowScale = 1.5) => {
    const end = {
      x: start.x + direction.x * arrowScale,
      y: start.y + direction.y * arrowScale,
      z: start.z + direction.z * arrowScale
    };
    
    const startProj = project3D(start, rotX, rotY);
    const endProj = project3D(end, rotX, rotY);
    
    // Draw line
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.moveTo(startProj.x, startProj.y);
    ctx.lineTo(endProj.x, endProj.y);
    ctx.stroke();
    
    // Draw arrowhead
    const angle = Math.atan2(endProj.y - startProj.y, endProj.x - startProj.x);
    const headLength = 12;
    
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.moveTo(endProj.x, endProj.y);
    ctx.lineTo(
      endProj.x - headLength * Math.cos(angle - Math.PI / 6),
      endProj.y - headLength * Math.sin(angle - Math.PI / 6)
    );
    ctx.lineTo(
      endProj.x - headLength * Math.cos(angle + Math.PI / 6),
      endProj.y - headLength * Math.sin(angle + Math.PI / 6)
    );
    ctx.closePath();
    ctx.fill();
    
    // Draw label
    ctx.fillStyle = color;
    ctx.font = 'bold 16px Arial';
    ctx.fillText(label, endProj.x + 10, endProj.y - 5);
  };

  // Draw the scene
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    
    // Clear canvas
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, width, height);
    
    const { v, B, F } = getVectors();
    const forceMag = magnitude(F);
    
    // Draw coordinate axes
    const axisLength = 1.2;
    const axes = [
      { dir: { x: axisLength, y: 0, z: 0 }, color: '#666', label: 'x' },
      { dir: { x: 0, y: axisLength, z: 0 }, color: '#666', label: 'y' },
      { dir: { x: 0, y: 0, z: axisLength }, color: '#666', label: 'z' }
    ];
    
    // Draw grid on xy plane
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 0.5;
    for (let i = -2; i <= 2; i += 0.5) {
      const p1 = project3D({ x: i, y: -2, z: 0 }, rotationX, rotationY);
      const p2 = project3D({ x: i, y: 2, z: 0 }, rotationX, rotationY);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
      
      const p3 = project3D({ x: -2, y: i, z: 0 }, rotationX, rotationY);
      const p4 = project3D({ x: 2, y: i, z: 0 }, rotationX, rotationY);
      ctx.beginPath();
      ctx.moveTo(p3.x, p3.y);
      ctx.lineTo(p4.x, p4.y);
      ctx.stroke();
    }
    
    // Draw axes
    axes.forEach(axis => {
      drawArrow3D(ctx, { x: 0, y: 0, z: 0 }, axis.dir, axis.color, axis.label, rotationX, rotationY, 1);
    });
    
    // Draw particle
    const particleProj = project3D(particlePos, rotationX, rotationY);
    const particleRadius = 15 * particleProj.factor;
    
    // Particle glow
    const gradient = ctx.createRadialGradient(
      particleProj.x, particleProj.y, 0,
      particleProj.x, particleProj.y, particleRadius * 2
    );
    gradient.addColorStop(0, charge > 0 ? 'rgba(255, 100, 100, 0.8)' : 'rgba(100, 100, 255, 0.8)');
    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(particleProj.x, particleProj.y, particleRadius * 2, 0, Math.PI * 2);
    ctx.fill();
    
    // Particle body
    ctx.fillStyle = charge > 0 ? '#ff6b6b' : '#6b6bff';
    ctx.beginPath();
    ctx.arc(particleProj.x, particleProj.y, particleRadius, 0, Math.PI * 2);
    ctx.fill();
    
    // Charge symbol
    ctx.fillStyle = 'white';
    ctx.font = `bold ${Math.max(12, particleRadius)}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(charge > 0 ? '+' : '−', particleProj.x, particleProj.y);
    
    // Draw vectors from particle position
    const origin = particlePos;
    
    // Velocity vector (cyan)
    drawArrow3D(ctx, origin, v, '#00ffff', 'v⃗', rotationX, rotationY);
    
    // Magnetic field vector (magenta)
    drawArrow3D(ctx, origin, B, '#ff00ff', 'B⃗', rotationX, rotationY);
    
    // Force vector (yellow/green) - only if non-zero
    if (forceMag > 0.01) {
      const normalizedF = normalize(F);
      drawArrow3D(ctx, origin, normalizedF, '#00ff00', 'F⃗', rotationX, rotationY);
    }
    
    // Draw particle path preview (helical motion)
    if (showParticlePath && forceMag > 0.01) {
      ctx.strokeStyle = 'rgba(255, 255, 100, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      
      let pos = { ...particlePos };
      let vel = { ...v };
      const dt = 0.05;
      const steps = 200;
      
      const firstPoint = project3D(pos, rotationX, rotationY);
      ctx.moveTo(firstPoint.x, firstPoint.y);
      
      for (let i = 0; i < steps; i++) {
        // Calculate force at current position
        const force = scale(crossProduct(vel, B), charge * 0.5);
        
        // Update velocity (simple Euler integration)
        vel = add(vel, scale(force, dt));
        
        // Update position
        pos = add(pos, scale(vel, dt));
        
        const projected = project3D(pos, rotationX, rotationY);
        ctx.lineTo(projected.x, projected.y);
      }
      ctx.stroke();
    }
    
    // Info text
    ctx.fillStyle = '#fff';
    ctx.font = '14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`|F⃗| = |q||v⃗||B⃗|sin(θ) = ${forceMag.toFixed(3)}`, 10, 30);
    
    const angle = Math.acos(
      (v.x * B.x + v.y * B.y + v.z * B.z) / (magnitude(v) * magnitude(B))
    ) * 180 / Math.PI;
    ctx.fillText(`Angle between v⃗ and B⃗: ${angle.toFixed(1)}°`, 10, 50);
    
    if (forceMag < 0.01) {
      ctx.fillStyle = '#ffaa00';
      ctx.fillText('⚠ v⃗ parallel to B⃗ → No force!', 10, 75);
    }
    
  }, [rotationX, rotationY, velocityTheta, velocityPhi, bFieldTheta, bFieldPhi, charge, showParticlePath, particlePos]);

  // Animation loop
  useEffect(() => {
    if (animating) {
      const { v, B } = getVectors();
      let pos = { ...particlePos };
      let vel = scale(v, 0.5);
      
      const animate = () => {
        const force = scale(crossProduct(vel, B), charge * 0.3);
        vel = add(vel, scale(force, 0.016));
        pos = add(pos, scale(vel, 0.016));
        
        // Keep in bounds
        if (magnitude(pos) > 3) {
          pos = { x: 0, y: 0, z: 0 };
          vel = scale(v, 0.5);
        }
        
        setParticlePos(pos);
        animationRef.current = requestAnimationFrame(animate);
      };
      
      animationRef.current = requestAnimationFrame(animate);
    }
    
    return () => {
      if (animationRef.current) {
        cancelAnimationFrame(animationRef.current);
      }
    };
  }, [animating, velocityTheta, velocityPhi, bFieldTheta, bFieldPhi, charge]);

  // Mouse handlers for rotation
  const handleMouseDown = (e) => {
    setIsDragging(true);
    setLastMouse({ x: e.clientX, y: e.clientY });
  };

  const handleMouseMove = (e) => {
    if (!isDragging) return;
    
    const deltaX = e.clientX - lastMouse.x;
    const deltaY = e.clientY - lastMouse.y;
    
    setRotationY(prev => prev + deltaX * 0.5);
    setRotationX(prev => Math.max(-89, Math.min(89, prev + deltaY * 0.5)));
    setLastMouse({ x: e.clientX, y: e.clientY });
  };

  const handleMouseUp = () => {
    setIsDragging(false);
  };

  const resetParticle = () => {
    setParticlePos({ x: 0, y: 0, z: 0 });
    setAnimating(false);
  };

  const presets = [
    { name: 'Classic (v→, B↓)', vTheta: 0, vPhi: 90, bTheta: 270, bPhi: 180 },
    { name: 'Circular Motion', vTheta: 0, vPhi: 90, bTheta: 0, bPhi: 0 },
    { name: 'Helical Path', vTheta: 30, vPhi: 60, bTheta: 0, bPhi: 0 },
    { name: 'No Force (parallel)', vTheta: 0, vPhi: 90, bTheta: 0, bPhi: 90 },
  ];

  return (
    <div className="min-h-screen bg-gray-900 text-white p-4">
      <h1 className="text-2xl font-bold text-center mb-2">
        Lorentz Force: F⃗ = qv⃗ × B⃗
      </h1>
      <p className="text-center text-gray-400 mb-4">
        Drag to rotate view • Adjust vectors with sliders
      </p>
      
      <div className="flex flex-col lg:flex-row gap-4 max-w-6xl mx-auto">
        {/* Canvas */}
        <div className="flex-1">
          <canvas
            ref={canvasRef}
            width={500}
            height={400}
            className="bg-gray-800 rounded-lg cursor-move w-full"
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
          />
          
          {/* Legend */}
          <div className="flex justify-center gap-6 mt-3 text-sm">
            <span className="flex items-center gap-2">
              <span className="w-4 h-1 bg-cyan-400 inline-block"></span> Velocity v⃗
            </span>
            <span className="flex items-center gap-2">
              <span className="w-4 h-1 bg-fuchsia-500 inline-block"></span> Magnetic Field B⃗
            </span>
            <span className="flex items-center gap-2">
              <span className="w-4 h-1 bg-green-400 inline-block"></span> Force F⃗
            </span>
          </div>
        </div>
        
        {/* Controls */}
        <div className="w-full lg:w-72 space-y-4">
          {/* Presets */}
          <div className="bg-gray-800 p-3 rounded-lg">
            <h3 className="font-semibold mb-2">Presets</h3>
            <div className="grid grid-cols-2 gap-2">
              {presets.map((preset, i) => (
                <button
                  key={i}
                  onClick={() => {
                    setVelocityTheta(preset.vTheta);
                    setVelocityPhi(preset.vPhi);
                    setBFieldTheta(preset.bTheta);
                    setBFieldPhi(preset.bPhi);
                    resetParticle();
                  }}
                  className="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded transition"
                >
                  {preset.name}
                </button>
              ))}
            </div>
          </div>
          
          {/* Charge */}
          <div className="bg-gray-800 p-3 rounded-lg">
            <h3 className="font-semibold mb-2">Charge</h3>
            <div className="flex gap-2">
              <button
                onClick={() => setCharge(1)}
                className={`flex-1 py-2 rounded transition ${
                  charge > 0 ? 'bg-red-500' : 'bg-gray-700 hover:bg-gray-600'
                }`}
              >
                + Positive
              </button>
              <button
                onClick={() => setCharge(-1)}
                className={`flex-1 py-2 rounded transition ${
                  charge < 0 ? 'bg-blue-500' : 'bg-gray-700 hover:bg-gray-600'
                }`}
              >
                − Negative
              </button>
            </div>
          </div>
          
          {/* Velocity */}
          <div className="bg-gray-800 p-3 rounded-lg">
            <h3 className="font-semibold mb-2 text-cyan-400">Velocity v⃗</h3>
            <label className="block text-sm text-gray-400">
              Azimuth (θ): {velocityTheta}°
            </label>
            <input
              type="range"
              min="0"
              max="360"
              value={velocityTheta}
              onChange={(e) => setVelocityTheta(Number(e.target.value))}
              className="w-full accent-cyan-400"
            />
            <label className="block text-sm text-gray-400 mt-2">
              Polar (φ): {velocityPhi}°
            </label>
            <input
              type="range"
              min="0"
              max="180"
              value={velocityPhi}
              onChange={(e) => setVelocityPhi(Number(e.target.value))}
              className="w-full accent-cyan-400"
            />
          </div>
          
          {/* Magnetic Field */}
          <div className="bg-gray-800 p-3 rounded-lg">
            <h3 className="font-semibold mb-2 text-fuchsia-400">Magnetic Field B⃗</h3>
            <label className="block text-sm text-gray-400">
              Azimuth (θ): {bFieldTheta}°
            </label>
            <input
              type="range"
              min="0"
              max="360"
              value={bFieldTheta}
              onChange={(e) => setBFieldTheta(Number(e.target.value))}
              className="w-full accent-fuchsia-400"
            />
            <label className="block text-sm text-gray-400 mt-2">
              Polar (φ): {bFieldPhi}°
            </label>
            <input
              type="range"
              min="0"
              max="180"
              value={bFieldPhi}
              onChange={(e) => setBFieldPhi(Number(e.target.value))}
              className="w-full accent-fuchsia-400"
            />
          </div>
          
          {/* Animation Controls */}
          <div className="bg-gray-800 p-3 rounded-lg">
            <h3 className="font-semibold mb-2">Animation</h3>
            <div className="flex gap-2">
              <button
                onClick={() => setAnimating(!animating)}
                className={`flex-1 py-2 rounded transition ${
                  animating ? 'bg-yellow-600' : 'bg-green-600 hover:bg-green-500'
                }`}
              >
                {animating ? '⏸ Pause' : '▶ Play'}
              </button>
              <button
                onClick={resetParticle}
                className="flex-1 py-2 rounded bg-gray-700 hover:bg-gray-600 transition"
              >
                ↺ Reset
              </button>
            </div>
            <label className="flex items-center gap-2 mt-2 text-sm">
              <input
                type="checkbox"
                checked={showParticlePath}
                onChange={(e) => setShowParticlePath(e.target.checked)}
                className="accent-yellow-400"
              />
              Show trajectory preview
            </label>
          </div>
        </div>
      </div>
      
      {/* Explanation */}
      <div className="max-w-2xl mx-auto mt-6 bg-gray-800 p-4 rounded-lg text-sm">
        <h3 className="font-semibold mb-2">Understanding the Cross Product</h3>
        <p className="text-gray-300">
          The force F⃗ is always <strong>perpendicular</strong> to both v⃗ and B⃗. 
          Use the <strong>right-hand rule</strong>: point fingers along v⃗, curl toward B⃗, 
          thumb points in F⃗ direction (for positive charge). The force magnitude is 
          |F| = |q||v||B|sin(θ), where θ is the angle between v⃗ and B⃗.
        </p>
        <p className="text-gray-400 mt-2">
          Notice: When v⃗ is parallel to B⃗ (θ = 0° or 180°), the force is zero! 
          This is why charged particles spiral along magnetic field lines.
        </p>
      </div>
    </div>
  );
};


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(LorentzForce3D));
</script>
<script>window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+='\n'+e.message;});</script>
