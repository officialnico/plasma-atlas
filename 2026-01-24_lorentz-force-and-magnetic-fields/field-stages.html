<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>field stages</title>
<style>html,body{margin:0;background:#0c0d10;color:#e8eaf0;font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif}
#root{min-height:100vh}#err{display:none;white-space:pre-wrap;padding:24px;color:#f0736a;font:13px/1.5 ui-monospace,Menlo,monospace}</style>
<div id="root"></div><pre id="err"></pre>
<script src="../_lib/react/libs-base.js"></script>
<script src="../_lib/react/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect,useReducer,useContext,createContext,forwardRef,memo,Fragment,Children,cloneElement} = React;



const ToroidalFieldStages = () => {
  const canvasRef = useRef(null);
  const [stage, setStage] = useState(0);
  const [isPlaying, setIsPlaying] = useState(true);
  const [time, setTime] = useState(0);
  const [speed, setSpeed] = useState(1);
  const [showForceVectors, setShowForceVectors] = useState(true);
  const [showDrift, setShowDrift] = useState(true);
  const animationRef = useRef(null);
  const lastTimeRef = useRef(Date.now());

  const stages = [
    {
      name: "No Field",
      description: "Particle moves in a straight line. No magnetic field, no force. It just flies off.",
      hasToroidal: false,
      hasPoloidal: false,
      color: '#666'
    },
    {
      name: "Toroidal Field Only",
      description: "Field goes around the donut (purple arrows). Particle spirals... but DRIFTS VERTICALLY because the field is stronger on the inside than outside. It will hit the wall!",
      hasToroidal: true,
      hasPoloidal: false,
      color: '#aa55ff'
    },
    {
      name: "Toroidal + Poloidal (The Twist)",
      description: "Now we add the poloidal field from plasma current. Field lines become HELICAL. Particle follows the twist - drifts up on one side, down on the other. Drifts CANCEL OUT. Confinement!",
      hasToroidal: true,
      hasPoloidal: true,
      color: '#55ffaa'
    }
  ];

  // Animation loop
  useEffect(() => {
    if (!isPlaying) return;
    
    const animate = () => {
      const now = Date.now();
      const delta = (now - lastTimeRef.current) / 1000;
      lastTimeRef.current = now;
      setTime(t => t + delta * speed);
      animationRef.current = requestAnimationFrame(animate);
    };
    
    animationRef.current = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(animationRef.current);
  }, [isPlaying, speed]);

  // Main render
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const centerX = width / 2;
    const centerY = height / 2;
    
    // Clear
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, width, height);
    
    const currentStage = stages[stage];
    
    // Torus parameters (top-down view)
    const R = 120; // Major radius
    const r = 40;  // Minor radius
    
    // Draw torus outline (top-down view - two concentric circles)
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    
    // Outer edge
    ctx.beginPath();
    ctx.arc(centerX, centerY, R + r, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner edge
    ctx.beginPath();
    ctx.arc(centerX, centerY, R - r, 0, Math.PI * 2);
    ctx.stroke();
    
    // Fill plasma region
    ctx.fillStyle = 'rgba(255, 100, 150, 0.1)';
    ctx.beginPath();
    ctx.arc(centerX, centerY, R + r, 0, Math.PI * 2);
    ctx.arc(centerX, centerY, R - r, 0, Math.PI * 2, true);
    ctx.fill();
    
    // Draw center point
    ctx.fillStyle = '#444';
    ctx.beginPath();
    ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
    ctx.fill();
    
    // Draw toroidal field arrows (going around the donut)
    if (currentStage.hasToroidal) {
      ctx.strokeStyle = '#aa55ff';
      ctx.fillStyle = '#aa55ff';
      ctx.lineWidth = 2;
      
      for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        const x = centerX + R * Math.cos(angle);
        const y = centerY + R * Math.sin(angle);
        
        // Arrow tangent to circle (toroidal direction)
        const tangentAngle = angle + Math.PI / 2;
        const arrowLength = 20;
        
        const endX = x + arrowLength * Math.cos(tangentAngle);
        const endY = y + arrowLength * Math.sin(tangentAngle);
        
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(endX, endY);
        ctx.stroke();
        
        // Arrowhead
        const headLength = 6;
        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX - headLength * Math.cos(tangentAngle - Math.PI/6), endY - headLength * Math.sin(tangentAngle - Math.PI/6));
        ctx.lineTo(endX - headLength * Math.cos(tangentAngle + Math.PI/6), endY - headLength * Math.sin(tangentAngle + Math.PI/6));
        ctx.closePath();
        ctx.fill();
      }
      
      // Show field strength gradient
      ctx.font = '12px Arial';
      ctx.fillStyle = '#aa55ff';
      ctx.textAlign = 'center';
      ctx.fillText('Strong B', centerX, centerY - 10);
      ctx.fillText('(inside)', centerX, centerY + 5);
      
      ctx.fillStyle = '#6633aa';
      ctx.fillText('Weak B', centerX + R + r + 30, centerY);
      ctx.fillText('(outside)', centerX + R + r + 30, centerY + 15);
    }
    
    // Calculate particle position based on stage
    let particleX, particleY, particleAngle;
    let velocityAngle, driftY = 0;
    
    if (stage === 0) {
      // No field - straight line, flies off
      const startX = centerX + R;
      const startY = centerY;
      particleX = startX + (time * 50) % 300;
      particleY = startY;
      velocityAngle = 0;
      
      if (particleX > width - 50) {
        setTime(0);
      }
    } else if (stage === 1) {
      // Toroidal only - circles but drifts up
      particleAngle = time * 0.8;
      driftY = -time * 15; // Drifts UP over time
      
      // Reset when it drifts too far
      if (Math.abs(driftY) > r + 20) {
        setTime(0);
      }
      
      particleX = centerX + R * Math.cos(particleAngle);
      particleY = centerY + R * Math.sin(particleAngle) + driftY;
      velocityAngle = particleAngle + Math.PI / 2;
    } else {
      // Toroidal + Poloidal - helical, drifts cancel
      particleAngle = time * 0.8;
      const poloidalAngle = time * 2.5; // Faster poloidal rotation
      
      // Drift oscillates instead of accumulating!
      driftY = Math.sin(poloidalAngle) * 25;
      
      particleX = centerX + R * Math.cos(particleAngle);
      particleY = centerY + R * Math.sin(particleAngle) + driftY;
      velocityAngle = particleAngle + Math.PI / 2;
    }
    
    // Draw particle trail
    ctx.strokeStyle = stage === 0 ? 'rgba(255,255,255,0.3)' : 
                      stage === 1 ? 'rgba(255,100,100,0.5)' : 
                      'rgba(100,255,150,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    
    const trailLength = 150;
    for (let i = 0; i < trailLength; i++) {
      const trailTime = time - i * 0.02;
      if (trailTime < 0) continue;
      
      let tx, ty;
      if (stage === 0) {
        tx = centerX + R + (trailTime * 50) % 300;
        ty = centerY;
      } else if (stage === 1) {
        const ta = trailTime * 0.8;
        const td = -trailTime * 15;
        tx = centerX + R * Math.cos(ta);
        ty = centerY + R * Math.sin(ta) + td;
      } else {
        const ta = trailTime * 0.8;
        const tp = trailTime * 2.5;
        const td = Math.sin(tp) * 25;
        tx = centerX + R * Math.cos(ta);
        ty = centerY + R * Math.sin(ta) + td;
      }
      
      if (i === 0) ctx.moveTo(tx, ty);
      else ctx.lineTo(tx, ty);
    }
    ctx.stroke();
    
    // Draw particle
    const particleRadius = 10;
    
    // Glow
    const gradient = ctx.createRadialGradient(particleX, particleY, 0, particleX, particleY, particleRadius * 2);
    gradient.addColorStop(0, 'rgba(255, 100, 100, 0.8)');
    gradient.addColorStop(1, 'rgba(255, 100, 100, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(particleX, particleY, particleRadius * 2, 0, Math.PI * 2);
    ctx.fill();
    
    // Body
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.arc(particleX, particleY, particleRadius, 0, Math.PI * 2);
    ctx.fill();
    
    // + sign
    ctx.fillStyle = 'white';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('+', particleX, particleY);
    
    // Draw velocity vector
    if (showForceVectors && stage > 0) {
      const vLength = 35;
      const vx = particleX + vLength * Math.cos(velocityAngle);
      const vy = particleY + vLength * Math.sin(velocityAngle);
      
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(particleX, particleY);
      ctx.lineTo(vx, vy);
      ctx.stroke();
      
      // Arrowhead
      ctx.fillStyle = '#00ffff';
      ctx.beginPath();
      ctx.moveTo(vx, vy);
      ctx.lineTo(vx - 8 * Math.cos(velocityAngle - Math.PI/6), vy - 8 * Math.sin(velocityAngle - Math.PI/6));
      ctx.lineTo(vx - 8 * Math.cos(velocityAngle + Math.PI/6), vy - 8 * Math.sin(velocityAngle + Math.PI/6));
      ctx.closePath();
      ctx.fill();
      
      ctx.fillStyle = '#00ffff';
      ctx.font = '12px Arial';
      ctx.fillText('v', vx + 10, vy);
    }
    
    // Draw drift vector (for stages 1 and 2)
    if (showDrift && stage >= 1) {
      let driftVector, driftColor, driftLabel;
      
      if (stage === 1) {
        // Constant upward drift
        driftVector = { x: 0, y: -30 };
        driftColor = '#ff5555';
        driftLabel = 'DRIFT ↑ (bad!)';
      } else {
        // Oscillating drift
        const driftDirection = Math.cos(time * 2.5);
        driftVector = { x: 0, y: -driftDirection * 25 };
        driftColor = driftDirection > 0 ? '#ffaa55' : '#55aaff';
        driftLabel = driftDirection > 0 ? 'drift ↑' : 'drift ↓';
      }
      
      const dx = particleX + driftVector.x;
      const dy = particleY + driftVector.y;
      
      ctx.strokeStyle = driftColor;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(particleX, particleY);
      ctx.lineTo(dx, dy);
      ctx.stroke();
      ctx.setLineDash([]);
      
      // Arrowhead
      const dAngle = Math.atan2(driftVector.y, driftVector.x);
      ctx.fillStyle = driftColor;
      ctx.beginPath();
      ctx.moveTo(dx, dy);
      ctx.lineTo(dx - 6 * Math.cos(dAngle - Math.PI/6), dy - 6 * Math.sin(dAngle - Math.PI/6));
      ctx.lineTo(dx - 6 * Math.cos(dAngle + Math.PI/6), dy - 6 * Math.sin(dAngle + Math.PI/6));
      ctx.closePath();
      ctx.fill();
      
      ctx.font = 'bold 12px Arial';
      ctx.fillStyle = driftColor;
      ctx.textAlign = 'left';
      ctx.fillText(driftLabel, dx + 10, dy);
    }
    
    // Draw "WALL" indicator for stage 1
    if (stage === 1 && driftY < -r + 10) {
      ctx.fillStyle = '#ff0000';
      ctx.font = 'bold 20px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('💥 HITS WALL!', centerX, 50);
    }
    
    // Draw poloidal field indicator (stage 2)
    if (currentStage.hasPoloidal) {
      // Show helical field lines
      ctx.strokeStyle = 'rgba(100, 255, 150, 0.4)';
      ctx.lineWidth = 1;
      
      for (let offset = 0; offset < 4; offset++) {
        ctx.beginPath();
        for (let t = 0; t <= Math.PI * 4; t += 0.1) {
          const angle = t;
          const wobble = Math.sin(t * 3 + offset * Math.PI/2) * 15;
          const px = centerX + (R + wobble * 0.3) * Math.cos(angle);
          const py = centerY + (R + wobble * 0.3) * Math.sin(angle);
          
          if (t === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    }
    
    // Labels
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`Stage ${stage + 1}: ${currentStage.name}`, centerX, 30);
    
    // Legend
    ctx.font = '12px Arial';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#aa55ff';
    ctx.fillText('→ Toroidal field (B)', 20, height - 60);
    ctx.fillStyle = '#00ffff';
    ctx.fillText('→ Velocity (v)', 20, height - 40);
    ctx.fillStyle = '#ff5555';
    ctx.fillText('⇢ Gradient drift', 20, height - 20);
    
  }, [time, stage, showForceVectors, showDrift]);

  const currentStage = stages[stage];

  return (
    <div className="min-h-screen bg-gray-900 text-white p-4">
      <h1 className="text-2xl font-bold text-center mb-2">
        Why Do We Need The Twist?
      </h1>
      <p className="text-center text-gray-400 mb-4">
        See what happens to a charged particle as we add each magnetic field component
      </p>
      
      <div className="flex flex-col lg:flex-row gap-4 max-w-6xl mx-auto">
        <div className="flex-1">
          <canvas
            ref={canvasRef}
            width={600}
            height={500}
            className="bg-gray-800 rounded-lg w-full"
          />
          
          {/* Stage description */}
          <div className={`mt-4 p-4 rounded-lg border-2`} style={{ borderColor: currentStage.color, backgroundColor: `${currentStage.color}15` }}>
            <p className="text-sm">{currentStage.description}</p>
          </div>
        </div>
        
        <div className="w-full lg:w-64 space-y-4">
          {/* Stage selector */}
          <div className="bg-gray-800 p-4 rounded-lg">
            <h3 className="font-semibold mb-3">Select Stage</h3>
            <div className="space-y-2">
              {stages.map((s, i) => (
                <button
                  key={i}
                  onClick={() => { setStage(i); setTime(0); }}
                  className={`w-full text-left px-3 py-2 rounded transition text-sm ${
                    stage === i 
                      ? 'bg-white text-gray-900 font-semibold' 
                      : 'bg-gray-700 hover:bg-gray-600'
                  }`}
                >
                  {i + 1}. {s.name}
                </button>
              ))}
            </div>
          </div>
          
          {/* Playback */}
          <div className="bg-gray-800 p-4 rounded-lg">
            <h3 className="font-semibold mb-3">Playback</h3>
            <div className="flex gap-2 mb-3">
              <button
                onClick={() => setIsPlaying(!isPlaying)}
                className={`flex-1 py-2 rounded transition ${
                  isPlaying ? 'bg-yellow-600' : 'bg-green-600 hover:bg-green-500'
                }`}
              >
                {isPlaying ? '⏸ Pause' : '▶ Play'}
              </button>
              <button
                onClick={() => setTime(0)}
                className="flex-1 py-2 rounded bg-gray-700 hover:bg-gray-600 transition"
              >
                ↺ Reset
              </button>
            </div>
            <label className="block text-sm text-gray-400">
              Speed: {speed.toFixed(1)}x
            </label>
            <input
              type="range"
              min="0.2"
              max="2"
              step="0.1"
              value={speed}
              onChange={(e) => setSpeed(Number(e.target.value))}
              className="w-full"
            />
          </div>
          
          {/* Display options */}
          <div className="bg-gray-800 p-4 rounded-lg">
            <h3 className="font-semibold mb-3">Display</h3>
            <label className="flex items-center gap-2 mb-2">
              <input
                type="checkbox"
                checked={showForceVectors}
                onChange={(e) => setShowForceVectors(e.target.checked)}
                className="accent-cyan-400"
              />
              Show velocity vector
            </label>
            <label className="flex items-center gap-2">
              <input
                type="checkbox"
                checked={showDrift}
                onChange={(e) => setShowDrift(e.target.checked)}
                className="accent-red-400"
              />
              Show drift vector
            </label>
          </div>
          
          {/* Quick explanation */}
          <div className="bg-gray-800 p-4 rounded-lg text-sm">
            <h3 className="font-semibold mb-2">The Problem & Solution</h3>
            <p className="text-gray-400 mb-2">
              <strong className="text-red-400">Problem:</strong> Toroidal field alone has a gradient (stronger inside, weaker outside). This causes particles to drift vertically → hits wall → plasma dies.
            </p>
            <p className="text-gray-400">
              <strong className="text-green-400">Solution:</strong> Add poloidal field to twist the field lines. Now the particle goes sometimes inside (drifts up), sometimes outside (drifts down). The drifts cancel!
            </p>
          </div>
        </div>
      </div>
      
      {/* Bottom explanation */}
      <div className="max-w-4xl mx-auto mt-6 bg-gray-800 p-4 rounded-lg">
        <h3 className="font-semibold mb-2">This is a TOP-DOWN view of the tokamak</h3>
        <p className="text-gray-300 text-sm">
          You're looking down at the donut from above. The particle travels around the ring (toroidal direction). 
          The "up/down" drift you see is actually vertical in 3D - the particle drifting toward the top or bottom of the torus.
          In stage 1, this drift accumulates and the particle escapes. In stage 3, the helical twist makes the drift oscillate and cancel out.
        </p>
      </div>
    </div>
  );
};


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ToroidalFieldStages));
</script>
<script>window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+='\n'+e.message;});</script>
