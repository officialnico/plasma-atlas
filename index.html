ions":[]},{"id":"2026-07-07-integration-sweep","title":"Integration, step by step","desc":"The sweep line moves left to right. At each position it adds that bin's signed height (red pile = add, blue gap = subtract) to a running total. That running total, traced below, is the field. Watch the field dip while the line crosses blue and climb while it crosses red.","path":"2026-07-07_the-vlasov-equation/integration-sweep.html","file":"integration-sweep.html","cluster":"math","size":9339,"date":"2026-07-07","d":218,"p":172,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-06-24-newtons-laws-motion-studies","title":"The Three Laws of Motion — Motion Studies","desc":"Philosophiæ Naturalis · Motion Studies","path":"2026-06-24_newtonian-motion/newtons-laws-motion-studies.html","file":"newtons-laws-motion-studies.html","cluster":"mech","size":26905,"date":"2026-06-24","d":205,"p":255,"ps":0,"tags":["sliders","animated"],"versions":[]},{"id":"2026-01-23-wrench-torque","title":"Wrench torque","desc":"Why pushing at the end of the wrench works better — torque as r × F, felt rather than derived.","path":"2026-01-23_math-interactive/wrench-torque.html","file":"wrench-torque.html","cluster":"mech","size":17655,"date":"2026-01-23","d":53,"p":199,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-06-04-energy-momentum-explainer","title":"From velocity to energy &amp; momentum","desc":"Drag the arrow to set a velocity. The amber box is that velocity squared its side is the arrow s length, its area is v . Press play to watch each step build.","path":"2026-06-04_energy-and-momentum/energy_momentum_explainer.html","file":"energy_momentum_explainer.html","cluster":"mech","size":16442,"date":"2026-06-04","d":185,"p":218,"ps":0,"tags":["sliders"],"versions":[]},{"id":"2026-01-23-box-push","title":"Box push","desc":"Push a box across a floor and watch force, friction and acceleration argue with each other.","path":"2026-01-23_math-interactive/box-push.html","file":"box-push.html","cluster":"mech","size":13714,"date":"2026-01-23","d":53,"p":216,"ps":1,"tags":["sliders"],"versions":[]},{"id":"2026-06-24-why-2d-and-squared","title":"Why 2d, and why squared","desc":"Stopping distance is the area of a triangle. That one fact answers both questions: a triangle is half its rectangle (the 2), and doubling the speed stretches both of its sides at once (the square).","path":"2026-06-24_newtonian-motion/why-2d-and-squared.html","file":"why-2d-and-squared.html","cluster":"mech","size":13126,"date":"2026-06-24","d":205,"p":215,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-06-16-particle-radiation-and-decay","title":"Particle Radiation & Nuclear Decay — A Deep Dive","desc":"A / FIRST, A WORD FIX\"Radiation\" isn't \"radioactive\"","path":"2026-06-16_radiation-and-nuclear-decay/particle-radiation-and-decay.html","file":"particle-radiation-and-decay.html","cluster":"nuclear","size":66275,"date":"2026-06-16","d":197,"p":107,"ps":0,"tags":["sliders","animated","long-read"],"versions":[]},{"id":"2026-06-14-mass-energy-guide","title":"The Origin of Mass — an interactive derivation","desc":"Everything below is built from tools you already own — Taylor series, the dot product, a metric. We start by recovering Newton from Einstein, and we finish at the two machines that actually manufacture the mass of the world: the strong force and the Higgs field.","path":"2026-06-14_mass-as-stored-energy/mass-energy-guide.html","file":"mass-energy-guide.html","cluster":"nuclear","size":46798,"date":"2026-06-14","d":195,"p":210,"ps":0,"tags":["sliders","LaTeX","long-read"],"versions":[]},{"id":"2026-06-16-candu-zero-to-hero","title":"CANDU — Zero to Hero","desc":"01 / THE EVENTThe split — and where the energy comes from","path":"2026-06-16_radiation-and-nuclear-decay/candu-zero-to-hero.html","file":"candu-zero-to-hero.html","cluster":"nuclear","size":41732,"date":"2026-06-16","d":197,"p":220,"ps":1,"tags":["sliders","animated","long-read"],"versions":[]},{"id":"2026-06-16-nuclear-explainer","title":"Radiation → Fission → Reactors → Bombs · A Visual Field Guide","desc":"It starts with a single neutron passing through a body. This guide walks the whole ladder: what radiation is, then where it comes from — the splitting of atoms — and how that same reaction is tamed into a power plant or unleashed in a bomb.","path":"2026-06-16_radiation-and-nuclear-decay/nuclear-explainer.html","file":"nuclear-explainer.html","cluster":"nuclear","size":40863,"date":"2026-06-16","d":197,"p":222,"ps":1,"tags":["sliders","animated","long-read"],"versions":[]},{"id":"2026-06-16-decay-playbook","title":"The Radioactive Decay Playbook","desc":"The rules usually surface one question at a time — but there's a tidy system underneath. So here it is whole: every path a nucleus can take, the single rule that decides which, what happens in the aftermath, how fast it goes, and how one decay leads to the next until everything settles.","path":"2026-06-16_radiation-and-nuclear-decay/decay-playbook.html","file":"decay-playbook.html","cluster":"nuclear","size":32594,"date":"2026-06-16","d":197,"p":220,"ps":1,"tags":[],"versions":[]},{"id":"2026-06-16-nuclear-decay-explainer","title":"Why Nuclei Decay — and the Math of When","desc":"Every alpha, beta, and gamma ray we've met came out of an unstable nucleus. But what makes one nucleus sit unchanged for billions of years and another vanish in microseconds? The answer is a tug-of-war between two forces, refereed by energy — and once you accept it's random, the timing collapses into one beautifully simple equation.","path":"2026-06-16_radiation-and-nuclear-decay/nuclear-decay-explainer.html","file":"nuclear-decay-explainer.html","cluster":"nuclear","size":32437,"date":"2026-06-16","d":197,"p":220,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-06-16-particle-radiation-explainer","title":"Particle Radiation — What's Actually Flying At You","desc":"Light is a wave. But the particle side of radiation is real, physical matter moving fast — and almost every question about it (Is it made of quarks? Has it been proven? Why is a flying proton \"radiation\"?) has a concrete, visualizable answer. Let's open up the particles.","path":"2026-06-16_radiation-and-nuclear-decay/particle-radiation-explainer.html","file":"particle-radiation-explainer.html","cluster":"nuclear","size":30799,"date":"2026-06-16","d":197,"p":220,"ps":1,"tags":["animated"],"versions":[]},{"id":"2026-06-18-mass-energy-balance","title":"The Weight of a Bond — E = mc²","desc":"Pull two things together and energy leaves the system; force them together against their will and energy is stored inside it. Either way the books are settled in mass, through E = mc². Drag the magnets — or switch to a nucleus — and watch the balance decide whether the whole weighs more or less than its separated parts.","path":"2026-06-18_nuclear-fission-energy-release/mass-energy-balance.html","file":"mass-energy-balance.html","cluster":"nuclear","size":30019,"date":"2026-06-18","d":199,"p":230,"ps":0,"tags":["sliders"],"versions":[]},{"id":"2026-06-16-radiation-explainer","title":"Radiation — A Visual Field Guide","desc":"It travels two ways: as waves of pure energy (light, X-rays, gamma rays) or as tiny pieces of matter flying fast (alpha, beta and neutron particles). Everything dangerous — and most things useful — comes down to how much energy each one carries.","path":"2026-06-16_radiation-and-nuclear-decay/radiation-explainer.html","file":"radiation-explainer.html","cluster":"nuclear","size":25153,"date":"2026-06-16","d":197,"p":226,"ps":1,"tags":["sliders","animated","long-read"],"versions":[]},{"id":"2026-06-17-neutron-capture-movie","title":"Where the mass goes — radiative neutron capture","desc":"A complete walk-through · nothing skipped Where the mass actually goes n + ²³⁵U ²³⁶U* ²³⁶U + Reduced-motion is on, so it hasn't auto-played.","path":"2026-06-17_mass-defect-in-uranium-236/neutron_capture_movie.html","file":"neutron_capture_movie.html","cluster":"nuclear","size":25080,"date":"2026-06-17","d":198,"p":223,"ps":0,"tags":["sliders","animated"],"versions":[]},{"id":"2026-06-16-mass-defect","title":"Bind it, and it gets lighter","desc":"A uranium‑235 nucleus swallows a neutron and becomes uranium‑236 — yet U‑236 weighs less than the U‑235 and the neutron did apart. The missing mass didn't vanish. It left as energy. Watch it leave.","path":"2026-06-16_mass-defect-and-binding-energy/mass-defect.html","file":"mass-defect.html","cluster":"nuclear","size":24347,"date":"2026-06-16","d":197,"p":225,"ps":0,"tags":["animated"],"versions":[]},{"id":"2026-06-16-light-mass-cascade","title":"Light, Mass & the Gamma Cascade","desc":"Made visible: a nucleus emits a finite cascade of gammas and goes quiet — and its ladder has rungs at all only because it's a confined quantum system; the only truly massless particles sit at one end of a vast mass spectrum; and a proton's weight is almost all binding energy, not quark mass.","path":"2026-06-16_radiation-and-nuclear-decay/light-mass-cascade.html","file":"light-mass-cascade.html","cluster":"nuclear","size":22699,"date":"2026-06-16","d":197,"p":226,"ps":1,"tags":["animated"],"versions":[]},{"id":"2026-05-12-plasma-physics-codex","title":"The Plasma Physics Codex — A Visual Field Guide","desc":"A visual field guide to magnetised matter — flux tubes, frozen-in flux and the MHD picture, end to end.","path":"2026-05-12_visual-guide-to-flux-tubes-and-mhd-physics/plasma_physics_codex.html","file":"plasma_physics_codex.html","cluster":"plasma","size":92943,"date":"2026-05-12","d":162,"p":236,"ps":0,"tags":["sliders","animated","long-read"],"versions":[]},{"id":"2026-05-06-debye-interactive-guide","title":"Debye Screening — Interactive Guide","desc":"A step-by-step build, with a thing to play with at every step. Read top to bottom — each visualization assumes the one before.","path":"2026-05-06_debye-shielding/debye_interactive_guide.html","file":"debye_interactive_guide.html","cluster":"plasma","size":61179,"date":"2026-05-06","d":156,"p":247,"ps":0,"tags":["sliders","animated","LaTeX","long-read"],"versions":[]},{"id":"2026-05-06-boltzmann-walkthrough","title":"Boltzmann Walkthrough · Every Confusion Cleared","desc":"A step-by-step walk through the Boltzmann equation, with every common confusion cleared on the way.","path":"2026-05-06_debye-shielding/boltzmann_walkthrough.html","file":"boltzmann_walkthrough.html","cluster":"plasma","size":55851,"date":"2026-05-06","d":156,"p":233,"ps":1,"tags":["sliders","animated","LaTeX","long-read"],"versions":[]},{"id":"2026-05-07-mean-field-guide","title":"Mean-Field Theory · An Interactive Guide","desc":"Tracking every particle in a system is impossible. So physicists made a deal with reality — they replace \"every particle interacting with every other particle\" with \"every particle interacting with the average of all the others.\" This guide builds the intuition from scratch, with five animated scenes you can poke at.","path":"2026-05-07_boltzmann-distribution-equilibrium/mean_field_guide.html","file":"mean_field_guide.html","cluster":"plasma","size":55426,"date":"2026-05-07","d":157,"p":233,"ps":0,"tags":["sliders","animated","long-read"],"versions":[]},{"id":"2026-05-07-click-particle-calc","title":"Plasma at Equilibrium · Click any particle","desc":"plasma at equilibrium Click any particle.","path":"2026-05-07_boltzmann-distribution-equilibrium/click_particle_calc.html","file":"click_particle_calc.html","cluster":"plasma","size":50611,"date":"2026-05-07","d":157,"p":235,"ps":1,"tags":["sliders","animated","long-read"],"versions":[]},{"id":"2026-05-07-potential-energy","title":"Potential Energy · An Intuition Builder","desc":"Forget formulas for a second. Potential energy is what the universe owes you for putting something somewhere it doesn't want to be — lifted up against gravity, pushed against a spring, pulled away from a magnet. That debt gets paid back as motion the moment you let go.","path":"2026-05-07_boltzmann-distribution-equilibrium/potential_energy.html","file":"potential_energy.html","cluster":"plasma","size":47701,"date":"2026-05-07","d":157,"p":236,"ps":1,"tags":["sliders","animated","long-read"],"versions":[]},{"id":"2026-05-07-particle-sandbox","title":"Particle Sandbox · Time-Resolved Boltzmann Equilibration","desc":"time-resolved boltzmann sandbox Place ions.","path":"2026-05-07_boltzmann-distribution-equilibrium/particle_sandbox.html","file":"particle_sandbox.html","cluster":"plasma","size":36520,"date":"2026-05-07","d":157,"p":236,"ps":1,"tags":["sliders","animated","sandbox"],"versions":[]},{"id":"2026-05-07-plasma-boltzmann","title":"Plasma Sheath · Boltzmann Density Relation","desc":"A plasma is a soup of positive ions and electrons — neutral in the bulk. Put a charged wall against it and the species respond very differently: electrons are light and fast, ions heavy and slow. The lighter species redistributes almost instantly to follow the Boltzmann relation — which is why that relation holds at all.","path":"2026-05-07_boltzmann-distribution-equilibrium/plasma_boltzmann.html","file":"plasma_boltzmann.html","cluster":"plasma","size":33563,"date":"2026-05-07","d":157,"p":238,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-06-21-plasma-visualizer","title":"Three Frequencies of a Plasma","desc":"A plasma rings in three different ways. Two of them come from a magnetic field bending single particles into circles. The third — the plasma frequency — needs no magnet at all. It is the whole electron sea sloshing.","path":"2026-06-21_three-plasma-frequencies/plasma-visualizer.html","file":"plasma-visualizer.html","cluster":"plasma","size":33532,"date":"2026-06-21","d":202,"p":247,"ps":0,"tags":["sliders","animated"],"versions":[]},{"id":"2026-05-07-3d-landscape","title":"3D Energy Landscape · Click to Reveal Density","desc":"3D energy landscape Click any point to see the density wave from there.","path":"2026-05-07_boltzmann-distribution-equilibrium/3d_landscape.html","file":"3d_landscape.html","cluster":"plasma","size":31809,"date":"2026-05-07","d":157,"p":236,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-05-07-boltzmann-homework","title":"Boltzmann Density · Homework Set","desc":"Eight problems, mixing conceptual checks with concrete calculations. Some are multiple choice, some need a number. Each has feedback that explains not just the answer, but the reasoning — so a wrong answer is also useful.","path":"2026-05-07_boltzmann-distribution-equilibrium/boltzmann_homework.html","file":"boltzmann_homework.html","cluster":"plasma","size":31764,"date":"2026-05-07","d":157,"p":238,"ps":1,"tags":[],"versions":[]},{"id":"2026-05-07-boltzmann-density-calc","title":"Boltzmann Density · Step by Step","desc":"You set the potential energy U at some location and the thermal energy kBT. The panel on the right shows how n/n₀ — the density at that location, relative to bulk — gets computed step by step. Watch what happens when you make the well deeper.","path":"2026-05-07_boltzmann-distribution-equilibrium/boltzmann_density_calc.html","file":"boltzmann_density_calc.html","cluster":"plasma","size":30593,"date":"2026-05-07","d":157,"p":241,"ps":1,"tags":["sliders"],"versions":[]},{"id":"2026-05-06-plasma-3d","title":"3D Plasma Density — Interactive","desc":"Watch real electrons cluster around ions in 3D, then see the same data become the Boltzmann curve.","path":"2026-05-06_debye-shielding/plasma_3d.html","file":"plasma_3d.html","cluster":"plasma","size":28215,"date":"2026-05-06","d":156,"p":234,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-05-07-boltzmann-sim","title":"The Boltzmann Distribution — A Statistical Inevitability","desc":"Boltzmann's wager was simple: if you can't track every particle, treat them statistically. Every microstate with the same total energy is equally likely. The distribution we call \"equilibrium\" is just the macrostate that contains the overwhelming majority of those microstates.","path":"2026-05-07_boltzmann-distribution-equilibrium/boltzmann_sim.html","file":"boltzmann_sim.html","cluster":"plasma","size":27963,"date":"2026-05-07","d":157,"p":236,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-05-06-debye-sandbox","title":"Debye Screening Sandbox","desc":"An ion sits in a soup. Drop electrons and watch the soup decide how far the ion's pull reaches.","path":"2026-05-06_debye-shielding/debye_sandbox.html","file":"debye_sandbox.html","cluster":"plasma","size":25180,"date":"2026-05-06","d":156,"p":244,"ps":1,"tags":["sliders","animated","sandbox"],"versions":[]},{"id":"2026-05-04-debye-app","title":"Debye screening sandbox","desc":"Drop a test charge into a plasma and watch the electron cloud smother its field within a Debye length.","path":"2026-05-04_spatial-advection-and-em-foundations/debye_app.html","file":"debye_app.html","cluster":"plasma","size":24679,"date":"2026-05-04","d":154,"p":14,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-05-07-ion-electron-pe","title":"Calculating Potential Energy · Live","desc":"Drag the electron anywhere on the stage. The panel on the right shows you exactly how the potential energy is calculated at each instant — every constant, every substitution, every step. No black boxes.","path":"2026-05-07_boltzmann-distribution-equilibrium/ion_electron_pe.html","file":"ion_electron_pe.html","cluster":"plasma","size":24489,"date":"2026-05-07","d":157,"p":243,"ps":1,"tags":["animated"],"versions":[]},{"id":"2026-05-07-where-u-negative","title":"Where Is U Negative? · Attractive vs Repulsive Regions","desc":"Each scene shows a real plasma configuration — ions, walls, etc. The colored heatmap is U(r) for an electron: blue = negative U = attractive (electrons pile up here), red = positive U = repulsive (electrons flee), yellow ≈ neutral. Move your cursor around to read off U at any specific point.","path":"2026-05-07_boltzmann-distribution-equilibrium/where_u_negative.html","file":"where_u_negative.html","cluster":"plasma","size":22843,"date":"2026-05-07","d":157,"p":239,"ps":1,"tags":["animated"],"versions":[]},{"id":"2026-05-07-marbles-landscape","title":"Marbles in a Hilly Landscape · Boltzmann Made Literal","desc":"Throw 200 marbles into a landscape with hills and valleys, then shake. Where do they end up? Watch the histogram at the bottom build up — that's the density distribution. Adjust the shaking (temperature) to see how cold landscapes give sharp pile-ups and hot landscapes give flat distributions. This is exactly what the Boltzmann formula describes.","path":"2026-05-07_boltzmann-distribution-equilibrium/marbles_landscape.html","file":"marbles_landscape.html","cluster":"plasma","size":22748,"date":"2026-05-07","d":157,"p":241,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-06-25-larmor-gyration","title":"Gyromotion · the Larmor radius in 3D","desc":"The field line is fixed; the particle spirals around it. Drag to orbit · scroll to zoom · right-drag (or shift-drag / WASD) to pan · F to refit. The view follows the drift so it stays in frame.","path":"2026-06-25_the-larmor-radius-balance/larmor_gyration.html","file":"larmor_gyration.html","cluster":"plasma","size":21992,"date":"2026-06-25","d":206,"p":135,"ps":0,"tags":["3D","sliders","animated"],"versions":[]},{"id":"2026-04-10-tokamak-particles","title":"Tokamak particles","desc":"Which way do ions and electrons gyrate, and where do they drift? Particle orbits inside the torus.","path":"2026-04-10_particle-gyration-directions/tokamak-particles.html","file":"tokamak-particles.html","cluster":"plasma","size":19142,"date":"2026-04-10","d":130,"p":60,"ps":0,"tags":["sliders","animated"],"versions":[]},{"id":"2026-05-07-density-follows-landscape","title":"Density Follows the Landscape","desc":"Drag the landscape up and down by clicking and dragging on the U(x) curve at the top. Watch n(x) at the bottom track every move. The density isn't peaked at any fixed point — it just follows the lowest U, wherever you put it.","path":"2026-05-07_boltzmann-distribution-equilibrium/density_follows_landscape.html","file":"density_follows_landscape.html","cluster":"plasma","size":17945,"date":"2026-05-07","d":157,"p":241,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-05-06-boltzmann","title":"Boltzmann","desc":"The Boltzmann factor e^(−U/kT) made tangible: raise the temperature and watch the population climb the hill.","path":"2026-05-06_boltzmann-distribution/boltzmann.html","file":"boltzmann.html","cluster":"plasma","size":17758,"date":"2026-05-06","d":156,"p":244,"ps":0,"tags":["sliders","animated"],"versions":[]},{"id":"2026-04-10-lorentz-force","title":"Lorentz force","desc":"(Newtons). Always ⊥ to both v and B — this is what bends the path into a circle.","path":"2026-04-10_particle-gyration-directions/lorentz-force.html","file":"lorentz-force.html","cluster":"plasma","size":17191,"date":"2026-04-10","d":130,"p":252,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-06-24-why-gyromotion-is-a-circle","title":"Why gyromotion is a circle","desc":"A magnetic force always points sideways to the motion. A sideways force can only turn you — it can never speed you up or slow you down. Turning by the same amount forever, at constant speed, is a circle.","path":"2026-06-24_why-gyromotion-is-circular/why-gyromotion-is-a-circle.html","file":"why-gyromotion-is-a-circle.html","cluster":"plasma","size":15321,"date":"2026-06-24","d":205,"p":255,"ps":0,"tags":["sliders","animated","LaTeX"],"versions":[]},{"id":"2026-06-21-plasma-vs-gyro","title":"Plasma frequency vs gyromotion","desc":"Both are \"fast small scales\" a simulation must resolve — but they're completely different motions.","path":"2026-06-21_plasma-vs-gyro-frequency/plasma_vs_gyro.html","file":"plasma_vs_gyro.html","cluster":"plasma","size":8320,"date":"2026-06-21","d":202,"p":240,"ps":0,"tags":["sliders","animated"],"versions":[]},{"id":"2026-05-05-schrodinger","title":"The Schrödinger Equation — An Interactive Essay","desc":"Before 1926, physicists drew electrons as little marbles. Erwin Schrödinger, working through a Christmas holiday in the Alps, wrote down something that changed the picture forever — an equation whose solutions were not trajectories, but waves of probability.","path":"2026-05-05_schrodinger-equation/schrodinger.html","file":"schrodinger.html","cluster":"quantum","size":47780,"date":"2026-05-05","d":155,"p":264,"ps":0,"tags":["sliders","animated","LaTeX","long-read"],"versions":[]},{"id":"2026-06-18-standard-model-map","title":"The Standard Model — Zero to Hero","desc":"The complete rulebook for everything you can touch","path":"2026-06-18_standard-model-exploration-map/standard-model-map.html","file":"standard-model-map.html","cluster":"quantum","size":45568,"date":"2026-06-18","d":199,"p":266,"ps":0,"tags":["animated","long-read"],"versions":[]},{"id":"2026-06-12-neutrinos","title":"Ghost Particles — A Guide to Neutrinos","desc":"Trillions are streaming through your body right now — through the floor, the planet, and out the other side — and you will never feel a single one. This is the neutrino: the particle that almost isn't there. Let's go from \"what's a lepton?\" to the open questions physicists are losing sleep over.","path":"2026-06-12_neutrinos/neutrinos.html","file":"neutrinos.html","cluster":"quantum","size":43511,"date":"2026-06-12","d":193,"p":258,"ps":0,"tags":["sliders","animated","long-read"],"versions":[]},{"id":"2026-05-11-atom-lattice","title":"States of Matter — An Atomic Observatory","desc":"Heat a lattice and watch it melt, then boil — solid, liquid, gas and plasma from one temperature slider.","path":"2026-05-11_states-of-matter/atom-lattice.html","file":"atom-lattice.html","cluster":"quantum","size":36021,"date":"2026-05-11","d":161,"p":2,"ps":1,"tags":["animated"],"versions":[]},{"id":"2026-06-16-particle-index","title":"The Particle Index — for Fusion & Gyrokinetics","desc":"Every particle, with the question that actually matters answered on each one: what is its role in fusion reactions, and does it appear in a gyrokinetic simulation? The honest headline — most elementary particles are confined or absent and never touch a simulation, while a small set of nuclei and the electron are the entire cast.","path":"2026-06-16_radiation-and-nuclear-decay/particle-index.html","file":"particle-index.html","cluster":"quantum","size":30678,"date":"2026-06-16","d":197,"p":226,"ps":1,"tags":[],"versions":[]},{"id":"2026-06-18-spin-visualizer","title":"Spin · a 3D instrument for spin-½","desc":"Spin isn't a spinning ball. A spin-½ state is a single point on this sphere — and a measurement only ever returns one of two answers.","path":"2026-06-18_spin-visualizer/spin-visualizer.html","file":"spin-visualizer.html","cluster":"quantum","size":26446,"date":"2026-06-18","d":199,"p":268,"ps":0,"tags":["3D","sliders","animated","sandbox"],"versions":[]},{"id":"2026-01-23-qaoa-visualization","title":"QAOA visualization","desc":"amplitude between states, allowing interference. Good solutions can constructively interfere. Adjust β (beta) to see the mixing effect.","path":"2026-01-23_quantum-optimization/qaoa-visualization.html","file":"qaoa-visualization.html","cluster":"quantum","size":26384,"date":"2026-01-23","d":53,"p":-1,"ps":0,"tags":["sliders"],"versions":[]},{"id":"2026-06-16-matter-waves","title":"What's Actually Waving","desc":"A water wave is water moving up and down. A sound wave is air squeezing. A matter wave is neither — what waves is an abstract angle that winds around as the particle travels. You can never picture it as the thing wobbling. But you can watch the angle. Here it is.","path":"2026-06-16_matter-waves/matter-waves.html","file":"matter-waves.html","cluster":"quantum","size":24557,"date":"2026-06-16","d":197,"p":262,"ps":0,"tags":["sliders","animated"],"versions":[]},{"id":"2026-06-16-quantum-zero-to-hero","title":"Quantum Mechanics — Zero to Hero","desc":"01 / THE ONE PREMISEEverything is a wave","path":"2026-06-16_radiation-and-nuclear-decay/quantum-zero-to-hero.html","file":"quantum-zero-to-hero.html","cluster":"quantum","size":22152,"date":"2026-06-16","d":197,"p":222,"ps":1,"tags":["animated","long-read"],"versions":[]},{"id":"2026-06-16-electron-clouds","title":"Electron Clouds — flythrough","desc":"An electron has no fixed path. Each fuzzy cloud is where it’s likely to be — sampled from |ψ|². A shell isn’t one ring: it’s several orbitals layered in space, each holding up to 2 electrons. The dark gaps are nodes, where the electron never appears.","path":"2026-06-16_3d-valence-shell/electron-clouds.html","file":"electron-clouds.html","cluster":"quantum","size":21536,"date":"2026-06-16","d":197,"p":262,"ps":0,"tags":["3D","animated"],"versions":[]},{"id":"2026-06-15-quark-combinations","title":"Color Confinement — Every Way to Bind Quarks & Gluons","desc":"Quarks carry a property called color charge — red, green, or blue (and anti­colors for antiquarks). Nature only lets particles exist if their colors add up to white. That single rule produces every combination below. Gluons are the glue: they carry color too, and constantly swap it between quarks. Pick a state to watch it bind.","path":"2026-06-15_color-confinement/quark-combinations.html","file":"quark-combinations.html","cluster":"quantum","size":16910,"date":"2026-06-15","d":196,"p":260,"ps":0,"tags":["animated"],"versions":[]},{"id":"2026-05-05-schrodinger-2","title":"The Schrödinger Equation — Interactive Explainer","desc":"An interactive look at quantum mechanics' central equation","path":"2026-05-05_schrodinger-equation-2/schrodinger.html","file":"schrodinger.html","cluster":"quantum","size":14066,"date":"2026-05-05","d":155,"p":258,"ps":0,"tags":["sliders","animated","long-read"],"versions":[]},{"id":"2026-06-16-wave-must-close","title":"The Wave That Has to Meet Itself","desc":"An electron bound to an atom is a wave wrapped into a loop. For it to keep existing, it has to join up smoothly with itself where it comes back around. Only a whole number of wavelengths can do that — a fraction comes back out of step and erases itself on every lap. Drag the dial and watch which waves survive.","path":"2026-06-16_radiation-and-nuclear-decay/wave-must-close.html","file":"wave-must-close.html","cluster":"quantum","size":11357,"date":"2026-06-16","d":197,"p":266,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-06-18-standard-model-visualizer","title":"How the Standard Model adds up","desc":"Toggle each of the four terms on or off. Watch which physical effects still follow once you change what's in the Lagrangian, then trace the machinery downward from the assembled to the predictions it generates.","path":"2026-06-18_standard-model-lagrangian/standard_model_visualizer.html","file":"standard_model_visualizer.html","cluster":"quantum","size":8411,"date":"2026-06-18","d":199,"p":259,"ps":0,"tags":[],"versions":[]},{"id":"2026-06-16-radial-overlap","title":"Radial probability — shell overlap","desc":"Notice the 2s curve (and even 3s ) has a small bump inside that band — those outer-shell electrons spend part of their time underneath the inner shell.","path":"2026-06-16_3d-valence-shell/radial-overlap.html","file":"radial-overlap.html","cluster":"quantum","size":4893,"date":"2026-06-16","d":197,"p":267,"ps":1,"tags":[],"versions":[]},{"id":"2026-08-20-constant-spectrum","title":"The Constant Spectrum — an interactive map of physical constants","desc":"Thirty-seven constants laid out as emission lines on a spectrograph plate, each one filed by family — SI defining, couplings, atomic, electromagnetic, thermal, gravity and cosmological. Open any bubble for its exact value, the definition that fixes it, a units breakdown, and the constants it is built out of; forty-eight derivations wire the whole plate together.","path":"2026-08-20_physical-constants/constant-spectrum.html","file":"constant-spectrum.html","cluster":"quantum","size":54472,"date":"2026-08-20","d":262,"p":262,"ps":0,"tags":["animated","LaTeX","sandbox"],"versions":[]}];
/* ============ state ============ */
const CL_ORDER = Object.keys(CLUSTERS);
const state = {
  q: '', active: new Set(CL_ORDER), sel: null, hover: null,
  view: 'map', matched: new Set(), dragNode: null, moved: false
};
const cv = document.getElementById('map'), ctx = cv.getContext('2d');
let W=0, H=0, DPR=1;
const cam = { x:0, y:0, k:1, tx:0, ty:0, tk:1 };

/* ============ data prep ============ */
ITEMS.forEach((d,i)=>{
  d.i=i;
  d.hay=(d.title+' '+d.desc+' '+d.file.replace(/[-_]/g,' ')+' '+CLUSTERS[d.cluster].name+' '+d.tags.join(' ')).toLowerCase();
  d.col=CLUSTERS[d.cluster].color;
  d.r=9+26*Math.pow(Math.min(d.size,200000)/200000,.55);
  d.vx=0; d.vy=0; d.ph=Math.random()*Math.PI*2;
});
document.getElementById('count').textContent =
  ITEMS.length+' visualizers · '+ITEMS.reduce((a,b)=>a+1+b.versions.length,0)+' files · '+CL_ORDER.length+' fields';

/* cluster layout — phyllotaxis, spaced by cluster mass */
const cinfo={};
CL_ORDER.forEach(k=>cinfo[k]={n:0,r:0,x:0,y:0,name:CLUSTERS[k].name,color:CLUSTERS[k].color});
ITEMS.forEach(d=>{ cinfo[d.cluster].n++; cinfo[d.cluster].r+=d.r*d.r; });
const order=CL_ORDER.slice().sort((a,b)=>cinfo[b].n-cinfo[a].n);
order.forEach(k=>{ cinfo[k].rad = Math.sqrt(cinfo[k].r)*1.45 + 26; });
// seed on a phyllotaxis spiral, then relax until clusters just touch
const avg = order.reduce((a,k)=>a+cinfo[k].rad,0)/order.length;
order.forEach((k,i)=>{
  const ang=i*2.39996, rr=avg*1.9*Math.sqrt(i+0.35);
  cinfo[k].x=Math.cos(ang)*rr; cinfo[k].y=Math.sin(ang)*rr*0.82;
});
for(let it=0; it<420; it++){
  for(let i=0;i<order.length;i++){
    const a=cinfo[order[i]];
    a.x*=0.996; a.y*=0.996;                       // gentle pull inward
    for(let j=i+1;j<order.length;j++){
      const b=cinfo[order[j]];
      let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||.01;
      const min=a.rad+b.rad+52;
      if(d<min){ const p=(min-d)/d*0.5; a.x-=dx*p; a.y-=dy*p; b.x+=dx*p; b.y+=dy*p; }
    }
  }
}
ITEMS.forEach(d=>{
  const c=cinfo[d.cluster], a=Math.random()*6.283, r=Math.sqrt(Math.random())*c.rad*.78;
  d.x=c.x+Math.cos(a)*r; d.y=c.y+Math.sin(a)*r;
});

/* ============ glow sprites ============ */
const sprite={};
for(const k of CL_ORDER){
  const S=160, c=document.createElement('canvas'); c.width=c.height=S;
  const g=c.getContext('2d'), col=CLUSTERS[k].color;
  const rg=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  rg.addColorStop(0,   hex(col,.95));
  rg.addColorStop(.28, hex(col,.55));
  rg.addColorStop(.55, hex(col,.16));
  rg.addColorStop(1,   hex(col,0));
  g.fillStyle=rg; g.fillRect(0,0,S,S);
  sprite[k]=c;
}
function hex(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}

/* starfield */
const stars=[]; for(let i=0;i<220;i++) stars.push({x:Math.random(),y:Math.random(),s:Math.random()*1.3+.2,t:Math.random()*6.28});

/* ============ resize ============ */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',()=>{resize();fit(true)});
resize();

function bounds(){
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  ITEMS.forEach(n=>{a=Math.min(a,n.x-n.r);b=Math.min(b,n.y-n.r);c=Math.max(c,n.x+n.r);d=Math.max(d,n.y+n.r)});
  return {a,b,c,d};
}
function insets(){ return W>860 ? {l:315,r:30,t:88,b:60} : {l:16,r:16,t:70,b:96}; }
function frame(a,b,c,d,maxk,now){
  const I=insets(), aw=W-I.l-I.r, ah=H-I.t-I.b, pw=c-a, ph=d-b;
  const k=Math.min(aw/(pw+80), ah/(ph+80), maxk||1.5);
  cam.tk=k; cam.tx=I.l+aw/2-(a+pw/2)*k; cam.ty=I.t+ah/2-(b+ph/2)*k;
  if(now){cam.k=cam.tk;cam.x=cam.tx;cam.y=cam.ty}
}
function fit(now){ const B=bounds(); frame(B.a,B.b,B.c,B.d,1.5,now); }

/* ============ simulation ============ */
let alpha=1;
function tick(){
  const strength = 0.0075 + 0.02*alpha;
  for(const d of ITEMS){
    if(d===state.dragNode) continue;
    const c=cinfo[d.cluster];
    d.vx += (c.x-d.x)*strength;
    d.vy += (c.y-d.y)*strength;
    d.vx += Math.cos(d.ph+performance.now()*0.00016)*0.012;
    d.vy += Math.sin(d.ph*1.7+performance.now()*0.00013)*0.012;
  }
  // collision (O(n^2) but n≈280)
  for(let it=0; it<2; it++){
    for(let i=0;i<ITEMS.length;i++){
      const a=ITEMS[i];
      for(let j=i+1;j<ITEMS.length;j++){
        const b=ITEMS[j];
        let dx=b.x-a.x, dy=b.y-a.y;
        let dist=Math.sqrt(dx*dx+dy*dy)||.01;
        const min=a.r+b.r+5;
        if(dist<min){
          const push=(min-dist)/dist*0.5*0.75;
          dx*=push; dy*=push;
          if(a!==state.dragNode){a.x-=dx;a.y-=dy}
          if(b!==state.dragNode){b.x+=dx;b.y+=dy}
        }
      }
    }
  }
  for(const d of ITEMS){
    if(d===state.dragNode){d.vx=d.vy=0;continue}
    d.vx*=0.86; d.vy*=0.86;
    d.x+=d.vx; d.y+=d.vy;
  }
  alpha*=0.985;
  for(const k of CL_ORDER){ const c=cinfo[k]; c.x0=1e9;c.y0=1e9;c.x1=-1e9;c.y1=-1e9; c.born=0; }
  for(const d of ITEMS){ const c=cinfo[d.cluster]; if(d.alive) c.born++;
    c.x0=Math.min(c.x0,d.x-d.r); c.y0=Math.min(c.y0,d.y-d.r);
    c.x1=Math.max(c.x1,d.x+d.r); c.y1=Math.max(c.y1,d.y+d.r); }
}

/* ============ timeline / play ============ */
const EPOCH=new Date(Date.UTC(2025,11,1));
const D0=Math.min(...ITEMS.map(d=>d.d)), D1=Math.max(...ITEMS.map(d=>d.d));
const play={on:false,running:false,t:D0,speed:1,dur:44000,last:0,links:0};
function dayToDate(n){ const dt=new Date(EPOCH.getTime()+n*86400000);
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}); }
const tl=document.getElementById('tl'), tlDate=document.getElementById('tlDate'),
      tlCount=document.getElementById('tlCount'), tlFill=document.getElementById('tlFill'),
      tlMark=document.getElementById('tlMark'), tlTrack=document.getElementById('tlTrack'),
      playBtn=document.getElementById('play');
(function buildHist(){
  const months=[]; let cur=null;
  for(let n=D0;n<=D1;n++){ const dt=new Date(EPOCH.getTime()+n*86400000);
    const key=dt.getUTCFullYear()+'-'+dt.getUTCMonth();
    if(!cur||cur.key!==key){ cur={key,label:dt.toLocaleDateString('en-GB',{month:'short',timeZone:'UTC'}),counts:{},n:0,days:0}; months.push(cur);}
    cur.days++; }
  function mIdx(day){ const dt=new Date(EPOCH.getTime()+day*86400000);
    return months.findIndex(m=>m.key===dt.getUTCFullYear()+'-'+dt.getUTCMonth()); }
  ITEMS.forEach(d=>{ const i=mIdx(d.d); if(i<0)return; const m=months[i];
    m.counts[d.cluster]=(m.counts[d.cluster]||0)+1; m.n++; });
  const max=Math.max(...months.map(m=>m.n))||1;
  document.getElementById('tlHist').innerHTML=months.map(m=>{
    const segs=Object.entries(m.counts).sort((a,b)=>b[1]-a[1])
      .map(([k,v])=>`<i style="height:${(v/max*100).toFixed(1)}%;background:${hex(CLUSTERS[k].color,.62)}"></i>`).join('');
    return `<div class="col" style="flex:${m.days}" title="${m.label}: ${m.n}">${segs}</div>`;
  }).join('');
  document.getElementById('tlMonths').innerHTML=months.map(m=>`<span style="flex:${m.days}">${m.label}</span>`).join('');
})();
function setPlayT(v,flash){
  play.t=Math.max(D0-2,Math.min(D1+1,v));
  const now=performance.now();
  for(const d of ITEMS){
    const was=d.alive; d.alive = d.d<=play.t;
    if(d.alive&&!was) d.bornAt = flash? now : now-3000;
    if(!d.alive) d.bornAt=0;
  }
  const f=(play.t-D0)/(D1-D0||1);
  tlFill.style.width=(f*100).toFixed(2)+'%'; tlMark.style.left=(f*100).toFixed(2)+'%';
  tlDate.textContent=dayToDate(Math.max(D0,Math.round(play.t)));
  tlCount.textContent=ITEMS.filter(d=>d.alive).length+' / '+ITEMS.length;
}
function enterPlay(restart){
  if(state.view!=='map') setView('map');
  close(); play.on=true; document.body.classList.add('playing'); tl.classList.add('show');
  fit(); if(restart!==false) setPlayT(D0-2,false);
  play.running=true; play.last=performance.now(); syncPlayBtn();
}
function exitPlay(){ play.on=false; play.running=false; document.body.classList.remove('playing');
  tl.classList.remove('show'); ITEMS.forEach(d=>{d.alive=false;d.bornAt=0}); syncPlayBtn(); }
function syncPlayBtn(){
  const l=playBtn.querySelector('.lbl'), sm=playBtn.querySelector('.sm');
  let txt='▶\u00a0 Play', ic='▶';
  if(play.on&&play.running){ txt='❚❚ Pause'; ic='❚❚'; }
  else if(play.on&&play.t>=D1){ txt='↻\u00a0 Replay'; ic='↻'; }
  else if(play.on){ txt='▶\u00a0 Resume'; ic='▶'; }
  l.innerHTML=txt; sm.textContent=ic; playBtn.classList.toggle('on',play.on&&play.running);
}
playBtn.onclick=()=>{
  if(!play.on){ enterPlay(true); return; }
  if(play.running){ play.running=false; }
  else { if(play.t>=D1) setPlayT(D0-2,false); play.running=true; play.last=performance.now(); }
  syncPlayBtn();
};
document.getElementById('tlClose').onclick=exitPlay;
document.getElementById('tlSpeed').onclick=e=>{
  const b=e.target.closest('button'); if(!b)return;
  play.speed=parseFloat(b.dataset.s);
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
};
let scrubbing=false;
function scrub(e){ const r=tlTrack.getBoundingClientRect();
  const f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)); setPlayT(D0+f*(D1-D0),false); }
tlTrack.addEventListener('pointerdown',e=>{ scrubbing=true; tlTrack.setPointerCapture(e.pointerId);
  play.running=false; syncPlayBtn(); scrub(e); });
tlTrack.addEventListener('pointermove',e=>{ if(scrubbing) scrub(e); });
tlTrack.addEventListener('pointerup',()=>{scrubbing=false});

/* ============ render ============ */
function render(t){
  cam.k += (cam.tk-cam.k)*0.13;
  cam.x += (cam.tx-cam.x)*0.13;
  cam.y += (cam.ty-cam.y)*0.13;

  ctx.clearRect(0,0,W,H);
  // background
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#04050a'); bg.addColorStop(.5,'#070812'); bg.addColorStop(1,'#04050a');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // stars
  ctx.save();
  for(const s of stars){
    const a=.14+.22*(0.5+0.5*Math.sin(t*0.0012+s.t));
    ctx.fillStyle=`rgba(180,200,255,${a})`;
    ctx.fillRect((s.x*W+cam.x*0.03)%W, (s.y*H+cam.y*0.03)%H, s.s, s.s);
  }
  ctx.restore();

  ctx.save();
  ctx.translate(cam.x,cam.y); ctx.scale(cam.k,cam.k);

  // nebulae
  ctx.globalCompositeOperation='lighter';
  for(const k of CL_ORDER){
    if(!state.active.has(k)) continue;
    const c=cinfo[k];
    const nf = play.on ? Math.min(1,(c.born||0)/Math.max(1,c.n*0.35)) : 1;
    if(nf<=0.001) continue;
    const g=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.rad*1.25);
    g.addColorStop(0,hex(c.color,.085*nf)); g.addColorStop(1,hex(c.color,0));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(c.x,c.y,c.rad*1.25,0,6.283); ctx.fill();
  }

  // ---- lineage links (timeline mode) ----
  const filtering = state.q.length>0;
  if(play.on){
    ctx.lineCap='round';
    for(const d of ITEMS){
      if(d.p<0||!d.alive) continue;
      const par=ITEMS[d.p]; if(!par.alive) continue;
      const age=t-(d.bornAt||0), prog=Math.max(0,Math.min(1,age/900));
      if(prog<=0) continue;
      const mx=(d.x+par.x)/2, my=(d.y+par.y)/2;
      const dx=d.x-par.x, dy=d.y-par.y, L=Math.hypot(dx,dy)||1;
      const cxp=mx-dy/L*L*0.14, cyp=my+dx/L*L*0.14;
      const ex=par.x+(d.x-par.x)*prog, ey=par.y+(d.y-par.y)*prog;
      const g=ctx.createLinearGradient(par.x,par.y,d.x,d.y);
      const fade=Math.min(1,0.25+0.75*Math.max(0,1-(age-900)/2600));
      g.addColorStop(0,hex(par.col,(d.ps?0.55:0.22)*fade));
      g.addColorStop(1,hex(d.col,(d.ps?0.75:0.30)*fade));
      ctx.strokeStyle=g; ctx.lineWidth=(d.ps?1.5:1)/Math.max(.5,cam.k)*Math.max(.6,cam.k);
      if(!d.ps) ctx.setLineDash([5,6]); else ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(par.x,par.y);
      ctx.quadraticCurveTo(cxp,cyp,prog<1?ex:d.x,prog<1?ey:d.y); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // bubbles
  for(const d of ITEMS){
    let on = state.active.has(d.cluster) && (!filtering || state.matched.has(d.i));
    if(play.on && !d.alive) continue;
    const isSel = state.sel===d, isHov = state.hover===d;
    let pulse = (isSel||isHov) ? 1.16 : 1;
    if(play.on&&d.bornAt){ const age=t-d.bornAt; if(age<520) pulse*=1+0.85*Math.pow(1-age/520,2); }
    const R = d.r*pulse;
    const a = on ? 1 : 0.07;
    ctx.globalAlpha=a;
    const sp=sprite[d.cluster], sz=R*4.6;
    ctx.drawImage(sp, d.x-sz/2, d.y-sz/2, sz, sz);
    ctx.globalAlpha=1;
  }
  ctx.globalCompositeOperation='source-over';
  for(const d of ITEMS){
    const on = state.active.has(d.cluster) && (!filtering || state.matched.has(d.i));
    if(play.on && !d.alive) continue;
    const isSel=state.sel===d, isHov=state.hover===d;
    let pl=1; if(play.on&&d.bornAt){ const age=t-d.bornAt; if(age<520) pl=1+0.85*Math.pow(1-age/520,2); }
    const R=d.r*((isSel||isHov)?1.16:1)*pl;
    ctx.globalAlpha = on?1:0.09;
    ctx.beginPath(); ctx.arc(d.x,d.y,R,0,6.283);
    ctx.fillStyle = hex(d.col, on?.30:.14); ctx.fill();
    ctx.lineWidth = (isSel?2.6:1.4)/1;
    ctx.strokeStyle = hex(d.col, on?(isSel||isHov?1:.8):.3); ctx.stroke();
    // core
    ctx.beginPath(); ctx.arc(d.x,d.y,Math.max(1.6,R*.24),0,6.283);
    ctx.fillStyle=hex(d.col,on?.95:.3); ctx.fill();
    if(isSel){
      ctx.beginPath(); ctx.arc(d.x,d.y,R+7+Math.sin(t*0.005)*2.5,0,6.283);
      ctx.strokeStyle=hex(d.col,.45); ctx.lineWidth=1; ctx.stroke();
    }
    if(play.on&&d.bornAt){ const age=t-d.bornAt;
      if(age<1000){ const q=age/1000;
        ctx.beginPath(); ctx.arc(d.x,d.y,R+4+q*46,0,6.283);
        ctx.strokeStyle=hex(d.col,(1-q)*0.7); ctx.lineWidth=2*(1-q)+.4; ctx.stroke();
      }
    }
    ctx.globalAlpha=1;
  }

  ctx.restore();

  // ---- labels in screen space, greedily decluttered ----
  const boxes=[];
  function place(x,y,w,h){
    for(const b of boxes){ if(x<b.x+b.w && x+w>b.x && y<b.y+b.h && y+h>b.y) return false; }
    boxes.push({x,y,w,h}); return true;
  }
  const I=insets();
  // cluster titles first (highest priority)
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const showClusterTitles = cam.k < 2.2;
  if(showClusterTitles){
    for(const k of CL_ORDER){
      if(!state.active.has(k)) continue;
      const c=cinfo[k];
      if(play.on && !c.born) continue;
      const cx=(c.x0+c.x1)/2; let sx=cx*cam.k+cam.x; const sy=c.y0*cam.k+cam.y-15;
      if(sx<-200||sx>W+200||sy<-40||sy>H+40) continue;
      const cfs=Math.max(8.5,Math.min(W<620?10:12.5,34*cam.k));
      ctx.font=`700 ${cfs}px "Space Grotesk",sans-serif`;
      if((c.x1-c.x0)*cam.k < 44) continue;
      const txt=c.name.toUpperCase(), tw=ctx.measureText(txt).width*1.12;
      sx=Math.max(tw/2+10, Math.min(W-tw/2-10, sx));
      let ly=sy;
      if(!place(sx-tw/2-6, ly-cfs*.9, tw+12, cfs*1.8)){
        ly=c.y1*cam.k+cam.y+22;
        if(!place(sx-tw/2-6, ly-cfs*.9, tw+12, cfs*1.8)) continue;
      }
      ctx.save(); ctx.letterSpacing=(cfs*0.13).toFixed(2)+'px';
      ctx.fillStyle=hex(c.color,.55); ctx.fillText(txt,sx,ly); ctx.restore();
    }
  }
  // node labels
  const wantLabels = filtering || cam.k>0.55;
  if(wantLabels){
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.font='500 11.5px "Space Grotesk",sans-serif';
    const cand=ITEMS.filter(d=>state.active.has(d.cluster)&&(!filtering||state.matched.has(d.i))&&(!play.on||d.alive));
    cand.sort((a,b)=>score(b)-score(a));
    let drawn=0;
    for(const d of cand){
      if(drawn>90) break;
      const sr=d.r*cam.k;
      const sx=d.x*cam.k+cam.x, sy=d.y*cam.k+cam.y;
      if(sx<-120||sx>W+120||sy<-60||sy>H+60) continue;
      if(sr<7 && d!==state.hover && d!==state.sel) continue;
      const txt=d.title.length>36?d.title.slice(0,34)+'…':d.title;
      const tw=ctx.measureText(txt).width;
      const bx=sx-tw/2-5, by=sy+sr+5;
      if(W>860 && bx < I.l-8 && by < 680) continue;   // don't collide with the field rail
      if(!place(bx,by,tw+10,19)) continue;
      ctx.fillStyle='rgba(4,5,10,.78)';
      roundRect(bx,by,tw+10,18,5); ctx.fill();
      ctx.fillStyle=(d===state.hover||d===state.sel)?'#fff':hex(d.col,.95);
      ctx.fillText(txt,sx,by+3);
      drawn++;
    }
  }
  function score(d){ return (d===state.sel?1e7:0)+(d===state.hover?1e6:0)+d.r; }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

let raf;
function loop(t){
  if(play.on&&play.running){
    const dt=Math.min(60,t-play.last); play.last=t;
    const next=play.t+dt/play.dur*(D1-D0+4)*play.speed;
    setPlayT(next,true);
    if(play.t>=D1){ play.running=false; syncPlayBtn(); }
  }
  tick(); render(t); raf=requestAnimationFrame(loop);
}
fit(true); loop(0);

/* ============ hit testing ============ */
function toWorld(px,py){ return {x:(px-cam.x)/cam.k, y:(py-cam.y)/cam.k}; }
function pick(px,py){
  const p=toWorld(px,py); let best=null,bd=1e9;
  const filtering=state.q.length>0;
  for(const d of ITEMS){
    if(!state.active.has(d.cluster)) continue;
    if(filtering && !state.matched.has(d.i)) continue;
    if(play.on && !d.alive) continue;
    const dx=d.x-p.x, dy=d.y-p.y, dist=Math.hypot(dx,dy);
    if(dist<d.r+4 && dist<bd){bd=dist;best=d}
  }
  return best;
}

/* ============ interaction ============ */
const tip=document.getElementById('tip');
let dragging=false, last={x:0,y:0}, downAt=0, downPos={x:0,y:0};

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  downAt=Date.now(); downPos={x:e.clientX,y:e.clientY}; state.moved=false;
  const n=pick(e.clientX,e.clientY);
  if(n){ state.dragNode=n; } else { dragging=true; cv.classList.add('grabbing'); }
  last={x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointermove',e=>{
  if(Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>4) state.moved=true;
  if(state.dragNode){
    const p=toWorld(e.clientX,e.clientY);
    state.dragNode.x=p.x; state.dragNode.y=p.y; alpha=Math.max(alpha,.25);
    hideTip(); return;
  }
  if(dragging){
    cam.tx += e.clientX-last.x; cam.ty += e.clientY-last.y;
    cam.x += e.clientX-last.x;  cam.y += e.clientY-last.y;
    last={x:e.clientX,y:e.clientY}; hideTip(); return;
  }
  const n=pick(e.clientX,e.clientY);
  state.hover=n;
  cv.classList.toggle('pointing',!!n);
  if(n) showTip(n,e.clientX,e.clientY); else hideTip();
});
function endDrag(e){
  if(state.dragNode && !state.moved) select(state.dragNode);
  else if(dragging && !state.moved && Date.now()-downAt<300){ /* bg click */ }
  state.dragNode=null; dragging=false; cv.classList.remove('grabbing');
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=Math.exp(-e.deltaY*0.0016);
  const nk=Math.min(5,Math.max(0.18,cam.tk*f));
  const wx=(e.clientX-cam.tx)/cam.tk, wy=(e.clientY-cam.ty)/cam.tk;
  cam.tk=nk; cam.tx=e.clientX-wx*nk; cam.ty=e.clientY-wy*nk;
  hideTip();
},{passive:false});
cv.addEventListener('dblclick',()=>fit());

function showTip(n,x,y){
  tip.innerHTML='<span class="c" style="color:'+n.col+'">'+CLUSTERS[n.cluster].name+'</span><span class="t">'+esc(n.title)+'</span>';
  tip.classList.add('show');
  const r=tip.getBoundingClientRect();
  let tx=x+16, ty=y+16;
  if(tx+r.width>window.innerWidth-12) tx=x-r.width-16;
  if(ty+r.height>window.innerHeight-12) ty=y-r.height-16;
  tip.style.left=tx+'px'; tip.style.top=ty+'px';
}
function hideTip(){ tip.classList.remove('show'); state.hover=null; }

/* ============ rail ============ */
const rail=document.getElementById('rail');
order.forEach(k=>{
  const c=cinfo[k];
  const b=document.createElement('button');
  b.className='chip on'; b.dataset.k=k;
  b.innerHTML='<span class="dot" style="background:'+c.color+';box-shadow:0 0 10px '+c.color+'"></span>'+c.name+'<span class="ct">'+c.n+'</span>';
  b.onclick=(e)=>{
    if(e.shiftKey || state.active.size===1 && state.active.has(k)){ toggleOnly(null); return; }
    if(state.active.size===CL_ORDER.length){ toggleOnly(k); }
    else if(state.active.has(k) && state.active.size>1){ state.active.delete(k); }
    else if(state.active.has(k)){ toggleOnly(null); }
    else { state.active.add(k); }
    syncRail(); flyToActive();
  };
  rail.appendChild(b);
});
function toggleOnly(k){
  state.active.clear();
  if(k) state.active.add(k); else CL_ORDER.forEach(x=>state.active.add(x));
}
function syncRail(){
  [...rail.children].forEach(el=>{
    const on=state.active.has(el.dataset.k);
    el.classList.toggle('on',on && state.active.size<CL_ORDER.length);
    el.classList.toggle('off',!on);
  });
  if(state.view==='grid') buildGrid();
}
function flyToActive(){
  if(state.active.size===CL_ORDER.length){ fit(); return; }
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  ITEMS.forEach(n=>{ if(!state.active.has(n.cluster))return;
    a=Math.min(a,n.x-n.r);b=Math.min(b,n.y-n.r);c=Math.max(c,n.x+n.r);d=Math.max(d,n.y+n.r)});
  frame(a,b,c,d,2.4);
}

/* ============ search ============ */
const qi=document.getElementById('q');
qi.addEventListener('input',()=>{
  state.q=qi.value.trim().toLowerCase();
  state.matched.clear();
  if(state.q){
    const terms=state.q.split(/\s+/);
    ITEMS.forEach(d=>{ if(terms.every(t=>d.hay.includes(t))) state.matched.add(d.i); });
    alpha=Math.max(alpha,.2);
    flyToMatches();
  } else fit();
  if(state.view==='grid') buildGrid();
});
function flyToMatches(){
  const m=ITEMS.filter(d=>state.matched.has(d.i)&&state.active.has(d.cluster));
  if(!m.length) return;
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  m.forEach(n=>{a=Math.min(a,n.x-n.r);b=Math.min(b,n.y-n.r);c=Math.max(c,n.x+n.r);d=Math.max(d,n.y+n.r)});
  frame(a,b,c,d,2.6);
}

/* ============ drawer ============ */
const drawer=document.getElementById('drawer'), dinner=document.getElementById('dinner'), glowbar=document.getElementById('glowbar');
document.getElementById('dclose').onclick=close;
function close(){ drawer.classList.remove('open'); state.sel=null; history.replaceState(null,'',location.pathname); }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function kb(n){ return n>=1048576? (n/1048576).toFixed(1)+' MB' : Math.round(n/1024)+' KB'; }

function select(d,fly=true){
  state.sel=d;
  glowbar.style.background='linear-gradient(90deg,'+d.col+','+hex(d.col,.1)+')';
  glowbar.style.boxShadow='0 0 26px '+hex(d.col,.55);
  const related=ITEMS.filter(x=>x!==d&&x.cluster===d.cluster).slice(0,60)
    .map(x=>({x,s:overlap(d.hay,x.hay)})).sort((a,b)=>b.s-a.s).slice(0,5).map(o=>o.x);
  dinner.innerHTML=`
    <div class="d-cluster" style="color:${d.col}"><span class="dot" style="background:${d.col};box-shadow:0 0 10px ${d.col}"></span>${esc(CLUSTERS[d.cluster].name)}</div>
    <div class="d-title">${esc(d.title)}</div>
    <div class="d-desc">${esc(d.desc)}</div>
    <div class="d-meta">${d.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<span class="tag">${kb(d.size)}</span><span class="tag">${esc(d.date)}</span></div>
    <div class="d-actions">
      <a class="primary" style="background:${d.col};color:#05060c" href="${encodeURI(d.path)}" target="_blank" rel="noopener">Open full ↗</a>
      <button id="pv">Preview here</button>
    </div>
    <iframe class="frame" id="fr" title="preview"></iframe>
    <div class="d-sec">Details</div>
    <div class="d-row"><span>File</span><b>${esc(d.file)}</b></div>
    <div class="d-row"><span>Built</span><b>${esc(d.date)}</b></div>
    ${d.p>=0?`<div class="d-row"><span>Grew out of</span><b><a data-jump="${d.p}" style="color:${d.col};cursor:pointer">${esc(ITEMS[d.p].title.slice(0,34))}${ITEMS[d.p].title.length>34?'…':''} →</a></b></div>`:''}
    ${d.versions.length?`<div class="d-sec">Earlier versions (${d.versions.length})</div><div class="vers">${
      d.versions.map(v=>`<a href="${encodeURI(v.path)}" target="_blank" rel="noopener"><span>${esc(v.file)}</span><span>${kb(v.size)}</span></a>`).join('')}</div>`:''}
    ${related.length?`<div class="d-sec">Nearby in ${esc(CLUSTERS[d.cluster].name)}</div><div class="related">${
      related.map(r=>`<a data-i="${r.i}"><i>→</i>${esc(r.title)}</a>`).join('')}</div>`:''}
  `;
  dinner.scrollTop=0;
  drawer.classList.add('open');
  document.getElementById('pv').onclick=e=>{
    const f=document.getElementById('fr');
    if(f.classList.contains('show')){ f.classList.remove('show'); f.src='about:blank'; e.target.textContent='Preview here'; }
    else { f.src=encodeURI(d.path); f.classList.add('show'); e.target.textContent='Hide preview'; }
  };
  dinner.querySelectorAll('.related a').forEach(a=>a.onclick=()=>select(ITEMS[+a.dataset.i]));
  dinner.querySelectorAll('[data-jump]').forEach(a=>a.onclick=()=>select(ITEMS[+a.dataset.jump]));
  history.replaceState(null,'','#'+d.id);
  if(fly && state.view==='map'){
    const k=Math.max(cam.tk,1.25);
    const I=insets(), dw = W>860?490:0;
    cam.tk=k; cam.tx=I.l+(W-I.l-dw)/2-d.x*k; cam.ty=I.t+(H-I.t)/2-d.y*k;
  }
}
function overlap(a,b){
  const A=new Set(a.split(/[^a-z0-9∇×·²]+/).filter(w=>w.length>3));
  let s=0; for(const w of b.split(/[^a-z0-9∇×·²]+/)) if(A.has(w)) s++;
  return s;
}

/* ============ grid view ============ */
const gridview=document.getElementById('gridview'), gwrap=document.getElementById('gwrap');
function buildGrid(){
  const filtering=state.q.length>0;
  let html='', total=0;
  for(const k of order){
    const list=ITEMS.filter(d=>d.cluster===k && state.active.has(k) && (!filtering||state.matched.has(d.i)));
    if(!list.length) continue;
    total+=list.length;
    const c=cinfo[k];
    html+=`<div class="gsec"><span class="dot" style="background:${c.color};box-shadow:0 0 12px ${c.color}"></span>${esc(c.name)}<span class="ct">${list.length}</span></div><div class="cards">`;
    for(const d of list){
      html+=`<article class="card" data-i="${d.i}" style="--g:${hex(d.col,1)}">
        <style scoped></style>
        <h3>${esc(d.title)}</h3><p>${esc(d.desc)}</p>
        <div class="ct">${d.tags.slice(0,3).map(t=>`<span>${esc(t)}</span>`).join('')}<span>${kb(d.size)}</span></div>
      </article>`;
    }
    html+='</div>';
  }
  if(!total) html='<div class="empty">Nothing matches — try a different word.</div>';
  gwrap.innerHTML=html;
  gwrap.querySelectorAll('.card').forEach(el=>{
    el.style.setProperty('--g', ITEMS[+el.dataset.i].col);
    el.querySelector('style').remove();
    el.style.borderLeftColor=ITEMS[+el.dataset.i].col;
    el.onclick=()=>select(ITEMS[+el.dataset.i],false);
  });
  // colour the ::before bars via inline gradient trick
  gwrap.querySelectorAll('.card').forEach(el=>{
    const c=ITEMS[+el.dataset.i].col;
    el.style.background='linear-gradient(90deg,'+hex(c,.16)+' 0 2px, rgba(255,255,255,.028) 2px)';
  });
}
const vmap=document.getElementById('vmap'), vgrid=document.getElementById('vgrid');
function setView(v){
  state.view=v;
  vmap.classList.toggle('on',v==='map'); vgrid.classList.toggle('on',v==='grid');
  gridview.classList.toggle('show',v==='grid');
  document.body.classList.toggle('grid-mode',v==='grid');
  document.getElementById('hint').classList.toggle('hide',v==='grid');
  if(v==='grid'){ buildGrid(); cancelAnimationFrame(raf); }
  else { raf=requestAnimationFrame(loop); }
}
vmap.onclick=()=>setView('map'); vgrid.onclick=()=>setView('grid');

/* ============ misc ============ */
document.getElementById('lucky').onclick=()=>{
  const pool=ITEMS.filter(d=>state.active.has(d.cluster));
  const d=pool[Math.floor(Math.random()*pool.length)];
  if(state.view==='grid') setView('map');
  select(d);
};
addEventListener('keydown',e=>{
  if(e.key==='/' && document.activeElement!==qi){ e.preventDefault(); qi.focus(); qi.select(); }
  else if(e.key==='Escape'){ if(drawer.classList.contains('open')) close(); else if(play.on) exitPlay(); else { qi.value='';qi.dispatchEvent(new Event('input')); } }
  else if(e.key==='g' && document.activeElement!==qi) setView(state.view==='grid'?'map':'grid');
  else if(e.key===' ' && document.activeElement!==qi){ e.preventDefault(); playBtn.click(); }
});
setTimeout(()=>document.getElementById('hint').classList.add('hide'),7000);
cv.addEventListener('pointerdown',()=>document.getElementById('hint').classList.add('hide'),{once:true});

if(innerWidth<620) qi.placeholder='Search 279 visualizers…';

/* deep link */
if(location.hash){
  const d=ITEMS.find(x=>x.id===location.hash.slice(1));
  if(d) setTimeout(()=>select(d),600);
}

</script>
