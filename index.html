<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Plasma Atlas — an interactive map of 274 physics visualizers</title>
<meta name="description" content="An interactive bubble map of hand-built physics, fusion and plasma visualizers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04050a; --bg2:#080a12; --ink:#eef2ff; --dim:#8b93ad; --dimmer:#5a6178;
  --line:rgba(140,160,220,.14); --panel:rgba(10,13,24,.82);
  --font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body.grid-mode{overflow:auto}
canvas#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#map.grabbing{cursor:grabbing}
canvas#map.pointing{cursor:pointer}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;gap:14px;align-items:center;
  padding:14px 18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  background:linear-gradient(180deg,rgba(4,5,10,.95),rgba(4,5,10,.5) 75%,transparent);
  pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:10px;flex-shrink:0}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  background:linear-gradient(90deg,#FF2E63,#FFE01A 30%,#2EFF9B 55%,#22B8FF 78%,#E952FF);
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand .n{font-family:var(--mono);font-size:11px;color:var(--dimmer)}
.search{position:relative;flex:1;max-width:420px}
.search input{width:100%;background:rgba(255,255,255,.045);border:1px solid var(--line);color:var(--ink);
  border-radius:999px;padding:9px 38px 9px 38px;font-size:13.5px;font-family:var(--font);outline:none;
  transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:rgba(34,184,255,.6);box-shadow:0 0 0 3px rgba(34,184,255,.12),0 0 24px rgba(34,184,255,.18)}
.search input::placeholder{color:var(--dimmer)}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--dimmer);font-size:13px}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--mono);
  font-size:10px;color:var(--dimmer);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}
.btn{background:rgba(255,255,255,.045);border:1px solid var(--line);color:var(--dim);border-radius:999px;
  padding:8px 14px;font-size:12px;font-family:var(--font);font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .18s}
.btn:hover{color:var(--ink);border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.09)}
.btn.on{color:#04050a;background:var(--ink);border-color:var(--ink);font-weight:600}
.btn .sm{display:none}
.seg{display:flex;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{background:none;border:0;color:var(--dim);padding:6px 14px;border-radius:999px;font-size:12px;
  font-family:var(--font);font-weight:500;cursor:pointer;transition:all .18s}
.seg button.on{background:rgba(255,255,255,.94);color:#04050a;font-weight:600}

/* ---------- cluster rail ---------- */
.rail{position:fixed;left:18px;top:70px;z-index:35;display:flex;flex-direction:column;gap:5px;
  max-height:calc(100vh - 140px);overflow-y:auto;scrollbar-width:none;padding-right:4px}
.rail::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:9px;background:rgba(10,13,24,.55);border:1px solid var(--line);
  border-radius:999px;padding:6px 13px 6px 8px;font-size:11.5px;color:var(--dim);cursor:pointer;
  backdrop-filter:blur(10px);transition:all .18s;white-space:nowrap;font-weight:500}
.chip:hover{color:var(--ink);transform:translateX(3px)}
.chip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;transition:box-shadow .2s}
.chip .ct{font-family:var(--mono);font-size:10px;color:var(--dimmer);margin-left:2px}
.chip.on{color:#fff;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.3)}
.chip.off{opacity:.32}

/* ---------- hint ---------- */
.hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:30;font-family:var(--mono);
  font-size:10.5px;color:var(--dimmer);letter-spacing:.05em;pointer-events:none;text-align:center;
  transition:opacity .5s;background:rgba(4,5,10,.6);padding:6px 14px;border-radius:999px;
  backdrop-filter:blur(8px);border:1px solid var(--line)}
.hint.hide{opacity:0}

/* ---------- timeline ---------- */
.timeline{position:fixed;left:315px;right:24px;bottom:18px;z-index:38;background:rgba(9,11,20,.86);
  border:1px solid var(--line);border-radius:14px;padding:10px 14px 12px;backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);box-shadow:0 12px 44px rgba(0,0,0,.55);
  opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .3s,transform .3s}
.timeline.show{opacity:1;transform:translateY(0);pointer-events:auto}
.tl-head{display:flex;align-items:center;gap:12px;margin-bottom:9px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.tl-date{color:var(--ink);font-weight:500;letter-spacing:.03em;min-width:112px}
.tl-count{color:var(--dimmer)}
.tl-spacer{flex:1}
.tl-legend{display:flex;align-items:center;gap:6px;color:var(--dimmer);font-size:10px}
.tl-legend .ln{display:inline-block;width:16px;height:0;border-top:1px solid;margin-left:8px}
.tl-legend .ln.same{border-color:#7CFFCB}
.tl-legend .ln.cross{border-top-style:dashed;border-color:#8b93ad}
.tl-speed{display:flex;gap:2px}
.tl-speed button{background:none;border:1px solid transparent;color:var(--dimmer);font-family:var(--mono);
  font-size:10px;padding:2px 6px;border-radius:5px;cursor:pointer}
.tl-speed button.on{color:var(--ink);border-color:var(--line);background:rgba(255,255,255,.07)}
.tl-close{background:none;border:0;color:var(--dimmer);cursor:pointer;font-size:13px;padding:0 2px;line-height:1}
.tl-close:hover{color:var(--ink)}
.tl-track{position:relative;height:38px;cursor:pointer;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.028)}
.tl-hist{position:absolute;inset:0 0 13px 0;display:flex;align-items:flex-end;gap:1px;padding:0 1px}
.tl-hist .col{height:100%;display:flex;flex-direction:column-reverse;min-width:0}
.tl-hist .col i{display:block;width:100%}
.tl-fill{position:absolute;top:0;bottom:13px;left:0;width:0;background:linear-gradient(90deg,rgba(255,255,255,.02),rgba(255,255,255,.09));
  border-right:1px solid rgba(255,255,255,.5);pointer-events:none}
.tl-head-mark{position:absolute;top:-2px;width:9px;height:9px;border-radius:50%;background:#fff;
  box-shadow:0 0 14px rgba(255,255,255,.9);transform:translateX(-50%);pointer-events:none;left:0}
.tl-months{position:absolute;left:0;right:0;bottom:0;height:13px;display:flex;pointer-events:none}
.tl-months span{font-family:var(--mono);font-size:8.5px;color:var(--dimmer);text-align:center;
  border-left:1px solid rgba(140,160,220,.10);line-height:13px;overflow:hidden;white-space:nowrap}
body.playing .hint{opacity:0}

/* ---------- tooltip ---------- */
.tip{position:fixed;z-index:45;pointer-events:none;background:rgba(8,10,20,.96);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font-size:12.5px;max-width:270px;line-height:1.4;opacity:0;
  transform:translateY(4px);transition:opacity .13s,transform .13s;backdrop-filter:blur(12px);
  box-shadow:0 8px 32px rgba(0,0,0,.6)}
.tip.show{opacity:1;transform:translateY(0)}
.tip .c{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px}
.tip .t{font-weight:600}

/* ---------- drawer ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);z-index:50;background:var(--panel);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .34s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;
  box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.drawer.open{transform:translateX(0)}
.drawer .glowbar{height:3px;flex-shrink:0}
.drawer .inner{padding:22px 24px 30px;overflow-y:auto;flex:1}
.drawer .close{position:absolute;top:16px;right:18px;background:rgba(255,255,255,.06);border:1px solid var(--line);
  color:var(--dim);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;
  display:grid;place-items:center;transition:all .18s}
.drawer .close:hover{color:var(--ink);background:rgba(255,255,255,.14)}
.d-cluster{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;
  display:inline-flex;align-items:center;gap:7px}
.d-cluster .dot{width:8px;height:8px;border-radius:50%}
.d-title{font-size:23px;font-weight:700;line-height:1.22;letter-spacing:-.015em;margin-bottom:12px;padding-right:36px}
.d-desc{color:#b9c1d8;font-size:14px;line-height:1.62;margin-bottom:18px}
.d-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--dim);border:1px solid var(--line);
  border-radius:5px;padding:3px 7px;background:rgba(255,255,255,.03)}
.d-actions{display:flex;gap:9px;margin-bottom:20px;flex-wrap:wrap}
.d-actions a,.d-actions button{flex:1;min-width:120px;text-align:center;text-decoration:none;border-radius:9px;
  padding:11px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .18s;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink)}
.d-actions a.primary{border:0}
.d-actions a:hover,.d-actions button:hover{filter:brightness(1.15);transform:translateY(-1px)}
.frame{width:100%;height:340px;border:1px solid var(--line);border-radius:11px;background:#000;margin-bottom:18px;display:none}
.frame.show{display:block}
.d-sec{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);
  margin:22px 0 9px;padding-top:16px;border-top:1px solid var(--line)}
.d-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--dim);padding:5px 0}
.d-row b{color:#c8cfe4;font-weight:500;font-family:var(--mono);font-size:11.5px}
.vers a{display:flex;justify-content:space-between;gap:10px;text-decoration:none;color:var(--dim);font-size:12px;
  font-family:var(--mono);padding:7px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px;
  transition:all .16s}
.vers a:hover{color:var(--ink);border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.05)}
.related a{display:block;text-decoration:none;color:var(--dim);font-size:12.5px;padding:7px 0;
  border-bottom:1px solid rgba(140,160,220,.07);cursor:pointer;transition:color .16s}
.related a:hover{color:var(--ink)}
.related a i{font-style:normal;opacity:.5;font-family:var(--mono);font-size:10px;margin-right:7px}

/* ---------- grid view ---------- */
.gridview{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--bg);display:none;padding:78px 24px 60px 320px}
.gridview.show{display:block}
.gwrap{max-width:1500px;margin:0 auto}
.gsec{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.gsec .dot{width:10px;height:10px;border-radius:50%}
.gsec .ct{color:var(--dimmer);font-size:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{position:relative;background:rgba(255,255,255,.028);border:1px solid var(--line);border-radius:13px;
  padding:16px 17px 14px;cursor:pointer;overflow:hidden;transition:transform .18s,border-color .18s,background .18s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;opacity:.85}
.card::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .25s;pointer-events:none;
  background:radial-gradient(120% 80% at 0% 0%,var(--g) 0%,transparent 60%)}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.05)}
.card:hover::after{opacity:.14}
.card h3{font-size:14.5px;font-weight:600;line-height:1.3;margin-bottom:7px;letter-spacing:-.01em}
.card p{font-size:12.5px;color:var(--dim);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .ct{display:flex;gap:5px;margin-top:11px;flex-wrap:wrap}
.card .ct span{font-family:var(--mono);font-size:9.5px;color:var(--dimmer);border:1px solid var(--line);
  border-radius:4px;padding:2px 5px}
.empty{text-align:center;color:var(--dimmer);padding:80px 20px;font-size:14px}

@media (max-width:860px){
  .rail{flex-direction:row;left:0;right:0;top:auto;bottom:0;overflow-x:auto;overflow-y:hidden;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));max-height:none;
    background:linear-gradient(0deg,rgba(4,5,10,.95),transparent)}
  .chip:hover{transform:none}
  .brand h1{font-size:12px;letter-spacing:.1em}
  .brand .n{display:none}
  .topbar{gap:9px;padding:11px 12px}
  .search kbd{display:none}
  .btn .lbl{display:none}
  .btn .sm{display:inline;font-size:15px;line-height:1}
  .tools .btn.wide{padding:8px 12px}
  .brand h1{font-size:11px}
  .search{max-width:none;min-width:0}
  .topbar{flex-wrap:wrap}
  .search{order:3;flex-basis:100%;max-width:none}
  .tools{margin-left:auto}
  .search input{padding:9px 14px 9px 34px;font-size:13.5px}
  .search .ico{left:11px}
  .hint{display:none}
  .gridview{padding:70px 14px 110px}
  .timeline{left:10px;right:10px;bottom:60px;padding:9px 10px 10px}
  .tl-legend,.tl-speed{display:none}
  .tl-date{min-width:0;font-size:10px}
  .drawer{width:100vw}
  .frame{height:260px}
}
</style>
</head>
<body>
<canvas id="map"></canvas>

<header class="topbar">
  <div class="brand">
    <h1>Plasma Atlas</h1>
    <span class="n" id="count"></span>
  </div>
  <div class="search">
    <span class="ico">⌕</span>
    <input id="q" type="search" placeholder="Search  ·  vlasov, curvature, neutrino, ∇×B …" autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
  </div>
  <div class="tools">
    <button class="btn" id="play" title="Play the timeline"><span class="lbl">▶&nbsp; Play</span><span class="sm">▶</span></button>
    <button class="btn wide" id="lucky" title="Open a random visualizer"><span class="lbl">✦ Surprise me</span><span class="sm">✦</span></button>
    <div class="seg">
      <button id="vmap" class="on">Map</button>
      <button id="vgrid">Grid</button>
    </div>
  </div>
</header>

<nav class="rail" id="rail"></nav>
<div class="hint" id="hint">drag to pan · scroll to zoom · click a bubble</div>
<div class="tip" id="tip"></div>

<div class="timeline" id="tl">
  <div class="tl-head">
    <span class="tl-date" id="tlDate">—</span>
    <span class="tl-count" id="tlCount"></span>
    <span class="tl-spacer"></span>
    <span class="tl-legend"><i class="ln same"></i>same session <i class="ln cross"></i>echoes an earlier one</span>
    <span class="tl-speed" id="tlSpeed"><button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></span>
    <button class="tl-close" id="tlClose" title="Exit timeline">✕</button>
  </div>
  <div class="tl-track" id="tlTrack">
    <div class="tl-hist" id="tlHist"></div>
    <div class="tl-fill" id="tlFill"></div>
    <div class="tl-head-mark" id="tlMark"></div>
    <div class="tl-months" id="tlMonths"></div>
  </div>
</div>

<section class="gridview" id="gridview"><div class="gwrap" id="gwrap"></div></section>

<aside class="drawer" id="drawer">
  <div class="glowbar" id="glowbar"></div>
  <button class="close" id="dclose">✕</button>
  <div class="inner" id="dinner"></div>
</aside>

<script>
const CLUSTERS = {"fusion": {"name": "Fusion Machines", "color": "#FF2E63"}, "equilibrium": {"name": "Equilibrium & Geometry", "color": "#FF8C1A"}, "gyro": {"name": "Gyrokinetics & Turbulence", "color": "#FFE01A"}, "kinetic": {"name": "Kinetic Theory & Vlasov", "color": "#A6FF2E"}, "plasma": {"name": "Plasma Fundamentals", "color": "#2EFF9B"}, "em": {"name": "Electromagnetism", "color": "#00E5D0"}, "quantum": {"name": "Quantum & Particles", "color": "#22B8FF"}, "nuclear": {"name": "Nuclear & Radiation", "color": "#5A78FF"}, "cosmos": {"name": "Relativity & Cosmos", "color": "#A855F7"}, "math": {"name": "Math & Vector Calculus", "color": "#E952FF"}, "mech": {"name": "Motion & Mechanics", "color": "#FF5CB8"}, "life": {"name": "Life Sciences", "color": "#7CFFCB"}, "applied": {"name": "Applied & Everyday", "color": "#C9D1D9"}};
const ITEMS = [{"id":"2026-08-04-the-bench-soundsystem-physics","title":"The Bench — what actually makes a rig sing","desc":"Air is a terrible load. A bare cone flails against almost nothing and converts about 1% of what you feed it into sound. A correctly flared duct matches the diaphragm's high mechanical impedance to the low impedance of open air, and that number goes up by ten times or more. Everything good downstream falls out of that one fact.","path":"2026-08-04_funktion-one-and-pk-sound-design/the-bench-soundsystem-physics.html","file":"the-bench-soundsystem-physics.html","cluster":"applied","size":124336,"date":"2026-08-04","d":246,"p":110,"ps":0,"tags":["sliders","animated","long-read"],"versions":[]},{"id":"2026-05-22-room-airflow","title":"Room Airflow Diagram","desc":"Hot air gets pushed out, cooler-ish air gets pulled in through the door on the opposite side and drawn diagonally across the seating cluster.","path":"2026-05-22_room-airflow/room_airflow.html","file":"room_airflow.html","cluster":"applied","size":5265,"date":"2026-05-22","d":172,"p":202,"ps":0,"tags":[],"versions":[]},{"id":"2026-05-11-relativity","title":"On the Relativity of Time — An Observatory","desc":"Imagine a clock that ticks each time a photon bounces between two mirrors. Now set it in motion. The clock cannot be allowed to break the speed of light — and so something else must give.","path":"2026-05-11_states-of-matter/relativity.html","file":"relativity.html","cluster":"cosmos","size":53438,"date":"2026-05-11","d":161,"p":21,"ps":0,"tags":["sliders","animated","long-read"],"versions":[]},{"id":"2026-06-25-cpt-zero-to-hero","title":"The Mirror at the Beginning — CPT Cosmology, Zero to Hero","desc":"A zero-to-hero path through the CPT-symmetric universe — the idea that the Big Bang isn't a starting line but a reflection, with an antimatter twin on the far side.","path":"2026-06-25_cpt-cosmology/cpt-zero-to-hero.html","file":"cpt-zero-to-hero.html","cluster":"cosmos","size":38982," ","d":124,"p":89,"ps":1,"tags":["LaTeX"],"versions":[]},{"id":"2026-06-08-fusion-fuel-visualizer-final","title":"Fueling a Star — How We Make Deuterium &amp; Tritium","desc":"Smash a deuterium nucleus into a tritium nucleus hard enough and they fuse — making helium, firing out a high-speed neutron, and releasing a huge burst of energy. This single reaction is what powers the Sun and what we're trying to bottle on Earth.","path":"2026-06-08_fuel-extraction-process/fusion-fuel-visualizer-final.html","file":"fusion-fuel-visualizer-final.html","cluster":"fusion","size":196285,"date":"2026-06-08","d":189,"p":110,"ps":0,"tags":["sliders","animated","long-read","3 versions"],"versions":[{"file":"fusion-fuel-visualizer.html","path":"2026-06-08_fuel-extraction-process/fusion-fuel-visualizer.html","size":93910},{"file":"fusion-fuel-visualizer.html","path":"2026-06-08_producing-deuterium-and-tritium-for-fusion/fusion-fuel-visualizer.html","size":93910}]},{"id":"2026-06-03-confinement-course","title":"How a Tokamak Holds a Star — A Guided Walkthrough","desc":"No prior fusion knowledge needed — just bring your sense of turbulence. We'll build up every idea in order: the magnetic bottle, the leak, the two confinement modes, and the violent little bursts that come free with the good one. There's a power knob pinned at the bottom — it drives the live diagrams as you read.","path":"2026-06-03_l-mode-h-mode-and-edge-localized-modes/confinement-course.html","file":"confinement-course.html","cluster":"fusion","size":47184,"date":"2026-06-03","d":184,"p":104,"ps":0,"tags":["sliders","animated","long-read"],"versions":[]},{"id":"2026-01-24-complete-tokamak-3d","title":"Complete tokamak 3D","desc":"The full machine in 3D — toroidal coils, poloidal coils, plasma and the twisted field they produce together.","path":"2026-01-24_lorentz-force-and-magnetic-fields/complete-tokamak-3d.html","file":"complete-tokamak-3d.html","cluster":"fusion","size":39009,"date":"2026-01-24","d":54,"p":101,"ps":0,"tags":["sliders"],"versions":[]},{"id":"2026-03-30-tokamak-pipeline","title":"Tokamak pipeline","desc":"Engineering specifications, coil currents, material constraints","path":"2026-03-30_tokamak-equilibrium-pipeline/tokamak-pipeline.html","file":"tokamak-pipeline.html","cluster":"fusion","size":33872,"date":"2026-03-30","d":119,"p":30,"ps":1,"tags":[],"versions":[]},{"id":"2025-12-28-tokamak-3d-complete","title":"Interactive 3D Tokamak Explorer","desc":"An orbitable 3D tokamak: peel back vessel, coils and plasma layer by layer to see how MHD holds it together.","path":"2025-12-28_mhd-model/tokamak_3d_complete.html","file":"tokamak_3d_complete.html","cluster":"fusion","size":31172,"date":"2025-12-28","d":27,"p":-1,"ps":0,"tags":["3D","sliders","animated","sandbox","4 versions"],"versions":[{"file":"tokamak_3d_final.html","path":"2025-12-28_mhd-model/tokamak_3d_final.html","size":28498},{"file":"tokamak_3d_interactive.html","path":"2025-12-28_mhd-model/tokamak_3d_interactive.html","size":27027},{"file":"tokamak_3d_interactive_fixed.html","path":"2025-12-28_mhd-model/tokamak_3d_interactive_fixed.html","size":25678}]},{"id":"2026-06-03-xpoint-3d-linked","title":"X-Point Sandbox + Live 3D Field & Exhaust","desc":"Top-left: the 2D equilibrium you drive with coil currents. Below: the same result rendered in 3D — the separatrix surface revolved into the donut, the X-point ring, the divertor legs, and a particle riding the field out to the strike point. Change a coil and both update together.","path":"2026-06-03_l-mode-h-mode-and-edge-localized-modes/xpoint-3d-linked.html","file":"xpoint-3d-linked.html","cluster":"fusion","size":27928,"date":"2026-06-03","d":184,"p":98,"ps":1,"tags":["3D","animated","sandbox"],"versions":[]},{"id":"2026-06-03-tokamak-confinement","title":"Tokamak Confinement Console — L-mode · H-mode · ELMs","desc":"Turn up the heating power and watch the plasma bifurcate from the leaky L-mode into the high-performance H-mode — then deal with the bursts (ELMs) that come with it. One knob drives every panel.","path":"2026-06-03_l-mode-h-mode-and-edge-localized-modes/tokamak-confinement.html","file":"tokamak-confinement.html","cluster":"fusion","size":27836,"date":"2026-06-03","d":184,"p":98,"ps":1,"tags":["sliders","animated","sandbox"],"versions":[]},{"id":"2026-01-24-tokamak-v2","title":"Tokamak v2","desc":"A cleaner second pass at the tokamak build — coils, field, and confinement in one draggable scene.","path":"2026-01-24_lorentz-force-and-magnetic-fields/tokamak-v2.html","file":"tokamak-v2.html","cluster":"fusion","size":25438,"date":"2026-01-24","d":54,"p":99,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-06-03-elm-2d-pressure","title":"Ballooning · Peeling · ELMs — Pressure & Steps","desc":"The colour is plasma pressure (the \"plasma\" colormap). A sharp colour change near the edge means a steep pressure gradient ∇p — that's the pedestal, and it's the fuel for every instability here. Pick a mechanism and step through it.","path":"2026-06-03_l-mode-h-mode-and-edge-localized-modes/elm-2d-pressure.html","file":"elm-2d-pressure.html","cluster":"fusion","size":23090,"date":"2026-06-03","d":184,"p":103,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-03-30-btoroidal","title":"Btoroidal","desc":"The toroidal field coils are physical loops of superconducting wire. They go up, over, and around the vacuum vessel. 12-18 of them evenly spaced around the torus. You pump current through them.","path":"2026-03-30_tokamak-equilibrium-pipeline/btoroidal.html","file":"btoroidal.html","cluster":"fusion","size":21871,"date":"2026-03-30","d":119,"p":100,"ps":1,"tags":[],"versions":[]},{"id":"2026-01-24-tokamak-visualization","title":"Tokamak visualization","desc":"First sketch of the machine: rings of current, a donut of field, and a particle that can't escape.","path":"2026-01-24_lorentz-force-and-magnetic-fields/tokamak-visualization.html","file":"tokamak-visualization.html","cluster":"fusion","size":20563,"date":"2026-01-24","d":54,"p":99,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-03-30-reactor-startup","title":"Reactor startup","desc":"No coils energized. No field. No plasma. Just an empty vacuum vessel.","path":"2026-03-30_tokamak-equilibrium-pipeline/reactor-startup.html","file":"reactor-startup.html","cluster":"fusion","size":20171,"date":"2026-03-30","d":119,"p":106,"ps":1,"tags":["animated"],"versions":[]},{"id":"2026-06-03-elm-2d-cutaways","title":"Ballooning · Peeling · ELMs — 2D Cutaways","desc":"Two cross-sections of the tokamak, driven together. The bagel slice shows poloidal position — inner vs outer side. The top-down view shows toroidal structure — the mode number, i.e. how many ripples wrap around the ring. Together they fully pin down where and how the edge fails.","path":"2026-06-03_l-mode-h-mode-and-edge-localized-modes/elm-2d-cutaways.html","file":"elm-2d-cutaways.html","cluster":"fusion","size":18960,"date":"2026-06-03","d":184,"p":105,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-03-30-toroidal-field","title":"Toroidal field","desc":"Why B_φ falls off as 1/R, and what that single fact does to everything downstream in the device.","path":"2026-03-30_tokamak-equilibrium-pipeline/toroidal-field.html","file":"toroidal-field.html","cluster":"fusion","size":18895,"date":"2026-03-30","d":119,"p":106,"ps":1,"tags":[],"versions":[]},{"id":"2026-06-03-xpoint-sandbox","title":"X-Point Sandbox — Shape the Field with Coil Currents","desc":"Six poloidal-field coils (PF1–PF6) and the plasma current. Each coil is a ring of current; the app sums their magnetic flux ψ(R,Z), then finds where the poloidal field cancels to zero — the X-point. Drag a coil's current and watch the null (and the whole boundary) move. Positive current is red, negative blue.","path":"2026-06-03_l-mode-h-mode-and-edge-localized-modes/xpoint-sandbox.html","file":"xpoint-sandbox.html","cluster":"fusion","size":18746,"date":"2026-06-03","d":184,"p":102,"ps":1,"tags":["animated","sandbox"],"versions":[]},{"id":"2026-06-03-elm-3d","title":"Ballooning · Peeling · ELMs — in 3D","desc":"A tokamak is a donut. These three ideas are all about where on the donut the steep edge gives way, and what shape the failure takes. Spin it with your finger. Pick a lens below and grow the pedestal to watch it happen.","path":"2026-06-03_l-mode-h-mode-and-edge-localized-modes/elm-3d.html","file":"elm-3d.html","cluster":"fusion","size":18572,"date":"2026-06-03","d":184,"p":105,"ps":1,"tags":["3D","sliders","animated"],"versions":[]},{"id":"2026-06-03-particle-divertor-3d","title":"A Particle's Journey to the Divertor — 3D","desc":"Follow a single charged particle. It spirals along a magnetic field line, safely looping the donut — until one outward nudge drops it onto an open field line, which funnels it through the X-point and down to a divertor target. Drag to rotate; scrub or play below.","path":"2026-06-03_l-mode-h-mode-and-edge-localized-modes/particle-divertor-3d.html","file":"particle-divertor-3d.html","cluster":"fusion","size":18111,"date":"2026-06-03","d":184,"p":102,"ps":1,"tags":["3D","sliders","animated"],"versions":[]},{"id":"2026-04-27-tokamak-3d","title":"Tokamak Magnetic Field — 3D","desc":"Helical field lines wrapping a torus — drag to rotate, scroll to zoom","path":"2026-04-27_3d-magnetic-field/tokamak-3d.html","file":"tokamak-3d.html","cluster":"fusion","size":17705,"date":"2026-04-27","d":147,"p":134,"ps":1,"tags":["3D","animated"],"versions":[]},{"id":"2026-04-27-gyrokinetics-intro","title":"Introduction to Gyrokinetics","desc":"From a spinning particle to the gyrokinetic equation, step by step","path":"2026-04-27_gyrokinetic-turbulence-intro/gyrokinetics-intro.html","file":"gyrokinetics-intro.html","cluster":"gyro","size":143036,"date":"2026-04-27","d":147,"p":33,"ps":0,"tags":["sliders","animated","long-read"],"versions":[]},{"id":"2026-05-19-plasma-guide","title":"A Field Guide to Fusion Plasma Simulation","desc":"Seven ideas that decide whether a fusion reactor works — explained from the ground up, with things to touch.","path":"2026-05-19_gyrokinetic-code-guides/plasma_guide.html","file":"plasma_guide.html","cluster":"gyro","size":92690,"date":"2026-05-19","d":169,"p":127,"ps":0,"tags":["sliders","animated","long-read"],"versions":[]},{"id":"2026-05-19-gyrokinetic-field-guide","title":"A field guide to gyrokinetic plumbing","desc":"Six ideas you'll keep hitting in fusion-plasma papers — and what they actually look like when you draw them. Built for someone who's comfortable with gradients and partial derivatives, and who's tired of nodding along to jargon.","path":"2026-05-19_gyrokinetic-code-guides/gyrokinetic-field-guide.html","file":"gyrokinetic-field-guide.html","cluster":"gyro","size":84709,"date":"2026-05-19","d":169,"p":116,"ps":1,"tags":["sliders","animated","LaTeX","long-read"],"versions":[]},{"id":"2026-04-27-fourier-intro","title":"Fourier Space — An Intuitive Introduction","desc":"From wiggly patterns to wavenumbers, from scratch","path":"2026-04-27_fourier-space/fourier_intro.html","file":"fourier_intro.html","cluster":"gyro","size":75472,"date":"2026-04-27","d":147,"p":115,"ps":0,"tags":["sliders","animated","long-read"],"versions":[]},{"id":"2026-05-19-six-ideas-gyrokinetics","title":"Six Ideas From Inside a Gyrokinetic Code","desc":"Kokkos. Spectral vs grid. Eulerian vs semi Lagrangian. Landau damping. ITG. Rosenbluth–Hinton. What they actually mean, with things you can drag.","path":"2026-05-19_gyrokinetic-code-guides/six_ideas_gyrokinetics.html","file":"six_ideas_gyrokinetics.html","cluster":"gyro","size":69768,"date":"2026-05-19","d":169,"p":117,"ps":1,"tags":["sliders","animated","LaTeX","long-read"],"versions":[]},{"id":"2026-05-19-gyrokinetics-guide","title":"A Field Guide to Gyrokinetic Plasma Simulation","desc":"A C++ library that lets the same loop run on a CPU core, a GPU thread, or anything in between.","path":"2026-05-19_gyrokinetics-field-guide/gyrokinetics_guide.html","file":"gyrokinetics_guide.html","cluster":"gyro","size":68629,"date":"2026-05-19","d":169,"p":116,"ps":0,"tags":["sliders","animated","LaTeX","long-read"],"versions":[]},{"id":"2026-04-27-binormal-intro","title":"The Binormal Direction — From Scratch","desc":"Why this weird third direction matters — and why GENE cares so much about it","path":"2026-04-27_fourier-space/binormal_intro.html","file":"binormal_intro.html","cluster":"gyro","size":66758,"date":"2026-04-27","d":147,"p":118,"ps":1,"tags":["3D","sliders","animated","long-read"],"versions":[]},{"id":"2026-06-19-gyrokinetic-quasineutrality","title":"The Ring and the Screen — Deriving Gyrokinetic Quasineutrality","desc":"The one-line version is 'average over the fast gyration'. This takes it the rest of the way — to writing down gyrokinetic quasineutrality, knowing where every symbol comes from, and seeing why the vacuum ∇²φ term barely matters in a fusion plasma.","path":"2026-06-19_gyrokinetic-quasineutrality/gyrokinetic-quasineutrality.html","file":"gyrokinetic-quasineutrality.html","cluster":"gyro","size":43363,"date":"2026-06-19","d":200,"p":127,"ps":0,"tags":["sliders","animated","LaTeX"],"versions":[]},{"id":"2026-04-29-integrated-v4","title":"δT — integrated v2","desc":"Volumetric fluctuation field with outboard ballooning. Drag to rotate, scroll to zoom, use bottom sliders to slice. Side panel: 2D cuts and Fourier basis.","path":"2026-04-29_binormal-in-fourier-space/integrated_v4.html","file":"integrated_v4.html","cluster":"gyro","size":40395,"date":"2026-04-29","d":149,"p":154,"ps":1,"tags":["3D","sliders","animated","4 versions"],"versions":[{"file":"integrated_v2.html","path":"2026-04-29_binormal-in-fourier-space/integrated_v2.html","size":26973},{"file":"integrated_v3.html","path":"2026-04-29_binormal-in-fourier-space/integrated_v3.html","size":33179},{"file":"v4.html","path":"2026-04-29_binormal-in-fourier-space/v4.html","size":37110}]},{"id":"2026-04-27-gyrokinetic-visualizations","title":"Gyrokinetic visualizations","desc":"The same particle seen from the side. It streams along the field line at v∥ while gyrating, tracing a helix. The depth shading shows the 3D spiral projected onto 2D.","path":"2026-04-27_gyrokinetic-turbulence-intro/gyrokinetic-visualizations.html","file":"gyrokinetic-visualizations.html","cluster":"gyro","size":39164,"date":"2026-04-27","d":147,"p":115,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-04-27-viz","title":"Visualizer","desc":"The same particle seen from the side. It streams along the field line at v∥ while gyrating, tracing a helix. The depth shading shows the 3D spiral projected onto 2D.","path":"2026-04-27_gyrokinetic-turbulence-intro/viz.html","file":"viz.html","cluster":"gyro","size":39141,"date":"2026-04-27","d":147,"p":124,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-04-29-full-explorer-v2","title":"Sliding through (x, y, z) and the ky Fourier basis","desc":"Three sliders: x (radial — which flux surface), y (binormal — around the surface), z (along B — where you are along the field line). Below: the discrete ky Fourier basis with Ny=16 modes, browsable one at a time.","path":"2026-04-29_binormal-in-fourier-space/full_explorer_v2.html","file":"full_explorer_v2.html","cluster":"gyro","size":34235,"date":"2026-04-29","d":149,"p":123,"ps":1,"tags":["sliders","2 versions"],"versions":[{"file":"full_explorer.html","path":"2026-04-29_binormal-in-fourier-space/full_explorer.html","size":28160}]},{"id":"2026-04-27-fusion-guide","title":"Zero to Hero: Gyrokinetic Plasma Turbulence","desc":"Everything you need to understand fusion turbulence simulations (GENE, Vlasov equations, and the physics underneath), built up from absolute basics.","path":"2026-04-27_gyrokinetic-turbulence-intro/fusion-guide.html","file":"fusion-guide.html","cluster":"gyro","size":28147,"date":"2026-04-27","d":147,"p":115,"ps":1,"tags":["long-read"],"versions":[]},{"id":"2026-04-29-integrated-dt","title":"δT — full integrated view","desc":"Volumetric fluctuation field with outboard ballooning. Drag main view, slice with sliders below. Side panel: 2D cross-sections + Fourier basis.","path":"2026-04-29_binormal-in-fourier-space/integrated_dt.html","file":"integrated_dt.html","cluster":"gyro","size":27376,"date":"2026-04-29","d":149,"p":123,"ps":1,"tags":["3D","sliders","animated"],"versions":[]},{"id":"2026-04-27-flux-tube","title":"The flux tube — why 16 points is enough","desc":"The flux tube trick — and why a tiny periodic box is all GENE needs","path":"2026-04-27_3d-magnetic-field/flux-tube.html","file":"flux-tube.html","cluster":"gyro","size":25078,"date":"2026-04-27","d":147,"p":147,"ps":0,"tags":["3D","animated"],"versions":[]},{"id":"2026-04-29-eddies-emerge","title":"Eddies emerge — they're not in the equation","desc":"The eddy size, location, and frequency aren't programmed in. They're instabilities of the gyrokinetic equation. Tiny random noise grows, the geometry decides which modes grow fastest, the nonlinear term saturates them. Here's the demo.","path":"2026-04-29_binormal-in-fourier-space/eddies_emerge.html","file":"eddies_emerge.html","cluster":"gyro","size":24083,"date":"2026-04-29","d":149,"p":126,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-04-27-y-fourier-gene","title":"y in Fourier space — how GENE sees the plasma","desc":"From wiggles to sine waves to GENE's actual data","path":"2026-04-27_3d-magnetic-field/y-fourier-gene.html","file":"y-fourier-gene.html","cluster":"gyro","size":22868,"date":"2026-04-27","d":147,"p":129,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-04-27-tokamak-directions","title":"Tokamak Coordinate Directions","desc":"How radial (x), parallel (z), and binormal (y) are defined — and what the magnetic field has to do with it","path":"2026-04-27_gyrokinetic-turbulence-intro/tokamak-directions.html","file":"tokamak-directions.html","cluster":"gyro","size":22247,"date":"2026-04-27","d":147,"p":125,"ps":1,"tags":["animated"],"versions":[]},{"id":"2026-04-29-donut-flythrough","title":"Flying through δT — in the donut","desc":"The flux tube wraps around the torus, hugging one D-shaped flux surface. Eddies live inside the tube — long along the field, narrow across. Drag to rotate, scroll to zoom, press space + WASD to fly along the tube.","path":"2026-04-29_binormal-in-fourier-space/donut_flythrough.html","file":"donut_flythrough.html","cluster":"gyro","size":21820,"date":"2026-04-29","d":149,"p":126,"ps":1,"tags":["3D","animated"],"versions":[]},{"id":"2026-04-27-eddies-and-fourier","title":"Eddies, y, and Fourier — the whole picture","desc":"Three separate things that often get conflated","path":"2026-04-27_3d-magnetic-field/eddies-and-fourier.html","file":"eddies-and-fourier.html","cluster":"gyro","size":21421,"date":"2026-04-27","d":147,"p":131,"ps":1,"tags":["3D","animated"],"versions":[]},{"id":"2026-04-27-eddy-3d","title":"3D Eddy","desc":"Interactive 3D · drag to orbit Anatomy of an Eddy hot spot (φ > 0) cold spot (φ magnetic field line E×B flow Eddy B field E×B flow Axes Auto-spin drag · pinch / scroll to zoom","path":"2026-04-27_fourier-space/eddy_3d.html","file":"eddy_3d.html","cluster":"gyro","size":21314,"date":"2026-04-27","d":147,"p":118,"ps":1,"tags":["3D","animated"],"versions":[]},{"id":"2026-04-27-background-uniform","title":"Background vs fluctuation","desc":"Splitting the plasma into the steady part and the wiggly part","path":"2026-04-27_3d-magnetic-field/background-uniform.html","file":"background-uniform.html","cluster":"gyro","size":20334,"date":"2026-04-27","d":147,"p":131,"ps":1,"tags":["animated"],"versions":[]},{"id":"2026-04-27-gene-fourier-y","title":"Why Fourier in y? — GENE coordinate symmetries","desc":"The three directions look different to a translation — only y is symmetric","path":"2026-04-27_3d-magnetic-field/gene-fourier-y.html","file":"gene-fourier-y.html","cluster":"gyro","size":20287,"date":"2026-04-27","d":147,"p":131,"ps":1,"tags":["animated"],"versions":[]},{"id":"2026-04-29-flythrough-3d","title":"Flying through δT — the 3D shape of fluctuations","desc":"The 3D shape of fluctuations inside a flux tube. Eddies are long sausages along z and narrow across x and y. Drag to rotate. x radial, y binormal, z along the field.","path":"2026-04-29_binormal-in-fourier-space/flythrough_3d.html","file":"flythrough_3d.html","cluster":"gyro","size":20259,"date":"2026-04-29","d":149,"p":133,"ps":1,"tags":["3D","animated"],"versions":[]},{"id":"2026-04-29-cuts-visualization-v2","title":"Toroidal & Poloidal cuts — D-shaped, with binormal slider","desc":"D-shaped flux surfaces (real tokamak geometry — elongated vertically, slightly triangular). Now with a binormal slider so you can slide along y and watch what changes.","path":"2026-04-29_binormal-in-fourier-space/cuts_visualization_v2.html","file":"cuts_visualization_v2.html","cluster":"gyro","size":20219,"date":"2026-04-29","d":149,"p":138,"ps":1,"tags":["sliders","2 versions"],"versions":[{"file":"cuts_visualization.html","path":"2026-04-29_binormal-in-fourier-space/cuts_visualization.html","size":20210}]},{"id":"2026-04-29-flux-tube-viz","title":"Flux Tube — what GENE actually simulates","desc":"Drag to rotate. Scroll to zoom. The flux tube is the small rectangular box GENE actually simulates — not the whole donut.","path":"2026-04-29_binormal-in-fourier-space/flux_tube_viz.html","file":"flux_tube_viz.html","cluster":"gyro","size":19359,"date":"2026-04-29","d":149,"p":133,"ps":1,"tags":["3D","animated"],"versions":[]},{"id":"2026-04-04-turbulence-viz","title":"Turbulence visualizer","desc":"Looking at the flux tube unwrapped — x is radial (across surfaces), z is along the field line. The eddies are hugely stretched along z but narrow in x. This is why one surface","path":"2026-04-04_metrics-and-jacobian-in-eqdsk/turbulence-viz.html","file":"turbulence-viz.html","cluster":"gyro","size":19263,"date":"2026-04-04","d":124,"p":50,"ps":1,"tags":["animated"],"versions":[]},{"id":"2026-04-03-flux-tube-2d-map","title":"Flux Tube — 2D Map","desc":"The tube cut open and laid flat. Each cell shows its real shape after metrics. Tap any cell. The mini ring shows where it sits on the tokamak.","path":"2026-04-03_magnetic-shear-chease-to-gene/flux-tube-2d-map.html","file":"flux-tube-2d-map.html","cluster":"gyro","size":17665,"date":"2026-04-03","d":123,"p":67,"ps":1,"tags":["sliders"],"versions":[]},{"id":"2026-04-27-coordinates-meaning","title":"What do (x, y, z) actually mean?","desc":"Drag the sliders. Watch the dot. The numbers are a recipe for getting to a point.","path":"2026-04-27_3d-magnetic-field/coordinates-meaning.html","file":"coordinates-meaning.html","cluster":"gyro","size":17610,"date":"2026-04-27","d":147,"p":134,"ps":1,"tags":["3D","sliders","animated"],"versions":[]},{"id":"2026-04-29-binormal-fourier","title":"ky and the binormal — why Fourier works","desc":"The flux tube cross-section: x radial, y binormal. We're looking at one slice; the field line z pokes out of the screen. Adjust ky below to see Fourier modes in y.","path":"2026-04-29_binormal-in-fourier-space/binormal_fourier.html","file":"binormal_fourier.html","cluster":"gyro","size":17103,"date":"2026-04-29","d":149,"p":126,"ps":1,"tags":["sliders","animated"],"versions":[]},{"id":"2026-04-29-inside-dt","title":"Inside the fluctuations","desc":"You're inside the flux tube. Red = hot fluctuation, blue = cold. Click the big button to start auto-flying along the field line. The colors will swirl past you.","path":"2026-04-29_binormal-in-fourier-space/inside_dt.html","file":"inside_dt.html","cluster":"gyro","size":16934,"date":"2026-04-29","d":149,"p":138,"ps":1,"tags":["3D","animated"],"versions":[]},{"id":"2026-04-29-ring-and-wave","title":"16 measurement points: ring ↔ sine wave","desc":"Same 16 measurements, two views. Left: where each point sits on the toroidal ring (real space — what you'd actually measure). Right: tho l-in-fourier-space/gene_forces.html","file":"gene_forces.html","cluster":"kinetic","size":13416,"date":"2026-04-29","d":149,"p":161,"ps":1,"tags":["LaTeX"],"versions":[]},{"id":"2026-06-21-closure-problem","title":"The closure problem","desc":"Take velocity moments of the Vlasov equation and you get a ladder of fluid equations. Every rung's rate of change depends on the rung above it — density needs velocity, velocity needs pressure, pressure needs heat flux, on and on. There is no top rung, so a finite fluid model can only exist if you cut the ladder by hand and invent a value for the dangling term. That invented value is a closure.","path":"2026-06-21_plasma-simulation-complexity/closure-problem.html","file":"closure-problem.html","cluster":"kinetic","size":13120,"date":"2026-06-21","d":202,"p":165,"ps":0,"tags":[],"versions":[]},{"id":"2026-05-31-vlasov-viewer-template","title":"Real Vlasov run — the knob-count, live","desc":"This is real data from an actual two-stream Vlasov simulation (the classic test). Two beams of particles tear into each other and the velocity distribution filaments — winds up into ever-finer structure. The same run is shown twice: without collisions and with weak collisions. The number above each is the real, measured count of Hermite knobs needed to capture the distribution at that instant.","path":"2026-05-31_hermite-spectral-method/vlasov_viewer_template.html","file":"vlasov_viewer_template.html","cluster":"kinetic","size":12231,"date":"2026-05-31","d":181,"p":173,"ps":1,"tags":["sliders"],"versions":[]},{"id":"2026-06-29-real-vs-phase-space","title":"Real space vs phase space — the same particles, two pictures","desc":"Same particles · two ways of drawing them","path":"2026-06-29_vlasov-equation-to-1d-hermite/real-vs-phase-space.html","file":"real-vs-phase-space.html","cluster":"kinetic","size":11565,"date":"2026-06-29","d":210,"p":167,"ps":1,"tags":["animated"],"versions":[]},{"id":"2026-07-07-boundary-conditions","title":"Boundaries
