<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Volumetric δT — smooth fog with cutting planes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #e8e6e0; font-family: 'Fraunces', serif; }
#c { position: fixed; inset: 0; cursor: grab; display: block; }
#c:active { cursor: grabbing; }
.panel {
  position: fixed; background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
  padding: 12px 14px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.55;
  z-index: 10;
}
#title { top: 14px; left: 14px; max-width: 320px; }
#title h1 { font-family: 'Fraunces', serif; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; margin-bottom: 4px; color: #fff; }
#title p { font-size: 10.5px; color: #b8b5ac; line-height: 1.5; }

#controls {
  bottom: 14px; left: 14px; max-width: 340px;
  display: flex; flex-direction: column; gap: 10px;
}

.slider-row {
  display: flex; align-items: center; gap: 10px;
  font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
}
.slider-row label { min-width: 90px; }
.slider-row input[type=range] {
  flex: 1; height: 4px;
  -webkit-appearance: none; appearance: none;
  border-radius: 2px; outline: none;
}
.slider-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  cursor: pointer; border: none;
}
.slider-row .val { min-width: 50px; text-align: right; }

.slider-row.cut-x label { color: #ff8b8b; }
.slider-row.cut-x input[type=range] { background: rgba(255, 107, 107, 0.2); }
.slider-row.cut-x input[type=range]::-webkit-slider-thumb { background: #ff6b6b; box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.25); }
.slider-row.cut-x .val { color: #ff8b8b; }

.slider-row.cut-y label { color: #6fdb9e; }
.slider-row.cut-y input[type=range] { background: rgba(74, 157, 110, 0.2); }
.slider-row.cut-y input[type=range]::-webkit-slider-thumb { background: #5fc28e; box-shadow: 0 0 0 3px rgba(74, 157, 110, 0.25); }
.slider-row.cut-y .val { color: #6fdb9e; }

.slider-row.cut-z label { color: #8bbde6; }
.slider-row.cut-z input[type=range] { background: rgba(91, 141, 191, 0.2); }
.slider-row.cut-z input[type=range]::-webkit-slider-thumb { background: #7badd6; box-shadow: 0 0 0 3px rgba(91, 141, 191, 0.25); }
.slider-row.cut-z .val { color: #8bbde6; }

.slider-row.density label { color: #d4a04a; }
.slider-row.density input[type=range] { background: rgba(212, 160, 74, 0.2); }
.slider-row.density input[type=range]::-webkit-slider-thumb { background: #d4a04a; box-shadow: 0 0 0 3px rgba(212, 160, 74, 0.25); }
.slider-row.density .val { color: #d4a04a; }

.btnrow { display: flex; gap: 6px; }
.toggle {
  background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.18);
  color: #e8e6e0; padding: 6px 10px; border-radius: 3px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  cursor: pointer; transition: all 0.15s;
}
.toggle:hover { background: rgba(255,255,255,0.1); }
.toggle.on { background: #d4a04a; color: #1a1408; border-color: #d4a04a; }

#help { bottom: 14px; right: 14px; max-width: 240px; }
#help p { color: #b8b5ac; font-size: 10.5px; }
#help .key { display: inline-block; padding: 1px 6px; background: rgba(255,255,255,0.15); border-radius: 3px; color: #d4a04a; font-weight: 600; margin: 0 1px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="panel">
  <h1>Volumetric δT</h1>
  <p>Smooth fluctuation fog inside the donut. Use the sliders to slice it open and peer inside. Drag to rotate, scroll to zoom.</p>
</div>

<div id="controls" class="panel">
  <div class="slider-row cut-x"><label>cut along X</label><input type="range" id="cutX" min="-10" max="10" step="0.05" value="-10"><span class="val" id="cutXv">off</span></div>
  <div class="slider-row cut-y"><label>cut from below</label><input type="range" id="cutY" min="-5" max="5" step="0.05" value="-5"><span class="val" id="cutYv">off</span></div>
  <div class="slider-row cut-z"><label>cut along Z</label><input type="range" id="cutZ" min="-10" max="10" step="0.05" value="-10"><span class="val" id="cutZv">off</span></div>
  <div class="slider-row density"><label>fog density</label><input type="range" id="density" min="0.5" max="6" step="0.1" value="2.5"><span class="val" id="densityv">2.5</span></div>
  <div class="btnrow">
    <button class="toggle on" id="rotBtn">auto-rotate</button>
    <button class="toggle" id="resetBtn">reset cuts</button>
  </div>
</div>

<div id="help" class="panel">
  <p><span class="key">drag</span> rotate &nbsp; <span class="key">scroll</span> zoom<br>
  Pull a slider in from "off" to slice. The colored fog shows δT — red is hot fluctuation, blue is cold.</p>
</div>

<script id="vert" type="x-shader/x-vertex">
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position, 1.0);
}
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;

uniform vec2 uResolution;
uniform float uTime;
uniform mat4 uInvProj;
uniform mat4 uInvView;
uniform vec3 uCamPos;

uniform vec3 uCutMin;   // cuts: only show points where pos.xyz > uCutMin (each axis)
uniform float uDensity;

const float R0 = 6.0;       // major radius
const float aMinor = 2.2;   // minor radius
const float KAPPA = 1.4;
const float DELTA = 0.25;
const float PI = 3.14159265359;

// SDF / membership for D-shaped torus volume
// Returns: r in [0, 1] = how deep inside the flux surface we are (0 at center, 1 at edge)
//          -1 if outside the torus
// We approximate: project (X, Z) to (R, phi), use R = sqrt(X^2 + Z^2),
// then in (R, Y) plane the cross-section is D-shaped centered at (R0, 0).
// For simplicity treat the cross-section as elliptical: (R - R0)^2/a^2 + Y^2/(kappa*a)^2 = r^2.
// Triangularity adds a horizontal shift in r based on poloidal angle, ignore for the SDF check.
float torusR(vec3 p) {
  float R = sqrt(p.x*p.x + p.z*p.z);
  float dr = (R - R0) / aMinor;
  float dy = p.y / (KAPPA * aMinor);
  return sqrt(dr*dr + dy*dy);
}

// Get poloidal angle θ and toroidal angle φ
vec2 torusAngles(vec3 p) {
  float phi = atan(p.z, p.x);
  float R = sqrt(p.x*p.x + p.z*p.z);
  float theta = atan(p.y / (KAPPA * aMinor), (R - R0) / aMinor);
  return vec2(theta, phi);
}

// δT field: function of (r, theta, phi)
// Equilibrium is symmetric in y (binormal ≈ toroidal direction).
// Fluctuations have ky structure in y, so they vary with phi (mainly) and have envelope in r.
//
// Mode amplitudes (matching the 16 ky modes earlier)
float modeAmp(int k) {
  // peaked at k=4
  float kf = float(k);
  return exp(-pow((kf - 4.0) / 3.0, 2.0)) * (0.5 + 0.8 * sin(kf * 1.7));
}
float modePhase(int k) {
  float kf = float(k);
  return kf * 1.31 + 0.7;
}

float deltaT(vec3 p) {
  float r = torusR(p);
  if (r > 1.0) return 0.0;
  vec2 angs = torusAngles(p);
  float theta = angs.x;
  float phi = angs.y;

  // Field-line aligned y coordinate: along the field line, going forward shifts both
  // theta and phi together (phi = q*theta). Eddies are long along this direction
  // (so δT varies SLOWLY along (theta + phi/q)) and quickly across the perpendicular
  // direction (which is roughly phi at fixed theta on the outboard).
  // For a pleasant fog, just use phi as the "binormal direction" and add some theta dependence.

  // Sum of ky modes in the toroidal direction (this is the "y/binormal" Fourier basis)
  float v = 0.0;
  for (int k = 1; k < 16; k++) {
    float kf = float(k);
    v += modeAmp(k) * cos(kf * phi * 3.0 + modePhase(k) + theta * 0.4);
  }
  v /= 4.0;

  // Radial envelope: fluctuations are strongest in mid-radius (r~0.6), weaker at center/edge
  float rEnv = exp(-pow((r - 0.6) / 0.25, 2.0));

  // Slow theta modulation (ballooning structure: stronger on outboard side, theta=0)
  float thetaEnv = 0.6 + 0.5 * cos(theta);

  return rEnv * thetaEnv * v;
}

// Color from value: red for positive, blue for negative
vec3 colorMap(float v) {
  float t = clamp(v * 1.8, -1.0, 1.0);
  if (t >= 0.0) {
    return vec3(1.0, 0.4 - 0.3 * t, 0.3 - 0.25 * t);
  } else {
    return vec3(0.3 + 0.2 * t, 0.55 + 0.2 * t, 1.0);
  }
}

bool inCut(vec3 p) {
  return p.x > uCutMin.x && p.y > uCutMin.y && p.z > uCutMin.z;
}

// Ray-AABB intersection for the bounding box of the torus
// torus extent: |x|, |z| < R0 + aMinor; |y| < kappa * aMinor
vec2 rayBoxT(vec3 ro, vec3 rd) {
  vec3 bmin = vec3(-(R0 + aMinor), -(KAPPA * aMinor), -(R0 + aMinor));
  vec3 bmax = vec3( (R0 + aMinor),  (KAPPA * aMinor),  (R0 + aMinor));
  vec3 invD = 1.0 / rd;
  vec3 t0 = (bmin - ro) * invD;
  vec3 t1 = (bmax - ro) * invD;
  vec3 tmin = min(t0, t1);
  vec3 tmax = max(t0, t1);
  float tNear = max(max(tmin.x, tmin.y), tmin.z);
  float tFar  = min(min(tmax.x, tmax.y), tmax.z);
  return vec2(tNear, tFar);
}

void main() {
  // Reconstruct world-space ray from screen UV
  vec2 ndc = vUv * 2.0 - 1.0;
  vec4 clipNear = vec4(ndc, -1.0, 1.0);
  vec4 clipFar  = vec4(ndc,  1.0, 1.0);
  vec4 wNear = uInvView * (uInvProj * clipNear);
  vec4 wFar  = uInvView * (uInvProj * clipFar);
  vec3 pNear = wNear.xyz / wNear.w;
  vec3 pFar  = wFar.xyz  / wFar.w;
  vec3 ro = uCamPos;
  vec3 rd = normalize(pFar - pNear);

  // Find ray entry/exit through the torus bounding box
  vec2 tBox = rayBoxT(ro, rd);
  float tNear = max(tBox.x, 0.0);
  float tFar  = tBox.y;

  vec3 acc = vec3(0.0);
  float trans = 1.0;

  if (tFar > tNear) {
    const int STEPS = 96;
    float stepLen = (tFar - tNear) / float(STEPS);

    // Jitter to reduce banding
    float jitter = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
    float t = tNear + stepLen * jitter;

    for (int i = 0; i < 96; i++) {
      vec3 p = ro + rd * t;
      if (inCut(p)) {
        float r = torusR(p);
        if (r < 1.0) {
          float v = deltaT(p);
          float a = abs(v) * uDensity * stepLen * 0.7;
          a = clamp(a, 0.0, 1.0);
          vec3 col = colorMap(v);
          acc += col * a * trans;
          trans *= (1.0 - a);
          if (trans < 0.01) break;
        }
      }
      t += stepLen;
      if (t > tFar) break;
    }
  }

  // Composite over black
  gl_FragColor = vec4(acc, 1.0 - trans);
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// We'll do a fullscreen-quad raymarch using a custom shader.
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 200);

// Fullscreen quad with custom shader
const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const fsScene = new THREE.Scene();

const material = new THREE.ShaderMaterial({
  uniforms: {
    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    uTime: { value: 0 },
    uInvProj: { value: new THREE.Matrix4() },
    uInvView: { value: new THREE.Matrix4() },
    uCamPos: { value: new THREE.Vector3() },
    uCutMin: { value: new THREE.Vector3(-10, -5, -10) }, // off
    uDensity: { value: 2.5 }
  },
  vertexShader: document.getElementById('vert').textContent,
  fragmentShader: document.getElementById('frag').textContent,
  depthWrite: false,
  depthTest: false
});

const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
fsScene.add(quad);

// ============ Camera control ============
let yaw = 0.6, pitch = 0.4, dist = 25;
let autoRotate = true;
function setCam() {
  camera.position.set(
    dist * Math.cos(pitch) * Math.sin(yaw),
    dist * Math.sin(pitch),
    dist * Math.cos(pitch) * Math.cos(yaw)
  );
  camera.lookAt(0, 0, 0);
  camera.up.set(0, 1, 0);
  camera.updateMatrixWorld();
}
setCam();

// Interaction
let dragging = false, prevX = 0, prevY = 0;
canvas.addEventListener('mousedown', e => { dragging = true; prevX = e.clientX; prevY = e.clientY; });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - prevX, dy = e.clientY - prevY;
  prevX = e.clientX; prevY = e.clientY;
  yaw += dx * 0.005;
  pitch = Math.max(-1.4, Math.min(1.4, pitch + dy * 0.005));
});
window.addEventListener('wheel', e => {
  dist = Math.max(5, Math.min(80, dist * (1 + e.deltaY * 0.001)));
});
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ============ UI ============
function bindSlider(id, valId, onChange, formatter) {
  const sl = document.getElementById(id);
  const val = document.getElementById(valId);
  const update = () => {
    const v = parseFloat(sl.value);
    onChange(v);
    val.textContent = formatter ? formatter(v) : v.toFixed(2);
  };
  sl.addEventListener('input', update);
  return update;
}

const cutFmt = (v, lo) => v <= lo + 0.05 ? 'off' : v.toFixed(2);

bindSlider('cutX', 'cutXv', v => material.uniforms.uCutMin.value.x = v, v => cutFmt(v, -10));
bindSlider('cutY', 'cutYv', v => material.uniforms.uCutMin.value.y = v, v => cutFmt(v, -5));
bindSlider('cutZ', 'cutZv', v => material.uniforms.uCutMin.value.z = v, v => cutFmt(v, -10));
bindSlider('density', 'densityv', v => material.uniforms.uDensity.value = v);

document.getElementById('rotBtn').addEventListener('click', e => {
  autoRotate = !autoRotate;
  e.target.classList.toggle('on', autoRotate);
});
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('cutX').value = -10; material.uniforms.uCutMin.value.x = -10;
  document.getElementById('cutY').value = -5;  material.uniforms.uCutMin.value.y = -5;
  document.getElementById('cutZ').value = -10; material.uniforms.uCutMin.value.z = -10;
  document.getElementById('cutXv').textContent = 'off';
  document.getElementById('cutYv').textContent = 'off';
  document.getElementById('cutZv').textContent = 'off';
});

// ============ Animate ============
const clock = new THREE.Clock();
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (autoRotate && !dragging) yaw += dt * 0.13;
  setCam();

  // Update shader uniforms with camera matrices
  material.uniforms.uInvProj.value.copy(camera.projectionMatrix).invert();
  material.uniforms.uInvView.value.copy(camera.matrixWorld);
  material.uniforms.uCamPos.value.copy(camera.position);
  material.uniforms.uTime.value += dt;

  renderer.render(fsScene, fsCam);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
